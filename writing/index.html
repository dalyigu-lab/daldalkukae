<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>지호의 빨간펜 글쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap">
<style>
/* 「달달맘의 글분석 학습지」와 같은 디자인: 흰 종이 만화 카드 한 가지 모습으로, 배경과 글자색을 모두 직접 지정합니다. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#342A2A; --ink-2:#6C5F5F; --ink-3:#A89B9B;
  --pink:#F5A3B7; --pink-soft:#FDE7ED; --pink-b:#EE9DB1;
  --lav:#F6E3F4; --lav-b:#E2A6D7;
  --lime:#EAF7CB; --peach:#FFF3E6; --peach-b:#F7CDA4;
  --blue:#4568CF; --blue-soft:#EAF0FC; --coral:#E3544B;
  --hl:#FFD2DC; --hl-y:#FFE7A3; --hl-g:#D9F0B8;
  --ok:#3E9B58; --ok-soft:#E8F6DF; --bad:#E3544B; --bad-soft:#FDE9E6;
  --rule:#EDF0F8; --margin:#F6B7C4; --star:#F5B73C; --line:#E6DCDC;
  --lh:36px;
  --f-hand:'Gaegu','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-pen:'Nanum Pen Script','Gaegu','Apple SD Gothic Neo',cursive;
  --f-text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{word-break:keep-all;overflow-wrap:anywhere;font-family:var(--f-hand);font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:18px 56px}
.tnum{font-variant-numeric:tabular-nums}
.hl{background:linear-gradient(to bottom,transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 3px}
.hl-y{background:linear-gradient(to bottom,transparent 55%,var(--hl-y) 55%,var(--hl-y) 92%,transparent 92%);padding:0 3px}
.hl-g{background:linear-gradient(to bottom,transparent 55%,var(--hl-g) 55%,var(--hl-g) 92%,transparent 92%);padding:0 3px}
.red{color:var(--coral)} .bl{color:var(--blue)}
.doodle{font-family:var(--f-pen);color:var(--coral);font-size:24px;line-height:1;display:inline-block;transform:rotate(-8deg);white-space:nowrap;pointer-events:none}
.chr{display:block;flex:none;width:110px}
.chr svg{display:block;width:100%;height:auto;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite}
.hop{animation:hop .5s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.05)}100%{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* 말풍선 */
.bubble{position:relative;background:var(--lime);border:2.5px solid var(--ink);border-radius:46% 54% 48% 52% / 58% 50% 50% 42%;padding:14px 24px;text-align:center;font-weight:700}
.bubble.l::after{content:'';position:absolute;left:-10px;bottom:22px;width:18px;height:18px;background:inherit;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(30deg) skewX(-10deg)}
.bubble.b::after{content:'';position:absolute;left:34px;bottom:-10px;width:18px;height:18px;background:inherit;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(40deg)}
.bubble.pink{background:var(--pink-soft);border-color:var(--pink-b);border-radius:18px}
.bubble.pink::after{border-color:var(--pink-b)}

/* ---------- 첫 화면 ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px 24px;align-items:end;padding-block:6px 10px}
.kicker{font-size:17px;color:var(--ink-2);margin:0}
.brand{font-family:var(--f-hand);font-weight:700;font-size:clamp(46px,8vw,78px);line-height:1;margin:6px 0 0;letter-spacing:-.02em}
.brand .red{white-space:nowrap}
.sub{font-size:21px;margin:12px 0 0;font-weight:700}
.hero-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero-c .pair{display:flex;align-items:flex-end;gap:6px}
.hero-c .bubble{max-width:260px;font-size:20px}
.hero-c .d1{position:absolute;right:6px;top:4px}
.panel{display:flex;flex-wrap:wrap;gap:14px;margin-block:10px 18px}
.guide{flex:1 1 420px;border:2.5px solid var(--peach-b);border-radius:6px;padding:12px 18px;position:relative;background:#fff}
.guide h3,.statbox h3{margin:0 0 6px;font-size:21px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checks li{display:flex;gap:10px;align-items:center;font-size:20px}
.cb{width:26px;height:26px;flex:none;position:relative;border:2.5px solid var(--ink);border-radius:3px;background:#fff}
.cb.on::after{content:'';position:absolute;left:3px;top:-10px;width:12px;height:22px;border-right:4px solid var(--coral);border-bottom:4px solid var(--coral);transform:rotate(40deg);border-radius:2px}
.checks .k{font-family:var(--f-pen);color:var(--coral);font-size:28px;width:18px;text-align:center;flex:none}
.statbox{flex:0 1 380px;flex-wrap:wrap;border:2.5px solid var(--lav-b);background:var(--lav);border-radius:6px;padding:12px 18px;display:flex;gap:22px;align-items:center}
.statbox b{display:block;font-size:40px;line-height:1;white-space:nowrap}
.statbox span{font-size:17px;color:var(--ink-2);white-space:nowrap}
.who{display:grid;gap:2px}
.who label{font-size:17px;color:var(--ink-2)}
.who input{width:6.5em;font-size:22px;font-weight:700;border:0;border-bottom:2.5px dashed var(--lav-b);background:transparent;padding:0 2px}
.who input:focus{outline:none;border-bottom-color:var(--coral)}
.today{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:2.5px solid var(--pink-b);background:var(--pink-soft);border-radius:6px;padding:8px 14px;margin-bottom:14px;font-size:20px}
.today.none{border-style:dashed;background:#fff;color:var(--ink-2);font-size:18px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-block:6px 12px}
.seg{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg button{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 18px;font-size:20px;font-weight:700;transition:transform .12s}
.seg button[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--coral);color:var(--coral)}
.seg button:hover{transform:translateY(-2px)}
.seg button:active{transform:translateY(0)}
.seg.sm button{font-size:17px;padding:2px 14px;border-width:2px}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:19px;cursor:pointer;position:relative}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk input:focus-visible + .cb{outline:3px solid var(--blue);outline-offset:3px}
.chk input:checked + .cb::after{content:'';position:absolute;left:3px;top:-10px;width:12px;height:22px;border-right:4px solid var(--coral);border-bottom:4px solid var(--coral);transform:rotate(40deg);border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{position:relative;display:grid;grid-template-rows:auto auto 1fr auto;gap:4px;text-align:left;background:#fff;border:2.5px solid var(--c,var(--pink-b));border-radius:6px;padding:10px 14px 10px;min-height:170px;transition:transform .15s ease}
.tile:nth-child(4n+1){--c:var(--pink-b)} .tile:nth-child(4n+2){--c:var(--peach-b)} .tile:nth-child(4n+3){--c:var(--lav-b)} .tile:nth-child(4n+4){--c:#9DC4F0}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile:active{transform:none}
.tile .no{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:700;line-height:1}
.tile .no .circ{display:inline-grid;place-items:center;width:40px;height:40px;border:2.5px solid var(--ink);border-radius:50%;font-size:22px}
.tile .no small{font-size:16px;color:var(--ink-3);font-weight:400}
.tile .tt{font-size:21px;font-weight:700;line-height:1.3}
.tile .snip{font-family:var(--f-text);font-size:14px;line-height:1.55;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .st{display:flex;align-items:center;justify-content:space-between;font-size:17px;color:var(--ink-3)}
.tile .new{font-family:var(--f-pen);color:var(--blue);font-size:22px}
.tile .stamp,.pstamp{position:absolute;right:8px;top:6px;font-family:var(--f-pen);color:var(--coral);font-size:20px;border:2px solid var(--coral);border-radius:50%;width:54px;height:54px;display:grid;place-items:center;line-height:1;transform:rotate(12deg);opacity:.85;text-align:center}
.tile.custom{cursor:default;border-style:dashed;--c:var(--ink-3)}
.tile.custom:hover{transform:none}
.tile.custom input,.tile.custom select{width:100%;border:2px solid var(--line);border-radius:6px;padding:3px 8px;font-family:var(--f-text);font-size:15px;background:#fff}
.stars{display:inline-flex;gap:1px}
.stars svg{width:18px;height:18px}
.shelf-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 0 10px}
.shelf-h h2{margin:0;font-size:30px}
.shelf{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.shelf li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border:2.5px solid var(--line);border-radius:8px;padding:8px 14px;background:#fff}
.shelf .t{font-size:21px;font-weight:700}
.shelf .m{font-size:16px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.shelf .acts{margin:0}
.ask-del{font-size:17px;color:var(--coral);display:inline-flex;gap:8px;align-items:center}
.linkbtn{border:0;background:none;padding:0;font-size:17px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.linkbtn.red{color:var(--coral)}
.empty{padding:20px 0;display:flex;gap:16px;align-items:center}
.empty .chr{width:84px}
.note{margin-top:30px;font-size:18px;border:2.5px dashed var(--peach-b);border-radius:6px;padding:12px 18px;max-width:80ch}
.note summary{cursor:pointer;font-weight:700}
.note p{margin:8px 0;font-family:var(--f-text);font-size:15px;line-height:1.7}

/* ---------- 글쓰기 화면 ---------- */
.shead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:2px 10px}
.back{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:3px 16px 3px 12px;font-size:18px;font-weight:700}
.back:hover{background:var(--pink-soft)}
.shead h2{font-size:34px;margin:0;line-height:1.1;display:flex;align-items:center;gap:10px}
.shead .lv{font-size:17px;color:var(--ink-2);border:2px solid var(--peach-b);background:var(--peach);border-radius:999px;padding:0 12px}
.shead .sp{flex:1}
.save-ind{font-size:16px;color:var(--ink-3)}
.rail-wrap{overflow-x:auto;margin-bottom:22px;scrollbar-width:thin}
.rail{display:flex;gap:6px;list-style:none;margin:0;padding:2px 2px 6px;min-width:max-content}
.rail button{font-size:17px;padding:2px 12px;border-radius:999px;border:2px solid #E6DEDE;color:var(--ink-3);white-space:nowrap;display:inline-flex;gap:4px;align-items:center;background:#fff;transition:transform .12s}
.rail button:hover{transform:translateY(-2px)}
.rail button.on{border-color:var(--coral);color:var(--coral);background:var(--pink-soft);font-weight:700}
.rail button.fin{color:var(--ink);border-color:var(--ink-3)}
.rail button.fin::before{content:'✔';color:var(--coral)}
.body{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:26px;align-items:start}
.pcard{background:#fff;border:2.5px solid var(--blue);border-radius:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.pcard .d2{position:absolute;right:8px;top:-22px;z-index:2}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:2px dashed #C9D5F2;background:var(--blue-soft)}
.ptools .lab{font-weight:700;font-size:19px;padding-left:4px}
.pens{display:flex;gap:6px;flex-wrap:wrap}
.pen{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:1px 10px;font-size:18px;font-weight:700;display:inline-flex;gap:5px;align-items:center;transition:transform .1s}
.pen .k{font-family:var(--f-pen);color:var(--coral);font-size:26px;line-height:1}
.pen[aria-pressed="true"]{background:var(--ink);color:#fff}
.pen[aria-pressed="true"] .k{color:var(--hl-y)}
.pen:hover:not([aria-pressed="true"]):not([disabled]){transform:translateY(-2px)}
.pen[disabled]{opacity:.5;cursor:default}
.pen.sm{font-size:16px;padding:0 8px;border-width:1.5px;font-weight:400}
.pscroll{overflow:auto;flex:1 1 auto;min-height:0}
.ptext{position:relative;margin:0;padding:8px 20px 20px 58px;font-family:var(--f-text);font-size:18px;line-height:var(--lh);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1.5px),var(--rule) calc(var(--lh) - 1.5px));background-size:100% var(--lh);background-position:0 8px}
.ptext::before{content:'';position:absolute;top:0;bottom:0;left:46px;border-left:2px solid var(--margin)}
.para{margin:0;text-indent:1em;position:relative}
.ptext h4{margin:0;font-family:var(--f-hand);font-size:28px;line-height:var(--lh);text-indent:0}
.ptext .by{font-family:var(--f-hand);color:var(--ink-2);font-size:17px;margin:0;text-indent:0}
.pfoot{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding:6px 12px;border-top:2px dashed #C9D5F2;font-size:18px;color:var(--ink-2)}
.meter{display:flex;gap:14px;flex-wrap:wrap}
.meter b{color:var(--ink);font-size:22px;margin-left:4px}
.penhint{font-family:var(--f-pen);color:var(--coral);font-size:22px}
.draft{display:block;width:100%;min-height:460px;border:0;resize:vertical;font-family:var(--f-text);font-size:18px;line-height:var(--lh);padding:8px 20px 20px 58px;color:var(--ink);background-color:#fff;
  background-image:linear-gradient(to right,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),linear-gradient(to bottom,transparent calc(var(--lh) - 1.5px),var(--rule) calc(var(--lh) - 1.5px));
  background-size:100% 100%,100% var(--lh);background-position:0 0,0 8px;background-attachment:local}
.draft:focus{outline:none;box-shadow:inset 0 0 0 3px var(--blue-soft)}
.marked{--lh:50px}
.marked ruby{ruby-position:over}
.marked s{text-decoration:line-through;text-decoration-color:var(--coral);text-decoration-thickness:2px}
.marked rt{font-family:var(--f-pen);color:var(--coral);font-size:22px;line-height:1}
.sent{border-radius:2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .2s}
.sent:hover{background-color:#FFF6D6}
.sent.short{text-decoration:underline wavy var(--pink-b);text-underline-offset:6px}
.sent.grown{background-image:linear-gradient(to bottom,transparent 58%,var(--hl-g) 58%,var(--hl-g) 92%,transparent 92%)}
.sent.on{background-color:var(--hl-y)}

.side{display:grid;gap:16px}
.card{position:relative;background:#fff;border:2.5px solid var(--peach-b);border-radius:6px;padding:16px 18px 18px;animation:pop .2s ease}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec h3{margin:0;font-size:28px;display:flex;align-items:center;gap:8px;line-height:1.1}
.circ{display:inline-grid;place-items:center;width:36px;height:36px;border:2.5px solid var(--ink);border-radius:50%;font-size:22px;flex:none}
.cnt{font-size:18px;color:#fff;background:#8B8080;border-radius:999px;padding:0 12px;white-space:nowrap}
.qbar{height:10px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:14px;background:#fff}
.qbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--pink) 0 8px,#F9BCCB 8px 16px);transform-origin:left;transition:transform .3s ease}
.ask{display:flex;gap:6px;align-items:flex-end;margin:0 0 12px}
.ask .chr{width:84px}
.ask .bubble{flex:1;font-size:21px;line-height:1.45;text-align:left;margin-left:12px;border-radius:26px;padding:12px 18px}
.ctx{font-family:var(--f-text);font-size:16px;line-height:1.8;background:var(--peach);border:2px dashed var(--peach-b);border-radius:6px;padding:8px 14px;margin:0 0 12px}
.ctx .cl{display:block;font-family:var(--f-pen);font-size:22px;color:var(--coral);line-height:1.1}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld label,.fld .lb{font-size:19px;font-weight:700}
.fld .hint2{font-family:var(--f-text);font-size:14px;color:var(--ink-2)}
.fld input[type=text],.fld textarea{width:100%;font-family:var(--f-text);font-size:16px;line-height:1.6;border:2px dashed var(--peach-b);border-radius:8px;padding:8px 10px;background:var(--peach);resize:vertical}
.fld input[type=text]:focus,.fld textarea:focus{outline:none;border-style:solid;border-color:var(--coral);background:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wchip{display:inline-flex;align-items:center;gap:4px;background:var(--pink-soft);border:2px solid var(--pink-b);border-radius:999px;padding:0 4px 0 12px;font-size:18px;font-weight:700}
.wchip button{border:0;background:none;color:var(--coral);font-size:20px;line-height:1;padding:0 6px}
.qitem{border:2px solid #E4DADA;border-radius:8px;padding:10px 14px;display:grid;gap:6px;transition:border-color .15s}
.qitem:focus-within{border-color:var(--ink)}
.qitem.pick{border-color:var(--coral);background:var(--pink-soft)}
.qitem .qt{font-size:20px;font-weight:700;display:flex;gap:8px;align-items:center}
.qitem .qt .circ{width:28px;height:28px;font-size:16px}
.qitem .ex{font-family:var(--f-text);font-size:14px;color:var(--ink-2);line-height:1.6}
.qitem input[type=text]{width:100%;font-family:var(--f-text);font-size:16px;border:0;border-bottom:2px dashed var(--peach-b);background:transparent;padding:2px 2px}
.qitem input[type=text]:focus{outline:none;border-bottom-color:var(--coral)}
.qitem .chk{font-size:17px}
.qitem .chk .cb{width:22px;height:22px}
.outline{display:grid;gap:12px}
.oblk{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:10px;align-items:start}
.oblk .ol{font-size:22px;font-weight:700;color:var(--coral);line-height:1.1;padding-top:6px}
.oblk .ol small{display:block;font-size:15px;color:var(--ink-2);font-weight:400}
.oblk .fld{margin:0}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.fix{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid #E4DADA;border-radius:8px;padding:8px 12px;font-size:20px;font-weight:700}
.fix s{text-decoration-color:var(--coral);text-decoration-thickness:2px;color:var(--ink-2)}
.fix .to{color:var(--coral)}
.fix .why{display:block;font-family:var(--f-text);font-size:14px;color:var(--ink-2);font-weight:400}
.optbtn{width:100%;text-align:left;border:2px solid #E4DADA;background:#fff;border-radius:8px;padding:8px 14px;font-size:20px;font-weight:700;line-height:1.4;transition:border-color .15s,transform .1s}
.optbtn:hover{border-color:var(--ink);transform:translateX(3px)}
.optbtn .sub{display:block;font-family:var(--f-text);font-size:14px;color:var(--ink-2);font-weight:400}
.fb{margin-top:14px;display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 14px;animation:pop .25s ease}
.fb.ok{background:var(--pink-soft);border:2.5px solid var(--pink-b)}
.fb.no{background:var(--lav);border:2.5px solid var(--lav-b)}
.fb .chr{width:70px;margin-top:-4px}
.fb h4{margin:0;font-size:26px;line-height:1.2}
.fb.ok h4{color:var(--coral)} .fb.no h4{color:#8A4E8C}

<script>
/* ============ 데이터: 올려주신 자료(인천 「생각이 깊어지는 글쓰기」 3·4학년 워크북·지도서, 서·논술형 평가도구, 저학년 논술교실, 5학년 논술 자료, 동화 글감)를 바탕으로 구성 ============ */
const TYPES={

};
const TARGET={1:[60,150],2:[120,260],3:[250,450],4:[350,600],5:[500,850],6:[650,1100]};

const TOPICS=[
 // 1학년 — 저학년 동화 글감
 {id:'1a',g:1,type:'exp',title:'혼자여서 무서웠던 날',src:'동화 「곰돌이 이야기」',
  body:'곰돌이가 처음으로 혼자서 자는 날이에요.\n“곰돌아, 혼자서 잘 수 있겠니?” “네, 엄마. 걱정 마세요.”\n그런데 ‘위잉위잉’ 바람이 창문을 흔들자 곰돌이는 무서웠어요.\n“우리 곰돌이는 참 씩씩하구나!” 아빠 말씀을 듣고 곰돌이는 얼른 제 방으로 돌아왔어요.\n“나는 씩씩한 곰돌이야.” 곰돌이는 코코 잠이 들었답니다.',
  think:['곰돌이처럼 혼자여서 무서웠던 일이 있었나요?','언제, 무슨 일 때문이었나요?','무서움을 어떻게 이겨 냈나요?']},
 {id:'1b',g:1,type:'expl',title:'내 친구의 모습을 소개해요',src:'동화 「모양나라 친구들」',
  body:'동그라미가 세모 나라에 갇혔을 때 세모 친구가 구해 주었어요.\n“넌 동글동글 이상하게 생겼다.” “너도 뾰족뾰족 이상하게 생겼다.”\n둘은 친구가 되었고, 넙적넙적 네모도 만났어요.\n동그라미, 세모, 네모는 모두 친구가 되어 모양 나라를 세웠답니다.',
  think:['친구들의 모습은 다 달라요. 내 친구는 어떻게 생겼나요?','키, 얼굴, 눈, 코, 입, 머리 모양을 떠올려 봐요.','그 친구의 좋은 점은 무엇인가요?']},
 {id:'1c',g:1,type:'exp',title:'내가 누군가를 도와준 날',src:'동화 「영희의 실내화」',
  body:'모두가 집으로 돌아간 유치원에서 훌쩍훌쩍 우는 소리가 들렸어요.\n영희의 실내화 한 짝이 바닥에 떨어져 울고 있었어요.\n나비는 ‘팔락팔락’ 선생님께 날아가 신발장으로 안내했어요.\n방글방글 웃는 실내화를 보며 나비는 무척 기뻤답니다.',
  think:['나비처럼 누구를 도와준 일이 있었나요?','도와준 뒤에 마음이 어땠나요?']},
 {id:'1d',g:1,type:'op',title:'놀이터에서는 차례를 지켜요',src:'동화 「그네와 파리」',
  body:'나비들이 즐겁게 그네를 타고 있었어요.\n그때 파리가 날아와 “비켜! 내가 먼저 탈 거야.” 하고 올라탔어요.\n그네는 ‘뚝’ 멈춰 섰어요.\n“파리야, 줄을 서면 밀어 줄게.” 산들바람의 말에 파리는 얼른 뒤로 물러섰어요.',
  think:['재미있게 놀고 있는데 누가 방해해서 속상했던 적이 있나요?','차례를 지키면 무엇이 좋을까요?']},
 {id:'1e',g:1,type:'exp',title:'내 물건을 아껴요',src:'동화 「아이쿠 아야야」',
  body:'아름이는 신발도 책도 아무 데나 던졌어요.\n“아이쿠!” 신발이 소리쳤어요. “아야야!” 책도 아파했어요.\n화가 난 장난감들이 몰려오자 아름이는 “잘못했어, 다시는 안 그럴게.” 했어요.\n잠에서 깬 아름이는 얼른 장난감을 정리했답니다.',
  think:['물건을 아무 데나 두었다가 곤란했던 적이 있나요?','내 물건을 아끼려면 어떻게 해야 할까요?']},
 {id:'1f',g:1,type:'expl',title:'나를 소개해요',src:'저학년 논술교실 「자기소개서 쓰기」',
  body:'친구들 앞에서 나를 소개하는 글을 써 봐요.\n이름, 좋아하는 것, 잘하는 것, 꿈을 차례대로 써 보면 좋아요.',
  think:['내 이름은 무엇이고, 누가 지어 주었나요?','내가 좋아하는 것과 잘하는 것은?','나의 꿈은 무엇인가요?']},
 {id:'1g',g:1,type:'letter',title:'부모님께 편지 쓰기',src:'저학년 논술교실 「편지쓰기」',
  body:'고마운 마음, 미안한 마음, 하고 싶은 말을 편지로 전해 봐요.\n편지는 ‘받는 사람 → 첫인사 → 하고 싶은 말 → 끝인사 → 날짜와 쓴 사람’ 차례로 써요.',
  think:['부모님께 가장 고마웠던 일은?','부모님께 꼭 하고 싶은 말은?']},
 // 2학년
 {id:'2a',g:2,type:'exp',title:'창피했던 일, 친구를 놀린 일',src:'동화 「무지개 물고기」 (논술교실 독서 글감)',
  body:'바다에서 가장 아름다운 비늘을 가진 물고기가 있었어요.\n다른 물고기들이 비늘 하나만 달라고 해도 물고기는 거절하고 뽐내기만 했어요.\n결국 아무도 함께 놀아 주지 않자 물고기는 외로워졌어요.\n반짝이 비늘을 하나씩 나누어 주자, 물고기는 친구들과 함께 행복해졌어요.',
  think:['나만 잘난 척하다가 창피했던 적이 있나요?','친구를 놀려서 친구가 속상했던 적은 없었나요?','그 뒤에 어떻게 했나요?']},
 {id:'2b',g:2,type:'exp',title:'해야 할 일을 미룬 날',src:'옛이야기 「아기 돼지 삼 형제」',
  body:'첫째 돼지는 지푸라기로, 둘째 돼지는 나무로 대충 집을 지었어요.\n막내 돼지는 힘들어도 벽돌을 한 장 한 장 쌓아 튼튼한 집을 지었어요.\n늑대가 “후우!” 불자 지푸라기 집과 나무 집은 날아가 버렸지만,\n벽돌집은 끄떡없었어요.',
  think:['해야 할 일을 하지 않고 미룬 적이 있나요?','그래서 어떤 일이 생겼나요?','다음에는 어떻게 하고 싶나요?']},
 {id:'2c',g:2,type:'imag',title:'개미와 베짱이, 그다음 이야기',src:'이솝 이야기 「개미와 베짱이」',
  body:'여름 내내 개미는 땀 흘려 먹이를 모았고, 베짱이는 노래만 불렀어요.\n추운 겨울이 오자 베짱이는 배가 고파 개미네 집 문을 두드렸어요.\n“똑똑, 개미야. 먹을 것 좀 나누어 줄 수 있니?”',
  think:['개미는 문을 열어 주었을까요?','베짱이는 그 뒤에 어떻게 바뀌었을까요?','내가 이야기 뒷부분을 지어 본다면?']},
 {id:'2d',g:2,type:'op',title:'선비가 구렁이를 쏜 것은 옳았을까?',src:'옛이야기 「은혜 갚은 까치」',
  body:'산길을 가던 선비는 구렁이가 까치 둥지를 노리는 것을 보았어요.\n선비는 활을 쏘아 구렁이를 물리치고 아기 까치들을 구했어요.\n그날 밤, 구렁이의 짝이 나타나 선비를 해치려 했지만\n까치들이 몸을 던져 종을 울려 선비를 구해 주었답니다.',
  think:['선비가 까치를 구한 것은 잘한 일일까요?','구렁이 입장에서 생각하면 어떨까요?','나라면 어떻게 했을까요?']},
 {id:'2e',g:2,type:'expl',title:'내가 좋아하는 동물 설명하기',src:'저학년 논술교실 「설명하는 글쓰기」',
  body:'좋아하는 동물 하나를 정해서, 그 동물을 모르는 친구도 알 수 있게 설명해 봐요.\n생김새, 사는 곳, 먹이, 재미있는 특징을 나누어 쓰면 좋아요.',
  think:['어떤 동물을 설명하고 싶나요?','생김새는 어떤가요?','그 동물만의 신기한 점은?']},
 {id:'2f',g:2,type:'imag',title:'토끼와 거북이, 끝부분 바꿔 쓰기',src:'저학년 논술교실 「이야기 끝부분 고쳐 쓰기」',
  body:'토끼는 느림보 거북이를 놀리며 경주를 하자고 했어요.\n앞서가던 토끼는 “한숨 자고 가도 이기겠지.” 하며 나무 밑에서 잠이 들었어요.\n거북이는 쉬지 않고 엉금엉금 기어갔어요.\n…… 이야기의 끝을 내 마음대로 바꾸어 볼까요?',
  think:['토끼가 잠에서 깨어났을 때 무슨 일이 생길까요?','두 친구가 함께 결승선에 들어간다면?','내가 바꾼 끝에서 인물들은 무엇을 배울까요?']},
 {id:'2g',g:2,type:'letter',title:'고마운 분께 편지 쓰기',src:'저학년 논술교실 「편지쓰기」',
  body:'선생님, 할머니, 친구처럼 고마운 사람에게 편지를 써 봐요.\n고마웠던 일을 자세히 쓰면 마음이 잘 전해져요.',
  think:['누구에게 고마운가요?','무엇이 고마웠나요? 그때 어떤 일이 있었나요?']},
 {id:'2h',g:2,type:'exp',title:'가장 기억에 남는 주말',src:'저학년 논술교실 「일기쓰기」',
  body:'지난 주말 있었던 일 가운데 가장 기억에 남는 일을 골라 일기로 써 봐요.\n있었던 일을 차례대로 쓰고, 그때의 생각과 느낌을 꼭 넣어요.',
  think:['언제, 어디서, 누구와 있었나요?','무엇을 했나요? 가장 재미있던 순간은?','그때 어떤 기분이었나요?']},
 // 3학년 — 의견을 제시하는 글 워크북
 {id:'3a',g:3,type:'op',title:'이웃을 위해 어떤 소음을 줄일 수 있을까?',src:'공익광고 「층간 소음」(2015, 공익광고협의회) · 3학년 워크북 기본1',
  body:'광고 속 사람들은 아파트에서 쿵쿵 뛰고, 의자를 끌고, 늦은 밤 청소기를 돌려요.\n그 소리들이 모여 아래층에는 커다란 ‘연주’처럼 들려요.\n“나에겐 일상이지만 이웃에겐 소음일 뿐입니다.”',

function findSpell(text){
  const hits=[];
  SPELL.forEach(([re,fn,why])=>{re.lastIndex=0;let m;while((m=re.exec(text))){const to=fn(...m);if(to!==m[0])hits.push({s:m.index,e:m.index+m[0].length,from:m[0],to,why,src:'rule'});if(m[0].length===0)re.lastIndex++}});
  hits.sort((a,b)=>a.s-b.s);const out=[];let end=-1;
  hits.forEach(h=>{if(h.s>=end){out.push(h);end=h.e}});return out;
}

  place:/(에서|에 갔|에 가|집|학교|공원|놀이터|교실)/,
  reason:/(왜냐하면|때문|까닭은|이유는|첫째|둘째|셋째)/g,
  example:/(예를 들어|예를 들면|예로|처럼|가령)/,
  opinion:/(생각합니다|생각한다|생각해요|해야|합시다|좋겠|찬성|반대|주장)/,
  concl:/(그러므로|따라서|이처럼|결론|앞으로|합시다|해요!|바랍니다|부탁)/,
  dialog:/[“"]/,
  mimetic:/([가-힣]{2})\1/,
  greet:/(에게|께|안녕)/, close:/(올림|드림|씀|사랑해|안녕히|[0-9]+월)/
};
function analyze(text,g,type){
  const t=(text||'').trim();const chars=countChars(t);
  const paras=t.split(/\n+/).filter(p=>p.trim()).length;
  const sents=splitSents(t);const errs=findSpell(t);
  const [tmin,tmax]=TARGET[g];
  const good=[],fix=[];
  // 길이
  if(chars>=tmin) good.push(`목표 글자 수(${tmin}자)를 넘겼어요. 끝까지 쓴 힘이 대단해요!`);
  else fix.push(`목표까지 ${tmin-chars}자 남았어요. 6단계에서 문장을 늘려 봐요.`);
  // 종류별 내용
  let content=1;
  const has=r=>r.test(t);const reasonN=(t.match(RX.reason)||[]).length;
  if(type==='op'){
    if(has(RX.opinion)){content++;good.push('내 의견이 분명하게 드러나요.')} else fix.push('“나는 ~라고 생각합니다.”처럼 내 의견을 분명히 써 봐요.');
    if(reasonN>=2){content++;good.push('‘왜냐하면·첫째·둘째’로 이유를 똑똑하게 밝혔어요!')} else if(reasonN===1){fix.push('이유가 하나예요. 두 번째 이유를 더해 볼까요?')} else fix.push('“왜냐하면 ~ 때문입니다.”로 이유를 써 봐요.');
    if(g>=3&&!has(RX.example)) fix.push('이유를 뒷받침하는 예시나 경험(“예를 들어,”)을 넣어 봐요.');
  }else if(type==='exp'){
    if(has(RX.time)||has(RX.place)){content++;good.push('언제, 어디서 있었던 일인지 잘 알려 주었어요.')} else fix.push('언제, 어디서 있었던 일인지 처음에 써 주세요.');
    if(has(RX.feel)){content++;good.push('그때의 마음을 솔직하게 썼어요.')} else fix.push('그때 어떤 기분이었는지 마음을 나타내는 말을 넣어 봐요.');
  }else if(type==='imag'){
    if(has(RX.dialog)){content++;good.push('인물의 대화를 넣어서 이야기가 생생해요.')} else fix.push('인물이 하는 말(“ ”)을 넣으면 더 생생해져요.');
    if(has(RX.feel)||sents.length>=5){content++;good.push('이야기가 이어지도록 잘 썼어요.')} else fix.push('인물의 마음이나 벌어진 일을 조금 더 써 봐요.');
  }else if(type==='letter'){
    if(has(RX.greet)){content++;good.push('받는 사람과 첫인사가 잘 들어갔어요.')} else fix.push('“○○에게”, “안녕하세요?”로 편지를 시작해 봐요.');
    if(has(RX.close)){content++;good.push('끝인사까지 잊지 않았어요.')} else fix.push('끝인사와 날짜, 쓴 사람을 써 주세요.');
  }else if(type==='expl'){
    if(/(첫째|또|특징|생김새|모양|색|크기|예를 들어|다른 점|같은 점)/.test(t)){content++;good.push('특징을 나누어 설명했어요.')} else fix.push('특징을 “첫째, 둘째”처럼 나누어 설명해 봐요.');
    if(sents.length>=Math.max(3,g+1)){content++} else fix.push('설명을 한두 문장 더 자세히 써 봐요.');
  }else if(type==='book'){
    if(/(장면|부분|때)/.test(t)){content++;good.push('인상 깊은 장면을 골라 썼어요.')} else fix.push('가장 인상 깊은 장면을 하나 골라 써 봐요.');
    if(reasonN>0||/(배웠|느꼈|깨달|앞으로|나라면)/.test(t)){content++;good.push('책을 읽고 생긴 내 생각을 썼어요.')} else fix.push('왜 인상 깊었는지, 무엇을 배웠는지 써 봐요.');
  }
  content=Math.min(3,content);
  // 짜임
  let org=1;const needP=g>=3?3:2;
  if(paras>=needP){org++;good.push('문단을 나누어 읽기 편해요.')} else fix.push(g>=3?'처음·가운데·끝을 줄을 바꾸어 문단으로 나누어 봐요.':'하고 싶은 말이 바뀔 때 줄을 바꿔 봐요.');
  if(type==='op'?has(RX.concl):sents.length>=3) org++; else if(type==='op') fix.push('끝부분에서 “그러므로”로 의견을 다시 정리해 봐요.');
  org=Math.min(3,org);
  // 표현
  let expr=3;
  const andN=(t.match(/그리고/g)||[]).length;
  if(andN>=3){expr--;fix.push(`‘그리고’가 ${andN}번 나왔어요. ‘그래서, 또, 게다가’로 바꿔 보면 글이 매끄러워요.`)}
  const ends=sents.map(s=>s.replace(/[.!?…"”'\s]+$/,'').slice(-4));
  const endCount={};ends.forEach(e=>{if(e.length>=3)endCount[e]=(endCount[e]||0)+1});
  const rep=Object.entries(endCount).find(([k,v])=>v>=3&&!/니다$/.test(k));
  if(rep){fix.push(`문장 끝이 ‘${rep[0]}’로 ${rep[1]}번 반복돼요. 다른 말로 바꾸어 볼까요?`)}
  const polite=sents.filter(s=>/(니다|요)[.!?]?$/.test(s.replace(/[”"'\s]+$/,''))).length;
  const plain=sents.filter(s=>/[^니]다[.!?]?$/.test(s.replace(/[”"'\s]+$/,''))&&!/[“"]/.test(s)).length;
  if(g>=2&&polite>0&&plain>0&&type!=='imag'){expr--;fix.push('‘~습니다/요’와 ‘~다’를 섞어 썼어요. 한 가지로 맞춰요.')}
  const longLim=g<=2?45:65;const longS=sents.filter(s=>s.length>longLim);
  if(longS.length){fix.push(`너무 긴 문장이 ${longS.length}개 있어요. 두 문장으로 나누어 봐요.`)}
  const noPunct=t.split(/\n+/).filter(p=>p.trim()&&!/[.!?…"”')]\s*$/.test(p.trim())).length;
  if(noPunct){fix.push('문장 끝에 마침표(.)를 빠뜨린 곳이 있어요.')}
  if(errs.length>=3)expr--; if(errs.length>=6)expr--;
  if(errs.length===0&&chars>20) good.push('맞춤법을 꼼꼼하게 지켰어요!');
  expr=Math.max(1,Math.min(3,expr));
  const shortN=sents.filter(s=>countChars(s)<(g<=2?8:14)).length;
  return {chars,paras,sentN:sents.length,shortN,errs,good:good.slice(0,3),fix:fix.slice(0,5),rubric:{내용:content,짜임:org,표현:expr},at:Date.now()};
}

function expandAsks(s,type){
  const a=[];
  if((type==='exp'||type==='imag'||type==='book')&&!RX.time.test(s)) a.push(['언제?','언제였는지 앞에 붙여 봐요. “지난 토요일 오후에,”']);
  if((type==='exp'||type==='imag')&&!RX.place.test(s)) a.push(['어디서?','어디였는지 넣어 봐요. “놀이터 미끄럼틀 앞에서”']);
  if(!RX.mimetic.test(s)) a.push(['어떻게?','흉내 내는 말이나 꾸며 주는 말을 넣어 봐요. “살금살금”, “힘껏”']);
  if(!/(때문|왜냐하면|해서|어서|아서|니까)/.test(s)) a.push(['왜?','까닭을 이어 붙여 봐요. “~ 때문이다.”, “~해서”']);
  if(!RX.feel.test(s)) a.push(['마음은?','그때 마음을 더해 봐요. “가슴이 두근두근 뛰었다.”']);
  if((type==='op'||type==='expl')&&!RX.example.test(s)) a.push(['예를 들면?','예를 하나 들어 봐요. “예를 들어, 우리 반에서는 ~”']);
  if(type==='op') a.push(['그러면 어떻게 될까?','그렇게 하면 어떤 좋은 일이 생기는지 써 봐요.']);
  return a.slice(0,5);
}

  const wrap=document.createElement('div');wrap.id='sendDlg';wrap.className='send-back';
  wrap.innerHTML=`<div class="send" role="dialog" aria-modal="true" aria-labelledby="sendT">
    <div class="send-top">${ch('songi','cheer')}<div class="bubble l pink" id="sendT">${esc(title)}</div></div>
    <ol class="send-steps">
      <li><span class="circ">1</span> <b>복사하기</b>를 눌러요</li>
      <li><span class="circ">2</span> 카톡에서 엄마 대화방을 열어요</li>
      <li><span class="circ">3</span> 길게 눌러 <b>붙여넣기</b> → 보내기!</li>
    </ol>
    <label class="sr" for="sendTxt">보낼 내용</label>
    <textarea id="sendTxt" readonly rows="9">${esc(text)}</textarea>
    <p class="send-msg" id="sendMsg" aria-live="polite"></p>
    <div class="acts">
      <button class="btn" id="sendClose">닫기</button>
      <button class="btn" id="sendFile">파일로 저장</button>
      <a class="btn" id="sendSms" href="sms:?&body=${encodeURIComponent(text)}">문자로 보내기</a>
      <button class="btn pri" id="sendCopy">복사하기</button>
    </div></div>`;
  $('#layer').appendChild(wrap);
  const ta=$('#sendTxt'),msg=$('#sendMsg');
  wrap.addEventListener('click',e=>{if(e.target===wrap)closeModal()});
  $('#sendClose').onclick=closeModal;
  $('#sendFile').onclick=()=>saveFile(fileName,text,'text/plain');
  $('#sendCopy').onclick=()=>{
    const fallback=()=>{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);msg.textContent='글이 선택됐어요. 길게 누르거나 Ctrl+C로 복사해 주세요.'};
    try{navigator.clipboard.writeText(text).then(()=>{msg.textContent='복사했어요! 이제 카톡에 붙여 넣어 엄마에게 보내요 💕';$('#sendCopy').textContent='복사 완료 ✔'},fallback)}catch(e){fallback()}
  };
  $('#sendSms').addEventListener('click',()=>{msg.textContent='문자 앱이 열리지 않으면 복사하기를 눌러 주세요.'});
  $('#sendCopy').focus();
}
function sendMom(w){
  if(!w.text||!w.text.trim()){toast('아직 쓴 글이 없어요');return}
  openSend(reportText(w),w.done?'완성한 글을 엄마에게 보내자!':'지금까지 쓴 글을 엄마에게 보내자!',`${DB.name}_${(w.title||topicOf(w).title).slice(0,20)}.txt`);
}

function workHTML(){
  const w=curWork();if(!w){view.screen='home';return homeHTML()}
  const tp=topicOf(w);
  const rail=STEP_NAMES.map((s,i)=>`<li><button data-act="step" data-s="${i}" class="${view.step===i?'on':(w.maxStep||0)>i||w.done?'fin':''}" ${view.step===i?'aria-current="step"':''}>${s}</button></li>`).join('');
  const L=[leftMaterial,leftMaterial,leftMaterial,leftDraft,leftMarked,leftSents][view.step](w,tp);
  const R=[r0,r1,r2,r3,r4,r5][view.step](w,tp);
  return `<div class="shead">
      <button class="back" data-act="home" aria-label="목록으로">← 목록</button>
      <h2><span class="circ tnum" style="width:44px;height:44px;font-size:24px">${w.grade}</span> ${esc(tp.title)}</h2>
      <span class="lv">${w.grade}학년 · ${TYPES[w.type].label}</span>
      <span class="sp"></span><span id="saveInd" class="save-ind"></span>
    </div>
    <div class="rail-wrap"><ol class="rail">${rail}</ol></div>
    <div class="body">${L}<section class="side" aria-live="polite">${R}</section></div>`;
}
function cardTop(w,title,cnt){
  const i=view.step;
  return `<div class="sec"><h3><span class="circ">${CIRC[i]}</span> ${title}</h3><span class="cnt tnum">${cnt||`${i+1}/6단계`}</span></div>
  <div class="qbar" aria-hidden="true"><i style="transform:scaleX(${(i+1)/6})"></i></div>`;
}
const askRow=(who,mood,html,cls='')=>`<div class="ask">${ch(who,mood,cls)}<p class="bubble l">${html}</p></div>`;
function navActs(){
  return `<div class="acts sp">${view.step>0?`<button class="btn" data-act="prev">← ${STEP_NAMES[view.step-1]}</button>`:'<span></span>'}${view.step<5?`<button class="btn pri" data-act="next">${STEP_NAMES[view.step+1]} →</button>`:''}</div>`;

/* 왼쪽: 지문 카드 */
function leftMaterial(w,tp){
  return `<section class="pcard mat" aria-label="읽을 글"><span class="doodle d2">여기 읽어 봐~</span>
    <div class="ptools"><span class="lab">읽을 글</span><span class="penhint">${esc(TYPES[w.type].label)}</span></div>
    <div class="pscroll"><div class="ptext">${tp.body.split('\n').filter(Boolean).map(p=>`<p class="para">${esc(p)}</p>`).join('')}</div></div>
    <div class="pfoot"><span style="font-size:16px">자료: ${esc(tp.src)}</span></div></section>`;
}
function leftDraft(w,tp){
  const [a,b]=TARGET[w.grade];
  return `<section class="pcard" aria-label="글 쓰는 곳"><span class="doodle d2">여기에 써 봐!</span>
    <div class="ptools"><div class="pens" role="group" aria-label="문장 도우미">${STARTERS[w.type].slice(0,5).map(s=>`<button class="pen sm" data-act="ins" data-v="${esc(s)}"><span class="k">+</span>${esc(s)}</button>`).join('')}</div></div>
    <div class="pscroll"><label class="sr" for="draft">글 쓰는 곳</label><textarea id="draft" class="draft" data-inp="text" placeholder="개요를 보면서 문장으로 써 봐요.">${esc(w.text||'')}</textarea></div>
    <div class="pfoot"><div class="meter"><span>글자 수<b class="tnum" id="mChars">0</b>자</span><span>문장<b class="tnum" id="mSents">0</b></span><span>문단<b class="tnum" id="mParas">0</b></span></div><span class="penhint" id="mGoal">목표 ${a}~${b}자</span></div></section>`;
}
function markedHTML(text,errs,aiFixes){
  const marks=errs.map(e=>({...e}));
  (aiFixes||[]).forEach(f=>{if(!f.from||f.from===f.to)return;const s=text.indexOf(f.from);if(s<0)return;const e=s+f.from.length;if(marks.some(m=>!(e<=m.s||s>=m.e)))return;marks.push({s,e,from:f.from,to:f.to})});
  marks.sort((a,b)=>a.s-b.s);let out='',p=0;
  marks.forEach(m=>{out+=esc(text.slice(p,m.s))+`<ruby><s>${esc(m.from)}</s><rt>${esc(m.to)}</rt></ruby>`;p=m.e});
  return out+esc(text.slice(p));
}
function paras(html){return html.split('\n').filter(x=>x.trim()).map(p=>`<p class="para">${p}</p>`).join('')}
function leftMarked(w,tp){
  if(!w.fb||!w.text)return leftDraftPreview(w);
  const aiF=w.ai&&w.ai.fixes?w.ai.fixes.filter(f=>w.text.includes(f.from)):[];
  const n=w.fb.errs.length+aiF.length;
  return `<section class="pcard" aria-label="빨간펜으로 고친 글"><span class="doodle d2">빨간펜 슥슥~</span>
    <div class="ptools"><span class="lab">빨간펜으로 고친 글</span><button class="pen" data-act="step" data-s="3"><span class="k">✎</span>글 고치러 가기</button></div>
    <div class="pscroll"><div class="ptext marked">${paras(markedHTML(w.text,w.fb.errs,aiF))}</div></div>
    <div class="pfoot"><div class="meter"><span>고칠 곳<b class="tnum">${n}</b>군데</span><span>글자 수<b class="tnum">${w.fb.chars}</b>자</span></div><span class="penhint">${n?'빨간 글씨로 고쳐 봐!':'맞춤법 통과!'}</span></div></section>`;
}
function leftDraftPreview(w){
  return `<section class="pcard" aria-label="내 글"><div class="ptools"><span class="lab">내 글</span></div>
    <div class="pscroll"><div class="ptext">${w.text?paras(esc(w.text)):'<p class="para" style="color:var(--ink-3)">아직 쓴 글이 없어요.</p>'}</div></div></section>`;
}
function leftSents(w,tp){
  if(w.done&&!view.more){
    return `<section class="pcard" aria-label="완성한 글"><span class="pstamp" style="top:48px">참<br>잘했어요</span>
      <div class="ptools"><span class="lab">완성한 글</span><button class="pen" data-act="more"><span class="k">+</span>문장 더 늘리기</button></div>
      <div class="pscroll"><div class="ptext"><h4>${esc(w.title||tp.title)}</h4><p class="by">${w.grade}학년 ${esc(DB.name)} · ${new Date(w.doneAt||Date.now()).toLocaleDateString('ko-KR')}</p>${paras(esc(w.text.trim()))}</div></div>
      <div class="pfoot"><div class="meter"><span>글자 수<b class="tnum">${countChars(w.text)}</b>자</span></div></div></section>`;
  }
  const lim=w.grade<=2?8:14,grown=new Set(w.grown||[]);let idx=0;
  const body=(w.text||'').split('\n').filter(x=>x.trim()).map(p=>{
    const ss=splitSents(p);
    return `<p class="para">${ss.map(s=>{const i=idx++;const cls=grown.has(s)?'grown':countChars(s)<lim?'short':'';return `<span class="sent ${cls} ${view.sel===i?'on':''}" data-act="sel" data-i="${i}" role="button" tabindex="0">${esc(s)}</span>`}).join(' ')}</p>`}).join('');
  return `<section class="pcard" aria-label="문장 고르기"><span class="doodle d2">문장을 콕!</span>
    <div class="ptools"><span class="lab">늘리고 싶은 문장을 눌러요</span></div>
    <div class="pscroll"><div class="ptext">${body||'<p class="para" style="color:var(--ink-3)">아직 쓴 글이 없어요.</p>'}</div></div>
    <div class="pfoot"><div class="meter"><span>글자 수<b class="tnum">${countChars(w.text)}</b>자</span><span>늘린 문장<b class="tnum">${w.grownN||0}</b></span></div><span class="penhint">물결 밑줄 = 짧은 문장</span></div></section>`;
}

/* 오른쪽: 단계 카드 */
function r0(w,tp){

    <ul class="checks">${tp.think.map(q=>`<li><span class="k">?</span><span>${esc(q)}</span></li>`).join('')}</ul>
    <div class="fld" style="margin-top:14px"><label for="wordIn">떠오르는 낱말 모으기</label>

    view.exAI={questions:(r.questions||[]).slice(0,3),example:r.example||''};
  }catch(e){view.ask=AI_ERR[e&&e.code]||'지금은 AI 질문을 받을 수 없어요. 다른 질문 펜을 써 봐요.'}
  view.exBusy=false;render();

function insertAt(el,val){
  if(!el)return;const s=el.selectionStart??el.value.length,e=el.selectionEnd??s;const pre=el.value.slice(0,s);
  const pad=pre&&!/\s$/.test(pre)?' ':'';
  el.value=pre+pad+val+el.value.slice(e);const pos=s+pad.length+val.length;el.focus();el.setSelectionRange(pos,pos);
  el.dispatchEvent(new Event('input',{bubbles:true}));
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;const w=curWork();
  switch(act){
    case 'grade':DB.grade=+b.dataset.g;DB.filter='all';persist();render();break;
    case 'filter':DB.filter=b.dataset.f;persist();render();break;
    case 'onlyNew':DB.onlyNew=b.checked;persist();render();break;
    case 'start':newWork(TOPICS.find(t=>t.id===b.dataset.t));break;
    case 'startCustom':{const title=$('#cTitle').value.trim();if(!title){$('#cTitle').focus();toast('주제를 먼저 써 주세요');return}
      const type=$('#cType').value;newWork(null,{id:'c'+uid(),g:DB.grade,type,title,src:'내가 정한 주제',body:`내가 정한 주제: ${title}\n이 주제에 대해 무엇을 쓰고 싶은지 떠올려 봐요.`,think:[`‘${title}’ 하면 무엇이 먼저 떠오르나요?`,'왜 이 주제를 골랐나요?','읽는 사람에게 꼭 전하고 싶은 것은?']});break}
    case 'open':{const x=DB.works.find(x=>x.id===b.dataset.id);view={...view,screen:'work',id:x.id,step:x.done?5:(x.step||0),sel:-1,ask:'',exAI:null,more:false};render();window.scrollTo({top:0});break}
    case 'home':view.screen='home';view.confirmDel=null;render();window.scrollTo({top:0});break;
    case 'del':view.confirmDel=b.dataset.id;render();break;
    case 'delNo':view.confirmDel=null;render();break;
    case 'delYes':DB.works=DB.works.filter(x=>x.id!==b.dataset.id);view.confirmDel=null;persist();render();toast('글을 지웠어요');break;
    case 'mom':{const x=DB.works.find(x=>x.id===b.dataset.id);if(x)sendMom(x);break}
    case 'todayMom':{const ws=DB.works.filter(x=>x.done&&dayKey(x.doneAt)===dayKey(Date.now()));openSend(dayMsg(ws),'오늘 쓴 글을 엄마에게 보내자!',`${DB.name}_오늘의글_${new Date().toISOString().slice(0,10)}.txt`);break}
    case 'step':goStep(+b.dataset.s);break;
    case 'next':goStep(Math.min(5,view.step+1));break;
    case 'prev':goStep(Math.max(0,view.step-1));break;
    case 'more':view.more=true;view.sel=-1;render();break;
    case 'addWord':{const i=$('#wordIn');const v=i.value.trim();if(!v)return;w.words=[...(w.words||[]),v];touch(w);render();$('#wordIn').focus();break}
    case 'rmWord':w.words.splice(+b.dataset.i,1);touch(w);render();break;
    case 'pickq':w.pick=b.dataset.k;touch(w);render();break;
    case 'pullOutline':{const ol=outlineFor(w.type,w.grade).map(([k])=>(w.ol||{})[k]).filter(Boolean);if(!ol.length){toast('개요가 비어 있어요');return}
      w.text=(w.text?w.text.replace(/\s+$/,'')+'\n\n':'')+ol.join('\n\n');touch(w);render();break}
    case 'ins':insertAt($('#draft'),b.dataset.v);break;
    case 'check':runCheck(w);break;
    case 'fix':{const e=w.fb.errs[+b.dataset.i];applyFix(w,e.from,e.to);runCheck(w);toast('고쳤어요');break}
    case 'fixAI':{const f=w.ai.fixes.filter(f=>w.text.includes(f.from))[+b.dataset.i];if(f){applyFix(w,f.from,f.to);w.ai.fixes=w.ai.fixes.filter(x=>x!==f)}runCheck(w);toast('고쳤어요');break}
    case 'fixAll':{[...w.fb.errs].reverse().forEach(e=>{w.text=w.text.slice(0,e.s)+e.to+w.text.slice(e.e);w.fixedN=(w.fixedN||0)+1});
      if(w.ai&&w.ai.fixes){w.ai.fixes.forEach(f=>{if(w.text.includes(f.from))applyFix(w,f.from,f.to)});w.ai.fixes=[]}runCheck(w);toast('모두 고쳤어요');break}
    case 'self':w.self={...(w.self||{}),[b.dataset.i]:b.checked};touch(w);break;
    case 'aiCheck':aiCheck(w);break;
    case 'aiStop':if(aiCtl)aiCtl.abort();break;
    case 'sel':view.sel=+b.dataset.i;view.ask='';view.exAI=null;render();if(window.matchMedia('(max-width:900px)').matches){const c=document.querySelector('.side');if(c)c.scrollIntoView({block:'start',behavior:'smooth'})}break;
    case 'ask':{const s=allSents(w)[view.sel];const a=expandAsks(s,w.type)[+b.dataset.i];view.ask=a?a[1]:'';const h=$('#hintline');if(h)h.textContent=view.ask;$('#grow')?.focus();break}
    case 'exAI':exAI(w,allSents(w)[view.sel]);break;
    case 'insGrow':insertAt($('#grow'),b.dataset.v);break;
    case 'replace':{const s=allSents(w)[view.sel];const nv=$('#grow').value.trim();if(!s||!nv||nv===s)return;
      const i=w.text.indexOf(s);if(i<0)return;w.text=w.text.slice(0,i)+nv+w.text.slice(i+s.length);
      const diff=countChars(nv)-countChars(s);if(diff>0){w.grownN=(w.grownN||0)+1;w.grown=[...(w.grown||[]),nv]}
      touch(w);view.ask='';view.exAI=null;render();toast(diff>0?`문장이 ${diff}자 늘었어요!`:'문장을 바꿨어요');break}
    case 'addPara':{const s=MORE[w.type][+b.dataset.i][1];w.text=(w.text||'').replace(/\s+$/,'')+'\n\n'+s;touch(w);goStep(3);
      setTimeout(()=>{const d=$('#draft');if(d){d.focus();d.setSelectionRange(d.value.length,d.value.length);d.scrollTop=d.scrollHeight}},30);break}
    case 'finish':{if(!w.firstLen)w.firstLen=countChars(w.text);w.done=true;w.doneAt=Date.now();w.fb=analyze(w.text,w.grade,w.type);w.fb.textSnap=w.text;view.more=false;view.sel=-1;touch(w);persist();render();window.scrollTo({top:0});toast('완성! 이 기기에 저장했어요');break}
    case 'saveTxt':saveFile(`${DB.name}_${(w.title||topicOf(w).title).slice(0,20)}.txt`,`${w.title||topicOf(w).title}\n${w.grade}학년 ${DB.name} · ${today()}\n\n${w.text.trim()}\n`,'text/plain');break;
    case 'backup':saveFile(`${DB.name}_글쓰기_백업_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(DB,null,1),'application/json');break;
  }
});
document.addEventListener('input',ev=>{
  const el=ev.target;const k=el.dataset.inp;if(!k)return;
  if(k==='name'){DB.name=el.value.trim()||'지호';const nm=$('#nm');if(nm)nm.textContent=DB.name;saveSoon();return}
  const w=curWork();if(!w)return;
  if(k==='text'){w.text=el.value;updateMeter()}
  else if(k==='web'){w.web={...(w.web||{}),[el.dataset.k]:el.value}}
  else if(k==='q'){w.qs={...(w.qs||{}),[el.dataset.k]:el.value}}
  else if(k==='ol'){w.ol={...(w.ol||{}),[el.dataset.k]:el.value}}
  else w[k]=el.value;
  touch(w);
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target.id==='wordIn'){ev.preventDefault();$('[data-act="addWord"]').click()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('sent')){ev.preventDefault();ev.target.click()}
  if(ev.key==='Escape'&&$('#layer').innerHTML)closeModal();
});
document.addEventListener('change',ev=>{
  if(ev.target.id!=='restoreIn')return;const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.works))throw 0;
    const ids=new Set(DB.works.map(w=>w.id));let n=0;d.works.forEach(w=>{if(!ids.has(w.id)){DB.works.push(w);n++}});persist();render();toast(`${n}편을 불러왔어요`)}catch(e){toast('글쓰기 백업 파일이 아니에요')}};r.readAsText(f);
});

render();
if(document.readyState==='complete')initCaps();else window.addEventListener('load',initCaps);
</script>
