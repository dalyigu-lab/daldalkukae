 제도 등이 모두 포함됩니다. 문화는 시대나 장소에 따라 다를 수 있습니다.","이야기에는 배경이 되는 시대의 문화가 반영되게 마련입니다. 이야기를 읽을 때에는 작품에 어떤 문화가 반영되어 있는지, 그 문화와 내가 살고 있는 시대의 문화는 어떤 차이가 있는지, 문화는 인물의 행동이나 사건과 어떤 관계가 있는지를 살펴보는 것이 좋습니다."],"g":"hi"},{"n":58,"ti":"어린이의 독서량을 늘리려면","to":"어린이들의 독서량을 늘리기 위해 가정, 학교, 어린이 스스로 노력해야 한다.","tx":["현대 사회는 정보화 사회이다.","학교에서 독서 모임을 운영한다."],"cp":0,"fm":"병렬식","th":["이 글에서 말한 방법 중 ‘어린이 스스로’ 할 수 있는 일은?","날마다 정해진 시간에 내 수준에 맞는 책을 읽는다.","부모님께 책을 많이 읽으시라고 한다.","학교에 독서 행사를 열어 달라고 한다.","책 대신 텔레비전으로 정보를 얻는다.","4문단에 자기 수준과 목적에 맞는 책을 골라 일정한 시간에 꾸준히 읽으라고 했어요."],"kw":["독서","정보화","행사","모범"],"vo":[["수용","어떤 것을 받아들이는 것","거절하는 것","잃어버리는 것","감추는 것"],["권장","어떤 일을 하도록 권하고 북돋우는 것","하지 못하게 막는 것","벌을 주는 것","못 본 척하는 것"]],"mi":["우리나라 어린이들은 독서량이 적다.","가정에서 부모가 모범을 보여야 한다.","학교에서는 책읽기를 권장하고 격려해야 한다.","어린이 스스로 책을 가까이하는 습관을 지녀야 한다."],"ks":[[1,"하지만 우리나라 어린이들은"],[2,"먼저, 가정에서"]],"ev":["부모가 책을 읽으면 자녀에게 어떤 영향이 있는지 알 수 있는 문장은?","그 자녀도 책을","2문단에 부모가 책을 많이 읽을 때 그 자녀도 책을 많이 읽게 된다고 했어요."],"p":["현대 사회를 정보화 사회라 한다. 정보화 사회에서는 정보를 빠르고 정확하게 수용하는 것이 중요하다. 정보를 얻는 중요한 방법 중의 하나가 책을 읽는 것이다. 하지만 우리나라 어린이들은 다른 나라 어린이들에 비해 독서량이 적은 편이다. 이러한 문제를 해결하기 위해서는 어떻게 해야 할까?","먼저, 가정에서 부모가 모범을 보여야 한다. 부모가 책을 많이 읽을 때에 그 자녀도 책을 많이 읽게 된다.","학교에서는 책읽기를 권장하고 격려해야 한다. 책읽기와 관련된 행사를 개최하거나 독서 모임을 운영하는 것도 한 방법이다.","무엇보다 어린이 스스로 늘 책을 가까이 하는 생활 습관을 지녀야 한다. 이를 위해서는 자기의 수준과 읽는 목적에 맞는 책을 골라 읽어야 한다. 그리고 하루 중에 일정한 시간을 정하여 꾸준하게 책을 읽는 것도 책 읽는 습관을 가지는 데에 중요하다."],"g":"hi"},{"n":59,"ti":"토의의 종류","to":"토의의 뜻과 여러 가지 종류","tx":["포럼은 청중이 참여한다.","토의는 한 사람이 혼자 하는 말하기다."],"cp":0,"fm":"병렬식","th":["전문가 4명이 청중 앞에서 차례로 의견을 발표하고, 청중의 질문에 답하는 토의는?","심포지엄","원탁 토의","포럼","배심 토의","4문단에 전문가 3~6명이 의견을 발표한 뒤 청중의 질문을 받아 답하는 것이 심포지엄이라고 했어요."],"kw":["토의","배심원","전문가","청중"],"vo":[["청중","강연이나 발표를 듣는 사람들","발표를 하는 사람","토의를 이끄는 사람","문제를 내는 사람"],["숙의","깊이 생각하여 충분히 의논하는 것","대충 빨리 정하는 것","혼자 결정하는 것","의논하지 않는 것"]],"mi":["토의의 뜻","원탁 토의의 뜻","배심 토의의 뜻","심포지엄의 뜻","포럼의 뜻"],"ks":[[1,"이러한 토의에는 여러"]],"ev":["원탁 토의에 참여하는 사람 수를 알 수 있는 문장은?","10명 내외의","2문단에 10명 내외의 소규모 집단이 의논한다고 했어요."],"p":["두 사람 이상이 모여서 공동의 문제에 대하여 가장 좋은 해결책을 논의하는 화법이 토의이다. 이러한 토의에는 여러 종류가 있다.","원탁 토의는 10명 내외의 소규모 집단이 공통의 관심사에 대한 문제를 의논하는 비공식적인 토의이다.","배심토의는 선정된 4~6명의 배심원들이 청중 앞에서 각자의 지식, 견문, 정보 등을 발표하고 의견을 제시하여 협력적으로 숙의를 전개해 나가는 공동 토의이다.","심포지엄은 특정한 주제를 놓고 각기 다른 방면의 전문가 3~6명이 자기 의견을 발표한 다음 청중으로부터 질문을 받아 응답하는 말하기 형식이다.","포럼은 패널이나 심포지엄과 같이 배심원의 발표나 연사의 강연 없이 처음부터 청중의 참여로 이루어지는 공개 토의이다."],"g":"hi"},{"n":60,"ti":"음식물 쓰레기 줄이기","to":"음식물 쓰레기를 줄이자.","tx":["음식물 쓰레기 처리 비용은 4000억 원이 넘는다.","급식은 남겨도 된다."],"cp":0,"fm":"병렬식","th":["급식 시간에 음식물 쓰레기를 줄이기 위해 내가 할 수 있는 일은?","먹을 만큼만 받아서 남기지 않는다.","좋아하는 반찬만 많이 받는다.","배가 부르면 남기고 버린다.","급식을 먹지 않는다.","4문단에 음식물을 남기지 않는 습관을 가져야 한다고 했어요."],"kw":["음식물 쓰레기","냉장고","손님","급식"],"vo":[["골칫거리","해결하기 어려워 걱정이 되는 일","아주 즐거운 일","쉽게 끝나는 일","자랑스러운 일"],["장만","필요한 것을 사거나 만들어 갖추는 것","가진 것을 버리는 것","남에게 빌리는 것","잊어버리는 것"]],"mi":["음식물 쓰레기는 골칫거리이며 줄이는 방법이 여러 가지 있다.","식단 계획을 세우고 필요한 식품만 구입한다.","식사량에 알맞게 음식을 장만한다.","음식물을 남기지 않는 습관을 가진다."],"ks":[[1,"음식물 쓰레기를 줄이는 방법에는"],[3,"둘째, 음식 조리시"]],"ev":["음식을 너무 많이 만들면 안 되는 까닭을 알 수 있는 문장은?","대부분이 버려지기","3문단에 남게 장만하면 대부분이 버려지기 때문이라고 했어요."],"p":["날로 늘어나고 있는 음식물 쓰레기는 골칫거리이다. 우리나라에서 한 해에 음식물 쓰레기를 처리하는 데에 드는 비용만 4000억 원이 넘는다고 한다. 음식물 쓰레기를 줄이는 방법에는 여러 가지가 있다.","첫째, 식단 계획을 생활화하고 냉장고 안의 식품을 정리한 후, 반드시, 필요한 식품만 구입해야 한다.","둘째, 음식 조리시 식사량에 알맞게 장만한다. 가족이나 손님이 먹을 양에 맞게 하지 않고 남게 장만하는 경우, 대부분이 버려지기 때문이다.","셋째, 음식물을 남기지 않는 습관을 가져야 한다. 학교에서 급식하는 경우를 보더라도 버려지는 음식물 쓰레기가 매우 많다."],"g":"hi"},{"n":61,"ti":"산성비의 피해","to":"산성비가 인간에게 주는 피해","tx":["산성비는 19세기에 처음 등장한 말이다.","산성비는 농작물을 잘 자라게 한다."],"cp":0,"fm":"병렬식","th":["산성비가 자주 내리는 도시의 대리석 동상은 어떻게 될까요?","점점 부식되어 손상된다.","더 반짝반짝 빛난다.","크기가 커진다.","아무 변화가 없다.","4문단에 석회암과 대리석으로 된 동상들의 손상이 매우 심각하다고 했어요."],"kw":["산성비","질산","당근","기념물"],"vo":[["부식","쇠나 돌 등이 화학 작용으로 썩거나 삭아 망가지는 것","새것처럼 반짝이는 것","더 단단해지는 것","색깔이 예뻐지는 것"],["저해","막아서 해를 끼치는 것","더 잘되게 돕는 것","아무 관계 없는 것","똑같이 나누는 것"]],"mi":["산성비의 뜻","산성비는 호흡기 질병을 일으킨다.","산성비는 식량 생산에 영향을 미친다.","산성비는 역사 유적을 부식시킨다."],"ks":[[1,"산성비가 인간에게 미치는"],[2,"첫째, 인간 호흡기"]],"ev":["산성비가 채소 농사에도 피해를 준다는 것을 알 수 있는 문장은?","무, 당근, 겨자","3문단에 무, 당근 등도 PH4에서 수확이 줄어든다고 했어요."],"p":["산성비는 19세기 중반에 처음으로 등장한 용어로 빗물의 PH값이 5.6이하인 비를 말한다. 산성비가 인간에게 미치는 피해는 다음과 같다.","첫째, 인간 호흡기 질병을 일으킨다. 우선 직접적으로 눈이나 피부를 자극하여 불쾌감이나 통증을 일으킬 수 있다. 산성비 속에 포함된 질산이온은 몸속에서 발암성인 비트로소 화합물로 변한다는 것이 알려져 있으며 위암발생과 관계가 있다.","둘째, 식량 생산에 영향을 미친다. PH5가 되면 쌀과 밀, 보리의 광합성이 저하되고, PH4에서 수확량이 저해된다. 무, 당근, 겨자, 채소 등도 PH4에서 수확이 감소되며 그 이하가 되면 많은 농작물의 잎에 피해가 일어난다고 보고된다.","셋째, 예술적 가치가 있는 역사유적의 부식을 일으킨다. 석회암과 대리석으로 된 동상들의 손상은 매우 심각하게 나타난다. 수많은 동상과 기념물들은 과거 200년 동안 보다 최근 50년 동안 훨씬 더 부식되고 있다."],"g":"hi"},{"n":62,"ti":"설날의 어원","to":"설날이라는 말의 여러 가지 어원","tx":["설날은 새해의 첫날이다.","설날은 한자어로 신일이라고만 한다."],"cp":0,"fm":"병렬식","th":["설날을 ‘삼가고 조심하는 날’로 보는 생각과 가장 어울리는 행동은?","새해 첫날 말과 행동을 조심하며 차분히 보낸다.","새해 첫날 친구와 크게 다툰다.","새해 첫날 늦잠을 자고 아무것도 안 한다.","새해 첫날 물건을 마구 산다.","4문단에 설날을 모든 언행을 삼가고 조심하는 날로 보는 어원이 나와요."],"kw":["설날","어근","한자어","질서"],"vo":[["어원","어떤 말이 생겨난 처음 모양이나 뿌리","말을 빨리 하는 방법","외국어로 번역한 말","글자를 예쁘게 쓰는 법"],["삼가다","말이나 행동을 조심하다","마음대로 행동하다","크게 소리 지르다","서둘러 떠나다"]],"mi":["설날의 뜻과 어원에 대한 세 가지 설","‘낯설다’의 ‘설’에서 온 어원","‘선다(시작하다)’에서 온 어원","‘섧다(삼가다)’에서 온 어원"],"ks":[[1,"이러한 설날의 어원에"],[2,"설날을 ‘낯설다’라는 말의"]],"ev":["설날을 ‘새해 새날이 시작되는 날’로 보는 어원이 나타난 문장은?","‘선날’ 즉 개시라는","3문단에 ‘선다’라는 말에서 새해 새날이 시작되는 날로 해석할 수 있다고 했어요."],"p":["설이란 새해의 첫머리란 뜻이고, 설날은 그 중에서도 첫날이란 의미를 지닌다. 이러한 설날의 어원에 대해서는 대개 세 가지 정도의 설이 있다.","설날을 ‘낯설다’라는 말의 어근인 ‘설’에서 그 어원을 찾는 것이다. 그래서 설날은 ‘새해에 대한 낯설음’이라는 의미와 ‘아직 익숙하지 않는 날’이란 뜻을 동시에 가지고 있다고 한다. 즉 설날은 묵은 해에서 분리되어 가는 전이 과정으로, 아직 완전히 새해에 통합되지 않았기 때문에 익숙하지 못한 그러한 단계에 해당한다는 것이다.","설날은 ‘선날’ 즉 개시라는 뜻의 ‘선다’라는 말에서 ‘새해 새날이 시작되는 날’이라는 뜻으로 해석할 수 있다. 이 ‘선날’이 시간이 흐르면서 연음화되어 설날로 와전되었다는 것이다.","설날을 ‘삼가다’ 또는 ‘조심하여 가만히 있다’라는 뜻의 옛말인 ‘섧다’에서 그 어원을 찾기도 한다. 이는 설날을 한자어로 신일(愼日)이라고 표현하는 것과 같은 맥락이다. 신일이란 ‘삼가고 조심하는 날’이란 뜻인데, 이는 완전히 새로운 시간 질서에 통합되지 않았기 때문에 인간의 모든 언행을 삼가고 조심하여야 한다는 것을 강조하기 위하여 생긴 말이다."],"g":"hi"},{"n":63,"ti":"수서곤충의 종류","to":"호흡 방법에 따른 수서곤충의 분류","tx":["물방개는 공기방울을 달고 다닌다.","수서곤충은 모두 아가미로 숨 쉰다."],"cp":1,"fm":"두괄식","th":["물 표면으로 올라와 공기방울을 달고 다니며 숨 쉬는 곤충은 어느 무리에 속할까요?","대기 중의 산소를 이용하는 곤충","물에 녹은 산소(용존산소)를 이용하는 곤충","땅 위에서만 사는 곤충","숨을 쉬지 않는 곤충","2문단에 물방개처럼 물 표면에서 공기방울을 얻는 곤충이 대기 중의 산소를 이용하는 무리로 나와요."],"kw":["수서곤충","딱정벌레","잠자리","털"],"vo":[["용존산소","물에 녹아 있는 산소","공기 중에 떠 있는 먼지","땅속에 있는 물","곤충의 먹이"],["포착","꼭 붙잡는 것","놓쳐 버리는 것","멀리 던지는 것","숨기는 것"]],"mi":["호흡 방법에 따라 수서곤충을 크게 두 가지로 나눈다.","대기 중의 산소를 이용하는 수서곤충","물에 녹아 있는 산소를 이용하는 수서곤충"],"ks":[[2,"대기 중의 산소를 이용하는 것으로는"],[3,"용존산소를 이용하는 것으로는"]],"ev":["잠자리 유충이 어떻게 숨 쉬는지 알 수 있는 문장은?","잠자리 유충의 경우","3문단 마지막 문장에 직장의 벽으로 용존산소를 호흡한다고 했어요."],"p":["수서곤충은 물속에서 사는 곤충으로 호흡 방법에 있어서 크게 대기 중의 산소를 이용하는 것과 물에 녹아있는 용존산소를 이용하는 것으로 나눌 수 있다.","대기 중의 산소를 이용하는 것으로는 딱정벌레목의 성충, 노린재목, 파리목의 일부 등이 이에 속한다. 이들은 가끔 물 표면으로 떠올라 육상곤충과 같이 기문으로 호흡하거나, 긴 호흡관을 물 바깥으로 내어 이를 통하여 호흡하기도 한다. 물방개와 같은 종류는 물 표면에서 공기방울을 얻어서 이를 달고 다니며 호흡하기도 하며, 여울벌레와 같은 종류는 몸 표면에 모반이라는 미세한 털로 된 기관을 가짐으로써 물속의 작은 공기방울을 포착 할 수 있다.","용존산소를 이용하는 것으로는 일부 파리목 유충과 같이 피부로 직접 용존산소를 흡수하기도 하지만, 용존산소를 보다 효율적으로 받아들일 수 있는 기관아가미라는 기관을 가지고 있다. 예를 들어, 하루살이 유충과 같이 판 모양이나 실모양의 기관아가미를 배마디에 갖는 종류가 있고, 강도래 유충과 같이 실모양의 기관아가미를 가슴마디에 갖는 종류도 있다. 잠자리 유충의 경우 직장의 벽으로 용존산소를 호흡하기도 한다."],"g":"hi"},{"n":64,"ti":"아름다운 한복","to":"한복의 아름다움","tx":["한복은 끈으로 고정한다.","한복은 서양에서 들어온 옷이다."],"cp":0,"fm":"병렬식","th":["한복은 ‘입어야 비로소 입체감이 생긴다’고 한 까닭은?","평면으로 만든 옷을 몸에 맞게 주름을 잡거나 접어 입기 때문에","옷감이 두껍기 때문에","처음부터 몸 모양대로 만들기 때문에","색깔이 화려하기 때문에","3문단에 한복은 평면 구성으로 이루어져 입어야 입체감이 생긴다고 했어요."],"kw":["한복","추녀","바지","동양"],"vo":[["단정하다","옷차림이나 몸가짐이 깔끔하고 바르다","지저분하고 어수선하다","크고 헐렁하다","화려하고 요란하다"],["입체","길이, 폭, 두께를 가진 물체","종이처럼 납작한 것","선 하나로 된 것","눈에 보이지 않는 것"]],"mi":["한복은 옷의 선이 아름답고 단정하다.","한복의 아름다움은 선의 흐름에서 찾을 수 있다.","평면 구성인 한복은 입어야 부드럽고 우아한 아름다움이 드러난다."],"ks":[[1,"한복은 직선과 약간의"],[3,"이와 같이 한복은 평면구성으로"]],"ev":["한복의 선에서 선조들의 미적 감각을 느낄 수 있다는 내용이 담긴 문장은?","뛰어난 미적 감각","2문단 마지막 문장에 선조들의 뛰어난 미적 감각을 느낄 수 있다고 했어요."],"p":["한복은 직선과 약간의 곡선이 기본을 이루고 있어 옷의 선이 매우 아름답다. 특히 여자 옷은 형태면에서 저고리와 치마가 상박하후하여 옷차림이 단정하고 아담하다. 옷 입은 분위기는 동양적인 생활윤리가 깃든 초연한 멋이 저절로 풍긴다.","한복의 아름다움은 외관으로 보이는 선의 흐름에서 찾아볼 수 있다. 추녀의 곡선과 같이 하늘을 향한 듯한 저고리의 배레선 도련의 곡선동정의 예리한 직선과 조화를 이루며, 깜찍하고 둥글면서 뾰족한 작은 섶코의 선은 저고리를 한층 돋보이게 해준다. 한복에 나타나는 이 같은 선의 흐름에서 우리는 선조들의 뛰어난 미적 감각을 느낄 수 있다.","한복은 평면적인 옷감을 직선적으로 재단하고 이를 꿰매어 평면적인 옷을 만들며 이것을 다시 입체적인 인체에 맞도록 남은 부분을 주름을 잡거나 접어서 끈으로 고정시키는 형태이다. 바지의 경우에는 활동에 필요한 여유분을 주기 위하여 사폭을 만들고 이것을 다시 큰 것과 작은 것으로 나누어 전후좌우를 구분하는 기준으로 삼는 것은 매우 흥미로운 구성 방법이다. 이와 같이 한복은 평면구성으로 이루어져 있기 때문에 입어야 비로소 입체감이 형성되어 부드럽고 우아한 아름다움을 느끼게 한다."],"g":"hi"},{"n":65,"ti":"예절의 뜻","to":"예절은 상대방의 인격을 존중하는 마음을 알맞은 형식으로 표현하는 것이다.","tx":["예의는 말투와 몸가짐이다.","예절은 억지로라도 지켜야 한다."],"cp":4,"fm":"미괄식","th":["이 글의 생각에 가장 가까운 예절 바른 행동은?","웃어른께 마음을 담아 공손히 인사한다.","마음속으로만 고맙다고 생각한다.","선생님이 보실 때만 인사한다.","벌을 받을까 봐 억지로 인사한다.","4문단에 예절은 마음이 밖으로 드러나야 하고, 스스로 실천하는 것이 바람직하다고 했어요."],"kw":["예절","인격","범절","규정"],"vo":[["준말","길게 쓰던 말을 줄여 짧게 만든 말","아주 긴 말","외국에서 온 말","반대의 뜻을 가진 말"],["경애","공경하고 사랑하는 것","미워하고 싫어하는 것","무시하는 것","두려워하는 것"]],"mi":["예절은 예의와 범절의 준말이다.","예의의 뜻","범절의 뜻","예절의 참뜻과 실천"],"ks":[[2,"예의(禮儀)는 남의"],[4,"그러므로 예절은 상대방의"]],"ev":["예절은 스스로 실천하는 것이 좋다는 내용이 담긴 문장은?","스스로 실천하는 것이","4문단 마지막 문장에 나와요."],"p":["예절은 예의와 범절의 준말이다.","예의(禮儀)는 남의 인격을 존중하고 경애하는 정신을 말과 행동으로 나타내는 공동체의 규정이나 관계이다. 즉 서로 상대방에게 갖추어야 할 말투나 몸가짐 또는 행동 따위이다.","범절(凡節)은 일상생활의 모든 일의 순서나 절차이다. 즉 말투나 몸가짐, 행동의 정해진 형식이다.","그러므로 예절은 상대방의 인격을 존중하는 마음을 그에 합당한 형식으로 표현하는 행위이다. 예절은 마음가짐만으로는 부족하며 마음이 밖으로 드러나야 참 예절을 갖출 수 있다. 또한 예절이란 구속력이나 강제적 규범에 의해서 지켜지기보다 스스로 실천하는 것이 바람직하다."],"g":"hi"},{"n":66,"ti":"고려 시대의 승려","to":"고려 시대에는 귀족들도 승려가 되었지만, 누구나 승려가 될 수는 없었다.","tx":["대각국사 의천은 문종의 아들이다.","고려에서는 누구나 승려가 될 수 있었다."],"cp":0,"fm":"병렬식","th":["고려 시대에 아들이 셋인 집에서 모두 승려가 되려고 한다면 어떻게 될까요?","나라에서 정한 대로 그중 한 아들만 승려가 될 수 있다.","세 아들 모두 승려가 될 수 있다.","아무도 승려가 될 수 없다.","막내만 꼭 승려가 되어야 한다.","2문단에 아들이 셋 있으면 그중 한 아들만 승려가 될 수 있게 나라에서 정하기도 했다고 했어요."],"kw":["승려","문종","왕자","천인"],"vo":[["내로라하다","어떤 분야에서 대표로 나설 만큼 뛰어나다","아주 가난하고 힘이 없다","이름이 알려지지 않다","나이가 아주 어리다"],["신분","사회에서 정해진 개인의 지위나 계급","사람의 키와 몸무게","사는 동네 이름","좋아하는 음식"]],"mi":["고려의 이름난 집안에서는 아들 중 한 명을 승려가 되게 했다.","누구나 승려가 될 수 있었던 것은 아니다."],"ks":[[1,"고려의 내로라하는 집안에서는"],[2,"승려가 될 수 있는 신분과"]],"ev":["왕족 중에도 승려가 된 사람이 있었다는 것을 알 수 있는 문장은?","왕자의 신분으로","1문단에 왕자의 신분으로 승려가 된 사람도 여럿 있었다고 했어요."],"p":["고려의 내로라하는 집안에서는 아들이 여럿이면 그 중 한 명을 승려가 되게 하는 것이 보통이었다. 대표적인 문벌 귀족인 이자겸의 아들들 중 한 사람도 승려가 되었고, 김부식의 오형제 가운데 한 사람도 승려가 되었다. 왕자의 신분으로 승려가 된 사람도 여럿 있었다. 유명한 대각국사 의천은 제 11대 왕 문종의 넷째 아들이다.","그럼 원하는 사람은 누구나 승려가 될 수 있었을까? 그렇지 않다. 승려가 될 수 있는 신분과 그렇지 않은 신분이 있었는데, 노비와 같은 천인은 승려가 될 수 없었다. 또, 승려의 숫자가 너무 많아지지 않도록 아들이 셋 있으면 그 중 한 아들만 승려가 될 수 있게 나라에서 정하기도 했다."],"g":"hi"},{"n":67,"ti":"묘청의 서경 천도","to":"묘청이 인종을 설득하여 서경으로 도읍을 옮기려 했다.","tx":["묘청은 서경 출신이다.","인종은 묘청의 말을 듣지 않았다."],"cp":0,"fm":"병렬식","th":["묘청이 수도를 서경으로 옮기자고 한 가장 큰 까닭은?","개경에서 판치는 문벌 귀족들의 힘을 약하게 하려고","서경의 경치가 아름다워서","금나라와 친하게 지내려고","이자겸과 함께 살려고","2문단에 문벌 귀족들의 힘을 약화시키려면 수도를 옮겨야 한다고 설득했다고 했어요."],"kw":["서경 천도","연호","여진족","궁궐"],"vo":[["천도","나라의 도읍(수도)을 옮기는 것","하늘에 제사를 지내는 것","군대를 모으는 것","새로운 왕을 세우는 것"],["솔깃하다","그럴듯해 보여서 마음이 쏠리다","듣기 싫어 귀를 막다","몹시 화가 나다","아무 느낌이 없다"]],"mi":["묘청이 인종의 고문이 되었다.","묘청은 수도를 서경으로 옮기자고 인종을 설득했다.","묘청은 칭제건원과 금나라 정벌을 주장했다.","인종은 묘청의 말에 넘어가 서경 천도를 꿈꾸었다."],"ks":[[2,"그는 문벌 귀족들의 힘을"],[4,"문벌 귀족들에게 싫증이"]],"ev":["‘칭제건원’이 무엇인지 알 수 있는 문장은?","왕을 황제라고 부르고","3문단에 왕을 황제라 부르고 연호를 독자적으로 쓰자는 주장이라고 했어요."],"p":["묘청은 서경(지금의 평양)출신의 승려였다. 그는 당대의 권세가인 이자겸을 제거하는 데 공을 세우고 제 17대 왕인 인종의 고문이 되었다.","그는 문벌 귀족들의 힘을 약화시키려면 수도를 다른 곳으로 옮겨야 한다고 인종을 설득했다. 개경은 문벌 귀족들이 판치는 곳이니 개경을 떠나 서경을 새 수도로 삼자고 했다. 개경은 이미 기운이 다했으니 서경으로 가면 주변국들이 모두 머리를 조아릴 것이라고 말이다.","또, 중국처럼 왕을 황제라고 부르고, 연호도 중국을 따라 쓰지 말고 독자적으로 써야 한다는 ‘칭제건원’을 주장했다. 나아가 여진족이 세운 금나라와 화친하지 말고, 이를 정벌해야 한다고 주장했다.","그러자 윤언이, 정지상, 백수한 등이 묘청의 주장을 지지하고 나섰다. 문벌 귀족들에게 싫증이 나 있던 인종은 묘청의 말에 솔깃하여 서경에 새 궁궐을 짓게 하고, 서경 천도를 꿈꾸었다."],"g":"hi"},{"n":68,"ti":"고려 농민과 천민의 봉기","to":"고려 시대 농민과 천민들이 봉기를 일으킨 까닭","tx":["농민 봉기는 신라에도 있었다.","고려 시대에는 아무 변화가 없었다."],"cp":3,"fm":"미괄식","th":["고려의 농민과 천민들이 ‘신분 제도도 바뀔 수 있다’고 생각하게 된 계기는?","무신 정권 뒤 천대받던 신분에서도 높은 지위에 오르는 사람이 늘어난 것","신라 시대의 봉기 이야기를 들은 것","조선이 세워진 것","농사가 풍년이 든 것","3문단에 무신 정권이 들어서며 천대받던 신분으로도 높은 지위에 오르는 사람이 늘었다고 했어요."],"kw":["봉기","화산","조선","무신"],"vo":[["봉기","벌 떼처럼 세차게 들고일어나는 것","조용히 잠드는 것","서로 화해하는 것","멀리 이사 가는 것"],["팍팍하다","살림살이가 넉넉하지 못하고 몹시 힘들다","살림이 넉넉하다","음식이 아주 부드럽다","날씨가 따뜻하다"]],"mi":["12~13세기 고려에서는 농민과 천민의 봉기가 활발했다.","무엇이 이들을 폭발하게 만들었을까?","봉기의 근본 원인과 또 다른 까닭"],"ks":[[1,"이 시대의 가장 눈에 띄는"]],"ev":["고려 시대 봉기가 다른 시대와 달랐던 점을 알 수 있는 문장은?","천민들의 봉기가 활발하게","1문단 마지막 문장에 고려에서는 농민뿐 아니라 천민들의 봉기도 활발했다고 했어요."],"p":["고려 500년 역사 중에서 12세기와 13세기는 변화의 시대였다. 이 시대의 가장 눈에 띄는 특징은 그 동안 억눌려 온 농민과 천민들의 힘이 화산처럼 폭발했다는 점이다. 농민들의 봉기는 신라 시대에도 있었고 조선 시대에도 있었다. 그런데 고려 시대에는 농민들뿐 아니라 천민들의 봉기가 활발하게 일어났다.","무엇이 이들을 폭발하게 만들었을까? 오랫동안 쌓여온 지배층에 대한 불만과 분노, 그들도 좀 더 나은 삶을 살고 싶다는 소망, 그런 것들이 아니었을까?","농민과 천민들이 봉기를 일으킨 근본 원인은 팍팍한 생활 형편 때문이지만, 다른 한편으로는 무신 정권이 들어서면서부터 천대받던 신분으로도 높은 지위에 오르는 사람이 늘어났고, 그럼으로써 절대적인 것으로만 여겨지던 신분 제도가 바뀌거나 없어질 수도 있다는 깨달음을 얻었기 때문일 것이다."],"g":"hi"},{"n":69,"ti":"조선 시대의 궁궐","to":"조선의 왕들이 여러 궁궐을 옮겨 다닌 까닭과 행궁","tx":["경복궁은 조선의 궁궐이다.","왕은 한 궁궐에서만 살았다."],"cp":1,"fm":"두괄식","th":["조선의 왕이 궁궐을 옮긴 가장 큰 이유는?","반대 세력을 멀리하고 분위기를 바꾸려는 정치적인 이유","궁궐이 너무 좁아서","날씨가 추워서","새 궁궐을 구경하려고","2문단에 가장 큰 이유는 정치적인 이유 때문이었다고 했어요."],"kw":["궁궐","경종","온천","화재"],"vo":[["행차","웃어른이 길을 나서서 가는 것","집에서 쉬는 것","잔치를 여는 것","잠을 자는 것"],["세력","권력이나 힘을 가진 무리","아주 작은 물건","오래된 건물","넓은 들판"]],"mi":["조선에 궁궐이 여러 개 필요했던 까닭","왕들이 궁궐을 옮겨 다닌 까닭","왕이 지방에 행차할 때 머문 행궁"],"ks":[[1,"왕은 한 궁궐에서 머물러"],[2,"화재가 났다든지"]],"ev":["세조가 온양 행궁에 자주 간 까닭을 알 수 있는 문장은?","피부병을 앓아","3문단에 피부병을 앓아 온양 온천에 자주 갔다고 했어요."],"p":["조선의 궁궐은 경복궁 하나만이 아니다. 창덕궁, 창경궁, 경희궁, 경운궁 등 여러 개가 있다. 왜 이렇게 여러 개의 궁궐이 필요했을까? 왕은 한 궁궐에서 머물러 살지 않고 이 궁궐, 저 궁궐로 옮겨 다니면서 살았기 때문이다. 몇 년에 한 번씩은 이사를 다녔다. 가장 이사를 자주 한 왕은 경종인데 그는 1년에 한 번 꼴로 이사를 다녔다.","왕들은 왜 이 궁궐 저 궁궐로 이사를 다녔을까? 화재가 났다든지 전염병이 돈다든지 하는 특별한 사정으로 옮겨 다니기도 했지만, 가장 큰 이유는 정치적인 이유 때문이었다. 수도를 옮기는 것과 마찬가지로 궁궐을 옮기는 것은 반대 세력을 멀리하고 왕 중심으로 새롭게 분위기를 바꾸는 일이었다.","궁궐은 수도에만 있지 않았다. 왕이 수도를 떠나 다른 지방으로 행차할 때 머무는 궁궐도 있다. 이런 궁궐을 ‘행궁’이라고 한다. 피부병을 앓아 온양 온천에 자주 갔던 세조가 묵었던 온양 행궁, 정조가 수원 화성에 행차할 때마다 머물던 화성 행궁 등이 있다."],"g":"hi"},{"n":70,"ti":"고구마와 감자의 전래","to":"고구마와 감자가 우리나라에 들어온 과정과 쓰임","tx":["고구마는 대마도에서 왔다.","고구마와 감자는 우리나라에서 처음 자랐다."],"cp":0,"fm":"병렬식","th":["감자를 ‘마령서’라고도 부른 까닭은?","말방울처럼 주렁주렁 달려서","말이 좋아하는 음식이어서","말을 타고 들어와서","말처럼 커서","3문단에 말방울처럼 주렁주렁 달렸다 해서 마령서라고 불렀다고 했어요."],"kw":["고구마와 감자","인삼","사신","흉년"],"vo":[["사신","나라의 명령을 받고 다른 나라에 가는 신하","농사를 짓는 사람","물건을 파는 장수","절에 사는 스님"],["흉년","농사가 잘되지 않아 먹을 것이 모자란 해","농사가 아주 잘된 해","새해의 첫날","비가 알맞게 온 해"]],"mi":["고구마와 감자는 외국에서 들어왔다.","고구마가 들어온 과정","감자가 들어온 과정","고구마와 감자는 흉년에 백성의 굶주림을 덜어 주었다."],"ks":[[2,"고구마는 18세기 중반"],[3,"감자는 고구마보다 늦게"]],"ev":["‘고구마’라는 이름이 어디에서 나왔는지 알 수 있는 문장은?","고꼬이모에서","2문단에 대마도 사람들이 부르던 ‘고꼬이모’에서 ‘고구마’라는 말이 나왔다고 했어요."],"p":["우리나라 사람들이 간식으로 즐기는 고구마와 감자는 200~300년 전에 외국에서 들어온 것이다. 그 전에는 고구마와 감자를 전혀 몰랐다.","고구마는 18세기 중반, 일본에 사신으로 갔던 조엄이 대마도에서 처음 갖고 왔다. 대마도 사람들은 고구마를 ‘고꼬이모’라고 했다. 고꼬이모에서 ‘고구마’라는 말이 나왔다. 고구마는 ‘감저’라고도 했다.","감자는 고구마보다 늦게 19세기 초에 들어왔다. 청나라 사람이 인삼을 캐러 몰래 조선에 들어갔다가 떨어뜨리고 갔다고 한다. 북쪽에서 온 감저라는 뜻으로 ‘북감저’, 말방울처럼 주렁주렁 달렸다 해서 ‘마령서’라고도 불렀었다.","고구마와 감자는 가뭄에도 죽지 않고 잘 자랐기 때문에 흉년이 들었을 때 가난한 백성들이 이것을 먹으며 굶주림을 면하곤 했다."],"g":"hi"},{"n":71,"ti":"왕귀뚜라미","to":"왕귀뚜라미의 생김새와 사는 곳, 우는 모습","tx":["귀뚜라미는 가을에 운다.","왕귀뚜라미는 몸이 아주 작다."],"cp":0,"fm":"병렬식","th":["밤에 풀숲에서 울고 있는 왕귀뚜라미는 암컷일까요, 수컷일까요?","수컷","암컷","둘 다","알 수 없다","4문단에 수컷은 밤이 되면 울음소리를 낸다고 했어요."],"kw":["왕귀뚜라미","더듬이","농촌 진흥청","경작지"],"vo":[["전령사","어떤 소식을 알리는 사람이나 것","물건을 파는 사람","노래를 부르는 사람","병을 고치는 사람"],["광택","물체의 겉면이 빛을 받아 반짝이는 것","거칠고 울퉁불퉁한 것","아주 어두운 그림자","물에 젖은 모습"]],"mi":["왕귀뚜라미를 집에서 기를 수 있는 기술이 개발되었다.","왕귀뚜라미의 생김새","왕귀뚜라미가 사는 곳","왕귀뚜라미 수컷의 울음"],"ks":[[1,"농촌 진흥청에서 우리나라"],[2,"왕귀뚜라미는 이름에서도"]],"ev":["왕귀뚜라미의 ‘눈썹’처럼 보이는 부분을 알 수 있는 문장은?","흰색 띠무늬가","2문단에 더듬이 밑에서 겹눈 위까지 흰색 띠무늬가 있어 눈썹처럼 보인다고 했어요."],"p":["가을을 알리는 대표적인 전령사, 귀뚜라미. 그 귀뚜라미 소리를 이제는 봄에도 들을 수 있다. 농촌 진흥청에서 우리나라 토종 귀뚜라미인 왕귀뚜라미를 일 년 내내 집 안에서 기를 수 있는 기술을 개발한 것이다.","왕귀뚜라미는 이름에서도 알 수 있듯 몸길이가 20~30mm로 매우 큰 편이다. 색깔은 갈색 또는 검은 갈색이며 광택을 띤다. 머리는 크고 검으며, 더듬이 밑쪽에서부터 겹눈 위까지 흰색 띠무늬가 있어 마치 '눈썹'처럼 보인다. 다자란 수컷의 날개는 배 끝보다 조금 길다. 암컷의 산란관은 매우 길며 조금 휘어져 있다.","왕귀뚜라미는 산이나 들판 또는 경작지 주변의 돌 밑과 풀뿌리 사이에서 흔히 볼 수 있다.","수컷은 낮에는 구멍 바깥에 앉아 있다가 밤이 되면 울음소리를 낸다. 울음소리를 듣고 암컷이 다가오면, 구애의 소리로 바꾸어 가락과 장단을 빠르게 하면서 유혹한다. 그 후 교미에 성공하면 울음소리는 단조롭게 바뀐다."],"g":"hi"},{"n":72,"ti":"계절별 별자리","to":"계절마다 잘 보이는 별자리와 그에 담긴 신화와 전설","tx":["겨울에는 공기가 맑다.","별자리 이야기는 모두 그리스 신화이다."],"cp":0,"fm":"병렬식","th":["칠월 칠석(음력 7월 7일) 밤하늘을 볼 때 떠올릴 수 있는 이야기는?","견우와 직녀가 은하수를 건너 만나는 이야기","페르세우스가 공주를 구하는 이야기","일곱 아들이 별이 된 이야기","제우스가 흰 소로 변한 이야기","3문단에 음력 칠월 초이렛날 견우와 직녀가 은하수를 건너 만난다는 전설이 나와요."],"kw":["별자리","은하수","시리우스","괴물"],"vo":[["형상","사물의 생긴 모양","소리의 크기","냄새","무게"],["둔갑","다른 모습으로 바뀌는 것","원래 모습 그대로인 것","깨끗하게 씻는 것","멀리 도망가는 것"]],"mi":["별자리의 뜻","봄의 별자리 큰곰자리(북두칠성)","여름의 별자리와 견우직녀 전설","가을의 별자리와 페르세우스 신화","겨울의 별자리 큰개자리와 황소자리"],"ks":[[2,"효성스러운 일곱 아들이"]],"ev":["겨울에 별이 더 또렷하게 보이는 까닭을 알 수 있는 문장은?","공기가 맑아서","5문단에 겨울은 공기가 맑아서 별이 더 또렷하게 보인다고 했어요."],"p":["밤하늘에 밝게 빛나는 별들을 연결해 가면, 어떤 형상을 이룬 듯이 보이는 별의 무리가 있다. 이것을 별자리라고 하는데, 보는 위치나 계절에 따라 특히 잘 보이는 별자리가 있다. 별자리에는 많은 신화나 전설이 담겨 있다.","효성스러운 일곱 아들이 죽어 하늘에 올라가 별이 되었다는 북두칠성은 봄날 저녁 무렵, 북쪽 하늘에서 볼 수 있다. 이것은 그리스 신화에서 제우스가 아름다운 요정 칼리스토를 곰으로 만들어 하늘로 오르게 하였다고 해서 큰곰자리라고 부르기도 한다.","여름밤에는 북쪽 하늘에서 남쪽 하늘로 은하수가 아름답게 펼쳐진다. 은하수를 사이에 두고 독수리자리의 알타이르와 거문고자리의 베가가 빛나고 있는데, 이것을 견우성과 직녀성이라고도 한다. 이 별자리에는 음력 칠월 초이렛날에 견우와 직녀가 은하수를 건너서 만난다는 전설이 전해오고 있다.","가을의 남쪽 밤하늘은 아름답고 신비한 이야기로 가득 차 있다. 그 가운데에 바닷가 괴물에게 제물로 바쳐진 안드로메다 공주를 용감하게 구해 낸 페르세우스 이야기가 있다. 바로 고래자리, 안드로메다자리, 페르세우스자리에 담겨 있는 신화이다.","겨울은 공기가 맑아서 다른 계절에 비하여 별이 더욱 또렷하게 보인다. 그 가운데에서도 더욱 눈부시게 빛나는 별은 큰개자리의 시리우스이다. 제우스가 흰 소로 둔갑한 모습인 황소자리도 오리온자리를 향하여 쇠뿔을 세우고 있다."],"g":"hi"},{"n":73,"ti":"질그릇과 오지그릇","to":"옹기의 두 종류인 질그릇과 오지그릇의 특징","tx":["옹기는 흙으로 만든다.","오지그릇은 흰색이다."],"cp":0,"fm":"병렬식","th":["검붉은 윤이 나고 단단한 옹기를 보았어요. 무엇일까요?","오지그릇","검은색 질그릇","회청색 질그릇","유리그릇","3문단에 오지그릇은 검붉은 윤이 나고 단단한 것이 특징이라고 했어요."],"kw":["옹기","온도","진흙","볕"],"vo":[["특색","다른 것과 비교해 두드러지게 다른 점","아주 흔한 점","똑같은 점","부족한 점"],["윤","반들반들하게 빛나는 기운","거친 먼지","깨진 조각","흐린 그림자"]],"mi":["옹기는 질그릇과 오지그릇으로 나뉜다.","질그릇의 종류와 특징","오지그릇의 특징"],"ks":[[1,"옹기는 크게 두 가지로"],[2,"질그릇은 구울 때의"]],"ev":["오지그릇을 만들 때 무엇을 입혀 다시 굽는지 알 수 있는 문장은?","오짓물을 입혀","3문단에 오짓물을 입혀 다시 굽는다고 했어요."],"p":["옹기는 크게 두 가지로 나눌 수 있다. 그 하나는 질그릇이고 나머지 하나는 오지그릇이다.","질그릇은 구울 때의 불의 온도에 따라 저화도 질그릇과 고화도 질그릇으로 나누어지는데, 그 중 저화도 질그릇은 다시 검은색과 붉은색 질그릇으로 나누어지게 된다. 검은색 질그릇은 일반적으로 우리가 흔히 볼 수 있는 것이다. 반면에, 고화도 질그릇은 회청색, 흑색, 적갈색으로 다양한 특색을 가지고 있다.","오지그릇은 붉은 진흙으로 만들어 볕에 말리거나 약간 구운 다음, 오짓물을 입혀 다시 구운 질그릇으로, 검붉은 윤이 나고 단단한 것이 특징이다."],"g":"hi"},{"n":74,"ti":"산림을 보호하자","to":"산림을 잘 가꾸고 보호하자.","tx":["우리나라는 국토의 70%가 산림이다.","홍수는 자연재해일 뿐이다."],"cp":4,"fm":"미괄식","th":["산림 보호를 위해 우리가 할 수 있는 일로 알맞은 것은?","식목일에 심은 나무에 물을 주고 가꾼다.","산에 쓰레기를 묻는다.","나무를 심기만 하고 내버려 둔다.","산에서 불을 피워 요리한다.","3문단에 나무를 심은 후에 잘 가꾸고, 환경이 오염되지 않도록 해야 한다고 했어요."],"kw":["산림","홍수","후손","야생 동물"],"vo":[["훼손","헐거나 깨뜨려 못 쓰게 만드는 것","새롭게 고치는 것","깨끗하게 청소하는 것","아껴서 보관하는 것"],["금수강산","비단에 수놓은 듯 아름다운 산천(우리나라)","쓸쓸한 사막","높은 빌딩이 많은 도시","얼음으로 덮인 땅"]],"mi":["홍수 피해는 산림 훼손 때문이기도 하며 산림은 중요하다.","산림을 보호해야 하는 까닭","산림을 보호하는 방법","산림을 잘 가꾸고 보호해야 한다."],"ks":[[1,"그런데 이런 일들이"],[4,"아름다운 금수강산을"]],"ev":["산림이 자연재해를 막는 역할을 한다는 것을 알 수 있는 문장은?","각종 자연재해를 예방하는","2문단에 산림은 홍수, 가뭄 등 각종 자연재해를 예방한다고 했어요."],"p":["거의 매년 홍수가 나서 많은 사람들이 다치고 집들이 파괴되는 일들이 반복되고 있다. 그런데 이런 일들이 자연 재해라기보다는 사람들의 무분별한 개발과 산림 훼손 때문에 생기는 것이라고 한다. 전 국토의 70%가 산림인 우리나라에서 산림의 중요성은 더 말할 필요가 없다.","이처럼 중요한 산림을 보호해야 하는 까닭은 무엇일까? 첫째, 산림은 홍수, 가뭄 등 각종 자연재해를 예방하는 역할을 한다. 둘째, 산림은 우리들에게 좋은 휴식처와 맑은 공기를 제공해 준다. 셋째, 각종 산에 나무가 많으면 경치가 좋고 각종 야생 동물도 많이 살게 됨은 물론 공기가 맑아 우리에게 좋은 휴식처가 된다.","이렇게 우리 생활에 중요한 산림을 보호하는 방법에는 어떤 것이 있는지 알아보자. 첫째, 나무를 심지만 말고 심은 후에 잘 가꾸어야 한다. 둘째, 환경이 오염되지 않도록 해야 한다. 쓰레기가 많으면 흙도 오염되고 결국은 나무가 자라는 데 나쁜 영향을 끼치게 된다. 셋째, 무엇보다 산림을 보호하려는 마음가짐이 필요하다. 산림의 중요성을 인식하고 산림을 아끼는 마음이 부족해서 그런 것이라 할 수 있다.","지금까지 산림을 보호해야 하는 까닭과 산림을 보호하는 방법에 대해 알아보았다. 산림은 우리에게 많은 혜택을 준다. 아름다운 금수강산을 후손에게 물려주기 위하여 산림을 잘 가꾸고 보호해야 한다."],"g":"hi"},{"n":75,"ti":"자주적인 사람","to":"스스로 노력하여 자주적인 사람이 되자.","tx":["자주적이지 못한 사람은 일을 끝내지 못한다.","자주적인 사람은 학년이 높아지면 저절로 된다."],"cp":4,"fm":"미괄식","th":["다음 중 자주적인 사람의 모습으로 알맞은 것은?","스스로 계획을 세워 숙제를 하고, 알람을 맞춰 혼자 일어난다.","엄마가 깨워 줄 때까지 잔다.","선생님이 시키지 않으면 숙제를 안 한다.","친구가 하자는 대로 무조건 따른다.","2문단에 자주적인 사람은 누가 깨워 주지 않아도 일어나고, 숙제나 공부도 계획을 세워 스스로 한다고 했어요."],"kw":["자주적","아침","숙제","짜증"],"vo":[["자주적","남의 도움 없이 스스로 판단하고 행동하는 것","남이 시키는 대로만 하는 것","아무것도 하지 않는 것","항상 남에게 기대는 것"],["실천","생각한 것을 실제 행동으로 옮기는 것","생각만 하고 행동하지 않는 것","계획을 잊어버리는 것","남의 일을 구경하는 것"]],"mi":["일을 즐겁게 잘하려면 스스로 생각하고 행동해야 한다.","자주적인 사람의 모습","자주적이지 못한 사람의 모습","자주적인 사람이 되기 위해 노력하자."],"ks":[[1,"그러므로 일을 즐겁게"],[4,"자주적인 사람은 학년이"]],"ev":["자주적이지 못한 사람은 일을 끝까지 하지 못한다는 것을 알 수 있는 문장은?","끝까지 해내지 못하는","3문단에 일을 시작했더라도 끝까지 해내지 못하는 경우가 많다고 했어요."],"p":["남이 시켜서 일을 하는 사람은 즐겁지도 않고 짜증이 날 때가 있다. 그러나 내가 할 일이 무엇인지를 스스로 생각하고 일을 하는 사람은 일이 즐겁고 또 정성을 들여서 잘 하게 된다. 그러므로 일을 즐겁게 하고 잘하려면 내가 할 일이 무엇인지를 스스로 생각하고 행동하도록 노력해야 할 것이다.","스스로 생각하고 행동하며 살아가는 사람을 자주적인 사람이라고 한다. 다른 사람의 생각이나 판단에 무조건 따르지 않으며, 스스로 해야 할 일과 하지 말아야 할 일을 생각하고 판단하며 살아가는 사람이다. 이런 사람은 학교나 집에서 스스로 자기 할 일을 찾아 하는 것은 물론이고, 아침에도 누가 깨워주지 않아도 자기 스스로 일어나며, 숙제나 공부도 계획을 세워 스스로 한다.","자주적이지 못한 사람은 자신이 해야 할 일이 생겨도 누가 시키지 않으면 하려고 하지 않는다. 또, 일을 혹시 시작했더라도 끝까지 해내지 못하는 경우가 많다.","자주적인 사람은 학년이 높아진다고 해서 저절로 되는 것이 아니고, 스스로의 노력과 실천에 의해서 만들어지는 것이다. 우선 무엇보다도 자기 스스로 생활 계획을 세우고 그 계획에 따라 생활하는 버릇을 들이는 것이, 자주적인 사람이 되는 길 중의 하나이다. 그리고 자기 스스로 해야 할 일과 하지 말아야 할 일을 판단하고, 스스로 해야 할 일을 실천하는 노력도 필요하다."],"g":"hi"},{"n":76,"ti":"개구리","to":"개구리의 종류와 먹이, 줄어드는 개구리","tx":["청개구리는 몸 색깔이 변한다.","개구리는 해충이다."],"cp":0,"fm":"병렬식","th":["논에 농약을 많이 뿌리면 어떤 일이 생길 수 있을까요?","해충을 잡아먹는 개구리의 수가 줄어든다.","개구리가 더 많아진다.","개구리가 농약을 먹이로 먹는다.","개구리 울음소리가 더 커진다.","4문단에 농약 사용, 자연 개발 등으로 개구리의 수가 점점 줄어들고 있다고 했어요."],"kw":["개구리","황소","냄새","거미"],"vo":[["융기","어느 부분이 높이 솟아오르는 것","움푹 들어간 것","평평한 것","부드러운 것"],["해충","사람이나 농작물에 해를 끼치는 벌레","사람에게 이로운 벌레","물고기의 한 종류","새의 한 종류"]],"mi":["물속과 땅 위 양쪽에서 사는 개구리","개구리의 여러 가지 종류","개구리의 먹이","개구리의 수가 줄어들고 있다."],"ks":[[1,"그 중의 하나가 바로"],[4,"그러나 농약 사용"]],"ev":["황소개구리라는 이름이 붙은 까닭을 짐작할 수 있는 문장은?","황소 울음과 같은","2문단에 목의 울음주머니로 밤에 황소 울음과 같은 소리를 낸다고 했어요."],"p":["물 속에서 사는 동물은 땅 위에서 사는 동물과 여러 가지로 크게 다르다. 그런데 신기하게도 물 속과 땅 위 양쪽에서 사는 신기한 동물들이 있다. 그 중의 하나가 바로 개구리이다.","개구리는 주변 상태에 따라 누런빛을 띤 녹색에서 회색을 띤 흰색, 어두운 갈색 등으로 변하는 청개구리, 목에 큰 울음주머니가 있어 밤에 황소 울음과 같은 소리를 내는 황소개구리, 주름돌기개구리하고도 불리며 등면은 검은색 바탕에 작은 융기가 많이 나있고 피부에서 독특한 냄새가 나는 옴개구리와 오뚝이개구리, 숲푸른개구리 등 그 종류가 아주 많다.","이런 개구리들은 나방, 거미, 달팽이, 배추벌레, 귀뚜라미, 메뚜기 등을 먹는다. 그런데 특이한 것은 움직이지 않는 것은 먹지 않는다는 점이다. 죽은 것도 실에 묶어 흔들어 주면 혀를 뻗어 순식간에 잡아먹는다.","개구리는 해충을 잡아먹는 소중한 동물 중의 하나이다. 그러나 농약 사용, 자연 개발 등으로 개구리의 수가 점점 줄어들고 있다."],"g":"hi"},{"n":77,"ti":"에너지를 절약하자","to":"에너지를 절약하며 아껴 쓰자.","tx":["석유는 쓰면 쓸수록 줄어든다.","에어컨을 마음껏 켜자."],"cp":0,"fm":"병렬식","th":["여름에 에너지를 아끼기 위한 행동으로 알맞은 것은?","에어컨 온도를 너무 낮지 않게 알맞게 맞춘다.","에어컨을 가장 낮은 온도로 하루 종일 켠다.","가까운 거리도 자동차를 탄다.","창문을 열어 두고 에어컨을 켠다.","3문단에 온도를 적절하게 조절하여 사용해야 한다고 했어요."],"kw":["에너지","지하철","땀띠","풍력"],"vo":[["고갈","자원이나 물자가 다 써서 없어지는 것","아주 많아지는 것","새로 만들어지는 것","알맞게 남는 것"],["대체","다른 것으로 대신하는 것","그대로 두는 것","더 많이 쓰는 것","버리는 것"]],"mi":["한정된 에너지를 어떻게 절약할지 알아보자.","대중교통을 많이 이용하자.","여름은 덜 시원하게, 겨울은 덜 따뜻하게 보내자.","대체 에너지를 개발하자.","지금은 에너지를 아끼는 방법밖에 없다."],"ks":[[2,"첫째, 대중교통을"],[4,"셋째, 대체 에너지를"]],"ev":["태양 에너지가 좋은 대체 에너지로 꼽힌다는 것을 알 수 있는 문장은?","태양 에너지를 꼽았다","4문단에 깨끗하고 이상적인 에너지로 태양 에너지를 꼽았다고 했어요."],"p":["석유, 석탄 그리고 천연 가스는 오래 전부터 사용한 에너지원이다. 이 에너지들은 한정되어 있어 쓰면 쓸수록 줄어드는 것들이다. 그러나 우리는 에어컨이나 히터, 자동차 등으로 인하여 에너지는 하루도 쉬지 않고 사용되고 있다. 만약 전 세계 사람들이 에어컨을 모두 켜면 50-100년 후 사이에는 석유가 고갈 될 것이라고 한다. 그렇다면 에너지 절약을 하기 위해서 어떻게 해야 할지 알아보자.","첫째, 대중교통을 많이 이용해야 한다. 요즘은 버스 전용차로가 활성화 되어있고 지하철로도 많이 확충되었다. 자동차가 많은 만큼 에너지도 낭비되고 환경오염도 될 수 있으니 불편하더라도 대중교통을 이용하여야겠다.","둘째, 여름은 덜 시원하게 겨울은 덜 따뜻하게 보내야 한다. 우리나라는 다른 나라에 비해 자동차와 실내에서 에어컨을 지나치게 남용한다. 여름엔 냉방병에 겨울엔 땀띠가 날 지경이라니 너무 비효율적이다. 그러므로 온도를 적절하게 조절하여 사용하여야겠다.","셋째, 대체 에너지를 개발해야 한다. 어느 환경 연구가는 앞으로 닥칠 엄청난 에너지 위기를 대비하여 깨끗하고 이상적인 에너지로 태양 에너지를 꼽았다. 또한 풍력과 조력 에너지도 언제나 얻을 수 있는 대체에너지이므로 관심을 갖고 연구 개발해야 할 것이다.","지금은 고유가 시대라고 한다. 그렇지만 아직은 대체 에너지가 제대로 개발되어있지 않아 석유 등 현재의 에너지원을 많이 사용할 수밖에 없다. 그렇다면 아끼는 방법밖에는 없다."],"g":"hi"},{"n":78,"ti":"제비집","to":"제비는 튼튼하고 안전한 집을 짓기 위해 여러 가지 방법을 쓴다.","tx":["제비는 처마 밑에 집을 짓는다.","제비집은 쉽게 무너진다."],"cp":4,"fm":"미괄식","th":["제비가 진흙이 마르기를 기다렸다가 또 붙이는 까닭은?","진흙이 채 마르기 전에 계속 붙이면 무너지기 쉬워서","진흙이 너무 무거워서","비가 오기를 기다려서","먹이를 먹고 와야 해서","2문단에 진흙이 채 마르기 전에 계속 붙이기만 하면 무너지기 쉽다고 했어요."],"kw":["제비집","처마","지푸라기","속도"],"vo":[["비법","남에게 알리지 않는 자기만의 특별한 방법","누구나 아는 방법","아주 쉬운 방법","실패한 방법"],["차곡차곡","물건을 가지런히 겹쳐 쌓는 모양","마구 흩어 놓는 모양","한꺼번에 무너지는 모양","멀리 던지는 모양"]],"mi":["제비집은 매우 튼튼하고 안전하다.","제비는 진흙 쌓는 속도를 조절한다.","제비는 진흙 사이에 지푸라기를 섞는다.","제비는 튼튼하고 안전한 집을 짓기 위해 이런 방법을 쓴다."],"ks":[[1,"자기들만의 비법으로"],[3,"진흙 사이에 지푸라기를 섞는 것도"]],"ev":["지푸라기를 섞으면 좋은 까닭을 알 수 있는 문장은?","진흙이 갈라지지 않기","3문단에 그렇게 해야 진흙이 갈라지지 않기 때문이라고 했어요."],"p":["제비가 집을 짓는 모습을 본 적이 있습니까? 제비들이 처마 밑에 집을 짓는 모습을 살펴보면, 그 꼼꼼함에 놀라지 않을 수 없습니다. 자기들만의 비법으로 지은 제비집은 매우 튼튼하고 안전합니다. 제비가 튼튼하고 안전한 집을 짓기 위해서 어떻게 하는지 알아볼까요?","제비는 진흙을 물어다 집을 짓습니다. 이 때 진흙을 쌓는 속도를 조절하는 것을 보면 신기합니다. 진흙이 채 마르기 전에 계속 붙이기만 하면 무너지기 쉬우므로, 진흙이 마르기를 기다려 또 다른 진흙을 덧붙입니다.","진흙 사이에 지푸라기를 섞는 것도 튼튼한 집을 짓는 비결입니다. 제비들은 진흙 사이에 지푸라기를 간간이 섞어 넣으며 차곡차곡 쌓아 갑니다. 그렇게 해야 진흙이 갈라지지 않기 때문입니다.","이처럼 제비가 진흙을 쌓는 속도를 조절하고, 진흙에다 지푸라기를 섞는 것은, 쉽게 허물어지지 않는, 튼튼하고 안전한 집을 짓기 위해서입니다."],"g":"hi"},{"n":79,"ti":"갯벌이 주는 이로움","to":"갯벌은 바다 생물과 새, 사람에게 많은 혜택을 준다.","tx":["갯벌에는 게가 산다.","갯벌은 쓸모없는 땅이다."],"cp":0,"fm":"병렬식","th":["태풍이 올 때 갯벌이 사람에게 주는 도움은?","태풍이나 해일을 약하게 하는 방파제 역할을 한다.","태풍을 더 세게 만든다.","태풍이 오면 사라진다.","바람을 모아 전기를 만든다.","4문단에 갯벌은 태풍이나 해일을 약화시키는 방파제 역할을 한다고 했어요."],"kw":["갯벌","물떼새","문어","오수"],"vo":[["퇴적물","흙이나 모래 등이 물에 실려 와 쌓인 것","바다에 사는 물고기","하늘의 구름","바위의 틈"],["방파제","파도를 막으려고 바닷가에 쌓은 둑","배를 만드는 곳","물고기를 기르는 곳","바닷물을 끓이는 곳"]],"mi":["갯벌이 만들어지는 과정","갯벌은 바다 생물이 살아가는 터전이다.","갯벌은 새들이 살아가는 터전이다.","갯벌은 사람에게도 큰 도움을 준다."],"ks":[[2,"갯벌은 바다 생물이"],[4,"갯벌은 우리 인간에게도"]],"ev":["갯벌이 바닷물을 깨끗하게 해 준다는 것을 알 수 있는 문장은?","오염 물질을 걸러","4문단에 갯벌은 오염 물질을 걸러 주어 바닷물이 오염되는 것을 막아 준다고 했어요."],"p":["바닷가에는 밀물 때는 바다가 되고 썰물 때는 육지가 되는 곳이 있습니다. 이곳을 갯벌이라고 하지요. 갯벌은 밀물과 썰물이 드나들 때에, 모래나 진흙 등의 퇴적물이 쌓여 만들어집니다. 이 갯벌이 주는 이로움에 대하여 알아볼까요?","갯벌은 바다 생물이 살아가는 터전이 되어 줍니다. 갯벌의 모래나 진흙 속에는 영양이 풍부한 유기물이 많습니다. 그래서 갯벌은 바다 생물인 갯지렁이, 바지락, 문어, 게 등이 영양분을 섭취하며 살아가는 삶의 터전이 되어 줍니다.","또, 갯벌은 조류가 살아가는 터전이기도 합니다. 갯벌에 사는 바다 생물을 먹이로 하여 살아가는 새들이 있습니다. 물떼새, 도요새 등이 그 예지요. 갯벌에 사는 식구가 참으로 많지요?","갯벌은 우리 인간에게도 큰 도움을 줍니다. 갯벌은 오염 물질을 걸러 주어 바닷물이 오염되는 것을 막아 줍니다. 우리가 무심코 흘려보내는 오수나 폐수를 정화시켜 주는 일을 갯벌이 하지요. 또, 갯벌은 태풍이나 해일이 발생할 때 이를 약화시켜 주는 방파제 역할을 하기도 합니다. 그래서 우리가 커다란 자연 재해를 입지 않도록 해 줍니다. 이처럼 갯벌은 바다 생물과 조류, 우리 인간에게 많은 혜택을 준답니다."],"g":"hi"},{"n":80,"ti":"우주선 생활","to":"우주선 안에서의 특별한 생활","tx":["우주에는 공기가 없다.","우주선의 쓰레기는 우주에 버린다."],"cp":0,"fm":"병렬식","th":["우주선에서 과자를 먹다가 부스러기를 흘리면 어떻게 될까요?","부스러기가 공중에 둥둥 떠다닌다.","부스러기가 바닥에 떨어진다.","부스러기가 저절로 사라진다.","부스러기가 녹아 버린다.","3문단에 음식 부스러기가 떨어지면 공중에 떠다니기 때문에 조심스럽게 먹어야 한다고 했어요."],"kw":["우주선","벨트","즉석 식품","식탁"],"vo":[["중력","지구가 물체를 끌어당기는 힘","물체를 밀어내는 힘","빛을 내는 힘","소리를 내는 힘"],["고정","한곳에 붙여 움직이지 않게 하는 것","자유롭게 움직이게 하는 것","멀리 던지는 것","바꾸는 것"]],"mi":["우주에서 지내려면 우주선이라는 특별한 생활 공간이 필요하다.","우주선에서 잠을 잘 때는 몸을 고정한다.","우주선에서 음식을 먹는 방법과 주의할 점","우주선에서 생긴 쓰레기는 지구로 가져온다."],"ks":[[1,"그래서 사람이 우주에서"],[4,"하지만 우주선 안에서 생기는"]],"ev":["우주선 안에서 우주복을 입지 않아도 되는 까닭을 알 수 있는 문장은?","늘 신선한 공기가","2문단에 우주선 안에는 늘 신선한 공기가 공급된다고 했어요."],"p":["우주는 공기도 없고 물도 없는 빈 공간입니다. 그래서 사람이 우주에서 지내기 위해서는 특별한 생활공간이 필요합니다. 이것이 바로 우주선입니다.","우주선 안에는 늘 신선한 공기가 공급됩니다. 그러므로 비행사의 몸을 보호해 주는 우주복을 입지 않아도 됩니다. 하지만 중력이 없기 때문에 잠을 잘 때에는 벨트를 이용해서 몸을 고정해야 합니다. 아래로 잡아당기는 중력이 없기 때문에, 고정시켜 두지 않으면 몸이 우주선 안을 둥둥 떠다니게 되기 때문입니다.","우주선 안에서 어떻게 음식을 먹는지 궁금하세요? 우주선 안에서 음식을 준비할 수는 없습니다. 그래서 지구에서 가져간 물기 없는 즉석 식품을 물에 타서 먹습니다. 그런데 음식을 먹을 때에도 주의할 점이 있습니다. 음식물이 떠다니는 것을 막기 위해 음식과 식사 도구들을 식탁에 붙여 놓아야 합니다. 또, 음식을 먹을 때에는 천천히 조심스럽게 먹어야 합니다. 음식 부스러기가 떨어지면 공중에 떠다니기 때문입니다.","우주선 안에서 생활을 하다 보면 자연히 쓰레기도 생기게 마련입니다. 이러한 쓰레기는 어떻게 처리할까요? ‘우주선 밖으로 내다버리면 되지 않나.’ 하고 생각할지 모르겠습니다. 하지만 우주선 안에서 생기는 생활 쓰레기는 모아서 지구로 가져온답니다."],"g":"hi"},{"n":81,"ti":"세대 간의 갈등","to":"세대 간의 갈등은 어린이의 옷차림이나 언어 사용에서 나타난다.","tx":["요즘 어린이들은 옷을 직접 고른다.","어른과 어린이 사이에는 세대 차이가 없다."],"cp":1,"fm":"두괄식","th":["어른과 어린이 사이의 갈등을 줄이기 위해 어린이가 할 수 있는 노력은?","때와 장소에 맞게 바르고 고운 말을 쓰도록 노력한다.","어른들을 시대에 뒤떨어진 사람으로 여긴다.","유행어를 더 많이 쓴다.","어른들과 이야기하지 않는다.","3문단에 어린이들이 때와 장소를 가리지 않고 유행어를 써서 어른들이 걱정한다고 했어요."],"kw":["세대 갈등","내숭","유행","얼굴"],"vo":[["갈등","생각이나 입장이 달라 서로 부딪치는 것","서로 사이좋게 지내는 것","함께 노래하는 것","똑같이 생각하는 것"],["심성","타고난 마음씨","얼굴 생김새","목소리","키와 몸무게"]],"mi":["사회가 빠르게 변하며 세대 간의 갈등이 심해지고 있다.","옷차림에서 나타나는 세대 갈등","언어 사용에서 나타나는 세대 갈등"],"ks":[[1,"이러한 세대 간의 갈등은"],[3,"언어 사용에서도 세대 간의"]],"ev":["어린이의 말을 들으면 그들의 생각을 알 수 있다는 내용이 담긴 문장은?","그들의 생각을 알 수 있다","3문단에 어린이의 말을 듣거나 글을 읽어 보면 그들의 생각을 알 수 있다고 했어요."],"p":["요즈음처럼 사회가 빠른 속도로 변화하는 시대에는 자연히 어른과 어린이 사이에 세대 차이가 생기고 그에 따른 세대 간의 갈등도 한층 더 심해지게 마련이다. 이러한 세대 간의 갈등은 어린이의 옷차림이나 언어 사용 등에서 흔히 나타난다.","어린이의 옷차림은 옛날과는 많이 다르다. 예전에는 부모님이 사 주신 옷을 단정하게 입었지만, 요즈음 어린이는 유행에 따르면서도 자신의 생각을 고집하여 직접 골라 입기도 한다.","언어 사용에서도 세대 간의 갈등이 있다. 언어는 곧 그것을 사용하는 사람의 얼굴이면서 그 사람이 살고 있는 사회 문화를 반영한다. 그러므로 어린이의 말을 듣거나 어린이가 쓴 글을 읽어보면 그들의 생각을 알 수 있다. 요즈음 어린이들은 ‘썰렁하다’, ‘웬 내숭’, ‘짱이다’등과 같은 말을 때와 장소를 가리지 않고 사용한다. 어른이 어린이에게 언어를 고쳐서 바르게 사용하라고 하면, “왜요? 재미있잖아요?” 하며 어른들을 시대에 뒤떨어진 사람으로 여기곤 한다. 어른들은 이러한 언어 사용이 계속되면, 고운 우리말이 점차 사라지고 심성도 나빠질 것이라고 걱정한다."],"g":"hi"},{"n":82,"ti":"반딧불이의 가치","to":"반딧불이는 깨끗한 환경을 알려 주는 지표 곤충으로 가치가 높아지고 있다.","tx":["반딧불이는 파란 빛을 낸다.","반딧불이는 우리나라에만 산다."],"cp":0,"fm":"병렬식","th":["어느 마을 개울가에서 반딧불이가 많이 보인다면 무엇을 짐작할 수 있을까요?","그 마을의 환경이 깨끗하다.","그 마을은 공기가 매우 나쁘다.","그 마을에는 공장이 많다.","그 마을은 한겨울이다.","1문단에 반딧불이는 깨끗한 환경을 알려 주는 지표 곤충이라고 했어요."],"kw":["반딧불이","루시페린","꽁무니","도시화"],"vo":[["지표","방향이나 상태를 알려 주는 표시","땅의 겉면","지도의 이름","아주 오래된 물건"],["희귀","드물어서 매우 귀한 것","아주 흔한 것","값이 싼 것","크기가 큰 것"]],"mi":["깨끗한 환경의 지표 곤충으로 가치가 높아지는 반딧불이","우리나라 반딧불이의 특징","우리나라에 사는 반딧불이의 종류","반딧불이가 빛을 내는 원리"],"ks":[],"ev":["반딧불이의 수가 줄어든 까닭을 알 수 있는 문장은?","환경오염으로","1문단에 산업화, 도시화에 따른 환경오염으로 수가 줄어들었다고 했어요."],"p":["반딧불이는 스스로 빛을 내는 희귀 곤충으로서 옛날부터 사람들의 관심을 끄는 정서곤충으로 잘 알려져 왔으나 최근 들어 산업화 도시화에 따른 환경오염으로 그 수가 점차 줄어듦에 따라, 오히려 깨끗한 환경의 지표곤충으로서의 가치는 점차 높아지고 있다.","반딧불이는 형광에 속하는 곤충으로서 지구상에 약 2000종이 서식한다고 알려져 있지만 우리 나라 반딧불이처럼 성충기에 빛을 내는 종은 극히 드물다.","우리 나라에는 7~8종이 기록되어 있으나 최근 확인된 것은 애반딧불이, 늦반딧불이, 파파리반딧불이 등 3종이 주종을 이룬다.","빛을 내는 원리는 꽁무니의 발광세포에 있는 루시페린의 화학 물질이 호흡에 의해 흡입한 산소를 산화하여 파란 빛을 낸다."],"g":"hi"},{"n":83,"ti":"고창읍성","to":"고창읍성의 규모와 구조, 성벽","tx":["고창읍성은 모양성이라고도 한다.","고창읍성은 조선 후기에 지었다."],"cp":0,"fm":"병렬식","th":["고창의 ‘성벽 밟는 놀이’가 생긴 까닭으로 짐작되는 것은?","성가퀴 뒤에 사람이 다닐 수 있는 성로가 있어서","성벽이 모두 무너져서","성 안에 놀이터가 있어서","문이 세 개라서","3문단에 성가퀴 뒤의 성로 때문에 생긴 것으로 추정된다고 했어요."],"kw":["고창읍성","북문","초석","당간지주"],"vo":[["축조","성이나 둑 따위를 쌓아서 만드는 것","허물어 부수는 것","깨끗이 청소하는 것","그림을 그리는 것"],["추정","미루어 생각하여 판단하는 것","확실하게 증명하는 것","잊어버리는 것","거짓말하는 것"]],"mi":["고창읍성의 위치와 규모, 쌓은 때","고창읍성의 구조","성벽의 재료와 성벽 밟는 놀이의 유래"],"ks":[[1,"고창읍성은 전라북도"]],"ev":["고창읍성의 둘레를 알 수 있는 문장은?","둘레는 1684미터","1문단에 둘레는 1684미터라고 했어요."],"p":["고창읍성은 전라북도 고창군 고창읍에 있는 조선초기의 성이다. 사적 제145호로 지정되어 있고 둘레는 1684미터이다. 모양성(牟陽城)이라고도 한다. 성벽의 형태로 보아 축조 연대는 대략 1573년인 것으로 짐작된다.","반등산(半登山)을 둘러싸고 있으며, 동․서․북의 3문과 치(雉) 6곳, 수구문(水口門) 2곳, 옹성(甕城) 등이 있다. 북문은 2층처럼 생긴 다락집이고, 아래층 어간(御間)에 문짝 둔테구멍이 있다. 서문터는 1976년 발굴되어 기둥 초석과 문짝을 달던 위치가 확인되고, 동문터도 기둥 초석의 존재가 확인되었다.","성벽은 비교적 잘 남아 있고, 자연석은 거칠게 다듬어 썼는데, 초석 당간지주(幢竿支柱)등을 깨뜨려 쓴 것도 있다. 고창의 성벽 밟는 놀이는 아마 성가퀴(성 위에 낮게 쌓은 담) 뒤의 성로(城路) 때문에 생긴 것으로 추정된다."],"g":"hi"},{"n":84,"ti":"물의 등급","to":"물은 오염 정도에 따라 5등급으로 나뉘며, 사는 생물로도 알 수 있다.","tx":["버들치는 1급수에 산다.","물은 모두 마실 수 있다."],"cp":0,"fm":"병렬식","th":["어느 냇가에서 미꾸라지와 붕어는 보이는데 버들치는 보이지 않았어요. 이 냇물은 몇 급수일까요?","3급수","1급수","2급수","5급수","3문단에 미꾸라지, 잉어, 붕어, 메기가 살면 3급수라고 했어요."],"kw":["물","살균","열목어","실지렁이"],"vo":[["불순물","순수한 물질에 섞여 있는 다른 물질","깨끗한 물","맛있는 음식","새 물건"],["부적합","알맞지 않은 것","아주 알맞은 것","가장 좋은 것","똑같은 것"]],"mi":["물은 오염 정도에 따라 5등급으로 나눈다.","1급수부터 5급수까지 물의 특징","사는 물고기로 알아보는 물의 등급","곤충과 실지렁이로도 물의 오염 정도를 알 수 있다."],"ks":[[3,"강에 살고 있는 물고기를"]],"ev":["2급수 물을 마시려면 어떻게 해야 하는지 알 수 있는 문장은?","침전, 여과, 살균","2문단에 침전, 여과, 살균 처리를 해야 마실 수 있는 물을 2급수라고 했어요."],"p":["물은 오염 정도에 따라 5등급으로 나눕니다.","가장 깨끗한 물은 1급수라고 하며, 불순물이 약간 있어 침전, 여과, 살균의 처리를 해야 마실 수 있는 물을 2급수라고 합니다. 3급수는 먹는 물로 사용하기에는 부적합한 것으로, 공업용이나 농업용으로 사용할 수 있는 물을 말합니다. 4 내지 5급수는 마시는 것은 물론 불가능하고, 공업용이나 농업용으로 사용하더라도 복잡한 처리 과정을 거쳐야 하는 물을 말합니다.","강에 살고 있는 물고기를 보면 오염 정도를 알 수 있다고 합니다. 버들치, 열목어, 은어 같은 물고기는 1급수에서 살고, 빙어, 쏘가리, 참붕어 같은 물고기는 2급수에서 살며, 미꾸라지, 잉어, 붕어, 메기가 살면 3급수라고 할 수 있습니다. 물고기가 아예 살 수 없는 물은 4 내지 5급수라고 보면 됩니다.","물고기 외에 잠자리나 하루살이 같은 곤충과 실지렁이 등으로도 물의 오염 정도를 알 수 있습니다."],"g":"hi"},{"n":85,"ti":"우주의 시작과 은하","to":"우주는 빅뱅이라는 대폭발로 시작되었으며, 은하가 만들어졌다.","tx":["빅뱅 전의 우주는 동전만 했다.","우주는 지금 줄어들고 있다."],"cp":0,"fm":"병렬식","th":["‘지금까지도 그 팽창은 계속되고 있다’는 말로 알 수 있는 것은?","우주는 지금도 점점 커지고 있다.","우주는 지금 멈춰 있다.","우주는 점점 작아지고 있다.","우주는 이미 사라졌다.","2문단에 폭발로 시작된 팽창이 지금까지 계속되고 있다고 했어요."],"kw":["우주","수소","짐승","동전"],"vo":[["팽창","부풀어서 크기가 커지는 것","줄어드는 것","부서지는 것","멈추는 것"],["충만","가득하게 차 있는 것","텅 비어 있는 것","조금만 있는 것","새어 나가는 것"]],"mi":["우주의 시작인 빅뱅","초기 우주를 이루던 물질","은하가 만들어진 과정"],"ks":[[1,"폭발로 인해 팽창했고"]],"ev":["우리가 사는 곳이 은하의 한 부분이라는 것을 알 수 있는 문장은?","바로 그 한 구석에","3문단에 바로 그 한 구석에 우리가 살고 있다고 했어요."],"p":["안드로메다 은하, 세이퍼트 은하 등은 백억 년 또는 2백억 년 전에 어떤 일이 일어났다. 대폭발 전의 우주는 1원짜리 동전만 했다고 한다. 폭발로 인해 팽창했고, 그것이 바로 우주의 시작이다. 우리는 이것을 빅뱅(Big bang)이라고 부른다.","지금까지도 그 팽창은 계속되고 있다. 초기의 우주는 방사선과 물질로 충만되어 있었고, 태초에 물질은 밀도 높은 불덩어리의 양자와 전자로 만들어진 수소와 헬륨 원소로 되어 있었다.","그러다가 얼마간의 혼합된 형태의 가스가 나타나기 시작했고 그리하여 농도가 엷은 넝쿨순 모양의 거대한 구름이 형성되어 여전히 빛을 발하면서 휘말리며 돌기 시작하더니 결국은 수천억 개의 회전점을 가진 덩어리가 마치 각각의 한 마리 짐승처럼 몸을 뒤틀어 댔다. 그러다가 드디어 우리가 볼 수 있는 가장 거대한 구조체가 우주 가운데 나타났다. 이름하여 은하(銀河)라 불리운다. 바로 그 한 구석에 우리가 살고 있는 것이다. 각각의 은하들에게 수십억 개에 달하는 태양이 들어 있다고 한다."],"g":"hi"},{"n":86,"ti":"우리 조상들이 연주하던 악기","to":"소리를 내는 방법에 따른 우리 악기의 분류","tx":["아쟁은 활로 켠다.","장구는 입으로 분다."],"cp":0,"fm":"병렬식","th":["가야금과 같은 방법으로 소리를 내는 악기는?","거문고","대금","장구","태평소","1문단에 줄을 켜거나 타서 소리를 내는 악기로 가야금, 거문고, 아쟁이 나와요."],"kw":["악기","개나리","구멍","나무"],"vo":[["진동","흔들려 움직이는 것","멈춰 있는 것","부서지는 것","녹는 것"],["분류","종류에 따라 나누는 것","하나로 합치는 것","버리는 것","숨기는 것"]],"mi":["줄을 켜거나 타서 소리를 내는 악기","입으로 불어서 소리를 내는 악기","두드려서 소리를 내는 악기"],"ks":[[1,"먼저 줄을 켜거나"],[2,"둘째로 입으로 불어서"]],"ev":["아쟁을 연주하는 방법이 가야금과 다르다는 것을 알 수 있는 문장은?","개나리 가지로 만든 활로","1문단 마지막 문장에 아쟁은 개나리 가지로 만든 활로 현을 켠다고 했어요."],"p":["저는 우리 조상들이 즐겨 연주하던 악기를 소리를 내는 방법에 따라 분류하여 조사하였습니다. 먼저 줄을 켜거나 타서 소리를 내는 악기에는 가야금, 거문고, 아쟁 등이 있습니다. 가야금이나 거문고는 사람의 손으로 연주하지만 아쟁은 개나리 가지로 만든 활로 현을 켜서 연주한다는 것이 다릅니다.","둘째로 입으로 불어서 공기를 진동시켜 소리를 내는 악기에는 태평소, 피리, 대금 등이 있습니다. 이들은 모두 나무로 된 관에 구멍을 뚫는데 구멍의 개수는 모두 다릅니다.","셋째로 두드려서 소리를 내는 악기에는 박, 북, 장구 등이 있습니다."],"g":"hi"},{"n":87,"ti":"우리 어머니","to":"어머니가 살아오신 과정","tx":["어머니는 광주에서 태어나셨다.","어머니는 뜨개질을 싫어하신다."],"cp":0,"fm":"병렬식","th":["이 글은 어떤 순서로 쓰였나요?","어머니의 삶을 시간 순서대로 썼다.","어머니의 생김새를 위에서 아래로 썼다.","어머니와 아버지를 비교하며 썼다.","어머니가 좋아하는 음식 순서로 썼다.","태어나심 → 중학생 → 스무 살 → 결혼 뒤, 시간의 흐름에 따라 썼어요."],"kw":["어머니","과수원","효행상","오빠"],"vo":[["시샘","남이 잘되는 것을 샘내고 미워하는 마음","남을 돕는 마음","부끄러운 마음","고마운 마음"],["몸져눕다","병이나 고통이 심해서 자리에 눕다","기운차게 일어나다","잠깐 낮잠을 자다","운동을 하다"]],"mi":["어린 시절의 어머니","중학생 때 효행상을 받으신 어머니","스무 살 무렵 뜨개질을 배우고 결혼하신 어머니","지금도 옷을 만들며 행복해하시는 어머니"],"ks":[[2,"어머니께서는 중학생 때"],[3,"어머니께서는 스무 살 무렵에"]],"ev":["어머니와 아버지가 어떻게 만나셨는지 알 수 있는 문장은?","선물을 사러 오신 아버지를","3문단에 수예 상점에 선물을 사러 오신 아버지를 만나 결혼하셨다고 했어요."],"p":["우리 어머니께서는 1965년에 광주에 있는 한 작은 과수원집에서 태어나셨다. 어머니께서는 어릴 때 시샘이 많아 주위의 어른들로부터 핀잔을 많이 들으셨다고 한다.","어머니께서는 중학생 때 효행상을 받으셨다. 힘든 과수원일로 인해 몸져누우신 외할머니를 정성껏 간호하셨기 때문이었다.","어머니께서는 스무 살 무렵에 이웃 아주머니에게서 뜨개질을 배우기 시작하셨다. 금방 배우고 솜씨가 좋아서 칭찬도 많이 받으셨다고 한다. 얼마 뒤에는 수예 상점을 차리셨고, 선물을 사러 오신 아버지를 만나 결혼을 하셨다.","결혼을 하시고 나서 2년 뒤에 오빠가 태어났고, 그 이듬해에 내가 태어났다. 어머니께서는 우리가 어릴 때부터 예쁜 옷이나 모자를 직접 만들어 주셨다. 지금도 어머니께서는 그 일을 하시면서 무척 행복해하신다."],"g":"hi"},{"n":88,"ti":"태극기","to":"태극기에 담긴 뜻","tx":["태극기 바탕은 흰색이다.","사괘는 빨간색이다."],"cp":0,"fm":"병렬식","th":["태극기의 사괘 중 ‘물’을 뜻하는 괘는 어디에 있나요?","오른쪽 위 (감)","왼쪽 위 (건)","오른쪽 아래 (곤)","왼쪽 아래 (이)","3문단에 오른쪽 위에 있는 감은 물을 가리킨다고 했어요."],"kw":["태극기","하늘","평화","막대"],"vo":[["민족성","한 민족이 공통으로 가진 성질","한 사람만의 버릇","나라의 크기","옛날이야기"],["조화","서로 잘 어울리는 것","서로 싸우는 것","하나만 있는 것","부서지는 것"]],"mi":["흰색 바탕의 뜻","태극 문양의 뜻","사괘의 뜻"],"ks":[[2,"태극 문양은 양의 기운을"]],"ev":["태극기의 흰색 바탕이 무엇을 나타내는지 알 수 있는 문장은?","흰색 바탕은","1문단에 밝음과 순수, 평화를 사랑하는 민족성을 나타낸다고 했어요."],"p":["태극기의 흰색 바탕은 밝음과 순수, 그리고 평화를 사랑하는 우리의 민족성을 나타냅니다.","태극 문양은 양의 기운을 나타내는 빨간색과 음의 기운을 나타내는 파란색의 조화를 보여 줍니다. 이는 우주 만물이 양의 기운과 음의 기운의 조화를 바탕으로 만들어지고 발전한다는 자연의 이치를 나타낸 것입니다.","사괘는 검은색으로 막대 모양입니다. 왼쪽 위에 있는 건은 하늘을 가리킵니다. 오른쪽 아래에 있는 곤은 땅을 가리킵니다. 그리고 오른쪽 위에 있는 감은 물을 가리킵니다. 왼쪽 아래에 있는 이는 불을 가리킵니다."],"g":"hi"},{"n":89,"ti":"책","to":"책은 나에게 선생님, 부모님, 친구처럼 소중하다.","tx":["책은 지식을 준다.","선생님은 미소가 다정하시다."],"cp":0,"fm":"병렬식","th":["이 시에서 책을 ‘친구’에 빗댄 까닭으로 알맞은 것은?","언제나 곁에서 즐거운 시간을 함께해 주기 때문에","숙제를 대신 해 주기 때문에","돈을 빌려주기 때문에","키가 비슷하기 때문에","3연에 책은 소중한 날들을 아낌없이 내어 주고, 정다운 말씨로 속삭이는 친구라고 했어요."],"kw":["책","미소","눈빛","말씨"],"vo":[["격려","용기나 의욕을 북돋워 주는 것","크게 꾸짖는 것","못 본 척하는 것","방해하는 것"],["아낌없이","아까워하지 않고 넉넉하게","조금만 조심스럽게","억지로","몰래"]],"mi":["책은 나의 선생님","책은 나의 부모님","책은 나의 친구"],"ks":[[1,"책은 나의 선생님"]],"ev":["책이 부모님처럼 나를 지켜본다는 것을 알 수 있는 부분은?","따뜻한 눈빛으로","2연 마지막 줄에 따뜻한 눈빛으로 지켜보시는 나의 부모님이라고 했어요."],"p":["책은 나의 선생님\n수많은 지식을 심어 주시며\n“높고 푸른 꿈 키워 가렴”\n다정한 미소로 격려하시는 나의 선생님.","책은 나의 부모님\n한없는 사랑을 채워 주시며\n“맑고 예쁜 마음 길러 가렴”\n따뜻한 눈빛으로 지켜보시는 나의 부모님","책은 나의 친구\n소중한 날들을 아낌없이 내어 주며\n“우리 사이좋게 지내자”\n정다운 말씨로 속삭이는 나의 친구"],"g":"hi","poem":1},{"n":90,"ti":"나무로 만든 물건","to":"나무가 우리 생활에 주는 도움","tx":["나막신은 비 올 때 신었다.","나무는 공기를 더럽힌다."],"cp":0,"fm":"병렬식","th":["다음 중 ‘먹는 것’과 관련해 나무로 만든 물건은?","밥주걱","침대","나막신","옷장","3문단에 먹는 것과 관련된 물건으로 그릇, 주걱, 바구니가 나와요."],"kw":["나무","대나무","돗자리","곡식"],"vo":[["목재","건축이나 가구를 만드는 데 쓰는 나무 재료","쇠로 만든 재료","플라스틱 재료","유리로 된 재료"],["보관","물건을 맡아서 잘 간직하는 것","물건을 버리는 것","물건을 파는 것","물건을 부수는 것"]],"mi":["나무가 우리 생활에 주는 도움","입는 것과 관련된 나무 제품","먹는 것과 관련된 나무 제품","잠자는 것과 관련된 나무 제품"],"ks":[[1,"나는 나무로 만든 제품"]],"ev":["옛날 사람들이 비 올 때 신던 나무 신발을 알 수 있는 문장은?","나막신","2문단에 비가 올 때 신었다는 나막신이 나와요."],"p":["나무는 우리 생활에 많은 도움을 준다. 신선한 공기를 공급하고, 여러 가지 생활에 필요한 재료를 만들 수 있게 해 준다. 나는 나무로 만든 제품 중 사용 목적에 따라서 조사해 보았다.","먼저 입는 것과 관련해 나무로 만든 제품으로 여름에 많이 사용하는 대나무 모자, 옛날 사람들이 비가 올 때 신었다는 나막신, 옷을 보관하는 옷장, 신발을 보관하는 신발장 등이 있다.","둘째, 먹는 것과 관련해서는 과일이나 과자 등을 담아 놓을 수 있는 그릇, 밥을 풀 때 사용하는 주걱, 나물이나 곡식을 담을 때 사용하는 바구니 등이 있다.","셋째, 잠자는 것과 관련해서는 집을 지을 때 사용하는 목재, 잠을 잘 때 사용하는 침대, 여름에 시원하게 깔고 잘 수 있는 돗자리, 여름에 잠을 잘 때 바람이 잘 통하는 베개 등이 있다."],"g":"hi"},{"n":91,"ti":"삼 년 고개","to":"생각을 바꾸면 어려움도 이겨 낼 수 있다.","tx":["삼 년 고개에서 넘어지면 삼 년밖에 못 산다.","고개를 넘을 때는 조심해야 한다."],"cp":2,"fm":"미괄식","th":["소년이 할아버지의 걱정을 해결한 방법은?","같은 규칙을 거꾸로 이용해 여러 번 넘어지게 했다.","할아버지를 다른 마을로 이사 가게 했다.","고개의 돌부리를 모두 뽑았다.","산신령에게 선물을 바쳤다.","한 번 넘어지면 삼 년을 산다면 여러 번 넘어지면 더 오래 산다고, 생각을 바꾸었어요."],"kw":["삼 년 고개","돌부리","가족","한숨"],"vo":[["돌부리","땅에 박힌 돌의 뾰족하게 내민 부분","길가에 핀 꽃","집의 문","나무의 열매"],["터덜터덜","지치거나 힘없이 걷는 모양","신나게 뛰어가는 모양","살금살금 걷는 모양","빙글빙글 도는 모양"]],"mi":["삼 년 고개에서 넘어져 슬픔에 잠긴 할아버지","소년의 지혜로 할아버지가 오래오래 살게 되었다."],"ks":[[1,"어느 날 할아버지 한 분이"],[2,"한 번 넘어지면 삼 년을"]],"ev":["할아버지가 넘어진 까닭을 알 수 있는 문장은?","돌부리에 걸려","1문단에 삐죽이 솟아나온 돌부리에 걸려 넘어졌다고 했어요."],"p":["어느 마을 뒤편에 삼 년 고개가 있었습니다. 이 고개를 지나다 넘어지면 삼 년밖에 살 수 없는 신기한 고개였습니다. 어느 날 할아버지 한 분이 이 고개를 넘다 그만 넘어지고 말았습니다. 삐죽이 솟아나온 돌부리에 걸려 넘어진 것이었지요. 삼 년밖에 못 산다니 눈앞이 캄캄해지고 한숨만 나왔습니다. 터덜터덜 집으로 돌아온 할아버지의 이야기를 듣고 온 가족은 슬픔에 잠겼습니다.","그런데 어느 날 그 마을에 사는 어떤 소년이 할아버지를 찾아와 걱정 마시라고 이야기하는 것이었어요. 한 번 넘어지면 삼 년을 살게 되니 두 번 넘어지면 육 년을 살고 세 번 넘어지면 구 년을 사니 산에 가셔서 자꾸만 넘어지라고 했습니다. 이 말을 들은 할아버지는 삼 년 고개로 달려가 ‘산신령님, 제발 오래 살게 해주세요.’라고 빌며 계속 굴렀습니다. 그 뒤 할아버지는 오래오래 살았답니다."],"g":"hi"},{"n":92,"ti":"솔거와 황룡사 벽화","to":"노력하여 재능을 발휘하자.","tx":["솔거는 신라 사람이다.","참새는 소나무를 좋아한다."],"cp":2,"fm":"미괄식","th":["참새와 까치가 솔거의 그림에 날아와 부딪힌 일로 알 수 있는 것은?","솔거의 그림이 진짜 소나무처럼 훌륭했다.","참새와 까치가 눈이 나빴다.","황룡사에 먹이가 많았다.","그림이 너무 작았다.","2문단에 그림이 꼭 살아 있는 진짜 소나무 같아 새들이 앉으려다 부딪혔다고 했어요."],"kw":["솔거","스승","까치","시골"],"vo":[["추천","알맞은 사람을 책임지고 소개하는 것","벌을 주는 것","쫓아내는 것","모른 척하는 것"],["칭찬","좋은 점이나 잘한 일을 높이 평가하는 것","잘못을 꾸짖는 것","흉을 보는 것","부러워하는 것"]],"mi":["가난했지만 열심히 노력한 솔거","황룡사 벽에 살아 있는 듯한 소나무를 그린 솔거"],"ks":[[1,"솔거는 열심히 그림공부를"],[2,"솔거는 온 정성을 다해"]],"ev":["솔거가 어릴 때 그림 공부를 하기 어려웠던 까닭을 알 수 있는 문장은?","집이 가난하여","1문단에 집이 가난하여 그림 공부를 제대로 할 수 없었다고 했어요."],"p":["옛날 신라에 솔거라는 소년이 살고 있었습니다. 솔거는 어릴 때부터 그림그리기를 좋아했으나 집이 가난하여 그림 공부를 제대로 할 수 없었습니다. 시골구석이라 스승을 찾을 수도 없었지요. 솔거는 열심히 그림공부를 하였습니다. 그리고 하느님께 좋은 그림을 그릴 수 있게 해 달라고 밤낮으로 기도를 했습니다. 그 후 솔거의 그림 솜씨는 더욱 훌륭해져 사람들에게 널리 알려졌습니다.","그 무렵 신라에는 황룡사라는 절이 세워지게 되었는데 사람들의 추천을 받은 솔거가 황룡사 벽에 그림을 그리게 되었습니다. 솔거는 온 정성을 다해 늙은 소나무 그림을 그렸습니다. 그림은 꼭 살아 있는 진짜 소나무 같았습니다. 참새와 까치들이 진짜 나무인지 알고 날아와 소나무 그림에 앉으려다 머리를 부딪히기도 하였습니다. 솔거가 황룡사 벽에 그린 그림은 ‘노송도’라고 불리는데 아주 유명한 것입니다. 사람들은 솔거의 뛰어난 그림을 ‘신령님의 그림’이라고 칭찬했습니다."],"g":"hi"},{"n":93,"ti":"두 소금 장수","to":"욕심을 부리면 화를 당한다.","tx":["소금 장수는 소금을 판다.","나무 위에서 자면 위험하다."],"cp":2,"fm":"미괄식","th":["욕심 많은 소금 장수가 칼에 찔린 까닭은?","호랑이 가죽을 혼자 다 가지려고 서둘러 내려오다가","집 주인이 싸움을 걸어서","착한 소금 장수가 밀어서","호랑이에게 쫓겨서","2문단에 호랑이 가죽을 다 가지려고 나무에서 내려오다 칼에 찔렸다고 했어요."],"kw":["욕심","갈림길","오두막집","가죽"],"vo":[["두메산골","도시에서 멀리 떨어진 깊은 산골","사람이 많은 큰 도시","넓은 바닷가","시장 거리"],["택하다","여럿 가운데서 고르다","모두 버리다","잊어버리다","빼앗다"]],"mi":["마음씨 착한 소금 장수는 큰돈을 벌었다.","욕심 많은 소금 장수는 화를 당했다."],"ks":[[1,"소금 장수는 호랑이 가죽을"],[2,"그러자 욕심 많은 소금 장수는"]],"ev":["욕심 많은 소금 장수가 처음에 어느 쪽으로 장사를 떠났는지 알 수 있는 문장은?","집이 많은 동네 쪽을","1문단 두 번째 문장에 집이 많은 동네 쪽을 택했다고 나와요."],"p":["어느 날 두 소금 장수가 갈림길에서 헤어져 장사를 떠났습니다. 욕심 많은 소금 장수는 집이 많은 동네 쪽을, 마음씨 착한 소금 장수는 두메산골을 택했습니다. 마음씨 착한 소금 장수는 산 속에 오두막집을 발견하고 하룻밤 묵어가게 되었는데, 집 주인이 같이 돈벌이를 하자고 수십 개의 칼을 갈아 뒷산 소나무 주위에 꼽고는 소금 장수에게 나무 위에 올라가 잠을 자라고 했습니다. 아침에 눈을 떠 보니 호랑이 수십 마리가 칼에 찔려 죽어 있었습니다. 소금 장수는 호랑이 가죽을 팔아 큰 돈을 벌고 소금은 집 주인에게 주었습니다.","돌아오는 길에 욕심 많은 소금 장수를 만나 그 동안의 이야기를 들려주었습니다. 그러자 욕심 많은 소금 장수는 똑같이 나무 위에서 자다가 호랑이 가죽을 다 가지려고 나무에서 내려오다 그만 칼에 찔려 죽고 말았습니다."],"g":"hi"},{"n":94,"ti":"겨울의 참외","to":"어려운 일도 지혜롭게 해결하자.","tx":["원님은 참외를 좋아한다.","겨울에는 눈이 온다."],"cp":2,"fm":"미괄식","th":["아들이 원님에게 ‘아버지가 독사에게 물렸다’고 말한 까닭은?","겨울에 참외를 구하라는 명령이 억지라는 것을 깨닫게 하려고","정말로 아버지가 독사에게 물려서","원님을 무섭게 하려고","참외 대신 독사를 주려고","원님이 ‘겨울에 독사가 어디 있냐’고 하자, 아들은 ‘겨울에는 참외도 없다’고 되받아 원님이 잘못을 깨닫게 했어요."],"kw":["지혜","죄수","동헌","눈"],"vo":[["불호령","갑자기 크게 내리는 무서운 꾸지람","다정한 칭찬","조용한 부탁","즐거운 노래"],["뉘우치다","스스로 잘못을 깨닫고 마음을 고치다","잘못을 남에게 떠넘기다","더 크게 화를 내다","모른 척하다"]],"mi":["겨울에 참외를 구해 오라는 고약한 원님의 명령","지혜로운 아들 덕분에 원님이 잘못을 뉘우쳤다."],"ks":[[1,"어느 겨울날 갑자기 참외가"],[2,"그러자 소년은"]],"ev":["죄수가 걱정 때문에 밥도 먹지 못한 까닭을 알 수 있는 문장은?","못 한다고 하면","1문단에 못 한다고 하면 불호령이 떨어지기 때문이라고 했어요."],"p":["옛날 어느 시골에 성질이 고약한 원님이 있었습니다. 안 되는 일도 억지로 시켜 고을 사람들을 괴롭혔습니다. 어느 겨울날 갑자기 참외가 먹고 싶어진 원님은 죄수를 한 사람 불러 참외를 구해 오라고 했습니다. 죄수는 못 한다고 하면 불호령이 떨어지기 때문에 그날부터 걱정이 되어 밥도 먹지 못하고 잠도 잘 자지 못했습니다. 참외를 구해 가지 못하면 큰 벌을 받게 됩니다.","이 죄수에게는 어린 아들이 있었습니다. 아들은 아버지에게서 자세한 이야기를 듣고는 원님을 만나러 동헌으로 갔습니다. 원님 앞으로 가서는 “아버지가 참외를 구하셨는데 참외를 구하다가 독사에게 물렸습니다. 그래서 제가 대신 왔습니다.”라고 하자 원님이 온 세상이 하얗게 눈으로 덮였는데 독사가 어디에 있다고 거짓말을 하냐며 화를 버럭 냈습니다. 그러자 소년은 추운 겨울에 독사도 없는데 여름에 나오는 참외가 어디 있냐며 아버지를 용서해 달라고 하자 원님은 자기 잘못을 뉘우치고 다시는 사람들을 괴롭히지 않았습니다."],"g":"hi"},{"n":95,"ti":"저승까지 따라온 빚쟁이","to":"어려움을 피하기만 해서는 해결되지 않는다(행실을 바르게 하자).","tx":["의원은 보약을 주었다.","빚쟁이는 저승에 산다."],"cp":2,"fm":"미괄식","th":["사나이가 “여기가 저승이구나.”라고 생각한 까닭은?","의원이 준 약을 먹고 잠들었다 깨어나서 자기가 죽은 줄 착각했기 때문에","정말로 저승에 갔기 때문에","산이 너무 높았기 때문에","아내가 편지를 보냈기 때문에","의원이 보약을 주어서 사나이는 멀쩡히 살아 있었지만, 술에 취해 자기가 죽은 줄 착각했어요."],"kw":["빚","의원","편지","항아리"],"vo":[["빚","남에게 갚아야 할 돈","저금한 돈","선물로 받은 돈","주운 돈"],["수상하다","보통과 달리 이상해서 의심스럽다","아주 평범하다","무척 기쁘다","매우 고맙다"]],"mi":["빚에 시달리던 사나이가 산에서 의원이 준 약을 먹고 잠들었다.","저승인 줄 알았던 곳에서 빚쟁이를 만났다."],"ks":[],"ev":["사나이의 집안이 엉망이 된 까닭을 알 수 있는 문장은?","날마다 빚쟁이들이","1문단에 날마다 빚쟁이들이 와서 돈을 내놓으라고 해서 집안이 엉망이었다고 했어요."],"p":["옛날에 빚을 잔뜩 진 사람이 있었습니다. 날마다 빚쟁이들이 와서 내 돈 내놓으라고 해서 집안은 늘 엉망진창이었습니다. 항아리고 그릇이고 살림은 다 망가졌습니다. 아내도 아들을 데리고 친정으로 가 버렸습니다. 견디다 못한 사나이는 ‘에이, 이렇게 살아서 뭐해. 죽어 버리자.’하고는 의원을 찾아갔습니다. 독약을 달라는 사나이 말을 수상하게 생각한 의원은 독약 대신 보약을 주었습니다. 사나이는 술 한 병과 보약을 들고 산으로 올라가 아내에게 편지를 쓰고는 술에 약을 타서 마셨습니다. 한참이 지나 눈을 뜬 사나이는 “아, 여기가 저승이구나.”라며 술이 덜 깬 채로 산을 내려왔습니다.","‘내가 살던 마을이랑 비슷한데’라며 고개를 갸우뚱하고 있는데 저쪽에서 빚쟁이와 비슷한 사람이 오는 것이 보였습니다. “이것 참 알 수 없는 일이군.”이라고 중얼거리며 지나치려 하는데 빚쟁이가 사나이의 멱살을 움켜쥐며 “내 돈 내놔. 당장!”그러자 사나이는 “자네 참 너무하네. 저승까지 쫓아와서 돈을 내놓으라고 하니 말이야.”하고 투덜거렸답니다."],"g":"hi"},{"n":96,"ti":"목침","to":"목침의 쓰임과 재료, 형태, 가장 오래된 유물","tx":["목침은 여름에 많이 썼다.","목침은 모두 둥근 모양이다."],"cp":0,"fm":"병렬식","th":["목침 안에 책을 넣어 둔 까닭은?","쓸 때마다 책의 향기와 우아한 정취를 느끼려고","책을 숨기려고","목침을 무겁게 하려고","누워서 책을 읽으려고","1문단에 목침 안에 책을 넣어 쓸 때마다 문향의 우아한 정취가 느껴지도록 했다고 했어요."],"kw":["목침","약재","무령왕릉","오동나무"],"vo":[["유물","앞 시대 사람들이 남긴 물건","새로 만든 물건","자연에 있는 돌","가게에서 파는 물건"],["출토","땅속에 묻혀 있던 물건이 밖으로 나오는 것","물건을 땅에 묻는 것","물건을 사는 것","물건을 만드는 것"]],"mi":["목침의 뜻과 쓰임","목침의 재료와 형태","가장 오래된 목침 유물"],"ks":[[1,"목침은 나무로 만든"]],"ev":["가장 흔하게 쓴 목침의 모양을 알 수 있는 문장은?","직사각 모양을 가장","2문단에 직사각 모양을 가장 일반적으로 썼다고 했어요."],"p":["목침은 나무로 만든 베개로 나무의 감촉이 서늘하면서도 체온을 은근하게 유지해 주어 잠을 자거나 쉴 때 많이 사용하였으며 서민층에서는 주로 여름에 썼다. 신침(神枕) 또는 약침(藥枕)이라고 하여 목침 안에 약재를 넣어 사용하거나, 목침 안에 책을 넣어 두어서 사용할 때마다 문향의 우아한 정취가 느껴지도록 하기도 하였다.","보통 감나무․회화나무․오동나무․소나무 등으로 만들었으며 나뭇결을 잘 살려 자연스러운 아름다움을 추구하였다. 형태는 둥근 모양, 사각 모양, 직사각 모양, 반달 모양, 동물 모양 등이 있는데, 직사각 모양을 가장 일반적으로 썼다.","가장 오래된 유물은 백제시대 무령왕릉의 왕비 관에서 출토한 것으로서, 통나무를 사다리꼴로 다듬고 중심부분을 반달 모양으로 파내어 베기 편하도록 하였으며 거북등무늬와 연화무늬를 새겨 넣었다."],"g":"hi"},{"n":97,"ti":"고래","to":"고래의 생태","tx":["향유고래는 오징어를 먹는다.","고래는 물고기이다."],"cp":0,"fm":"병렬식","th":["다음 중 가장 오래 사는 것으로 추정되는 고래는?","긴수염고래","돌고래","향유고래","모두 같다","4문단에 긴수염고래류의 수명은 약 100년으로 추정된다고 했어요."],"kw":["고래","해저 전선","콧구멍","플랑크톤"],"vo":[["성숙","생물이 충분히 자라 어른이 되는 것","막 태어나는 것","병이 드는 것","잠을 자는 것"],["회유","물고기나 고래가 철 따라 먼 곳을 오가며 다니는 것","한곳에 머물러 사는 것","땅 위로 올라오는 것","알을 낳는 것"]],"mi":["고래의 먹이","고래의 잠수 깊이와 시간","고래의 분기","고래의 성숙과 수명","고래의 번식"],"ks":[[4,"성숙할 때까지의 수명은"]],"ev":["향유고래가 아주 깊이 잠수한다는 것을 알 수 있는 문장은?","수심 1,000m 부근","2문단에 수심 1,000m 부근의 해저 전선에 감겨 죽은 채 발견된 일도 있다고 했어요."],"p":["긴수염고래류의 먹이는 주로 젓새우 등의 갑각류와 플랑크톤, 무리를 지어 사는 작은 물고기등이다. 이빨고래류는 오징어·새우류·게·물고기 등을 먹는다.","긴수염고래류의 잠수 깊이는 150m 정도이나, 이빨고래류에 속하며 주로 깊은 바다에 사는 오징어를 먹고 사는 향유고래는 수심 1,000m 부근에 설치된 해저 전선에 감겨 죽은 채 발견된 일도 있다. 잠수시간은 긴수염고래류의 경우 10분 이내이고, 소형의 이빨고래는 3∼10분, 향유고래는 30∼60분에 달한다.","물 속에서 떠올랐을 때 흡입했던 공기를 토해내는 것을 고래의 분기라고 하는데, 이것은 콧구멍의 홈이나 그 주위에 고여 있던 물을 분수처럼 뿜어올리는 것으로 추정된다.","성숙할 때까지의 수명은 종류에 따라 다르나, 대형인 종은 성숙이 느리고 수명이 길다. 돌고래는 3∼5년에 성숙하며, 수명은 약 25년이고, 향유고래는 약 8년에 성숙하며, 수명은 약 60년이다. 긴수염고래류는 일반적으로 10∼12년에 성숙하며, 수명은 약 100년으로 추정된다.","멀리 회유하는 긴수염고래나 향유고래는 겨울에서 봄까지 번식을 하며, 돌고래는 대부분 봄·가을의 2차례에 걸쳐 번식하는 종이 많다. 임신기간은 일반적으로 약 1년이지만, 향유고래는 16개월, 흑등고래는 약 10개월로 한배에 1마리를 낳는다."],"g":"hi"},{"n":98,"ti":"김치냉장고","to":"김치냉장고의 뜻과 원리, 특징","tx":["일반 냉장고는 온도 차이가 심하다.","김치냉장고는 옆으로 문을 연다."],"cp":0,"fm":"병렬식","th":["김치냉장고를 서랍식이나 위로 여는 방식으로 만든 까닭은?","무거운 찬 공기가 밖으로 흘러나오지 않게 하려고","김치를 꺼내기 쉽게 하려고","냉장고를 예쁘게 보이게 하려고","전기를 더 쓰려고","2문단에 차가운 공기는 무거워 위로 솟아나오지 않는다는 원리를 이용했다고 했어요."],"kw":["김치냉장고","서랍","일주일","문"],"vo":[["보완","모자란 것을 보태어 완전하게 하는 것","있던 것을 빼는 것","더 나쁘게 만드는 것","그대로 두는 것"],["단속","잘 지켜서 새어 나가지 않게 하는 것","활짝 열어 두는 것","모두 버리는 것","마구 섞는 것"]],"mi":["김치냉장고의 뜻","김치냉장고의 원리와 일반 냉장고와 다른 점"],"ks":[[1,"따라서 냉장고에 김치를"],[2,"즉, 김치냉장고는"]],"ev":["일반 냉장고의 문을 열면 어떤 일이 생기는지 알 수 있는 문장은?","한랭공기가 바닥으로","2문단에 무거운 찬 공기가 바닥으로 쏟아지고 뜨거운 공기가 들어온다고 했어요."],"p":["일반 냉장고는 일정 기간 냉각을 반복하기 때문에 냉장고 안의 온도 차이가 심하다. 따라서 냉장고에 김치를 보관할 경우 일주일 정도면 맛이 쉬는데, 이러한 단점을 보완해 김치만을 따로 보관할 목적으로 만들어진 냉장고를 김치냉장고라 한다.","일반 냉장고는 문을 열면 무거운 한랭공기가 바닥으로 쏟아져 흘러내리면서 뜨거운 공기가 유입된다. 이 때문에 문을 닫으면 다시 냉각시켜 본래의 온도까지 도달하는 데 어느 정도의 시간이 걸리게 된다. 그러나 김치냉장고는 서랍식 또는 상부 개폐식으로 만들어져 문을 열더라도 냉기가 밖으로 흘러나오지 않아 원래의 냉장고 온도를 유지할 수 있다. 즉, 김치냉장고는 차가운 공기가 따뜻한 공기보다 무거워 위로 솟아나오지 않는다는 원리를 이용한 것으로, 일반 냉장고와 구별되는 가장 큰 특징은 바로 이러한 냉장고 내부의 냉기 단속능력이다."],"g":"hi"},{"n":99,"ti":"동지팥죽","to":"동지팥죽의 유래와 만드는 방법","tx":["팥죽에는 새알심을 넣는다.","동지팥죽은 여름에 먹는다."],"cp":0,"fm":"병렬식","th":["열 살인 내가 옛 풍습대로 동지팥죽을 먹는다면 새알심을 몇 개 넣을까요?","10개","1개","24개","넣지 않는다","2문단에 새알심은 먹는 사람의 나이 수만큼 넣어 먹는다고 했어요."],"kw":["동지팥죽","역귀","사당","주걱"],"vo":[["유래","어떤 일이나 물건이 생겨난 까닭이나 역사","만드는 방법","먹는 방법","가격"],["풍속","옛날부터 전해 오는 생활 습관","새로 생긴 규칙","외국의 법","학교의 교칙"]],"mi":["동지팥죽의 유래","동지팥죽을 만드는 방법"],"ks":[[1,"24절기의 하나인"]],"ev":["팥이 귀신을 쫓는다고 여긴 까닭을 알 수 있는 문장은?","붉은 빛은 양기를","1문단 마지막 문장에 붉은 빛은 양기를 뜻해서 팥이 귀신을 쫓는다고 했어요."],"p":["24절기의 하나인 동지에 쑤어 먹는 죽으로 중국 요순시대 형벌을 담당했다고 하는 신화적인 인물인 공공씨에게서 유래된 음식이다.《형초세시기》에 전하는 바에 의하면, 공공씨의 망나니 같은 아들이 동짓날 죽어서 역질귀신이 되었다. 이 역귀가 생전에 팥을 싫어했기 때문에 동짓날이 되면 팥으로 죽을 쑤어 역귀를 쫓았는데 이것이 풍속으로 전래된 것이다. 붉은 빛은 양기를 의미하기 때문에 팥이 귀신을 쫓는 역할을 한다 하여 그 후로 잡귀를 물리치는 데 널리 사용되었다.","만드는 방법은 붉은 팥을 푹 삶아 체에 거른 팥물에 불린 쌀을 넣고 약한 불에서 나무주걱으로 저어가며 뭉근하게 끓인다. 죽이 거의 익어 가면 찹쌀가루를 익반죽하여 새알과 같이 생겨 새알심이라 하는 찹쌀 경단을 함께 넣는다. 다 만들어지면 먼저 사당에 올리고 각 방과 장독대, 헛간 등 집안의 여러 곳에 담아 놓았다가 식은 다음 식구들이 모여 앉아 먹는다. 이때 새알심은 먹는 사람의 나이 수만큼 넣어 먹는다."],"g":"hi"},{"n":100,"ti":"손오공, 저팔계, 사오정","to":"손오공, 저팔계, 사오정이란 이름에 담긴 상징적인 의미","tx":["손오공은 돌 원숭이이다.","저팔계는 원래 하늘의 장군이었다."],"cp":0,"fm":"병렬식","th":["‘저팔계’라는 이름에 담긴 뜻으로 알맞은 것은?","욕심을 경계하라는 여덟 가지 계율","여덟 마리 돼지","하늘의 장군","빈 마음을 깨우친다","3문단에 팔계(八戒)는 욕심을 경계하라는 여덟 가지 계율이라는 뜻이라고 했어요."],"kw":["이름","원숭이","술잔","장군"],"vo":[["구도자","진리나 깨달음을 얻으려고 애쓰는 사람","길을 만드는 사람","그림을 그리는 사람","물건을 파는 사람"],["오만","잘난 체하며 남을 업신여기는 것","겸손하게 자신을 낮추는 것","부끄러워하는 것","친절하게 돕는 것"]],"mi":["세 인물은 구도자의 서로 다른 면을 상징한다.","손오공이라는 이름의 의미","저팔계라는 이름의 의미","사오정이라는 이름의 의미"],"ks":[[4,"사오정은 모래사 깨달을오"]],"ev":["사오정이 하계로 쫓겨난 까닭을 알 수 있는 문장은?","귀중한 술잔을","4문단에 실수로 귀중한 술잔을 깨 버렸기 때문이라고 했어요."],"p":["서유기에 등장하는 손오공이나 저팔계, 그리고 사오정 모두 구원의 길을 찾는 구도자의 각기 다른 면모를 상징적으로 보여줍니다.","제 재주와 힘만 믿고 천하를 들었다 놓으면서 뻐기고 이름도 제천대성(齊天大聖)이라고 자칭하며 오만을 부리던 돌 원숭이는 그의 온갖 야망을 버린 오공(悟空), 즉 \"빈 마음을 깨우친다\"라는 이름을 얻습니다.","하늘의 천봉원수(天蓬元帥)라는 장군이었다가 술과 여색을 밝히는 바람에 벌을 받아 돼지가 된 돼지 저(猪), 저팔계는 그 욕심을 경계하라는 팔계(八戒), 여덟 가지 계율이라는 뜻의 별명과 함께, 무지함을 청산한 지혜로운 존재, 즉 오능(悟能), \"능히 깨달아 알다\"가 됩니다.","사오정은 천상계의 권렴대장의 직책을 수행하던 인물입니다. 하지만 반도회(신들의 잔치)때 실수로 귀중한 술잔을 깨 버리는 바람에 두들겨 맞고 흉측한 모습으로 하계로 추방되어 유사하의 수중 요괴가 됩니다. 사오정은 모래사 깨달을오 깨끗할정으로 올바름을 깨닫는다는 의미로 역시 불교의 교리와 연관성이 있다고 합니다."],"g":"hi"}];

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, k) => shuffle(a).slice(0, k);
const MARKS = ['①','②','③','④','⑤','⑥'];
function hasBatchim(w){ const c = w.charCodeAt(w.length - 1); if (c < 0xAC00 || c > 0xD7A3) return /[0-9LMNR]$/i.test(w) ? /[0136783LMNR]$/i.test(w) : false; return (c - 0xAC00) % 28 !== 0; }
const josa = (w, a, b) => w + (hasBatchim(w) ? a : b);
function splitSent(p){
  const out = []; let cur = ''; let i = 0;
  while (i < p.length){
    const c = p[i]; cur += c;
    if ('.?!…'.includes(c)){
      let j = i + 1;
      while (j < p.length && '.?!…”’"\''.includes(p[j])){ cur += p[j]; j++; }
      if (j >= p.length || p[j] === ' '){ out.push(cur.trim()); cur = ''; i = j; continue; }
      i = j; continue;
    }
    i++;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
const byN = {}; DATA.forEach(d => byN[d.n] = d);

  d.sents = d.p.map(p => d.poem ? p.split('\n') : splitSent(p));
  d.chars = d.p.join('').replace(/\s/g, '').length;
});

/* ---------- question builder ---------- */
function opt(t, c = false, extra = {}){ return Object.assign({ t, c }, extra); }
function buildQs(d){
  const U = d.poem ? '연' : '문단';
  const N = d.p.length;
  const peers = DATA.filter(x => x.g === d.g && x.n !== d.n);
  const qs = [];

  // 문단 나누기
  const cnt = [N - 1, N, N + 1, N + 2].filter(x => x >= 1);
  while (cnt.length < 4) cnt.push(cnt[cnt.length - 1] + 1);
  qs.push({ cat: 'count', kind: 'count',
    prompt: `이 글은 몇 개의 ${U}으로 이루어져 있나요?`,
    opts: cnt.slice(0, 4).map(x => opt(`${x}개의 ${U}`, x === N)),
    exp: d.poem ? `한 줄을 띄어 묶어 놓은 덩어리를 ‘연’이라고 해요. 이 시는 ${N}개의 연으로 되어 있어요.` : `한 칸 들여 써서 시작하는 덩어리가 하나의 문단이에요. 이 글은 ${N}개의 문단으로 되어 있어요. 이제 공책 왼쪽에 문단 번호가 나타나요.` });

  // 생각하기
  qs.push({ cat: 'think', prompt: d.th[0], opts: [opt(d.th[1], true), ...d.th.slice(2, 5).map(t => opt(t))], exp: d.th[5] });

  // 핵심 단어
  const kw = d.kw[0];
  const full = d.p.join(' ');
  const times = full.split(kw).length - 1;
  qs.push({ cat: 'key', prompt: '이 글의 핵심 단어(가장 중요한 낱말)는 무엇일까요?',
    opts: [opt(kw, true), ...d.kw.slice(1).map(t => opt(t))],
    exp: `‘${kw}’${hasBatchim(kw) ? '은' : '는'} 글 전체의 중심 내용과 이어지는 낱말이에요.${times >= 2 ? ` 글에 ${times}번이나 나와요.` : ''} 나머지 낱말은 글의 한 부분에만 잠깐 나와요.` });

  // 어휘
  d.vo.forEach(v => {
    const word = v[0];
    const stem = /다$/.test(word) && word.length > 1 ? word.slice(0, -1) : word;
    let ctx = null;
    for (const ss of d.sents){ for (const s of ss){ if (s.includes(stem)){ ctx = { s, stem }; break; } } if (ctx) break; }
    qs.push({ cat: 'vocab', prompt: `글에 나온 ‘${word}’의 뜻으로 알맞은 것은?`, ctx,
      opts: [opt(v[1], true), ...v.slice(2).map(t => opt(t))],
      exp: `‘${word}’${hasBatchim(word) ? '은' : '는'} “${v[1]}”이라는 뜻이에요. 앞뒤 문장을 함께 읽으면 뜻을 짐작하기 쉬워요.` });
  });

  // 중심 문단: 문단별 중심 내용 (최대 3개)
  const idx = d.mi.map((_, i) => i);
  const chosen = (idx.length <= 3 ? idx : pick(idx, 3)).sort((a, b) => a - b);
  chosen.forEach(k => {
    const others = d.mi.filter((_, i) => i !== k);
    const pool = shuffle(others).concat(d.tx).filter((t, i, a) => a.indexOf(t) === i && t !== d.mi[k]).slice(0, 3);
    qs.push({ cat: 'main', kind: 'mi', para: k, prompt: `${k + 1}${U}의 중심 내용으로 알맞은 것은?`,
      opts: [opt(d.mi[k], true), ...pool.map(t => opt(t))],
      exp: `${k + 1}${U}은 “${d.mi[k]}”에 대한 내용이에요. 문단 속 여러 문장이 공통으로 말하는 것을 찾으면 중심 내용이 보여요.` });
  });
  // 중심 문단
  const cpOpts = d.p.map((_, i) => opt(`${i + 1}${U}`, d.cp === i + 1));
  cpOpts.push(opt(`어느 한 ${U}이 아니라 글 전체에 고루`, d.cp === 0));
  qs.push({ cat: 'main', kind: 'cp', noShuffle: true,
    prompt: `글쓴이가 가장 하고 싶은 말(중심 내용)이 담긴 ${U}은 어디일까요?`, opts: cpOpts, para: d.cp ? d.cp - 1 : null,
    exp: d.cp === 0 ? `이 글은 여러 ${U}이 같은 무게로 나란히 설명하는 짜임이라서, 중심 내용이 글 전체에 고루 나뉘어 있어요.`
                    : `${d.cp}${U}(“${d.mi[d.cp - 1]}”)에 글쓴이가 가장 하고 싶은 말이 담겨 있어요.` });

  // 중심 문장
  d.ks.forEach(([pi, sub]) => {
    const ss = d.sents[pi - 1];
    const right = ss.find(s => s.includes(sub));
    let wrongs = pick(ss.filter(s => s !== right), 3);
    if (wrongs.length < 3){
      const near = d.sents.filter((_, i) => i !== pi - 1).flat().filter(s => s.length > 8);
      wrongs = wrongs.concat(pick(near, 3 - wrongs.length));
    }
    qs.push({ cat: 'sent', kind: 'sent', hl: right, para: pi - 1, prompt: `${pi}${U}에서 중심 문장을 고르세요.`,
      opts: [opt(right, true, { sent: 1 }), ...wrongs.map(t => opt(t, false, { sent: 1 }))],
      exp: `중심 문장은 ${U} 전체의 내용을 대표하는 문장이에요. 나머지 문장은 중심 문장을 자세히 풀어 주거나 예를 드는 뒷받침 문장이에요.` });
  });

  // 근거 찾기
  const all = d.sents.flat();
  const evR = all.find(s => s.includes(d.ev[1]));
  const evW = pick(all.filter(s => s !== evR), 3);
  qs.push({ cat: 'evid', kind: 'sent', hl: evR, prompt: d.ev[0],
    opts: [opt(evR, true, { sent: 1 }), ...evW.map(t => opt(t, false, { sent: 1 }))], exp: d.ev[2] });

  // 짜임 (4·5·6학년)
  if (d.g === 'hi'){
    qs.push({ cat: 'theme', kind: 'form', noShuffle: true, prompt: '중심 내용이 어디에 있는지 생각해 보고, 이 글의 짜임(형식)을 고르세요.',
      opts: FORMS.map(([t, s]) => opt(t, t === d.fm, { sub: s })),
      exp: `이 글은 ${d.fm}이에요. ${FORMS.find(f => f[0] === d.fm)[1]}.` });
  }
  // 주제
  const tOther = pick(peers.map(x => x.to).filter(t => t !== d.to && !d.tx.includes(t)), 1);
  qs.push({ cat: 'theme', prompt: '이 글의 주제로 가장 알맞은 것은?',
    opts: [opt(d.to, true), ...d.tx.map(t => opt(t)), ...tOther.map(t => opt(t))],
    exp: `주제는 글 전체를 아우르는 중심 생각이에요. 이 글의 주제는 “${d.to}”예요. 다른 보기는 글의 한 부분이거나, 글과 맞지 않는 내용이에요.` });
  // 제목
  const tt = pick(peers.map(x => x.ti).filter(t => t !== d.ti), 3);
  qs.push({ cat: 'theme', prompt: '이 글에 가장 알맞은 제목은?',
    opts: [opt(d.ti, true), ...tt.map(t => opt(t))],
    exp: `제목은 글 전체의 내용을 짧게 나타내요. 이 글에는 ‘${d.ti}’${hasBatchim(d.ti) ? '이' : '가'} 잘 어울려요.` });

  qs.forEach(q => { if (!q.noShuffle) q.opts = shuffle(q.opts); });
  return qs;
}

const WD = ['일','월','화','수','목','금','토'];
function dstr(t){ const d = new Date(t); const h = d.getHours(); return `${d.getMonth()+1}월 ${d.getDate()}일(${WD[d.getDay()]}) ${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(d.getMinutes()).padStart(2,'0')}`; }
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
const stars3 = n => '★'.repeat(n) + '☆'.repeat(3 - n);
function oneMsg(r, full){
  const lines = [`📘 학습지 ${r.n}번 「${r.title}」 ${r.score}/${r.total}점 ${stars3(r.stars)}`];
  if (r.cpm) lines.push(`   읽기 속도: 1분에 ${r.cpm}자 (${r.time})`);
  if (full){
    const good = r.cats.filter(c => c[1] === c[2]).map(c => c[0]);
    const weak = r.cats.filter(c => c[1] < c[2]).map(c => `${c[0]} ${c[1]}/${c[2]}`);
    if (good.length) lines.push(`   잘한 영역: ${good.join(', ')}`);
    if (weak.length) lines.push(`   더 연습할 영역: ${weak.join(', ')}`);
    if (r.wrong.length){ lines.push('   틀린 문제:'); r.wrong.forEach(w => lines.push(`   - [${w[0]}] ${w[1]}\n     정답: ${w[2]}`)); }
  }
  return lines.join('\n');
}

    </div>
    <div class="today${today.length ? '' : ' none'}">
      ${today.length ? `<span>오늘 <b class="tnum">${today.length}</b>편 풀었어! (${today.reduce((a, r) => a + r.score, 0)}/${today.reduce((a, r) => a + r.total, 0)}점)</span><button class="btn pri" id="todayMom">💌 오늘 공부 엄마에게 보내기</button>` : `<span>오늘 푼 학습지가 생기면 여기서 한꺼번에 엄마에게 보낼 수 있어요.</span>`}
    </div>
    <div class="bar">
      <div class="seg" role="group" aria-label="학년 선택">
        <button id="g-lo" aria-pressed="${prefs.g === 'lo'}">1·2·3학년 <span class="tnum">(1~50)</span></button>
        <button id="g-hi" aria-pressed="${prefs.g === 'hi'}">4·5·6학년 <span class="tnum">(51~100)</span></button>
      </div>
      <label class="chk"><input type="checkbox" id="onlyNew" ${prefs.onlyNew ? 'checked' : ''}><span class="cb ${prefs.onlyNew ? 'on' : ''}"></span> 아직 안 푼 것만 보기</label>
    </div>
    ${list.length ? `<div class="grid">${list.map(tileHtml).join('')}</div>` : `<div class="empty">${ch('songi', 'cheer')}<div class="bubble l">이 학년 학습지를 다 풀었어! 대단해~<br>체크를 끄면 다시 볼 수 있어.</div></div>`}
    <details class="note">
      <summary>선생님·부모님께</summary>
      <p>원본 『독서디딤돌 글 분석 학습지』 100편(1·2·3학년용 1~50, 4·5·6학년용 51~100)을 실었어요. 원문의 오탈자만 조금 바로잡았어요.</p>
      <p>한 편은 ‘읽기(사선·네모·밑줄 + 읽기 시간 재기) → 문단 나누기 → 생각하기 → 핵심 단어 → 어휘 → 중심 문단 → 중심 문장 → 근거 찾기 → 짜임·주제·제목’ 순서로 진행돼요. 4·5·6학년 학습지에는 글의 짜임(두괄식·미괄식 등) 문제가 더 있어요.</p>
      <p>보기 순서는 풀 때마다 바뀌어요. 점수와 별은 이 기기의 브라우저에만 저장돼요. 결과 화면의 ‘엄마에게 보내기’를 누르면 점수·읽기 속도·영역별 결과·틀린 문제가 한 번에 정리되고, 복사해서 카톡이나 문자로 보낼 수 있어요. 등장 캐릭터(송이·몽이·책돌이)는 이 앱을 위해 새로 그렸어요.</p>
    </details>`;
  $('#g-lo').onclick = () => { prefs.g = 'lo'; save(); renderHome(); };
  $('#g-hi').onclick = () => { prefs.g = 'hi'; save(); renderHome(); };
  $('#onlyNew').onchange = e => { prefs.onlyNew = e.target.checked; save(); renderHome(); };
  $('#kidName').onchange = e => { prefs.kid = e.target.value.trim(); save(); renderHome(); };
  const tm = $('#todayMom'); if (tm) tm.onclick = () => openSend(dayMsg(today), '오늘 공부한 걸 엄마에게 보내자!');
  document.querySelectorAll('.tile').forEach(b => b.onclick = () => openSheet(+b.dataset.n));
}
function tileHtml(d){
  const r = store[d.n];
  const src = d.p.join(' ').replace(/\n/g, ' ');
  const snip = src.length > 58 ? src.slice(0, 58) + '…' : src;
  return `<button class="tile" data-n="${d.n}" aria-label="학습지 ${d.n}${r ? `, 최고 점수 ${r.best}/${r.total}` : ', 새 학습지'}">
    ${r && r.stars === 3 ? '<span class="stamp">참<br>잘했어요</span>' : ''}
    <span class="no"><span class="circ tnum${d.n >= 100 ? ' n3' : ''}">${d.n}</span><small>${d.chars}자</small></span>
    <span class="snip">${esc(snip)}</span>
    <span class="st">${r ? `${starsHtml(r.stars)}<span class="tnum">${r.best}/${r.total}</span>` : '<span class="new">새 학습지!</span><span>→</span>'}</span>
  </button>`;
}

/* ---------- sheet ---------- */
function openSheet(n){
  const d = byN[n];
  S = { view: 'sheet', n, d, phase: 'read', qs: buildQs(d), qi: 0, ans: [], pen: null, t0: null, t1: null, fold: false };
  render(); window.scrollTo({ top: 0 });
}
function passageHtml(d){
  return d.p.map((p, pi) => `<p class="para" data-pi="${pi}"><span class="pnum" aria-hidden="true">${MARKS[pi] || pi + 1}</span>${
    d.sents[pi].map(s => `<span class="s" data-s="${esc(s)}">${s.split(' ').map(w => `<span class="w">${esc(w)}</span>`).join(' ')}</span>`).join(d.poem ? '<br>' : ' ')
  }</p>`).join('');
}
function renderSheet(){
  const d = S.d;
  $('#app').innerHTML = `
    <div class="shead">
      <button class="back" id="back" aria-label="목록으로">← 목록</button>
      <h2><span class="circ tnum" style="width:44px;height:44px;font-size:${d.n >= 100 ? 18 : 24}px">${d.n}</span> 학습지</h2>
      <span class="lv">${d.g === 'lo' ? '1·2·3학년용' : '4·5·6학년용'}</span>
    </div>
    <div class="rail-wrap"><ol class="rail" id="rail"></ol></div>
    <div class="body" id="body">
      <section class="pcard" id="pcard" aria-label="지문">
        <span class="doodle d2">여기 읽어 봐~</span>
        <div class="ptools">
          <div class="pens" role="group" aria-label="읽기 펜">
            <button class="pen" data-pen="slash" aria-pressed="false"><span class="k">/</span>사선</button>
            <button class="pen" data-pen="box" aria-pressed="false"><span class="k">□</span>네모</button>
            <button class="pen" data-pen="line" aria-pressed="false"><span class="k">_</span>밑줄</button>
            <button class="pen clear" id="clearMarks">지우기</button>
          </div>
          <button class="pen pcol-toggle" id="fold" aria-expanded="true">지문 접기</button>
        </div>
        <div class="pscroll" id="pscroll"><div class="ptext${d.poem ? ' poem' : ''}" id="ptext">${passageHtml(d)}</div></div>
        <div class="pfoot"><div class="meter"><span>글자 수<b class="tnum">${d.chars}</b>자</span><span id="mtime"></span><span id="mspeed"></span></div><span id="penHint"></span></div>
      </section>
      <section class="side" id="side" aria-live="polite"></section>
    </div>`;
  $('#back').onclick = () => { stopClock(); go('home'); };
  document.querySelectorAll('.pen[data-pen]').forEach(b => b.onclick = () => setPen(S.pen === b.dataset.pen ? null : b.dataset.pen));
  $('#clearMarks').onclick = () => { $('#ptext').querySelectorAll('.box,.slash,.ul').forEach(el => el.classList.remove('box', 'slash', 'ul')); };
  $('#fold').onclick = () => { S.fold = !S.fold; $('#pcard').classList.toggle('fold', S.fold); $('#fold').textContent = S.fold ? '지문 펼치기' : '지문 접기'; $('#fold').setAttribute('aria-expanded', String(!S.fold)); };
  $('#ptext').addEventListener('click', e => {
    if (!S.pen) return;
    if (S.pen === 'line'){ const s = e.target.closest('.s'); if (s) s.classList.toggle('ul'); }
    else { const w = e.target.closest('.w'); if (w) w.classList.toggle(S.pen === 'box' ? 'box' : 'slash'); }
  });
  setPen(null);
  renderSide();
}
function setPen(p){
  S.pen = p;
  document.querySelectorAll('.pen[data-pen]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pen === p)));
  const t = $('#ptext'); t.classList.remove('pen-slash', 'pen-box', 'pen-line'); if (p) t.classList.add('pen-' + p);
  const hint = { slash: '낱말을 누르면 / 가 생겨!', box: '모르는 낱말을 콕!', line: '중요한 문장을 콕!' };
  $('#penHint').textContent = p ? hint[p] : '';
}
function renderRail(){
  const cur = S.phase === 'read' ? 'read' : S.phase === 'quiz' ? S.qs[S.qi].cat : null;
  const present = new Set(['read', ...S.qs.map(q => q.cat)]);
  const catDone = c => c === 'read' ? S.phase !== 'read' : S.qs.every((q, i) => q.cat !== c || S.ans[i]);
  $('#rail').innerHTML = CATS.filter(([c]) => present.has(c)).map(([c, name]) =>
    `<li class="${c === cur ? 'on' : catDone(c) ? 'fin' : ''}"${c === cur ? ' aria-current="step"' : ''}>${name}</li>`).join('');
}

/* reading clock */
let tick = null;
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function startClock(){ S.t0 = Date.now(); S.t1 = null; clearInterval(tick); tick = setInterval(updClock, 250); updClock(); }
function stopClock(){ if (S.t0 && !S.t1) S.t1 = Date.now(); clearInterval(tick); tick = null; if (S.view === 'sheet') updClock(); }
function secs(){ return S.t0 ? ((S.t1 || Date.now()) - S.t0) / 1000 : 0; }
function speed(){ const s = secs(); return s >= 5 ? Math.round(S.d.chars / (s / 60)) : null; }
function updClock(){
  const c = $('#clock'); if (c) c.innerHTML = `${fmt(secs())}<small>${S.t1 ? '다 읽었어요!' : S.t0 ? '읽는 중… 타다닥' : '읽기 시작을 누르고 읽어요'}</small>`;
  const mt = $('#mtime'); if (mt) mt.innerHTML = S.t0 ? `읽은 시간<b class="tnum">${fmt(secs())}</b>` : '';
  const ms = $('#mspeed'); if (ms) ms.innerHTML = S.t1 && speed() ? `1분에<b class="tnum">${speed()}</b>자` : '';
  const b = $('#clockBtn'); if (b) b.textContent = !S.t0 ? '읽기 시작' : S.t1 ? '다시 재기' : '다 읽었어요';
}

function renderSide(){
  renderRail();
  $('#body').classList.toggle('quizmode', S.phase !== 'read');
  $('#ptext').classList.toggle('nums', S.phase === 'result' || S.ans[0] !== undefined);
  if (S.phase === 'read') return renderRead();
  if (S.phase === 'quiz') return renderQ();
  renderResult();
}
function renderRead(){
  $('#side').innerHTML = `<div class="card">
    <div class="sec"><h3><span class="circ">①</span> 읽기</h3><span class="cnt">문제 ${S.qs.length}개</span></div>
    <div class="readhead">${ch('bookie', 'happy', 'bob')}<div class="bubble l">천천히 읽으면서<br>펜으로 표시해 봐!</div></div>
    <ul class="checks">
      <li><span class="cb on"></span><span><span class="hl">사선 펜</span>을 켜고 낱말을 누르면 / 가 생겨요</span></li>
      <li><span class="cb on"></span><span>모르는 낱말엔 <span class="hl-y">네모</span>! 어휘 문제에서 뜻을 알 수 있어요</span></li>
      <li><span class="cb on"></span><span>중요한 문장엔 <span class="hl-g">밑줄</span>! 중심 문장 찾기에 도움돼요</span></li>
    </ul>
    <div class="timer">
      <div class="clock tnum" id="clock"></div>
      <button class="btn" id="clockBtn"></button>
    </div>
    <div class="acts"><button class="btn pri" id="startQ">문제 풀기 →</button></div>
  </div>`;
  $('#clockBtn').onclick = () => { if (!S.t0 || S.t1) startClock(); else stopClock(); };
  $('#startQ').onclick = () => { stopClock(); setPen(null); S.phase = 'quiz'; S.qi = 0; renderSide(); scrollSideIntoView(); };
  updClock();
}
function scrollSideIntoView(){
  if (window.matchMedia('(max-width:900px)').matches){ const el = $('#side'); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
}
function renderQ(){
  const q = S.qs[S.qi], a = S.ans[S.qi], n = S.qs.length;
  const ci = CATS.findIndex(c => c[0] === q.cat);
  const who = CAT_WHO[q.cat] || 'songi';
  const mood = a ? (a.ok ? 'wow' : 'oops') : 'think';
  const ctx = q.ctx ? `<p class="ctx">${esc(q.ctx.s).replace(esc(q.ctx.stem), `<span class="ctxw">${esc(q.ctx.stem)}</span>`)}</p>` : '';
  const yay = YAY[S.qi % YAY.length], oops = OOPS[S.qi % OOPS.length];
  $('#side').innerHTML = `<div class="card">
    <div class="sec"><h3><span class="circ">${CIRC[ci]}</span> ${CATNAME[q.cat]}</h3><span class="cnt tnum">${S.qi + 1}/${n}</span></div>
    <div class="qbar" aria-hidden="true"><i style="transform:scaleX(${(S.qi + (a ? 1 : 0)) / n})"></i></div>
    <div class="ask">${ch(who, mood, a ? 'hop' : '')}<p class="bubble l">${esc(q.prompt)}</p></div>
    ${!a ? `<span class="doodle" style="position:absolute;right:18px;top:92px">${CAT_NOTE[q.cat] || ''}</span>` : ''}
    ${ctx}
    <ul class="opts">${q.opts.map((o, i) => {
      let cls = o.sent ? 'opt sent' : 'opt';
      if (a){ if (o.c) cls += ' right'; else if (a.pick === i) cls += ' wrong'; else cls += ' dim'; }
      const mark = a && !o.c && a.pick === i ? '✕' : i + 1;
      return `<li><button class="${cls}" data-i="${i}" ${a ? 'disabled' : ''}><span class="cb">${mark}</span><span>${esc(o.t)}${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ''}</span></button></li>`;
    }).join('')}</ul>
    ${a ? `<div class="fb ${a.ok ? 'ok' : 'no'}">${ch(a.ok ? 'songi' : 'mongi', a.ok ? 'cheer' : 'oops', 'hop')}<div><h4>${a.ok ? yay : oops}</h4><p>${esc(q.exp)}</p></div></div>` : ''}
    <div class="acts">${a ? `<button class="btn pri" id="next">${S.qi + 1 < n ? '다음 문제 →' : '결과 보기 →'}</button>` : ''}</div>
    ${!a ? `<p class="hint">${q.kind === 'sent' ? '지문에서 문장을 찾아 읽고 골라 봐!' : '숫자 키 1~' + q.opts.length + '로도 고를 수 있어'}</p>` : ''}
  </div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  const nx = $('#next'); if (nx){ nx.onclick = nextQ; nx.focus({ preventScroll: true }); }
  const t = $('#ptext'); t.querySelectorAll('.hit').forEach(x => x.classList.remove('hit'));
  if (a && q.hl){ const el = [...t.querySelectorAll('.s')].find(s => s.dataset.s === q.hl); if (el){ el.classList.add('hit'); scrollPassageTo(el); } }
  else if (a && q.para != null && q.kind === 'cp'){ const p = t.querySelector(`.para[data-pi="${q.para}"]`); if (p) scrollPassageTo(p); }
}
function scrollPassageTo(el){
  const box = $('#pscroll'); if (!box) return;
  if (box.scrollHeight > box.clientHeight + 4){ box.scrollTo({ top: Math.max(0, el.offsetTop - 40), behavior: 'smooth' }); }
}
function choose(i){
  if (S.ans[S.qi]) return;
  const q = S.qs[S.qi];
  S.ans[S.qi] = { pick: i, ok: !!q.opts[i].c };
  renderSide();
}
function nextQ(){
  if (S.qi + 1 < S.qs.length){ S.qi++; renderSide(); scrollSideIntoView(); }
  else finish();
}
function finish(){
  const d = S.d, total = S.qs.length, score = S.ans.filter(a => a && a.ok).length, pct = score / total;
  const stars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0;
  const prev = store[d.n];
  store[d.n] = { best: Math.max(score, prev ? prev.best : 0), total, stars: Math.max(stars, prev ? prev.stars : 0), last: score, cpm: speed() || (prev && prev.cpm) || null };
  const per = {}; S.qs.forEach((q, i) => { per[q.cat] = per[q.cat] || [0, 0]; per[q.cat][1]++; if (S.ans[i] && S.ans[i].ok) per[q.cat][0]++; });
  const rec = { n: d.n, title: d.ti, g: d.g, score, total, stars, t: Date.now(), cpm: speed(), time: fmt(secs()),
    cats: CATS.filter(([c]) => per[c]).map(([c, name]) => [name, per[c][0], per[c][1]]),
    wrong: S.qs.map((q, i) => [q, S.ans[i]]).filter(([q, a]) => a && !a.ok).map(([q]) => [CATNAME[q.cat], q.prompt, q.opts.find(o => o.c).t]) };
  store._log.push(rec); if (store._log.length > 300) store._log = store._log.slice(-300);
  save();
  S.phase = 'result'; S.result = { score, total, stars, rec };
  renderSide(); scrollSideIntoView();
}
function renderResult(){
  const { score, total, stars } = S.result;
  const per = {};
  S.qs.forEach((q, i) => { per[q.cat] = per[q.cat] || [0, 0]; per[q.cat][1]++; if (S.ans[i] && S.ans[i].ok) per[q.cat][0]++; });
  const msg = stars === 3 ? '우와, 글을 정말 꼼꼼히 읽었구나!<br>참 잘했어요~' : stars === 2 ? '잘했어! 틀린 문제는<br>근거 문장을 다시 찾아보자.' : stars === 1 ? '조금만 더! 문단마다<br>중심 문장에 밑줄 치며 읽어 봐.' : '괜찮아, 천천히<br>한 번 더 읽고 도전하자!';
  const nextN = S.d.n + 1 <= (S.d.g === 'lo' ? 50 : 100) ? S.d.n + 1 : null;
  const sp = speed();
  $('#side').innerHTML = `<div class="card">
    <div class="sec"><h3><span class="circ">✿</span> 결과</h3><span class="cnt">학습지 ${S.d.n}</span></div>
    <div class="score"><div class="big tnum">${score}<small>/${total}</small></div>${starsHtml(stars, 'stars bigstars')}</div>
    <div class="resrow">${ch('songi', stars >= 2 ? 'cheer' : 'happy', 'hop')}<div class="bubble l pink">${msg}</div>${stars === 3 ? ch('mongi', 'cheer', 'bob') : ''}</div>
    ${sp ? `<p class="speed">읽기 속도: 1분에 <span class="hl-y tnum"><b>${sp}</b>자</span> (글자 수 ${S.d.chars}자 · ${fmt(secs())})</p>` : ''}
    <ul class="cats">${CATS.filter(([c]) => per[c]).map(([c, name]) => {
      const [o, t] = per[c]; const r = o / t;
      return `<li><span>${name}</span><span class="tr"><i class="${r < .5 ? 'lo' : ''}" style="width:${Math.round(r * 100)}%"></i></span><span class="v tnum">${o}/${t}</span></li>`;
    }).join('')}</ul>
    <details class="review"><summary>문제 다시 보기</summary><ol>${S.qs.map((q, i) => {
      const a = S.ans[i], right = q.opts.find(o => o.c);
      return `<li><span class="yn ${a && a.ok ? 'o' : 'x'}">${a && a.ok ? '○' : '×'}</span> [${CATNAME[q.cat]}] ${esc(q.prompt)}<br><span class="ans">정답: ${esc(right.t)}${a && !a.ok ? ` · 내가 고른 답: ${esc(q.opts[a.pick].t)}` : ''}</span></li>`;
    }).join('')}</ol></details>
    <div class="momsend">
      ${ch('mongi', 'happy', 'bob')}
      <div><b>엄마에게 결과를 보내 볼까?</b><span>점수, 읽기 속도, 틀린 문제가 정리돼요</span></div>
      <button class="btn pri" id="toMom">💌 엄마에게 보내기</button>
    </div>
    <div class="acts">
      <button class="btn" id="home">목록으로</button>
      <button class="btn" id="again">다시 풀기</button>
      ${nextN ? `<button class="btn pri" id="nextSheet">학습지 ${nextN} →</button>` : ''}
    </div>
  </div>`;
  $('#home').onclick = () => go('home');
  $('#toMom').onclick = () => openSend(resultMsg(S.result.rec), '엄마에게 결과를 보내자!');
  $('#again').onclick = () => openSheet(S.d.n);
  const ns = $('#nextSheet'); if (ns) ns.onclick = () => openSheet(nextN);
  $('#ptext').querySelectorAll('.hit').forEach(x => x.classList.remove('hit'));
}

document.addEventListener('keydown', e => {
  if (S.view !== 'sheet' || S.phase !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-6]$/.test(e.key) && !S.ans[S.qi]){ const i = +e.key - 1; if (i < S.qs[S.qi].opts.length) choose(i); }
});

function render(){ if (S.view === 'home') renderHome(); else renderSheet(); }
render();
</script>

</body>
</html>
