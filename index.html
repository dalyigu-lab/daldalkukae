<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>달달맘의 글분석 학습지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap">
<style>
/* 한 가지 모습(흰 종이 만화 카드)으로만 디자인한 페이지: 배경과 글자색을 모두 직접 지정합니다. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#342A2A; --ink-2:#6C5F5F; --ink-3:#A89B9B;
  --pink:#F5A3B7; --pink-soft:#FDE7ED; --pink-b:#EE9DB1;
  --lav:#F6E3F4; --lav-b:#E2A6D7;
  --lime:#EAF7CB; --peach:#FFF3E6; --peach-b:#F7CDA4;
  --blue:#4568CF; --blue-soft:#EAF0FC; --coral:#E3544B;
  --hl:#FFD2DC; --hl-y:#FFE7A3; --hl-g:#D9F0B8;
  --ok:#3E9B58; --ok-soft:#E8F6DF; --bad:#E3544B; --bad-soft:#FDE9E6;
  --rule:#EDF0F8; --margin:#F6B7C4; --star:#F5B73C; --line:#E6DCDC;
  --lh:36px;
  --f-hand:'Gaegu','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-pen:'Nanum Pen Script','Gaegu','Apple SD Gothic Neo',cursive;
  --f-text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{word-break:keep-all;overflow-wrap:anywhere;font-family:var(--f-hand);font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:18px 56px}
.tnum{font-variant-numeric:tabular-nums}
.hl{background:linear-gradient(to bottom,transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 3px}
.hl-y{background:linear-gradient(to bottom,transparent 55%,var(--hl-y) 55%,var(--hl-y) 92%,transparent 92%);padding:0 3px}
.hl-g{background:linear-gradient(to bottom,transparent 55%,var(--hl-g) 55%,var(--hl-g) 92%,transparent 92%);padding:0 3px}
.red{color:var(--coral)} .bl{color:var(--blue)}
.doodle{font-family:var(--f-pen);color:var(--coral);font-size:24px;line-height:1;display:inline-block;transform:rotate(-8deg);white-space:nowrap;pointer-events:none}
.doodle.ink{color:var(--ink-2)}
.chr{display:block;flex:none;width:110px}
.chr svg{display:block;width:100%;height:auto;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite}
.hop{animation:hop .5s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.05)}100%{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* speech bubbles */
.bubble{position:relative;background:var(--lime);border:2.5px solid var(--ink);border-radius:46% 54% 48% 52% / 58% 50% 50% 42%;padding:14px 24px;text-align:center;font-weight:700}
.bubble.l::after{content:'';position:absolute;left:-10px;bottom:22px;width:18px;height:18px;background:inherit;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(30deg) skewX(-10deg)}
.bubble.b::after{content:'';position:absolute;left:34px;bottom:-10px;width:18px;height:18px;background:inherit;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(40deg)}
.bubble.pink{background:var(--pink-soft);border-color:var(--pink-b);border-radius:18px}
.bubble.pink::after{border-color:var(--pink-b)}
.bubble.wh{background:#fff}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px 24px;align-items:end;padding-block:6px 10px}
.kicker{font-size:17px;color:var(--ink-2);margin:0}
.brand{font-family:var(--f-hand);font-weight:700;font-size:clamp(46px,8vw,78px);line-height:1;margin:6px 0 0;letter-spacing:-.02em}
.brand .red{white-space:nowrap}
.sub{font-size:21px;margin:12px 0 0;font-weight:700}
.hero-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero-c .pair{display:flex;align-items:flex-end;gap:6px}
.hero-c .bubble{max-width:260px;font-size:20px}
.hero-c .d1{position:absolute;right:6px;top:4px}
.panel{display:flex;flex-wrap:wrap;gap:14px;margin-block:10px 18px}
.guide{flex:1 1 420px;border:2.5px solid var(--peach-b);border-radius:6px;padding:12px 18px;position:relative;background:#fff}
.guide h3,.statbox h3{margin:0 0 6px;font-size:21px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checks li{display:flex;gap:10px;align-items:center;font-size:20px}
.cb{width:26px;height:26px;flex:none;position:relative;border:2.5px solid var(--ink);border-radius:3px;background:#fff}
.cb.on::after{content:'';position:absolute;left:3px;top:-10px;width:12px;height:22px;border-right:4px solid var(--coral);border-bottom:4px solid var(--coral);transform:rotate(40deg);border-radius:2px}
.checks .k{font-family:var(--f-pen);color:var(--coral);font-size:28px;width:18px;text-align:center}
.statbox{flex:0 1 380px;flex-wrap:wrap;border:2.5px solid var(--lav-b);background:var(--lav);border-radius:6px;padding:12px 18px;display:flex;gap:22px;align-items:center}
.statbox b{display:block;font-size:40px;line-height:1}
.statbox span{font-size:17px;color:var(--ink-2);white-space:nowrap}
.statbox b{white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-block:6px 16px}
.seg{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg button{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 18px;font-size:20px;font-weight:700;transition:transform .12s}
.seg button[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--coral);color:var(--coral)}
.seg button:hover{transform:translateY(-2px)}
.seg button:active{transform:translateY(0)}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:19px;cursor:pointer}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk input:focus-visible + .cb{outline:3px solid var(--blue);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
.tile{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:4px;text-align:left;background:#fff;border:2.5px solid var(--c,var(--pink-b));border-radius:6px;padding:10px 14px 10px;min-height:156px;transition:transform .15s ease}
.tile:nth-child(4n+1){--c:var(--pink-b)} .tile:nth-child(4n+2){--c:var(--peach-b)} .tile:nth-child(4n+3){--c:var(--lav-b)} .tile:nth-child(4n+4){--c:#9DC4F0}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile:active{transform:none}
.tile .no{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:700;line-height:1}
.tile .no .circ{display:inline-grid;place-items:center;width:40px;height:40px;border:2.5px solid var(--ink);border-radius:50%;font-size:22px}
.tile .no .n3{font-size:18px}
.tile .no small{font-size:16px;color:var(--ink-3);font-weight:400}
.tile .snip{font-family:var(--f-text);font-size:14px;line-height:1.55;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .st{display:flex;align-items:center;justify-content:space-between;font-size:17px;color:var(--ink-3)}
.tile .new{font-family:var(--f-pen);color:var(--blue);font-size:22px}
.tile .stamp{position:absolute;right:8px;top:6px;font-family:var(--f-pen);color:var(--coral);font-size:20px;border:2px solid var(--coral);border-radius:50%;width:54px;height:54px;display:grid;place-items:center;line-height:1;transform:rotate(12deg);opacity:.85;text-align:center}
.stars{display:inline-flex;gap:1px}
.stars svg{width:18px;height:18px}
.empty{padding:40px 0;display:flex;gap:16px;align-items:center}
.note{margin-top:30px;font-size:18px;border:2.5px dashed var(--peach-b);border-radius:6px;padding:12px 18px;max-width:80ch}
.note summary{cursor:pointer;font-weight:700}
.note p{margin:8px 0;font-family:var(--f-text);font-size:15px;line-height:1.7}

/* ---------- sheet ---------- */
.shead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:2px 10px}
.back{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:3px 16px 3px 12px;font-size:18px;font-weight:700}
.back:hover{background:var(--pink-soft)}
.shead h2{font-size:34px;margin:0;line-height:1.1;display:flex;align-items:center;gap:10px}
.shead .lv{font-size:17px;color:var(--ink-2);border:2px solid var(--peach-b);background:var(--peach);border-radius:999px;padding:0 12px}
.rail-wrap{overflow-x:auto;margin-bottom:22px;scrollbar-width:thin}
.rail{display:flex;gap:6px;list-style:none;margin:0;padding:2px 2px 6px;min-width:max-content}
.rail li{font-size:17px;padding:2px 12px;border-radius:999px;border:2px solid #E6DEDE;color:var(--ink-3);white-space:nowrap;display:inline-flex;gap:4px;align-items:center;background:#fff}
.rail li.on{border-color:var(--coral);color:var(--coral);background:var(--pink-soft);font-weight:700}
.rail li.fin{color:var(--ink);border-color:var(--ink-3)}
.rail li.fin::before{content:'✔';color:var(--coral)}
.body{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:26px;align-items:start}
.pcard{background:#fff;border:2.5px solid var(--blue);border-radius:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.pcard .d2{position:absolute;right:8px;top:-22px;z-index:2}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:2px dashed #C9D5F2;background:var(--blue-soft)}
.pens{display:flex;gap:6px;flex-wrap:wrap}
.pen{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:1px 10px;font-size:18px;font-weight:700;display:inline-flex;gap:5px;align-items:center;transition:transform .1s}
.pen .k{font-family:var(--f-pen);color:var(--coral);font-size:26px;line-height:1}
.pen[aria-pressed="true"]{background:var(--ink);color:#fff}
.pen[aria-pressed="true"] .k{color:var(--hl-y)}
.pen:hover:not([aria-pressed="true"]){transform:translateY(-2px)}
.pen.clear{border-style:dashed;color:var(--ink-2)}
.pscroll{overflow:auto;flex:1 1 auto;min-height:0}
.ptext{position:relative;margin:0;padding:8px 20px 20px 58px;font-family:var(--f-text);font-size:18px;line-height:var(--lh);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1.5px),var(--rule) calc(var(--lh) - 1.5px));background-size:100% var(--lh);background-position:0 8px}
.ptext::before{content:'';position:absolute;top:0;bottom:0;left:46px;border-left:2px solid var(--margin)}
.para{margin:0;text-indent:1em;position:relative}
.poem .para{text-indent:0;margin-bottom:var(--lh)}
.pnum{position:absolute;left:-54px;top:1px;width:34px;height:30px;display:grid;place-items:center;text-indent:0;font-family:var(--f-hand);font-weight:700;color:var(--coral);font-size:24px;opacity:0;transform:scale(.6) rotate(-10deg);transition:opacity .3s,transform .3s}
.nums .pnum{opacity:1;transform:none}
.s{border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .25s}
.w{border-radius:3px}
.pen-slash .w,.pen-box .w{cursor:pointer}
.pen-slash .w:hover,.pen-box .w:hover{background:var(--pink-soft)}
.pen-line .s{cursor:pointer}
.pen-line .s:hover{background-color:#FFF6D6}
.w.box{outline:2.5px solid var(--coral);outline-offset:1px}
.w.slash::after{content:' /';color:var(--coral);font-family:var(--f-pen);font-size:24px}
.s.ul{background-image:linear-gradient(to bottom,transparent 58%,var(--hl-y) 58%,var(--hl-y) 92%,transparent 92%)}
.s.hit{background-color:var(--hl-g);box-shadow:0 0 0 3px var(--hl-g)}
.ctxw{background:var(--hl);border-radius:3px;padding:0 2px}
.pfoot{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding:6px 12px;border-top:2px dashed #C9D5F2;font-size:18px;color:var(--ink-2)}
.meter{display:flex;gap:14px;flex-wrap:wrap}
.meter b{color:var(--ink);font-size:22px;margin-left:4px}
#penHint{font-family:var(--f-pen);color:var(--coral);font-size:22px}
.pcol-toggle{display:none}

.side{display:grid;gap:16px}
.card{position:relative;background:#fff;border:2.5px solid var(--peach-b);border-radius:6px;padding:16px 18px 18px;animation:pop .2s ease}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec h3{margin:0;font-size:28px;display:flex;align-items:center;gap:8px;line-height:1.1}
.circ{display:inline-grid;place-items:center;width:36px;height:36px;border:2.5px solid var(--ink);border-radius:50%;font-size:22px;flex:none}
.cnt{font-size:18px;color:#fff;background:#8B8080;border-radius:999px;padding:0 12px}
.qbar{height:10px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:14px;background:#fff}
.qbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--pink) 0 8px,#F9BCCB 8px 16px);transform-origin:left;transition:transform .3s ease}
.ask{display:flex;gap:6px;align-items:flex-end;margin:0 0 12px}
.ask .chr{width:84px}
.ask .bubble{flex:1;font-size:22px;line-height:1.45;text-align:left;margin-left:12px;border-radius:26px;padding:12px 18px}
.ctx{font-family:var(--f-text);font-size:16px;line-height:1.8;background:var(--peach);border:2px dashed var(--peach-b);border-radius:6px;padding:8px 14px;margin:0 0 12px}
.ctx::before{content:'글 속 문장';display:block;font-family:var(--f-pen);font-size:22px;color:var(--coral);line-height:1.1}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;text-align:left;border:2px solid #E4DADA;background:#fff;border-radius:8px;padding:10px 14px;font-size:21px;line-height:1.45;font-weight:700;transition:border-color .15s,background-color .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--ink);transform:translateX(3px)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt[disabled]{cursor:default}
.opt .cb{margin-top:2px;display:grid;place-items:center;font-size:15px;color:var(--ink-3);font-weight:700}
.opt.sent{font-family:var(--f-text);font-weight:400;font-size:16px;line-height:1.65}
.opt .sub{display:block;font-size:17px;color:var(--ink-2);font-weight:400}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .cb{color:transparent}
.opt.right .cb::after{content:'';position:absolute;left:4px;top:-12px;width:12px;height:24px;border-right:4.5px solid var(--coral);border-bottom:4.5px solid var(--coral);transform:rotate(40deg);border-radius:2px}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .cb{color:var(--bad);font-size:20px}
.opt.dim{opacity:.5}
.fb{margin-top:14px;display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 14px;animation:pop .25s ease}
.fb.ok{background:var(--pink-soft);border:2.5px solid var(--pink-b)}
.fb.no{background:var(--lav);border:2.5px solid var(--lav-b)}
.fb .chr{width:70px;margin-top:-4px}
.fb h4{margin:0;font-size:26px;line-height:1.2}
.fb.ok h4{color:var(--coral)} .fb.no h4{color:#8A4E8C}
.fb p{margin:4px 0 0;font-family:var(--f-text);font-size:15.5px;line-height:1.7}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:5px 20px;font-size:21px;font-weight:700;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:none}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff}
.hint{font-family:var(--f-pen);font-size:22px;color:var(--ink-2);margin:8px 0 0;text-align:right}

.readhead{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.readhead .chr{width:96px}
.readhead .bubble{flex:1;margin-left:12px;font-size:21px}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border:2.5px solid var(--lav-b);background:var(--lav);border-radius:6px}
.clock{font-size:46px;font-weight:700;line-height:1}
.clock small{font-size:18px;color:var(--ink-2);display:block;margin-top:2px;font-weight:400}

.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score .big{font-size:84px;font-weight:700;line-height:.9}
.score .big small{font-size:34px;color:var(--ink-3)}
.bigstars svg{width:40px;height:40px}
.resrow{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.resrow .chr{width:92px}
.resrow .bubble{flex:1;margin-left:12px;font-size:20px;text-align:left}
.cats{display:grid;gap:6px;margin:16px 0 0;padding:0;list-style:none}
.cats li{display:grid;grid-template-columns:8em 1fr 3em;gap:10px;align-items:center;font-size:19px}
.cats .tr{height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.cats .tr i{display:block;height:100%;background:var(--pink)}
.cats .tr i.lo{background:#C9B6E8}
.cats .v{text-align:right}
.review{margin-top:14px}
.review summary{cursor:pointer;font-weight:700;font-size:21px}
.review ol{margin:10px 0 0;padding-left:22px;display:grid;gap:10px;font-family:var(--f-text)}
.review li{font-size:14.5px;line-height:1.6}
.review .yn{font-weight:700}
.review .yn.o{color:var(--ok)} .review .yn.x{color:var(--bad)}
.review .ans{color:var(--ink-2)}
.speed{font-size:19px;margin-top:10px}


.who{display:grid;gap:2px}
.who label{font-size:17px;color:var(--ink-2)}
.who input{width:6.5em;font:inherit;font-size:22px;font-weight:700;border:0;border-bottom:2.5px dashed var(--lav-b);background:transparent;color:var(--ink);padding:0 2px}
.who input:focus{outline:none;border-bottom-color:var(--coral)}
.today{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:2.5px solid var(--pink-b);background:var(--pink-soft);border-radius:6px;padding:8px 14px;margin-bottom:14px;font-size:20px}
.today.none{border-style:dashed;background:#fff;color:var(--ink-2);font-size:18px}
.momsend{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px;padding:10px 14px;border:2.5px solid var(--pink-b);background:var(--pink-soft);border-radius:10px}
.momsend .chr{width:62px}
.momsend > div{flex:1 1 180px;display:grid}
.momsend b{font-size:22px} .momsend span{font-size:17px;color:var(--ink-2)}
a.btn{text-decoration:none;display:inline-block}
.send-back{position:fixed;inset:0;z-index:50;background:rgba(52,42,42,.35);display:grid;place-items:center;padding:16px;animation:pop .15s ease}
.send{width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:16px 18px 18px}
.send-top{display:flex;align-items:flex-end;gap:6px;margin-bottom:10px}
.send-top .chr{width:80px}
.send-top .bubble{flex:1;margin-left:12px;font-size:22px}
.send-steps{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:19px}
.send-steps li{display:flex;align-items:center;gap:8px}
.send-steps .circ{width:28px;height:28px;font-size:17px}
.send textarea{width:100%;font-family:var(--f-text);font-size:14.5px;line-height:1.6;border:2px dashed var(--peach-b);border-radius:8px;padding:10px;background:var(--peach);color:var(--ink);resize:vertical}
.send-msg{min-height:1.4em;margin:6px 0 0;color:var(--coral);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:900px){
  .statbox{flex-basis:100%}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-c{flex-direction:row;justify-content:center;align-items:flex-end}
  .hero-c .chr{width:84px}
  .hero-c .bubble{font-size:18px;padding:10px 16px}
  .brand{font-size:44px}
  .body{grid-template-columns:minmax(0,1fr);gap:18px}
  .pcard{position:relative;top:0;max-height:none}
  .quizmode .pcard .pscroll{max-height:42vh}
  .quizmode .pcard.fold .pscroll,.quizmode .pcard.fold .pfoot,.quizmode .pcard.fold .ptools .pens{display:none}
  .pcol-toggle{display:inline-flex}
  .ptext{padding-left:50px;padding-right:14px;font-size:17px;--lh:34px}
  .ptext::before{left:40px}
  .pnum{left:-50px}
  .ask .chr{width:64px}
  .ask .bubble{font-size:20px}
  .opt{font-size:19px}
  .pcard .d2{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

<script>
const DATA = [{"n":1,"ti":"튼튼한 몸을 만드는 습관","to":"튼튼한 몸을 만들려면 몸을 움직여 놀고 음식을 골고루 먹는 습관이 필요하다.","tx":["줄넘기를 하면 잠이 잘 온다.","좋아하는 반찬만 먹어도 괜찮다."],"cp":1,"fm":"두괄식","th":["과자만 먹고 밖에 나가 놀지 않는 동생에게 이 글을 읽은 내가 해 줄 말로 가장 알맞은 것은?","“골고루 먹고 밖에서 뛰어놀아야 몸이 튼튼해져.”","“과자에도 영양소가 있으니 많이 먹어도 돼.”","“운동은 가끔 한 번만 하면 돼.”","“잠만 푹 자면 튼튼해져.”","글쓴이는 튼튼한 몸을 만들려면 몸을 움직여 놀고 음식을 골고루 먹어야 한다고 했어요."],"kw":["습관","줄넘기","생선","잠"],"vo":[["습관","여러 번 되풀이하여 몸에 익은 행동","딱 한 번 해 본 일","남이 시킨 일","잊어버린 일"],["골고루","빠짐없이 두루두루","한 가지만","아주 조금","아무렇게나"]],"mi":["튼튼한 몸을 만들려면 좋은 습관이 필요하다.","밖에서 몸을 움직여 놀아야 한다.","음식을 골고루 먹어야 한다."],"ks":[[2,"먼저, 밖에서"],[3,"다음으로, 여러 가지"]],"ev":["좋아하는 반찬만 먹으면 안 되는 까닭을 알 수 있는 문장은?","좋아하는 반찬만 먹으면","3문단 마지막 문장에 몸에 필요한 영양소가 모자랄 수 있다고 했어요."],"p":["튼튼한 몸은 하루아침에 만들어지지 않습니다. 날마다 좋은 습관을 쌓아야 합니다. 어떤 습관이 필요할까요?","먼저, 밖에서 몸을 움직여 놀아야 합니다. 줄넘기를 하거나 공을 차면 다리와 팔에 힘이 생깁니다. 땀을 흘리고 나면 밤에 잠도 잘 옵니다.","다음으로, 여러 가지 음식을 골고루 먹어야 합니다. 채소와 고기, 생선에는 서로 다른 영양소가 들어 있습니다. 좋아하는 반찬만 먹으면 몸에 필요한 영양소가 모자랄 수 있습니다."],"g":"lo"},{"n":2,"ti":"도서관과 친해지는 방법","to":"도서관과 친해지려면 자주 가 보고 사서 선생님께 도움을 받자.","tx":["도서관에는 책이 아주 많다.","사서 선생님은 책 찾는 일을 도와주지 않는다."],"cp":1,"fm":"두괄식","th":["도서관에서 공룡 책을 찾고 싶은데 어디 있는지 모를 때, 이 글대로 해 본다면?","사서 선생님께 공룡 책이 어디 있는지 여쭈어 본다.","아무 책이나 꺼내 읽는다.","찾기 어려우니 그냥 집에 간다.","친구 가방 속 책을 꺼내 본다.","3문단에 읽고 싶은 책을 말씀드리면 사서 선생님이 있는 곳을 알려 주신다고 했어요."],"kw":["도서관","자리","나이","일주일"],"vo":[["사서","도서관에서 책을 관리하고 이용을 돕는 사람","책을 쓰는 사람","책을 파는 사람","책을 인쇄하는 사람"],["추천","좋은 것을 골라 권하는 것","못 하게 막는 것","몰래 숨기는 것","값을 깎는 것"]],"mi":["도서관과 친해지는 방법을 알아보자.","도서관에 자주 가 본다.","사서 선생님께 도움을 받는다."],"ks":[[1,"도서관과 친해지려면"],[3,"둘째, 사서 선생님께"]],"ev":["도서관에 자주 가면 좋은 점을 알 수 있는 문장은?","저절로 알게 됩니다","2문단에 자주 가다 보면 어느 자리에 어떤 책이 있는지 저절로 알게 된다고 했어요."],"p":["도서관에는 재미있는 책이 가득합니다. 그런데 처음 가 보면 책이 너무 많아서 어디서부터 봐야 할지 모릅니다. 도서관과 친해지려면 어떻게 하면 좋을까요?","첫째, 자주 가 보는 것입니다. 일주일에 한 번씩 가다 보면 어느 자리에 어떤 책이 있는지 저절로 알게 됩니다.","둘째, 사서 선생님께 도움을 받는 것입니다. 읽고 싶은 책을 말씀드리면 책이 있는 곳을 친절하게 알려 주십니다. 내 나이에 맞는 재미있는 책을 추천해 주시기도 합니다."],"g":"lo"},{"n":3,"ti":"남자가 하는 일, 여자가 하는 일","to":"직업에서 남녀 구별이 사라지고 있으니, 좋아하고 잘하는 일을 찾는 것이 중요하다.","tx":["소방관은 불을 끈다.","직업은 남자와 여자가 따로 정해져 있다."],"cp":4,"fm":"미괄식","th":["간호사가 되고 싶은 남자아이 준호에게 이 글의 글쓴이가 해 줄 말로 알맞은 것은?","“네가 좋아하고 잘할 수 있다면 멋진 꿈이야.”","“간호사는 여자만 하는 일이야.”","“소방관이 되는 게 더 어울려.”","“직업은 부모님이 정해 주셔야 해.”","글쓴이는 직업을 고를 때 무엇을 좋아하고 잘하는지가 더 중요하다고 했어요."],"kw":["직업","빵","조종사","짐"],"vo":[["직업","생활에 필요한 돈을 벌려고 하는 일","노는 시간","학교 숙제","취미로 모은 물건"],["여기다","마음속으로 그렇다고 생각하다","크게 소리치다","잊어버리다","손으로 만지다"]],"mi":["세상에는 여러 가지 직업이 있다.","옛날에는 남자 일과 여자 일을 나누어 생각했다.","요즘은 남녀 구별 없이 여러 직업에서 일한다.","중요한 것은 좋아하고 잘하는 일이다."],"ks":[[3,"하지만 요즘은 달라졌습니다"],[4,"내가 무엇을 좋아하고"]],"ev":["요즘은 여자도 비행기를 몬다는 것을 알 수 있는 문장은?","여자 조종사","3문단 마지막 문장에 나와요."],"p":["세상에는 여러 가지 직업이 있습니다. 불을 끄는 소방관, 아픈 사람을 돌보는 간호사, 맛있는 빵을 굽는 제빵사처럼 사람들은 저마다 다른 일을 합니다.","옛날에는 남자가 하는 일과 여자가 하는 일을 따로 나누어 생각하는 사람이 많았습니다. 무거운 짐을 나르는 일은 남자가, 아이를 돌보는 일은 여자가 한다고 여겼습니다.","하지만 요즘은 달라졌습니다. 소방관으로 일하는 여자도 있고, 어린이집 선생님으로 일하는 남자도 있습니다. 비행기를 모는 여자 조종사도 쉽게 만날 수 있습니다.","이제 직업을 고를 때 중요한 것은 남자냐 여자냐가 아닙니다. 내가 무엇을 좋아하고 무엇을 잘하는지가 더 중요합니다."],"g":"lo"},{"n":4,"ti":"우산","to":"우산은 종류가 여러 가지이고 비를 막아 주어 편리하다.","tx":["양산은 햇빛을 가린다.","옛날 사람들은 비를 막을 물건이 없었다."],"cp":1,"fm":"두괄식","th":["옛날 사람들이 도롱이 대신 우산을 쓰게 된 까닭은?","도롱이가 무겁고 불편했기 때문에","도롱이가 너무 비쌌기 때문에","도롱이는 색이 예쁘지 않아서","비가 오지 않게 되어서","3문단에 무겁고 불편해서 가볍고 물이 스며들지 않는 우산을 만들었다고 했어요."],"kw":["우산","나뭇잎","짚","가방"],"vo":[["스며들다","물이나 기운이 속으로 배어 들어가다","튕겨 나가다","얼어붙다","말라 버리다"],["편리하다","쓰기 쉽고 이롭다","불편하고 귀찮다","무겁고 크다","값이 비싸다"]],"mi":["우산이 있으면 비 오는 날 편리하다.","우산에는 여러 가지 종류가 있다.","옛날의 불편한 비옷 대신 우산을 만들게 되었다."],"ks":[[2,"우산에는 여러 가지 종류가"],[3,"하지만 무겁고 불편해서"]],"ev":["우산을 작게 접어 들고 다닐 수 있다는 것을 알 수 있는 문장은?","접이식 우산","2문단 두 번째 문장에 나와요."],"p":["비 오는 날 우산이 있으면 옷과 가방이 젖지 않아 참 편리합니다.","우산에는 여러 가지 종류가 있습니다. 길고 튼튼한 장우산, 작게 접어 가방에 넣는 접이식 우산이 있고, 햇빛을 가리는 양산도 있습니다.","아주 옛날에는 커다란 나뭇잎이나 짚으로 엮은 도롱이로 비를 막았습니다. 하지만 무겁고 불편해서 사람들은 가볍고 물이 스며들지 않는 우산을 만들게 되었습니다."],"g":"lo"},{"n":5,"ti":"자전거와 킥보드","to":"자전거와 킥보드의 다른 점과 같은 점","tx":["킥보드는 가볍다.","자전거가 킥보드보다 빠르다."],"cp":1,"fm":"두괄식","th":["버스를 타고 공원에 가야 해서 들고 다니기 쉬운 탈것을 챙기려면?","킥보드","자전거","둘 다 똑같다","둘 다 들고 다닐 수 없다","3문단에 킥보드는 작고 가벼워서 들고 다니기 쉽다고 했어요."],"kw":["자전거와 킥보드","안장","헬멧","페달"],"vo":[["페달","발로 밟아 바퀴를 돌리는 장치","앉는 자리","손잡이","바퀴 덮개"],["공통점","둘 이상에 똑같이 있는 점","서로 다른 점","가장 나쁜 점","새로 생긴 점"]],"mi":["자전거와 킥보드는 같은 점과 다른 점이 있다.","자전거는 페달을 굴리고, 킥보드는 발로 땅을 차서 나아간다.","킥보드는 들고 다니기 쉽고 자전거는 어렵다.","둘 다 바퀴가 있고 헬멧을 써야 한다."],"ks":[],"ev":["자전거를 타면 먼 길도 편하게 갈 수 있는 까닭을 알 수 있는 문장은?","안장이 있어서","2문단에 앉을 수 있는 안장이 있어서 먼 길도 앉아서 갈 수 있다고 했어요."],"p":["자전거와 킥보드는 비슷한 점도 있고 다른 점도 있습니다.","자전거는 페달을 발로 굴려서 앞으로 나아갑니다. 앉을 수 있는 안장이 있어서 먼 길도 앉아서 갈 수 있습니다. 이와 달리 킥보드는 한 발로 땅을 차면서 나아갑니다.","킥보드는 작고 가벼워서 들고 다니기 쉽습니다. 그러나 자전거는 크고 무거워서 들고 다니기 어렵습니다.","그렇지만 자전거와 킥보드 모두 바퀴가 달려 있고, 탈 때 헬멧을 꼭 써야 한다는 공통점이 있습니다."],"g":"lo"},{"n":6,"ti":"손수건","to":"쓸 곳이 많은 손수건을 늘 챙겨 다니자.","tx":["손수건으로 땀을 닦을 수 있다.","손수건은 집에 두고 다니는 것이 좋다."],"cp":3,"fm":"미괄식","th":["소풍 가서 넘어져 무릎에 작은 상처가 났어요. 이 글과 관련해 알맞은 생각은?","손수건이 있으면 상처를 잠깐 감쌀 수 있어 좋겠다.","손수건은 손을 닦을 때만 써야 한다.","상처가 나면 손수건을 버려야 한다.","손수건은 집에만 두는 것이 좋다.","2문단에 무릎이 까졌을 때 손수건으로 잠깐 감싸 줄 수 있다고 했어요."],"kw":["손수건","이마","음식","주머니"],"vo":[["감싸다","둘레를 둘러 덮다","활짝 펼치다","멀리 던지다","찢어 버리다"],["챙기다","필요한 것을 빠뜨리지 않고 갖추다","버리고 오다","잃어버리다","남에게 주다"]],"mi":["손수건 한 장은 쓸 곳이 많다.","손수건을 쓰는 여러 가지 경우","손수건을 챙겨 다니는 습관을 들이자."],"ks":[[1,"작은 손수건 한 장은"],[3,"가방이나 주머니에"]],"ev":["손수건으로 다친 곳을 보살필 수 있다는 것을 알 수 있는 문장은?","무릎이 까졌을 때","2문단 마지막 문장에 나와요."],"p":["손수건을 늘 가지고 다니는 친구가 있나요? 작은 손수건 한 장은 생각보다 쓸 곳이 많습니다.","손을 씻은 뒤 물기를 닦을 수 있고, 더운 날에는 이마의 땀을 닦을 수 있습니다. 음식을 먹다가 옷에 흘렸을 때도 손수건으로 쓱 닦을 수 있습니다. 넘어져서 무릎이 까졌을 때 잠깐 감싸 줄 수도 있습니다.","이처럼 손수건은 언제 어디서 쓰일지 모릅니다. 가방이나 주머니에 손수건 한 장을 챙겨 다니는 습관을 들여 봅시다."],"g":"lo"},{"n":7,"ti":"남의 작품을 쓸 때","to":"다른 사람의 작품은 허락을 받고 써야 한다.","tx":["인터넷에는 그림과 노래가 많다.","누구나 볼 수 있는 그림은 마음대로 써도 된다."],"cp":3,"fm":"미괄식","th":["친구가 그린 멋진 그림을 내 발표 자료에 넣고 싶을 때 알맞은 행동은?","친구에게 먼저 써도 되는지 물어본다.","몰래 가져다 쓴다.","내가 그렸다고 말한다.","그림을 조금 바꿔서 그냥 쓴다.","3문단에 다른 사람의 작품을 쓸 때는 먼저 허락을 받아야 한다고 했어요."],"kw":["허락","인터넷","노래","시간"],"vo":[["허락","하겠다는 것을 들어주어 하도록 하는 것","못 하게 막는 것","크게 칭찬하는 것","몰래 하는 것"],["대가","일을 한 값으로 받는 돈이나 보상","벌로 받는 꾸중","공짜로 주는 선물","빌린 물건"]],"mi":["인터넷의 그림이나 노래를 그냥 가져다 써도 된다고 생각하는 친구들이 있다.","허락 없이 쓰면 만든 사람이 피해를 입는다.","다른 사람의 작품은 허락을 받고 써야 한다."],"ks":[[1,"인터넷에서 마음에 드는"],[3,"그러므로 다른 사람의"]],"ev":["허락 없이 쓰는 일이 계속되면 어떤 일이 생기는지 알 수 있는 문장은?","좋은 작품을 만들려는 사람도","2문단 마지막 문장에 나와요."],"p":["인터넷에서 마음에 드는 그림이나 노래를 찾으면 그냥 가져다 써도 된다고 생각하는 친구들이 있습니다. 누구나 볼 수 있으니 괜찮다고 여기는 것입니다.","하지만 그림, 노래, 글에는 그것을 만든 사람의 노력과 시간이 담겨 있습니다. 허락 없이 가져다 쓰면 만든 사람은 힘들게 만든 작품의 대가를 받지 못합니다. 이런 일이 계속되면 좋은 작품을 만들려는 사람도 줄어들 것입니다.","그러므로 다른 사람의 작품을 쓸 때에는 먼저 허락을 받아야 합니다. 쓸 수 있게 허락된 작품이라도 누가 만든 것인지 밝혀 주는 것이 좋습니다."],"g":"lo"},{"n":8,"ti":"글쓰기와 요리","to":"글쓰기도 요리처럼 차례를 지켜 한 단계씩 해야 한다.","tx":["김밥은 돌돌 말아 만든다.","글은 떠오르는 대로 한 번에 쓰면 된다."],"cp":3,"fm":"미괄식","th":["김밥을 썰어 접시에 예쁘게 담는 것처럼, 글쓰기의 마지막 단계는?","쓴 글을 다시 읽으며 고친다.","누가 읽을지 정한다.","쓸 내용을 모은다.","순서를 정한다.","2문단에 마지막으로 다시 읽으며 고친다고 했어요."],"kw":["단계","김","접시","밥"],"vo":[["손질","쓰기 좋게 매만지고 다듬는 것","그대로 버리는 것","맛을 보는 것","가게에서 사 오는 것"],["과정","일이 되어 가는 차례나 길","일의 마지막 결과","갑자기 생긴 일","쉬는 시간"]],"mi":["김밥을 만드는 과정","글을 쓰는 과정","글쓰기는 요리처럼 차례를 지켜야 한다."],"ks":[[2,"글을 쓰는 과정도"],[3,"요리도 글쓰기도"]],"ev":["글을 쓸 때 가장 먼저 하는 일을 알 수 있는 문장은?","누가 읽을 글인지","2문단 두 번째 문장에 나와요."],"p":["맛있는 김밥을 만드는 과정을 떠올려 봅시다. 먼저 누가 먹을지 생각하고, 필요한 재료를 준비합니다. 그다음 재료를 알맞게 썰고 볶아서 손질합니다. 김 위에 밥과 재료를 올려 돌돌 말고, 마지막으로 먹기 좋게 썰어 접시에 담습니다.","글을 쓰는 과정도 이와 비슷합니다. 먼저 누가 읽을 글인지 정하고, 쓸 내용을 떠올려 모읍니다. 그다음 모은 내용 가운데 알맞은 것을 골라 순서를 정합니다. 그리고 글을 쓴 뒤, 마지막으로 다시 읽으며 고칩니다.","이처럼 글쓰기는 요리와 닮았습니다. 요리도 글쓰기도 차례를 지켜 한 단계씩 해 나가야 좋은 결과를 얻을 수 있습니다."],"g":"lo"},{"n":9,"ti":"달팽이의 몸과 먹이","to":"달팽이의 몸 생김새와 먹이","tx":["달팽이는 비 온 뒤에 잘 보인다.","달팽이는 고기를 먹는다."],"cp":1,"fm":"두괄식","th":["달팽이를 손가락으로 살짝 건드리면 어떻게 될까요?","몸을 껍데기 속으로 숨긴다.","빨리 뛰어 도망간다.","큰 소리를 낸다.","껍데기를 벗고 도망간다.","2문단에 위험을 느끼면 몸을 껍데기 속으로 숨긴다고 했어요."],"kw":["달팽이","풀잎","상추","비"],"vo":[["더듬이","곤충이나 달팽이의 머리에 있는 가늘고 긴 감각 기관","등에 난 날개","발에 있는 발톱","꼬리 끝의 털"],["갉아 먹다","조금씩 긁어 뜯어 먹다","통째로 삼키다","물만 마시다","냄새만 맡다"]],"mi":["달팽이의 몸과 먹이를 알아보자.","달팽이의 몸 생김새","달팽이의 먹이와 먹는 방법"],"ks":[[1,"여기서는 달팽이의"],[3,"달팽이는 주로 상추나"]],"ev":["달팽이의 눈이 어디에 있는지 알 수 있는 문장은?","긴 더듬이 끝에","2문단에 긴 더듬이 끝에 눈이 달려 있다고 했어요."],"p":["비가 온 뒤 풀잎 위를 천천히 기어가는 달팽이를 본 적이 있나요? 여기서는 달팽이의 몸과 먹이에 대해 알아보겠습니다.","달팽이는 등에 동그랗게 말린 껍데기를 지고 다닙니다. 머리에는 더듬이가 두 쌍 있는데, 긴 더듬이 끝에 눈이 달려 있습니다. 위험을 느끼면 몸을 껍데기 속으로 쏙 숨깁니다.","달팽이는 주로 상추나 배추 같은 부드러운 잎을 먹습니다. 입 안에는 아주 작은 이빨이 많이 달린 혀가 있어서 잎을 조금씩 갉아 먹습니다."],"g":"lo"},{"n":10,"ti":"할머니와 할아버지","to":"할머니와 할아버지를 소개하는 글","tx":["할머니는 봉숭아를 심으셨다.","할아버지는 걸음이 느리시다."],"cp":0,"fm":"병렬식","th":["이 글을 쓴 사람은 누구일까요?","할머니와 할아버지의 손주","할머니의 친구","이웃집 아저씨","꽃집 주인","‘내 손톱에 물을 들여 주십니다’, ‘우리 할머니’ 같은 말로 보아 손주가 쓴 글이에요."],"kw":["할머니와 할아버지","봉숭아","뒷산","손톱"],"vo":[["물을 들이다","색깔이 스며들게 하다","물을 쏟다","물을 마시다","깨끗이 씻다"],["연세","‘나이’를 높여 이르는 말","사는 곳","좋아하는 음식","하시는 일"]],"mi":["꽃 가꾸기를 좋아하시는 할머니","부드럽고 잘 웃으시는 할머니의 성격","아침마다 산에 오르시는 할아버지","조용하지만 옛날이야기를 재미있게 해 주시는 할아버지"],"ks":[[1,"우리 할머니는 꽃 가꾸기를"],[3,"우리 할아버지는 아침마다"]],"ev":["할아버지께서 건강하시다는 것을 짐작할 수 있는 문장은?","걸음이 무척 빠르십니다","3문단에 연세가 많으신데도 걸음이 무척 빠르시다고 했어요."],"p":["우리 할머니는 꽃 가꾸기를 좋아하십니다. 마당에는 할머니가 심은 봉숭아와 채송화가 가득합니다. 여름이면 봉숭아 꽃잎으로 내 손톱에 물을 들여 주십니다.","할머니는 목소리가 부드럽고 잘 웃으십니다. 내가 실수를 해도 괜찮다며 등을 토닥여 주십니다.","우리 할아버지는 아침마다 뒷산에 오르십니다. 연세가 많으신데도 걸음이 무척 빠르십니다.","할아버지는 말씀이 적고 조용하십니다. 하지만 옛날이야기를 해 주실 때에는 목소리를 바꿔 가며 재미있게 들려주십니다."],"g":"lo"},{"n":11,"ti":"고마운 벌","to":"벌은 사람에게 많은 도움을 주는 고마운 곤충이다.","tx":["꿀벌은 벌집에 꿀을 모은다.","벌은 무서우니 모두 없애야 한다."],"cp":1,"fm":"두괄식","th":["꽃밭에 벌이 한 마리도 오지 않는다면 어떤 일이 생길까요?","꽃가루받이가 잘 안 되어 열매가 적게 열린다.","열매가 더 많이 열린다.","꿀이 더 많아진다.","꽃이 더 크게 핀다.","2문단과 4문단에 벌이 꽃가루를 옮겨 주어 열매가 잘 열린다고 했어요."],"kw":["벌","딸기","벌집","꽃밭"],"vo":[["꽃가루받이","꽃가루가 다른 꽃의 암술에 옮겨 붙는 일","꽃에 물을 주는 일","꽃을 꺾는 일","꽃씨를 심는 일"],["저장","물건을 모아서 간직하는 것","모두 버리는 것","나누어 주는 것","먹어 버리는 것"]],"mi":["벌은 사람에게 꼭 필요한 곤충이다.","벌은 꽃가루받이를 돕는다.","벌은 꿀을 만들어 준다.","벌이 살 수 있는 자연을 지켜야 한다."],"ks":[[2,"벌은 꽃가루받이를 돕습니다"],[3,"벌은 꿀도 만들어"]],"ev":["벌 덕분에 과일이 잘 열린다는 것을 알 수 있는 문장은?","열매가 잘 열립니다","2문단 마지막 문장에 나와요."],"p":["벌은 사람에게 꼭 필요한 곤충입니다. 벌을 무섭다고만 생각하기 쉽지만, 벌은 우리에게 많은 도움을 줍니다.","벌은 꽃가루받이를 돕습니다. 꿀을 먹으러 이 꽃 저 꽃을 날아다니면서 몸에 묻은 꽃가루를 옮겨 줍니다. 덕분에 사과, 딸기 같은 열매가 잘 열립니다.","벌은 꿀도 만들어 줍니다. 꿀벌은 꽃에서 모은 꿀물을 벌집에 저장해 달콤한 꿀로 만듭니다.","벌이 사라지면 열매가 잘 맺히지 않아 우리가 먹을 과일도 줄어들 것입니다. 벌이 살 수 있는 꽃밭과 자연을 지켜야 합니다."],"g":"lo"},{"n":12,"ti":"고마운 나무","to":"나무가 주는 도움을 생각하며 나무를 아끼고 가꾸자.","tx":["공책은 나무로 만든다.","나무는 공기를 더럽힌다."],"cp":4,"fm":"양괄식","th":["나무가 모두 없어진다면 어떤 일이 생길지 가장 알맞게 짐작한 것은?","공기가 탁해지고 공책이나 책상을 만들기 어려워진다.","공기가 더 맑아진다.","여름이 더 시원해진다.","연필이 더 많아진다.","나무는 공기를 깨끗하게 하고 여러 물건의 재료가 돼요."],"kw":["나무","그늘","연필","더위"],"vo":[["재료","물건을 만드는 데 들어가는 것","물건의 값","물건의 주인","물건을 파는 곳"],["가꾸다","식물이 잘 자라도록 보살피다","나무를 베어 내다","꽃을 꺾다","씨앗을 버리다"]],"mi":["나무는 우리에게 많은 것을 준다.","나무는 공기를 깨끗하게 하고 더위를 식혀 준다.","나무는 여러 가지 물건의 재료가 된다.","나무를 아끼고 심고 가꾸어야 한다."],"ks":[[2,"나무는 공기를 깨끗하게"],[4,"그러니 나무를 아끼고"]],"ev":["나무가 여름에 주는 도움을 알 수 있는 문장은?","넓은 그늘을","2문단 마지막 문장에 여름에는 넓은 그늘을 만들어 더위를 식혀 준다고 했어요."],"p":["나무는 우리에게 많은 것을 줍니다.","나무는 공기를 깨끗하게 해 줍니다. 나뭇잎은 우리가 숨 쉴 때 필요한 산소를 내보냅니다. 여름에는 넓은 그늘을 만들어 더위도 식혀 줍니다.","나무는 여러 가지 물건의 재료가 됩니다. 우리가 쓰는 공책과 연필, 책상도 나무로 만들었습니다.","나무가 없다면 우리 생활은 무척 불편해질 것입니다. 그러니 나무를 아끼고, 꾸준히 심고 가꾸어야 합니다."],"g":"lo"},{"n":13,"ti":"무지개","to":"무지개가 생기는 까닭과 모양, 무지개에 얽힌 옛이야기","tx":["무지개는 일곱 가지 색으로 보인다.","무지개는 밤에 뜬다."],"cp":0,"fm":"병렬식","th":["맑은 날 마당에서 분무기로 물을 뿌렸더니 작은 무지개가 보였어요. 그 까닭은?","공중에 뿌려진 물방울에 햇빛이 비쳤기 때문에","분무기 속에 물감이 들어 있었기 때문에","비가 오는 중이었기 때문에","밤이 되었기 때문에","1문단에 무지개는 공기 중의 작은 물방울에 햇빛이 비칠 때 생긴다고 했어요."],"kw":["무지개","다리","활","하늘나라"],"vo":[["휘어지다","곧은 것이 구부러지다","똑바로 펴지다","딱딱해지다","작아지다"],["잇다","두 끝을 맞대어 이어 붙이다","둘로 나누다","멀리 떨어뜨리다","감추다"]],"mi":["무지개가 생기는 까닭","무지개의 모양과 색깔","옛날 사람들이 생각한 무지개"],"ks":[[1,"무지개는 공기 중에"],[3,"옛날 사람들은 무지개를"]],"ev":["무지개의 가장 바깥쪽 색을 알 수 있는 문장은?","바깥쪽부터 빨강","2문단에 바깥쪽부터 빨강이라고 했어요."],"p":["비가 그친 뒤 해가 나오면 하늘에 무지개가 뜰 때가 있습니다. 무지개는 공기 중에 떠 있는 작은 물방울에 햇빛이 비칠 때 생깁니다.","무지개는 커다란 활처럼 휘어진 모양입니다. 바깥쪽부터 빨강, 주황, 노랑, 초록, 파랑, 남색, 보라 순서로 색이 보입니다.","옛날 사람들은 무지개를 하늘과 땅을 잇는 다리라고 생각했습니다. 그래서 무지개를 타고 하늘나라 사람이 내려온다는 이야기를 지어내기도 했습니다."],"g":"lo"},{"n":14,"ti":"월드컵 축구 대회","to":"세계인의 잔치인 월드컵 축구 대회","tx":["월드컵은 1930년에 처음 열렸다.","월드컵은 해마다 열린다."],"cp":1,"fm":"두괄식","th":["월드컵을 ‘세계인의 잔치’라고 부르는 까닭은?","여러 나라 사람들이 함께 모여 응원하고 즐기기 때문에","경기 뒤에 잔치 음식을 먹기 때문에","한 나라 사람들만 모이기 때문에","해마다 열리기 때문에","2문단에 서로 다른 나라 사람들이 모여 함께 즐기는 잔치라고 했어요."],"kw":["월드컵","우루과이","거리","문화"],"vo":[["참가","어떤 모임이나 대회에 함께 끼는 것","구경만 하는 것","중간에 빠지는 것","혼자 쉬는 것"],["한마음","여럿이 하나로 합친 같은 마음","서로 다른 생각","미워하는 마음","무서운 마음"]],"mi":["가장 유명한 축구 대회인 월드컵","세계인의 잔치인 월드컵","2002년 우리나라와 일본이 함께 연 월드컵"],"ks":[[1,"세계 여러 나라가 참가하는"],[2,"서로 다른 말과 문화를"]],"ev":["월드컵이 몇 년마다 열리는지 알 수 있는 문장은?","4년마다","1문단 두 번째 문장에 나와요."],"p":["세계 여러 나라가 참가하는 축구 대회 가운데 가장 유명한 것은 월드컵입니다. 월드컵은 1930년 우루과이에서 처음 열렸고, 그 뒤로 4년마다 열리고 있습니다.","월드컵은 단순한 축구 경기가 아닙니다. 서로 다른 말과 문화를 가진 사람들이 한자리에 모여 함께 응원하고 즐기는 세계인의 잔치입니다.","2002년에는 우리나라와 일본이 함께 월드컵을 열었습니다. 그때 많은 사람들이 거리에 나와 한마음으로 응원했습니다."],"g":"lo"},{"n":15,"ti":"자연을 지켜요","to":"소중한 자연을 지키기 위해 작은 일부터 실천하자.","tx":["공기와 물은 자연에서 얻는다.","자연 보호는 어른들만 하는 일이다."],"cp":4,"fm":"미괄식","th":["이 글에서 말한 ‘자연을 지키는 방법’을 실천한 어린이는?","쓰레기를 분리해서 버린 지민","공원의 꽃을 꺾어 온 현우","물을 틀어 놓고 양치한 서연","길에 과자 봉지를 버린 도윤","3문단에 쓰레기를 분리해서 버리는 것이 자연을 지키는 방법이라고 했어요."],"kw":["자연","전기","공원","공기"],"vo":[["함부로","생각하지 않고 마구","아주 조심스럽게","천천히","정성껏"],["실천","생각한 것을 실제로 행동으로 옮기는 것","생각만 하는 것","잊어버리는 것","미루는 것"]],"mi":["사람은 자연에서 필요한 것을 얻는다.","사람들 때문에 자연이 망가지고 있다.","자연을 지키는 여러 가지 방법","작은 일부터 실천하여 자연을 지키자."],"ks":[[2,"그런데 사람들이 자연을"],[3,"자연을 지키는 방법은"]],"ev":["자연이 망가지는 까닭을 알 수 있는 문장은?","나무를 마구 베기","2문단 두 번째 문장에 나와요."],"p":["우리는 먹을 것, 입을 것, 숨 쉴 공기와 마실 물을 모두 자연에서 얻습니다. 자연이 없으면 사람은 살아갈 수 없습니다.","그런데 사람들이 자연을 함부로 다루면서 자연이 점점 망가지고 있습니다. 쓰레기를 아무 데나 버리고, 나무를 마구 베기 때문입니다.","자연을 지키는 방법은 어렵지 않습니다. 쓰레기는 분리해서 버리고, 물과 전기를 아껴 씁니다. 산이나 공원에서 꽃과 나무를 꺾지 않는 것도 자연을 지키는 일입니다.","우리 어린이들도 작은 일부터 실천하여 소중한 자연을 지켜야 합니다."],"g":"lo"},{"n":16,"ti":"지우의 다짐","to":"바른 자세로 앉고, 몸과 눈을 자주 쉬게 하자.","tx":["할머니는 밭에서 일하신다.","누워서 보면 눈이 편하다."],"cp":2,"fm":"미괄식","th":["지우가 앞으로 바르게 앉겠다고 다짐한 까닭은?","허리를 오래 굽혀 아프신 할머니 이야기를 듣고","휴대폰이 고장 나서","엄마께 혼이 나서","만화가 재미없어서","할머니께서 오래 허리를 굽히고 일해서 아프시다는 말씀을 듣고 지우는 자기 자세를 돌아보았어요."],"kw":["자세","만화","밭","저녁"],"vo":[["뻐근하다","근육이 뭉쳐 움직이기 거북하다","아주 가볍고 시원하다","배가 부르다","졸리다"],["다짐","마음을 굳게 먹고 스스로 약속하는 것","남을 탓하는 것","일을 미루는 것","잊어버리는 것"]],"mi":["지우는 누워서 휴대폰을 보다가 목과 눈이 아팠다.","할머니 이야기를 듣고 지우는 바른 자세를 다짐했다."],"ks":[[1,"지우는 소파에"],[2,"그리고 앞으로는 바르게"]],"ev":["누워서 만화를 본 뒤 지우의 몸이 불편했던 점을 알 수 있는 문장은?","목이 뻐근하고","1문단 두 번째 문장에 나와요."],"p":["지우는 소파에 비스듬히 누워 휴대폰으로 만화를 보았습니다. 한참 보고 나니 목이 뻐근하고 눈이 따가웠습니다.","저녁에 할머니께서 허리를 짚으며 들어오셨습니다. 밭에서 오래 허리를 굽히고 일하셔서 아프시다고 하셨습니다. 의사 선생님께서 자주 허리를 펴고 쉬어야 한다고 말씀하셨다고 합니다. 할머니의 말씀을 들은 지우는 자기 자세를 돌아보았습니다. 그리고 앞으로는 바르게 앉아서 보고, 가끔 눈과 몸을 쉬게 하겠다고 다짐했습니다."],"g":"lo"},{"n":17,"ti":"메아리","to":"내가 먼저 고운 말을 하면 고운 말이 돌아온다.","tx":["산꼭대기에 오르면 기분이 좋다.","산에서는 소리를 지르면 안 된다."],"cp":3,"fm":"미괄식","th":["이 이야기의 메아리처럼, 우리 생활에서 비슷한 일이 일어나는 경우는?","내가 친구에게 먼저 다정하게 말하면 친구도 다정하게 대답한다.","친구가 화를 내도 나는 모른다.","산에 가면 항상 비가 온다.","혼자 있으면 심심하다.","메아리가 내 말을 그대로 돌려주듯, 내가 하는 말과 행동은 나에게 돌아와요."],"kw":["메아리","꼭대기","장난","건너편"],"vo":[["곰곰이","여러모로 깊이 생각하는 모양","아주 빠르게","크게 소리 지르며","아무 생각 없이"],["장난삼아","재미로 가볍게 해 보려고","아주 진지하게","화가 나서","무서워서"]],"mi":["아이가 “야호!” 하고 외치자 똑같은 소리가 들려왔다.","“바보야!” 하고 외치자 똑같은 말이 되돌아와 기분이 나빠졌다.","“나는 네가 좋아!”라고 외치자 똑같은 말이 들려와 마음이 따뜻해졌다."],"ks":[],"ev":["아이가 나쁜 말을 듣고 바로 소리치지 않고 생각을 했다는 것을 알 수 있는 문장은?","곰곰이 생각했습니다","3문단 첫 문장에 나와요."],"p":["산에 오른 아이가 꼭대기에서 크게 외쳤습니다. “야호!” 그러자 건너편 산에서도 “야호!”라는 소리가 들려왔습니다.","아이는 장난삼아 다시 외쳤습니다. “바보야!” 그러자 건너편에서도 “바보야!”라는 소리가 되돌아왔습니다. 아이는 기분이 나빠졌습니다.","아이는 잠시 곰곰이 생각했습니다. 그러고는 환하게 웃으며 외쳤습니다. “나는 네가 좋아!” 그러자 건너편에서도 “나는 네가 좋아!”라는 소리가 들려왔습니다. 아이의 마음이 따뜻해졌습니다."],"g":"lo"},{"n":18,"ti":"과학 쇼 안내","to":"두 시에 2층 실험실에서 열리는 거품 과학 쇼를 보러 오세요.","tx":["과학관 1층에는 기념품 가게가 있다.","과학 쇼는 아침에 열린다."],"cp":2,"fm":"중괄식","th":["이 글은 어떤 상황에서 들을 수 있는 말일까요?","과학관에서 방송으로 안내하는 말","학교에서 선생님이 수업하는 말","친구에게 쓴 편지","과학책의 설명","‘찾아 주셔서 감사합니다’, ‘모여 주십시오’ 같은 말로 보아 과학관 안내 방송이에요."],"kw":["과학 쇼","기념품","자리","1층"],"vo":[["한정","수나 양을 정해진 만큼으로 줄여 놓은 것","끝없이 많은 것","아주 비싼 것","새로 만든 것"],["기념품","어떤 곳이나 일을 기억하려고 사는 물건","먹을 음식","입장권","쓰레기"]],"mi":["과학관을 찾아 주셔서 감사하다.","두 시에 2층 실험실에서 거품 과학 쇼가 시작된다.","공연 뒤에 1층에서 직접 실험을 해 볼 수 있다."],"ks":[[2,"잠시 후 두 시부터"]],"ev":["과학 쇼를 보려면 일찍 와야 하는 까닭을 알 수 있는 문장은?","자리가 한정되어","2문단 마지막 문장에 나와요."],"p":["오늘도 우리 과학관을 찾아 주셔서 감사합니다.","잠시 후 두 시부터 2층 실험실에서 ‘거품 과학 쇼’가 시작됩니다. 공연을 보실 분은 2층 실험실 앞으로 모여 주십시오. 자리가 한정되어 있으니 조금 일찍 오시기 바랍니다.","공연이 끝난 뒤에는 1층 기념품 가게 옆에서 직접 거품 실험을 해 볼 수 있습니다. 즐거운 시간 보내시기 바랍니다."],"g":"lo"},{"n":19,"ti":"체험학습 준비물 안내","to":"체험학습 준비물을 잊지 말고 미리 챙기자.","tx":["체험학습은 식물원으로 간다.","준비물은 한 가지뿐이다."],"cp":4,"fm":"미괄식","th":["이 글은 누가 누구에게 하는 말일까요?","선생님이 3학년 어린이들에게 방송으로 알리는 말","어린이가 부모님께 쓴 편지","친구끼리 나누는 대화","식물원 직원의 설명","‘3학년 어린이 여러분, 안녕하세요.’로 시작하고 준비물을 알려 주는 것으로 보아 안내 방송이에요."],"kw":["준비물","식물원","도시락","모자"],"vo":[["관찰","사물을 자세히 살펴보는 것","대충 훑어보는 것","눈을 감는 것","멀리 도망가는 것"],["체험학습","직접 가서 보고 겪으며 배우는 공부","교실에서 시험 보는 것","집에서 쉬는 것","책을 베껴 쓰는 것"]],"mi":["내일 체험학습 준비물을 알려 주겠다.","준비물은 세 가지이다.","도시락과 물병, 공책과 연필, 모자를 챙긴다.","오늘 밤에 가방을 미리 싸 두자."],"ks":[[1,"지금부터 준비물을"]],"ev":["모자를 써야 하는 까닭을 알 수 있는 문장은?","햇볕이 강할 수 있으니","3문단 마지막 문장에 나와요."],"p":["3학년 어린이 여러분, 안녕하세요. 내일은 식물원으로 체험학습을 가는 날입니다. 지금부터 준비물을 알려 드리겠습니다.","준비물은 모두 세 가지입니다.","첫째, 점심 도시락과 물병을 챙겨 옵니다. 둘째, 식물을 관찰하고 적을 수 있도록 공책과 연필을 가져옵니다. 셋째, 햇볕이 강할 수 있으니 모자를 꼭 씁니다.","빠진 준비물이 없도록 오늘 밤에 가방을 미리 싸 두세요."],"g":"lo"},{"n":20,"ti":"알을 지키는 가시고기","to":"가시고기 수컷은 둥지를 짓고 알을 지킨다.","tx":["가시고기는 맑은 냇물에 산다.","가시고기 암컷이 알을 지킨다."],"cp":3,"fm":"미괄식","th":["가시고기가 사는 냇물이 더러워진다면 어떻게 될까요?","맑은 물에 사는 가시고기가 살기 어려워진다.","가시고기가 더 많아진다.","둥지를 더 잘 짓는다.","아무 일도 일어나지 않는다.","1문단에 가시고기는 맑은 냇물에 사는 물고기라고 했어요."],"kw":["가시고기","봄","물풀","부채질"],"vo":[["둥지","새나 동물이 알을 낳거나 사는 곳","물고기의 먹이","강가의 돌","물풀의 뿌리"],["신선하다","새롭고 깨끗하다","오래되고 더럽다","아주 뜨겁다","딱딱하다"]],"mi":["가시고기는 맑은 냇물에 산다.","봄이 되면 수컷이 둥지를 짓는다.","수컷이 남아서 알을 지킨다."],"ks":[[3,"암컷이 둥지에 알을 낳고"]],"ev":["수컷이 알에게 신선한 물을 보내는 방법을 알 수 있는 문장은?","지느러미로 부채질","3문단 마지막 문장에 나와요."],"p":["가시고기는 맑은 냇물에 사는 작은 물고기입니다.","봄이 되면 가시고기 수컷은 물풀을 물어다 둥지를 짓습니다. 가시고기 수컷은 왜 둥지를 지을까요?","암컷이 둥지에 알을 낳고 떠나면, 수컷이 남아서 알을 지킵니다. 수컷은 지느러미로 부채질을 하여 알에 신선한 물을 보내 줍니다."],"g":"lo"},{"n":21,"ti":"교통 규칙","to":"나와 다른 사람의 안전을 위해 교통 규칙을 지키자.","tx":["횡단보도에는 신호등이 있다.","휴대폰을 보며 걸어도 괜찮다."],"cp":3,"fm":"양괄식","th":["신호등이 빨간불인데 길을 건너려는 동생에게 할 말로 알맞은 것은?","“신호를 안 지키면 사고가 날 수 있어. 초록불을 기다리자.”","“차가 없으면 빨리 뛰어가면 돼.”","“빨간불일 때 건너는 게 더 빨라.”","“다른 사람도 건너니까 괜찮아.”","2문단에 신호를 기다리지 않고 건너면 자동차와 부딪칠 수 있다고 했어요."],"kw":["교통 규칙","휴대폰","자동차","실수"],"vo":[["횡단보도","사람이 길을 건널 수 있게 표시해 놓은 곳","차가 서 있는 곳","버스를 기다리는 곳","자전거만 다니는 길"],["안전","위험하지 않고 탈이 없는 것","무섭고 위험한 것","아주 빠른 것","시끄러운 것"]],"mi":["교통 규칙을 지켜야 한다.","규칙을 지키지 않으면 큰 사고가 날 수 있다.","안전을 위해 교통 규칙을 꼭 지키자."],"ks":[[2,"작은 실수 하나가"]],"ev":["길을 걸으면서 휴대폰을 보면 안 되는 까닭을 알 수 있는 문장은?","주변을 살피지 못해","2문단 두 번째 문장에 나와요."],"p":["우리는 교통 규칙을 잘 지켜야 합니다.","횡단보도에서 신호를 기다리지 않고 건너면 달려오는 자동차와 부딪칠 수 있습니다. 또 휴대폰을 보면서 길을 걸으면 주변을 살피지 못해 위험합니다. 작은 실수 하나가 큰 사고로 이어질 수 있습니다.","그러므로 나와 다른 사람의 안전을 위해 교통 규칙을 꼭 지켜야 합니다."],"g":"lo"},{"n":22,"ti":"끝까지 들어 준 서진이","to":"친구의 말을 끝까지 잘 들어 주자.","tx":["나는 가을을 좋아한다.","민재는 겨울을 좋아한다."],"cp":4,"fm":"미괄식","th":["발표하는 친구를 배려하는 듣는 태도로 알맞은 것은?","발표하는 친구를 바라보며 끝까지 듣는다.","연필을 돌리며 딴생각을 한다.","친구 말이 끝나기 전에 끼어든다.","옆 친구와 떠든다.","서진이처럼 끝까지 들어 주는 태도가 말하는 친구에게 힘이 돼요."],"kw":["들어 주기","계절","연필","모둠"],"vo":[["두근거리다","놀라거나 떨려서 가슴이 자꾸 뛰다","졸려서 하품이 나다","배가 고파 꼬르륵하다","추워서 떨리다"],["끼어들다","남의 말이나 일에 중간에 불쑥 들어가다","조용히 기다리다","끝까지 듣다","자리를 떠나다"]],"mi":["용기를 내어 좋아하는 계절을 말하기 시작했다.","친구들이 내 말을 잘 들어 주지 않았다.","서진이 덕분에 끝까지 이야기할 수 있었다.","친구의 말을 끝까지 들어 주는 사람이 되어야겠다."],"ks":[[1,"그래도 용기를 내어"],[4,"나도 서진이처럼"]],"ev":["발표할 차례가 되었을 때 ‘나’의 마음을 알 수 있는 문장은?","가슴이 두근거렸다","1문단 두 번째 문장에 나와요."],"p":["오늘 국어 시간에 모둠별로 좋아하는 계절을 이야기했다. 내 차례가 되자 가슴이 두근거렸다. 그래도 용기를 내어 가을이 좋은 까닭을 말하기 시작했다.","그런데 민재는 내 말이 끝나기도 전에 “겨울이 더 좋아!”라며 끼어들었다. 하윤이는 연필을 돌리며 딴생각을 하는 것 같았다.","속상해서 말을 제대로 끝내지 못했다. 그때 서진이가 “네 이야기 더 듣고 싶어.”라고 말해 주었다. 서진이 덕분에 나는 끝까지 이야기할 수 있었다.","친구의 말을 끝까지 들어 주는 것은 참 고마운 일이다. 나도 서진이처럼 친구 말을 잘 들어 주는 사람이 되어야겠다."],"g":"lo"},{"n":23,"ti":"나눔 책장","to":"다 읽은 책을 나누면 모두가 더 많은 책을 읽을 수 있다.","tx":["준서는 곤충 책을 읽었다.","책은 한 번 읽고 버려야 한다."],"cp":4,"fm":"미괄식","th":["우리 반에 ‘나눔 책장’이 생긴다면 꽂아 두기에 알맞은 것은?","내가 다 읽은 동화책","찢어져 읽을 수 없는 종이","먹다 남은 과자","쓰고 버린 휴지","나눔 책장은 다 읽은 책을 다른 친구와 나누는 곳이에요."],"kw":["나눔 책장","곤충","동화책","교실"],"vo":[["깜빡","잠깐 잊어버리는 모양","아주 오래","또렷하게","천천히"],["설레다","마음이 들떠 두근거리다","몹시 슬프다","무척 졸리다","화가 나다"]],"mi":["다 읽은 책이 새 주인을 만나는 곳","우리 반에는 다 읽은 책을 나누는 나눔 책장이 있다.","책을 잊고 온 준서가 나눔 책장의 책을 읽었다.","나눔 책장이 있어서 우리 반이 더 좋아졌다."],"ks":[[2,"우리 반 교실 뒤에는"],[4,"나눔 책장이 있어서"]],"ev":["준서가 나눔 책장의 책을 읽게 된 까닭을 알 수 있는 문장은?","깜빡 잊고 왔다","3문단 첫 문장에 나와요."],"p":["다 읽은 책이 새 주인을 만나는 곳.","우리 반 교실 뒤에는 ‘나눔 책장’이 있다. 집에서 다 읽은 책을 가져와 꽂아 두면, 누구든 꺼내 읽을 수 있다.","지난주에 준서는 읽을 책을 깜빡 잊고 왔다. 그래서 나눔 책장에서 곤충 책을 골라 읽었다. 준서는 그 책이 정말 재미있었다고 말했다.","나도 어제 다 읽은 동화책을 나눔 책장에 꽂았다. 누가 이 책을 읽을지 생각하니 설렜다. 나눔 책장이 있어서 우리 반이 더 좋아졌다."],"g":"lo"},{"n":24,"ti":"초식 공룡과 육식 공룡","to":"공룡에는 초식 공룡과 육식 공룡이 있었다.","tx":["공룡은 모두 풀을 먹었다.","육식 공룡은 이빨이 날카로웠다."],"cp":1,"fm":"두괄식","th":["초식 공룡이 무리를 지어 다닌 까닭은?","육식 공룡으로부터 몸을 지키려고","풀을 더 많이 먹으려고","육식 공룡을 사냥하려고","잠을 푹 자려고","2문단에 무리를 지어 다니며 육식 공룡으로부터 몸을 지켰다고 했어요."],"kw":["공룡","발톱","나무","목"],"vo":[["초식","풀이나 식물을 먹고 사는 것","고기를 먹고 사는 것","아무것도 먹지 않는 것","물만 마시는 것"],["사냥","산이나 들의 짐승을 잡는 일","풀을 뜯는 일","잠을 자는 일","집을 짓는 일"]],"mi":["공룡에는 초식 공룡과 육식 공룡이 있었다.","초식 공룡의 생활","육식 공룡의 생김새와 사냥"],"ks":[[3,"육식 공룡은 날카로운"]],"ev":["목이 긴 공룡이 무엇을 먹었는지 알 수 있는 문장은?","높은 나무의 잎","2문단 두 번째 문장에 나와요."],"p":["공룡 가운데에는 풀을 먹는 초식 공룡과 고기를 먹는 육식 공룡이 있었습니다.","초식 공룡은 몸집이 큰 것이 많았습니다. 목이 긴 공룡은 높은 나무의 잎을 뜯어 먹었습니다. 또 여럿이 무리를 지어 다니며 육식 공룡으로부터 몸을 지켰습니다.","육식 공룡은 날카로운 이빨과 발톱을 가지고 있었습니다. 빠르게 달려 다른 동물을 사냥했습니다."],"g":"lo"},{"n":25,"ti":"그늘막을 설치해 주세요","to":"놀이터에 그늘막을 설치해 주세요.","tx":["하람이는 3학년이다.","놀이 기구는 겨울에 뜨겁다."],"cp":2,"fm":"중괄식","th":["하람이가 이 편지를 쓴 까닭으로 알맞은 것은?","놀이터에 그늘막을 설치해 달라고 부탁하려고","교장 선생님께 생일 축하를 하려고","놀이터를 없애 달라고 하려고","새 친구를 소개하려고","2문단에 놀이터에 그늘막을 설치해 달라는 부탁이 나와요."],"kw":["그늘막","쉬는 시간","운동장","3학년"],"vo":[["설치","어떤 곳에 기계나 시설을 만들어 두는 것","부수어 없애는 것","깨끗이 청소하는 것","다른 곳으로 옮기는 것"],["달구다","불이나 햇볕으로 뜨겁게 하다","차갑게 식히다","물에 적시다","바람을 쐬다"]],"mi":["하람이의 자기소개","놀이터에 그늘막을 설치해 달라는 부탁","여름에는 놀이 기구가 뜨거워 오래 놀 수 없다.","그늘막이 생기면 안전하게 놀 수 있다."],"ks":[[2,"운동장 놀이터에 그늘막을"],[4,"그늘막이 생기면"]],"ev":["여름에 놀이터에서 오래 놀 수 없는 까닭을 알 수 있는 문장은?","햇볕에 달구어져","3문단 첫 문장에 나와요."],"p":["교장 선생님, 안녕하세요? 저는 3학년 1반 김하람입니다.","교장 선생님께 부탁드릴 것이 있어서 편지를 씁니다. 운동장 놀이터에 그늘막을 설치해 주시면 좋겠습니다.","여름에는 놀이 기구가 햇볕에 달구어져 무척 뜨겁습니다. 그래서 쉬는 시간에 놀이터에서 놀고 싶어도 오래 있을 수가 없습니다.","그늘막이 생기면 더운 날에도 친구들과 안전하게 놀 수 있을 것입니다. 저희의 부탁을 꼭 들어주세요."],"g":"lo"},{"n":26,"ti":"잠이 중요한 까닭","to":"잠은 몸과 머리에 도움이 되니 정해진 시간에 푹 자자.","tx":["잠잘 때 키가 크는 데 도움을 주는 물질이 나온다.","밤늦게까지 게임을 해도 괜찮다."],"cp":1,"fm":"양괄식","th":["이 글을 읽고 실천할 일로 알맞지 않은 것은?","밤늦게까지 휴대폰으로 영상을 본다.","정해진 시간에 잠자리에 든다.","잠을 푹 자고 일어난다.","자기 전에 게임을 멈춘다.","4문단에 밤늦게까지 게임을 하거나 휴대폰을 보지 말라고 했어요."],"kw":["잠","게임","물질","머릿속"],"vo":[["차곡차곡","물건을 가지런히 겹쳐 쌓거나 정리하는 모양","마구 흩어지는 모양","아주 빠르게","한꺼번에 무너지는 모양"],["잠자리에 들다","잠을 자려고 눕다","아침에 일어나다","놀러 나가다","밥을 먹다"]],"mi":["잠을 푹 자야 힘차게 생활할 수 있다.","잠자는 동안 몸이 자란다.","잠은 배운 것을 정리해 공부에 도움이 된다.","정해진 시간에 잠자리에 들자."],"ks":[[1,"잠은 우리 몸과 머리가"],[2,"잠을 자는 동안 우리 몸은"]],"ev":["잠이 공부에 도움이 되는 까닭을 알 수 있는 문장은?","머릿속에 차곡차곡","3문단 두 번째 문장에 나와요."],"p":["잠은 우리 몸과 머리가 쉬는 시간입니다. 잠을 푹 자야 다음 날 힘차게 생활할 수 있습니다.","잠을 자는 동안 우리 몸은 쑥쑥 자랍니다. 키가 크는 데 도움을 주는 물질이 잠잘 때 많이 나오기 때문입니다.","잠은 공부에도 도움이 됩니다. 낮에 배운 것을 머릿속에 차곡차곡 정리해 주기 때문입니다.","그러니 밤늦게까지 게임을 하거나 휴대폰을 보지 말고, 정해진 시간에 잠자리에 드는 것이 좋습니다."],"g":"lo"},{"n":27,"ti":"나의 꿈, 수의사","to":"나는 아픈 동물을 돕는 수의사가 되고 싶다.","tx":["초코는 강아지이다.","수의사는 사람의 병을 고친다."],"cp":1,"fm":"두괄식","th":["글쓴이가 수의사가 되기 위해 하고 있는 일이 아닌 것은?","동물 병원에서 일하기","동물 책 읽기","초코에게 밥 주기","초코 산책시키기","3·4문단에 동물 책을 읽고 초코를 잘 돌보고 있다고 했어요. 동물 병원에서 일한다는 말은 없어요."],"kw":["수의사","산책","봄","밥"],"vo":[["수의사","동물의 병을 치료하는 의사","동물을 파는 사람","사람의 병을 고치는 의사","동물원 청소부"],["정성껏","참된 마음을 다하여","대충 빨리","마지못해","아무렇게나"]],"mi":["나는 수의사가 되고 싶다.","아픈 초코를 치료해 준 수의사를 보고 꿈이 생겼다.","수의사가 되려고 동물 책을 읽는다.","동물을 사랑하는 마음으로 초코를 돌본다."],"ks":[[2,"그때부터 나도 아픈 동물을"],[3,"수의사가 되려면"]],"ev":["글쓴이가 동물을 사랑하는 마음을 기르려고 하는 일을 알 수 있는 문장은?","산책을 시키며","4문단 마지막 문장에 나와요."],"p":["나는 커서 수의사가 되고 싶습니다.","지난봄에 우리 집 강아지 초코가 아파서 동물 병원에 갔습니다. 수의사 선생님께서 초코를 정성껏 치료해 주셨고, 초코는 금방 나았습니다. 그때부터 나도 아픈 동물을 돕고 싶어졌습니다.","수의사가 되려면 동물의 몸에 대해 많이 알아야 합니다. 그래서 요즘 동물 책을 열심히 읽고 있습니다.","또 동물을 사랑하는 마음도 중요합니다. 날마다 초코에게 밥을 주고 산책을 시키며 잘 돌보고 있습니다."],"g":"lo"},{"n":28,"ti":"우리 반 텃밭","to":"우리 반에서 텃밭을 가꾸자.","tx":["상추는 텃밭에서 기를 수 있다.","식물은 책으로만 배우면 된다."],"cp":1,"fm":"두괄식","th":["글쓴이가 텃밭을 가꾸자고 하며 든 까닭이 아닌 것은?","텃밭 채소를 팔아 돈을 벌 수 있다.","식물이 자라는 모습을 직접 볼 수 있다.","친구들과 사이가 좋아진다.","직접 기른 채소를 나누어 먹으면 뿌듯하다.","채소를 판다는 이야기는 글에 나오지 않아요."],"kw":["텃밭","씨앗","상추","풀"],"vo":[["텃밭","집이나 학교 가까이에 있는 작은 밭","넓은 논","높은 산","큰 공원"],["뿌듯하다","기쁨이나 자랑스러움으로 마음이 가득하다","몹시 서운하다","무척 귀찮다","겁이 나다"]],"mi":["우리 반에서 텃밭을 가꾸었으면 좋겠다.","식물이 자라는 모습을 직접 보고 배울 수 있다.","친구들과 사이가 좋아지고 뿌듯함을 느낄 수 있다."],"ks":[[2,"텃밭을 가꾸면 식물이"],[3,"또 친구들과 함께"]],"ev":["식물을 실제로 보며 배우면 좋은 점을 알 수 있는 문장은?","더 오래 기억에","2문단 마지막 문장에 나와요."],"p":["나는 우리 반에서 작은 텃밭을 가꾸었으면 좋겠습니다.","텃밭을 가꾸면 식물이 자라는 모습을 직접 볼 수 있습니다. 씨앗이 싹을 틔우고, 잎이 나고, 열매가 맺히는 과정을 눈으로 확인할 수 있습니다. 책으로만 배우던 것을 실제로 보면 더 오래 기억에 남습니다.","또 친구들과 함께 물을 주고 풀을 뽑다 보면 저절로 사이가 좋아집니다. 직접 기른 상추를 나누어 먹는다면 정말 뿌듯할 것입니다."],"g":"lo"},{"n":29,"ti":"비석치기와 딱지치기","to":"옛날 어린이들이 즐기던 비석치기와 딱지치기 놀이 방법","tx":["딱지는 종이로 만든다.","비석치기는 요즘 새로 생긴 놀이다."],"cp":1,"fm":"두괄식","th":["종이가 한 장도 없을 때 할 수 없는 놀이는?","딱지치기","비석치기","둘 다 할 수 있다","둘 다 할 수 없다","딱지치기는 종이를 접어 만든 딱지가 있어야 해요."],"kw":["놀이","줄","바닥","돌"],"vo":[["납작하다","판판하고 얇다","둥글고 뚱뚱하다","길고 뾰족하다","무르고 말랑하다"],["상대편","놀이나 경기에서 맞서는 쪽","같은 편","구경하는 사람","심판"]],"mi":["비석치기와 딱지치기를 알아보자.","비석치기 놀이 방법","딱지치기 놀이 방법"],"ks":[[2,"비석치기는 납작한 돌을"],[3,"딱지치기는 종이를 접어"]],"ev":["딱지치기에서 이기면 무엇을 얻는지 알 수 있는 문장은?","그 딱지를 가져갈","3문단 마지막 문장에 나와요."],"p":["옛날 어린이들은 주변에 있는 물건으로 재미있는 놀이를 만들어 즐겼습니다. 그중 비석치기와 딱지치기를 알아봅시다.","비석치기는 납작한 돌을 던져 상대편의 돌을 쓰러뜨리는 놀이입니다. 먼저 땅에 줄을 긋고 상대편 돌을 세워 둡니다. 그다음 떨어진 곳에서 내 돌을 던져 상대편 돌을 맞혀 쓰러뜨리면 이깁니다.","딱지치기는 종이를 접어 만든 딱지를 쳐서 넘기는 놀이입니다. 내 딱지로 바닥에 놓인 상대편 딱지를 세게 내리칩니다. 상대편 딱지가 뒤집히면 그 딱지를 가져갈 수 있습니다."],"g":"lo"},{"n":30,"ti":"물건을 아껴 쓰자","to":"학용품을 소중히 여기고 아껴 쓰자.","tx":["연필은 나무로 만든다.","학용품은 잃어버리면 새로 사면 된다."],"cp":3,"fm":"미괄식","th":["글쓴이와 같은 생각을 가진 친구는?","“연필이 짧아져도 끝까지 아껴 쓸래.”","“지우개는 잃어버리면 또 사면 돼.”","“새 연필이 좋으니 자주 바꾸자.”","“이름은 안 써도 괜찮아.”","글쓴이는 물건에 이름을 쓰고 짧아질 때까지 아껴 써야 한다고 했어요."],"kw":["아껴 쓰기","흑연","지우개","쓰레기"],"vo":[["수고","일을 하느라 애쓰는 것","쉬는 것","노는 것","잠자는 것"],["흑연","연필심을 만드는 검은 재료","지우개를 만드는 재료","공책 종이","색연필의 물감"]],"mi":["학용품을 잃어버려도 찾지 않는 친구들이 있다.","물건 하나에도 재료와 수고가 들고, 버리면 쓰레기가 는다.","물건에 이름을 쓰고 아껴 써야 한다."],"ks":[[1,"요즘 우리 반에는"],[2,"하지만 연필 한 자루를"]],"ev":["물건을 쉽게 버리면 생기는 문제를 알 수 있는 문장은?","쓰레기도 그만큼","2문단 마지막 문장에 나와요."],"p":["요즘 우리 반에는 연필이나 지우개를 잃어버려도 찾지 않는 친구들이 있다. 새로 사면 된다고 생각하기 때문이다.","하지만 연필 한 자루를 만들려면 나무와 흑연 같은 재료와 많은 사람의 수고가 필요하다. 물건을 쉽게 버리면 쓰레기도 그만큼 늘어난다.","나는 물건에 이름을 쓰고, 짧아질 때까지 아껴 써야 한다고 생각한다."],"g":"lo"},{"n":31,"ti":"하은이의 다짐","to":"게임은 시간을 정해서 조금만 하자.","tx":["하은이는 게임을 좋아한다.","게임은 아예 하면 안 된다."],"cp":3,"fm":"미괄식","th":["하은이가 다짐을 잘 지키려면 어떻게 하면 좋을까요?","타이머를 30분에 맞추고 게임을 한다.","숙제를 미루고 게임부터 한다.","밤늦게 몰래 한다.","게임 시간을 매일 늘린다.","3문단에 게임을 하루 30분만 하고 숙제를 먼저 끝내기로 다짐했어요."],"kw":["게임","태블릿","눈","숙제"],"vo":[["피로하다","몸이나 마음이 지쳐 힘들다","기운이 넘치다","배가 부르다","기분이 좋다"],["미루다","할 일을 나중으로 넘기다","먼저 끝내다","열심히 하다","도와주다"]],"mi":["하은이는 게임을 자주 한다.","화면을 오래 보면 좋지 않은 점이 많다.","하은이는 게임을 30분만 하기로 다짐했다."],"ks":[[1,"하은이는 태블릿으로"],[2,"화면을 오래 보면"]],"ev":["게임을 오래 하면 노는 시간에 생기는 문제를 알 수 있는 문장은?","뛰어놀 시간이","2문단 마지막 문장에 나와요."],"p":["하은이는 태블릿으로 게임을 자주 합니다. 그런데 엄마는 게임을 조금만 하라고 하십니다.","하은이가 까닭을 여쭈어 보았더니, 화면을 오래 보면 눈이 쉽게 피로해지고 해야 할 일을 미루게 된다고 하셨습니다. 또 밖에서 뛰어놀 시간이 줄어든다고 하셨습니다.","그래서 하은이는 게임을 하루에 30분만 하고, 숙제를 먼저 끝내기로 다짐했습니다."],"g":"lo"},{"n":32,"ti":"바닷가에서 생긴 일","to":"쓰레기를 함부로 버리지 말고 자기 쓰레기는 가져가자.","tx":["수아는 모래성을 쌓고 싶었다.","바닷가에는 게가 많이 산다."],"cp":3,"fm":"미괄식","th":["바위 틈에서 게를 찾기 어려웠던 까닭으로 가장 알맞게 짐작한 것은?","쓰레기가 많아 게가 살기 어려워졌기 때문에","겨울이라 게가 잠을 자서","수아가 너무 시끄러워서","바닷물이 모두 말라서","2문단에 바위 틈에도 비닐이 끼어 있었고, 수아는 게들을 걱정했어요."],"kw":["쓰레기","모래성","집게","일기장"],"vo":[["모래사장","모래가 넓게 깔린 바닷가","바닷물 속","높은 절벽","작은 섬"],["굴러다니다","여기저기 이리저리 뒹굴다","한곳에 가만히 있다","하늘로 날아가다","물에 가라앉다"]],"mi":["수아는 설레는 마음으로 바닷가에 갔다.","바닷가에 쓰레기가 많아 게들이 걱정되었다.","쓰레기를 줍고, 모두 자기 쓰레기를 가져가자고 적었다."],"ks":[[2,"그런데 모래사장에 도착하니"],[3,"모두가 자기 쓰레기를"]],"ev":["수아네 가족이 바닷가를 위해 한 일을 알 수 있는 문장은?","집게와 봉투를","3문단 첫 문장에 나와요."],"p":["여름 방학에 수아는 가족과 함께 바닷가에 갔습니다. 파도 소리를 들으며 모래성을 쌓을 생각에 가슴이 설렜습니다.","그런데 모래사장에 도착하니 과자 봉지와 페트병이 여기저기 굴러다녔습니다. 게를 찾으려고 바위 틈을 들여다보았더니, 그곳에도 비닐이 끼어 있었습니다. 수아는 게들이 어디로 갔을지 걱정이 되었습니다.","수아네 가족은 집게와 봉투를 빌려 쓰레기를 주웠습니다. 집에 돌아와 수아는 일기장에 이렇게 적었습니다. 모두가 자기 쓰레기를 가져가면 바다가 다시 깨끗해질 거예요."],"g":"lo"},{"n":33,"ti":"물 마시기","to":"음료수보다 물을 자주 마시자.","tx":["체육 시간 뒤에 물을 마신다.","음료수가 물보다 몸에 좋다."],"cp":3,"fm":"미괄식","th":["운동을 하고 목이 마른 동생에게 글쓴이가 할 만한 말은?","“달콤한 음료수 말고 시원한 물을 마셔 봐.”","“목이 말라도 참아.”","“탄산음료를 많이 마셔.”","“물은 아침에만 마시는 거야.”","글쓴이는 음료수보다 물을 자주 마시는 것이 좋다고 했어요."],"kw":["물","체육","컵","땀"],"vo":[["개운하다","기분이나 몸이 가뿐하고 상쾌하다","몸이 무겁고 답답하다","배가 아프다","졸리다"],["음료수","마시려고 만든 달거나 향이 있는 물","아무것도 넣지 않은 맹물","국물","약"]],"mi":["나는 하루에 물을 여러 번 마신다.","물을 마시면 몸이 개운하고 힘이 난다.","음료수보다 물을 자주 마시는 것이 좋다."],"ks":[[1,"나는 하루에 물을"],[2,"물을 마시면 몸이"]],"ev":["글쓴이가 체육 시간 뒤에 하는 일을 알 수 있는 문장은?","물병을 꺼냅니다","1문단 두 번째 문장에 나와요."],"p":["나는 하루에 물을 여러 번 마십니다. 아침에 일어나면 물 한 컵을 마시고, 체육 시간이 끝나면 물병을 꺼냅니다.","물을 마시면 몸이 개운해집니다. 땀을 흘린 뒤에도 물을 마시면 다시 힘이 납니다.","나는 음료수보다 물을 자주 마시는 것이 좋다고 생각합니다."],"g":"lo"},{"n":34,"ti":"여러 가지 눈 이름","to":"조상들은 눈의 모양과 내리는 때를 살펴 여러 가지 눈 이름을 붙였다.","tx":["함박눈은 굵게 내린다.","눈은 모두 같은 이름으로 부른다."],"cp":4,"fm":"양괄식","th":["아침에 일어나 보니 밤사이 몰래 눈이 소복이 쌓여 있었어요. 이 눈을 무엇이라고 부를까요?","도둑눈","함박눈","싸라기눈","가랑눈","3문단에 밤사이 아무도 모르게 내린 눈을 도둑눈이라고 한다고 했어요."],"kw":["눈 이름","쌀알","비","밤사이"],"vo":[["탐스럽다","마음이 끌릴 만큼 보기 좋다","보기 싫고 지저분하다","아주 작고 초라하다","무섭고 사납다"],["살피다","주의하여 자세히 보다","눈을 감다","대충 넘기다","잊어버리다"]],"mi":["눈을 부르는 이름이 여러 가지 있다.","가늘거나 작게 내리는 눈의 이름","굵게 내리는 눈과 밤사이 내린 눈의 이름","조상들은 눈을 잘 살펴 알맞은 이름을 붙였다."],"ks":[[1,"우리말에는 눈을 부르는"]],"ev":["비와 섞여 내리는 눈의 이름을 알 수 있는 문장은?","진눈깨비","2문단 마지막 문장에 나와요."],"p":["우리말에는 눈을 부르는 이름이 여러 가지 있습니다. 눈이 내리는 모양이나 때를 보고 이름을 붙였습니다.","가늘게 조금씩 내리는 눈은 가랑눈이라고 합니다. 쌀알처럼 작고 단단하게 내리는 눈은 싸라기눈이라고 합니다. 비와 섞여서 내리는 눈은 진눈깨비라고 부릅니다.","굵고 탐스럽게 펑펑 내리는 눈은 함박눈이라고 합니다. 밤사이 아무도 모르게 내린 눈은 도둑눈이라고 부릅니다.","이처럼 우리 조상들은 눈의 모양과 내리는 때를 잘 살펴 알맞은 이름을 붙였습니다."],"g":"lo"},{"n":35,"ti":"아빠의 부탁","to":"물건을 쓴 뒤에는 제자리에 두는 습관을 기르자.","tx":["민호는 동생에게 양보했다.","방이 어지러워도 괜찮다."],"cp":3,"fm":"미괄식","th":["아빠가 민호에게 이 편지를 쓴 까닭으로 가장 알맞은 것은?","물건을 제자리에 두는 습관을 기르길 바라서","민호에게 선물을 주고 싶어서","민호가 학교에 늦어서 혼내려고","동생과 싸우지 말라고 하려고","3문단에 물건을 쓴 뒤 제자리에 두는 습관을 기르면 좋겠다고 부탁했어요."],"kw":["제자리","장난감","공책","잔소리"],"vo":[["양보","자기 것을 남에게 먼저 내어 주는 것","남의 것을 빼앗는 것","혼자 차지하는 것","숨기는 것"],["흩어지다","한데 모여 있던 것이 여기저기 퍼지다","가지런히 모이다","깨끗이 정리되다","사라지다"]],"mi":["동생에게 양보한 민호가 대견했다.","방이 어지러워 물건을 찾기 힘들었다.","물건을 제자리에 두는 습관을 기르자."],"ks":[[1,"아빠는 그 모습이"],[3,"물건을 쓴 뒤에는 제자리에"]],"ev":["방이 어지러워서 생긴 곤란한 일을 알 수 있는 문장은?","숙제 공책을 찾느라","2문단 마지막 문장에 나와요."],"p":["민호야, 오늘 아침 네가 동생에게 장난감을 먼저 양보하는 모습을 보았단다. 아빠는 그 모습이 참 대견했어.","그런데 오늘은 한 가지 부탁을 하고 싶구나. 요즘 네 방에 옷과 책이 여기저기 흩어져 있더라. 어제는 숙제 공책을 찾느라 학교에 늦을 뻔했지?","민호야, 물건을 쓴 뒤에는 제자리에 두는 습관을 기르면 좋겠다. 그러면 필요한 물건을 금방 찾을 수 있고, 방도 훨씬 넓어 보인단다. 아빠 말을 잔소리로 듣지 말고, 너를 아끼는 마음으로 들어 주렴."],"g":"lo"},{"n":36,"ti":"새콤달콤 딸기","to":"딸기는 맛과 영양이 풍부한 과일이다.","tx":["딸기 겉에는 씨가 박혀 있다.","딸기는 꼭지를 먼저 떼고 씻어야 한다."],"cp":1,"fm":"두괄식","th":["딸기를 맛있게 먹으려면 어떻게 씻는 것이 좋을까요?","꼭지를 떼기 전에 흐르는 물에 가볍게 씻는다.","꼭지를 먼저 떼고 물에 오래 담가 둔다.","씻지 않고 먹는다.","뜨거운 물에 삶는다.","3문단에 꼭지를 떼기 전에 흐르는 물에 가볍게 씻는 것이 좋다고 했어요."],"kw":["딸기","꼭지","알갱이","물"],"vo":[["풍부하다","넉넉하게 많다","아주 적다","전혀 없다","딱 맞다"],["싱겁다","맛이 진하지 않고 밍밍하다","아주 짜다","맵다","쓰다"]],"mi":["딸기는 맛과 영양이 풍부한 과일이다.","딸기에는 비타민 C가 많다.","딸기의 씨와 딸기를 씻는 방법"],"ks":[[2,"딸기에는 비타민 C가"]],"ev":["딸기 겉의 작은 알갱이가 무엇인지 알 수 있는 문장은?","작은 알갱이는","3문단 첫 문장에 나와요."],"p":["빨갛고 새콤달콤한 딸기는 많은 어린이가 좋아하는 과일입니다. 딸기는 맛뿐 아니라 영양도 풍부합니다.","딸기에는 비타민 C가 많이 들어 있습니다. 딸기 몇 알만 먹어도 하루에 필요한 비타민 C를 꽤 많이 얻을 수 있습니다. 비타민 C는 우리 몸이 건강하게 지내도록 돕습니다.","딸기 겉에 콕콕 박힌 작은 알갱이는 딸기의 씨입니다. 딸기를 먹을 때에는 꼭지를 떼기 전에 흐르는 물에 가볍게 씻는 것이 좋습니다. 꼭지를 먼저 떼면 씻는 물이 속으로 들어가 맛이 싱거워지기 때문입니다."],"g":"lo"},{"n":37,"ti":"차례 지키기","to":"줄을 설 때는 차례를 꼭 지켜야 한다.","tx":["태오는 친구 옆에 서고 싶었다.","급식은 점심시간에 받는다."],"cp":3,"fm":"미괄식","th":["태오가 친구와 함께 서고 싶을 때 어떻게 했어야 할까요?","친구와 함께 줄 맨 뒤로 가서 선다.","친구 앞에 끼어든다.","줄을 무시하고 먼저 받는다.","다른 친구를 밀어낸다.","글쓴이는 까닭이 있어도 새치기는 잘못이고 차례를 지켜야 한다고 했어요."],"kw":["차례","급식","친구","이야기"],"vo":[["새치기","차례를 어기고 남의 앞에 끼어드는 것","줄 맨 뒤에 서는 것","차례를 양보하는 것","줄을 세우는 것"],["억울하다","잘못한 것 없이 손해를 보아 속상하다","기쁘고 즐겁다","배가 부르다","편안하다"]],"mi":["태오가 급식 줄에서 새치기를 했다.","까닭이 있어도 새치기는 잘못이다.","차례를 꼭 지켜야 한다."],"ks":[[1,"그런데 태오가 친구와"],[2,"친구 옆에 서고 싶은 마음은"]],"ev":["새치기를 당한 사람의 마음을 알 수 있는 문장은?","억울한 마음이","2문단 두 번째 문장에 나와요."],"p":["점심시간에 급식을 받으려고 줄을 서 있었습니다. 그런데 태오가 친구와 이야기하다가 내 앞에 쓱 끼어들었습니다. 태오는 친구 옆에 서고 싶었다고 말했습니다.","친구 옆에 서고 싶은 마음은 알지만, 새치기는 잘못입니다. 먼저 와서 기다린 사람은 억울한 마음이 듭니다. 그리고 한 사람이 새치기를 하면 줄이 엉망이 됩니다.","나는 차례를 꼭 지켜야 한다고 생각합니다."],"g":"lo"},{"n":38,"ti":"나라마다 다른 식사 예절","to":"나라마다 밥을 먹는 예절이 다르다.","tx":["일본 사람들은 젓가락을 쓴다.","밥 먹는 예절은 모든 나라가 똑같다."],"cp":1,"fm":"두괄식","th":["일본에서 온 친구와 밥을 먹는데, 친구가 밥그릇을 들고 먹어요. 알맞은 생각은?","일본에서는 밥그릇을 들고 먹는 것이 예절이구나.","예절이 없는 행동이니 하지 말라고 한다.","밥그릇을 빼앗는다.","못 본 척하고 자리를 옮긴다.","3문단에 일본에서는 밥그릇을 들고 먹는 것이 예절이라고 했어요."],"kw":["식사 예절","젓가락","국","오른손"],"vo":[["예절","사람 사이에 지켜야 할 바른 태도나 방법","맛있는 음식","식사 시간","그릇의 모양"],["집다","손가락이나 젓가락으로 물건을 잡다","던지다","쏟다","숨기다"]],"mi":["나라마다 식사 예절이 다르다.","우리나라의 식사 예절","일본의 식사 예절","인도의 식사 예절"],"ks":[[2,"우리나라 사람들은 숟가락과"],[3,"일본 사람들은 주로"]],"ev":["인도에서 손으로 먹을 때 어느 손을 쓰는지 알 수 있는 문장은?","오른손을 쓰는","4문단 마지막 문장에 나와요."],"p":["나라마다 밥을 먹는 예절이 다릅니다. 어떻게 다른지 알아볼까요?","우리나라 사람들은 숟가락과 젓가락을 함께 씁니다. 밥과 국은 숟가락으로 먹고, 반찬은 젓가락으로 집습니다. 밥그릇은 상 위에 놓은 채로 먹습니다.","일본 사람들은 주로 젓가락을 씁니다. 밥그릇을 손에 들고 입 가까이 가져가서 먹는 것이 예절입니다.","인도의 여러 지역에서는 손으로 음식을 먹기도 합니다. 이때에는 오른손을 쓰는 것이 예절입니다."],"g":"lo"},{"n":39,"ti":"여름 과일 수박","to":"여름 과일인 수박의 원산지와 생김새, 좋은 점","tx":["수박 속은 빨갛다.","수박은 겨울 과일이다."],"cp":1,"fm":"두괄식","th":["여름에 땀을 많이 흘린 뒤 수박을 먹으면 좋은 까닭은?","수박은 대부분이 물이라 목마름을 달래 주기 때문에","수박 껍질이 초록색이기 때문에","수박이 아프리카에서 왔기 때문에","수박에 줄무늬가 있기 때문에","3문단에 수박은 대부분이 물이라 목마름을 달래 준다고 했어요."],"kw":["수박","아프리카","줄무늬","조각"],"vo":[["원산지","동식물이 처음 나서 자란 곳","물건을 파는 곳","과일을 보관하는 곳","과일을 먹는 계절"],["달래다","괴롭거나 불편한 것을 가라앉히다","더 심하게 하다","깜짝 놀라게 하다","화나게 하다"]],"mi":["여름 과일인 수박에 대해 알아보자.","수박의 원산지와 생김새","수박의 좋은 점과 잘 익은 수박 고르기"],"ks":[[1,"여름 과일인 수박에"],[3,"수박은 대부분이 물로"]],"ev":["잘 익은 수박을 고르는 방법을 알 수 있는 문장은?","통통 튀는 소리","3문단 마지막 문장에 나와요."],"p":["무더운 여름, 시원한 수박 한 조각이면 더위가 싹 달아납니다. 여름 과일인 수박에 대해 알아봅시다.","수박은 아프리카에서 처음 자랐다고 알려져 있습니다. 둥글고 커다란 열매는 초록 껍질에 검은 줄무늬가 있고, 속은 빨갛습니다.","수박은 대부분이 물로 되어 있습니다. 그래서 땀을 많이 흘리는 여름에 먹으면 목마름을 달래 줍니다. 잘 익은 수박은 두드렸을 때 맑고 통통 튀는 소리가 난다고 합니다."],"g":"lo"},{"n":40,"ti":"복도에서는 천천히","to":"다치지 않으려면 복도에서는 오른쪽으로 천천히 걸어야 한다.","tx":["소연이는 쉬는 시간에 복도를 걸었다.","복도에서는 빨리 뛰는 것이 좋다."],"cp":2,"fm":"미괄식","th":["복도 모퉁이에서 특히 조심해야 하는 까닭은?","앞이 잘 보이지 않아 부딪치기 쉬워서","모퉁이가 미끄러워서","모퉁이에 선생님이 계셔서","모퉁이는 넓어서","2문단에 모퉁이에서는 앞이 잘 보이지 않아 부딪치기 쉽다고 했어요."],"kw":["복도","회의","무릎","쉬는 시간"],"vo":[["모퉁이","구부러지거나 꺾어진 곳의 가장자리","넓은 운동장 가운데","계단 맨 위","교실 안쪽"],["학급 회의","반 친구들이 모여 함께 의논하는 시간","시험 보는 시간","점심시간","방과 후 놀이"]],"mi":["복도에서 부딪칠 뻔한 소연이는 다치지 않는 방법을 생각했다.","복도에서는 오른쪽으로 천천히 걷자고 말하기로 했다."],"ks":[[1,"깜짝 놀란 소연이는"],[2,"그래서 소연이는 학급 회의"]],"ev":["복도에서 실제로 다친 일이 있었다는 것을 알 수 있는 문장은?","무릎을 다쳤습니다","2문단 세 번째 문장에 나와요."],"p":["소연이는 쉬는 시간에 복도를 걷다가 뛰어오던 친구와 부딪칠 뻔했습니다. 깜짝 놀란 소연이는 어떻게 하면 복도에서 다치는 일을 막을 수 있을지 생각해 보았습니다.","소연이는 먼저 복도에서는 뛰지 말고 오른쪽으로 걸어야 한다고 생각했습니다. 모퉁이에서는 앞이 잘 보이지 않아서 부딪치기 쉽기 때문입니다. 실제로 지난달에는 옆 반 친구가 모퉁이에서 부딪쳐 무릎을 다쳤습니다. 그래서 소연이는 학급 회의 시간에 복도에서는 오른쪽으로 천천히 걷자고 말하기로 했습니다."],"g":"lo"},{"n":41,"ti":"고슴도치","to":"고슴도치의 생김새와 특징","tx":["고슴도치는 밤에 움직인다.","고슴도치는 적을 만나면 빨리 도망친다."],"cp":0,"fm":"병렬식","th":["고슴도치가 사는 풀숲의 낙엽을 모두 치워 버리면 어떤 일이 생길까요?","고슴도치가 겨울잠을 잘 곳을 잃는다.","고슴도치가 더 많아진다.","고슴도치가 낮에 움직인다.","고슴도치의 가시가 길어진다.","4문단에 고슴도치는 낙엽 속에 들어가 겨울잠을 잔다고 했어요."],"kw":["고슴도치","코끝","굴","봄"],"vo":[["빽빽이","사이가 촘촘하게 꽉 차게","드문드문","하나도 없이","아주 크게"],["사방","동서남북 모든 쪽","한쪽 방향","하늘 위","땅속"]],"mi":["가시가 빽빽한 고슴도치의 생김새","적을 만났을 때 몸을 공처럼 마는 고슴도치","밤에 움직이며 벌레를 먹는 고슴도치","겨울잠을 자는 고슴도치"],"ks":[[2,"고슴도치는 적을 만나면"],[3,"고슴도치는 주로 밤에"]],"ev":["고슴도치가 무엇을 먹는지 알 수 있는 문장은?","벌레를 찾아","3문단 두 번째 문장에 나와요."],"p":["고슴도치는 등에 뾰족한 가시가 빽빽이 나 있는 작은 동물입니다. 얼굴은 작고 코끝이 뾰족하며, 눈은 까맣고 동그랗습니다.","고슴도치는 적을 만나면 몸을 공처럼 동그랗게 맙니다. 그러면 가시가 사방으로 서서 적이 쉽게 다가오지 못합니다.","고슴도치는 주로 밤에 움직입니다. 낮에는 풀숲이나 굴에 숨어 쉬다가, 어두워지면 나와서 벌레를 찾아 먹습니다.","추운 겨울이 되면 고슴도치는 낙엽 속에 들어가 겨울잠을 잡니다. 그리고 따뜻한 봄이 오면 다시 깨어납니다."],"g":"lo"},{"n":42,"ti":"만약 시계가 없다면?","to":"시계는 우리 생활에 꼭 필요하다.","tx":["시계를 보고 아침에 일어난다.","시계는 없어도 불편하지 않다."],"cp":4,"fm":"미괄식","th":["친구와 놀이터에서 만나기로 할 때 시계가 있으면 좋은 점은?","만날 시간을 정하고 서로 제때 나올 수 있다.","놀이터 위치를 알 수 있다.","날씨를 알 수 있다.","놀이 기구를 고칠 수 있다.","3문단에 시계가 없으면 약속해도 언제 가야 할지 모른다고 했어요."],"kw":["시계","만화","놀이터","수업"],"vo":[["확인","틀림없는지 알아보거나 살펴보는 것","잊어버리는 것","감추는 것","미루는 것"],["곤란하다","어떻게 해야 할지 몰라 난처하다","아주 쉽고 편하다","무척 신나다","배가 부르다"]],"mi":["시계가 없다면 어떤 일이 생길까?","학교생활이 어려워진다.","집에서도 불편한 일이 생긴다.","시계는 우리 생활에 꼭 필요하다."],"ks":[[1,"만약에 시계가 없다면"],[2,"시계가 없다면 모두가"]],"ev":["시계가 없으면 쉬는 시간에 생기는 문제를 알 수 있는 문장은?","쉬는 시간이 언제 끝나는지","2문단 마지막 문장에 나와요."],"p":["아침마다 우리는 시계를 보고 일어납니다. 학교에 늦지 않으려고 시계를 확인하고, 좋아하는 만화가 시작하는 시간도 시계로 압니다. 만약에 시계가 없다면 어떤 일이 생길까요?","먼저 학교생활부터 생각해 봅시다. 시계가 없다면 모두가 같은 시간에 수업을 시작하기 어렵습니다. 쉬는 시간이 언제 끝나는지도 알 수 없습니다.","집에서도 불편한 일이 생깁니다. 엄마는 밥을 얼마나 끓여야 할지 몰라 곤란하실 것입니다. 친구와 놀이터에서 만나기로 약속해도 서로 언제 가야 할지 모릅니다.","이처럼 시계는 우리가 함께 생활하는 데 꼭 필요한 물건입니다."],"g":"lo"},{"n":43,"ti":"세계 여러 나라의 집","to":"여러 나라의 집에는 그곳의 자연에 맞춘 지혜가 담겨 있다.","tx":["이글루는 눈으로 만든다.","세계의 집은 모두 모양이 같다."],"cp":4,"fm":"미괄식","th":["비가 아주 많이 오는 마을에 집을 짓는다면 어떻게 짓는 것이 좋을까요?","기둥을 세워 땅에서 높이 띄워 짓는다.","눈으로 벽돌을 만들어 짓는다.","땅을 깊이 파고 그 안에 짓는다.","창문을 모두 막아 짓는다.","2문단에 비가 많이 오는 곳에서는 기둥을 세워 집을 높이 띄워 짓는다고 했어요."],"kw":["집","기둥","이글루","벽돌"],"vo":[["지혜","사물의 이치를 깨닫고 잘 처리하는 슬기","힘센 팔","많은 돈","큰 목소리"],["축축하다","물기가 있어 조금 젖은 듯하다","바짝 마르다","아주 뜨겁다","딱딱하다"]],"mi":["사람들은 날씨와 땅에 알맞게 집을 지었다.","비가 많은 곳의 높이 띄운 집","추운 곳의 눈으로 만든 이글루","집에는 그곳 사람들의 지혜가 담겨 있다."],"ks":[[1,"사람들은 그곳의 날씨와"],[4,"이렇게 집의 모양에는"]],"ev":["이글루 안이 어떤지 알 수 있는 문장은?","바깥보다 따뜻합니다","3문단 마지막 문장에 나와요."],"p":["세계 여러 나라에는 모양이 서로 다른 집들이 있습니다. 사람들은 그곳의 날씨와 땅에 알맞게 집을 지었습니다.","비가 많이 오고 땅이 축축한 곳에서는 기둥을 세워 집을 땅에서 높이 띄워 짓습니다. 그러면 집 안으로 물이 들어오지 않고, 바람도 잘 통합니다.","몹시 추운 북쪽 지방에서는 눈을 벽돌처럼 잘라 쌓아 이글루를 만들기도 합니다. 눈으로 만든 집이지만 안은 바깥보다 따뜻합니다.","이렇게 집의 모양에는 그곳 사람들의 지혜가 담겨 있습니다. 여러 나라의 집을 살펴보면 그 나라의 자연과 생활을 더 잘 알 수 있습니다."],"g":"lo"},{"n":44,"ti":"손 씻기","to":"병을 막으려면 손을 깨끗이 씻어야 한다.","tx":["문손잡이에 세균이 있을 수 있다.","손은 물로만 대충 씻어도 된다."],"cp":1,"fm":"두괄식","th":["손을 가장 꼼꼼히 씻은 친구는?","손가락 사이와 손톱 밑까지 비누로 문지른 민서","손바닥만 물에 적신 준우","비누 없이 물만 뿌린 하린","손등만 닦은 도현","3문단에 손바닥, 손등, 손가락 사이, 손톱 밑까지 꼼꼼히 문질러야 한다고 했어요."],"kw":["손 씻기","배탈","휴대폰","거품"],"vo":[["세균","눈에 보이지 않을 만큼 작은 생물로 병을 일으키기도 하는 것","깨끗한 물","비누 거품","손톱 밑의 때"],["헹구다","물에 넣어 흔들어 거품이나 더러운 것을 빼다","비누칠을 하다","말리다","문지르다"]],"mi":["손 씻기는 병을 막는 쉬운 방법이다.","손에 붙은 세균이 몸속으로 들어갈 수 있다.","손을 꼼꼼히 씻는 방법과 씻어야 할 때"],"ks":[[1,"바로 손을 깨끗이"]],"ev":["손을 씻은 뒤 마무리로 하는 일을 알 수 있는 문장은?","흐르는 물에 깨끗이","3문단 두 번째 문장에 나와요."],"p":["감기나 배탈을 막는 가장 쉬운 방법이 있습니다. 바로 손을 깨끗이 씻는 것입니다.","우리 손은 하루 종일 여러 물건을 만집니다. 문손잡이, 책상, 휴대폰에는 눈에 보이지 않는 세균이 붙어 있을 수 있습니다. 이런 손으로 눈이나 입을 만지면 세균이 몸속으로 들어갈 수 있습니다.","손을 씻을 때에는 비누 거품을 내어 손바닥, 손등, 손가락 사이, 손톱 밑까지 꼼꼼히 문질러야 합니다. 그리고 흐르는 물에 깨끗이 헹굽니다. 밖에서 돌아왔을 때, 밥을 먹기 전, 화장실을 다녀온 뒤에는 꼭 손을 씻읍시다."],"g":"lo"},{"n":45,"ti":"‘괜찮아’의 여러 가지 뜻","to":"‘괜찮아’는 상황에 따라 여러 가지 뜻으로 쓰인다.","tx":["넘어진 친구에게 괜찮냐고 물을 수 있다.","‘괜찮아’는 한 가지 뜻만 있다."],"cp":1,"fm":"두괄식","th":["엄마가 “과자 더 줄까?” 하고 물으셨을 때 내가 “괜찮아요.”라고 대답했다면, 무슨 뜻일까요?","더 먹지 않겠다는 뜻","과자가 맛있다는 뜻","엄마를 걱정하는 뜻","엄마를 용서한다는 뜻","2문단에 무엇을 더 먹겠냐는 물음에 ‘괜찮아’라고 하면 사양한다는 뜻이 된다고 했어요."],"kw":["괜찮아","간식","발","실수"],"vo":[["사양","겸손하게 받지 않거나 응하지 않는 것","기쁘게 받는 것","크게 화내는 것","몰래 가져가는 것"],["용서","잘못을 꾸짖거나 벌하지 않고 덮어 주는 것","끝까지 탓하는 것","벌을 주는 것","모른 척하는 것"]],"mi":["‘괜찮아’는 여러 가지 뜻으로 쓰인다.","상황에 따라 달라지는 ‘괜찮아’의 뜻"],"ks":[[1,"이 말은 짧지만"]],"ev":["‘괜찮아’로 걱정하는 마음을 전할 수 있다는 것을 알 수 있는 문장은?","걱정하는 마음을","2문단 두 번째 문장에 나와요."],"p":["‘괜찮아’라는 말을 들어 본 적 있나요? 이 말은 짧지만 여러 가지 뜻으로 쓰입니다.","친구가 실수로 내 발을 밟고 사과했을 때 ‘괜찮아’라고 하면 용서한다는 뜻이 됩니다. 넘어진 친구에게 ‘괜찮아?’라고 물으면 걱정하는 마음을 전할 수 있습니다. 그리고 간식을 더 먹겠냐는 물음에 ‘괜찮아’라고 하면 사양한다는 뜻이 되기도 합니다."],"g":"lo"},{"n":46,"ti":"구수한 된장","to":"친구들이 된장의 구수한 맛을 알고 즐겨 먹었으면 좋겠다.","tx":["된장은 콩으로 만든다.","된장은 요즘 새로 생긴 음식이다."],"cp":3,"fm":"미괄식","th":["된장을 싫어하는 지안이에게 글쓴이가 권하며 할 말로 알맞은 것은?","“된장찌개는 맛이 구수하고 채소랑도 잘 어울려.”","“된장은 옛날 음식이라 맛이 없어.”","“햄만 먹으면 돼.”","“된장은 외국 음식이야.”","2문단에 된장을 넣으면 맛이 구수해지고 채소와도 잘 어울린다고 했어요."],"kw":["된장","메주","쌈","지안"],"vo":[["구수하다","누룽지처럼 입맛 당기는 좋은 맛이나 냄새가 나다","아주 맵다","시큼하다","쓰다"],["익히다","음식을 알맞은 맛이 들도록 오래 두거나 열을 가하다","날것 그대로 두다","얼리다","버리다"]],"mi":["된장은 조상들이 오래전부터 먹어 온 음식이다.","된장은 여러 음식을 구수하게 만든다.","친구들이 된장을 즐겨 먹었으면 좋겠다."],"ks":[[1,"된장은 우리 조상들이"],[3,"나는 친구들이 된장의"]],"ev":["된장을 만드는 방법을 알 수 있는 문장은?","메주를 소금물에","1문단 두 번째 문장에 나와요."],"p":["된장은 우리 조상들이 오래전부터 먹어 온 음식입니다. 콩으로 메주를 만들고, 메주를 소금물에 담가 오랫동안 익혀서 만듭니다.","된장은 찌개나 국에 넣으면 맛이 구수해집니다. 채소를 무치거나 쌈을 싸 먹을 때에도 잘 어울립니다.","나는 할머니가 끓여 주시는 된장찌개를 가장 좋아합니다. 그런데 내 친구 지안이는 된장 냄새가 싫다며 잘 먹지 않습니다. 나는 친구들이 된장의 구수한 맛을 알고 즐겨 먹었으면 좋겠습니다."],"g":"lo"},{"n":47,"ti":"반달가슴곰","to":"가슴에 하얀 반달무늬가 있는 곰, 반달가슴곰","tx":["불곰은 갈색이다.","반달가슴곰은 흔한 동물이다."],"cp":1,"fm":"두괄식","th":["숲에서 온몸이 검고 가슴에 하얀 반달무늬가 있는 곰을 보았어요. 무엇일까요?","반달가슴곰","불곰","북극곰","알 수 없다","1문단에 반달가슴곰은 가슴에 하얀 반달무늬가 있다고 했어요."],"kw":["반달가슴곰","털","귀","지리산"],"vo":[["멸종","생물의 한 종류가 아주 없어지는 것","새로 많이 태어나는 것","이사 가는 것","잠을 자는 것"],["구별","서로 다른 점에 따라 나누어 알아보는 것","모두 똑같이 보는 것","섞어 버리는 것","잊어버리는 것"]],"mi":["가슴에 하얀 반달무늬가 있는 반달가슴곰","반달무늬로 다른 곰과 구별된다.","멸종 위기의 반달가슴곰을 보호하고 있다."],"ks":[[1,"반달가슴곰은 가슴에"],[2,"반달가슴곰은 반달무늬 덕분에"]],"ev":["반달가슴곰을 지키기 위해 하고 있는 일을 알 수 있는 문장은?","숲으로 돌려보내는","3문단 마지막 문장에 나와요."],"p":["반달가슴곰은 가슴에 하얀 반달무늬가 있는 곰입니다. 온몸은 검은 털로 덮여 있고, 귀가 둥글고 큽니다.","반달가슴곰은 반달무늬 덕분에 다른 곰과 쉽게 구별됩니다. 불곰은 온몸이 갈색이고, 가슴에 뚜렷한 무늬가 없습니다.","반달가슴곰은 우리나라에서 멸종 위기에 놓인 동물입니다. 그래서 지리산에서는 반달가슴곰을 보호하고 숲으로 돌려보내는 일을 하고 있습니다."],"g":"lo"},{"n":48,"ti":"꾸준히 잘하는 친구들의 공통점","to":"작은 목표를 세우고 날마다 조금씩 해 나가면 누구나 잘할 수 있다.","tx":["하루에 열 쪽씩 책을 읽는다.","처음부터 잘하지 못하면 포기해야 한다."],"cp":5,"fm":"미괄식","th":["줄넘기를 잘하고 싶은 친구에게 이 글의 방법대로 알려 준다면?","“하루에 20번씩, 저녁마다 같은 시간에 연습해 봐.”","“첫날부터 1000번을 목표로 해.”","“생각날 때만 가끔 해.”","“한 번 걸리면 그만둬.”","2·3문단에 해낼 수 있는 작은 목표를 세우고 날마다 같은 시간에 하라고 했어요."],"kw":["꾸준히","쪽","저녁","문제"],"vo":[["목표","이루려고 정해 둔 것","지난 일","실수한 것","놀이 기구"],["자신감","스스로 잘할 수 있다고 믿는 마음","두려워하는 마음","심심한 마음","미안한 마음"]],"mi":["꾸준히 잘하는 친구들의 공통점 세 가지를 알아보자.","작은 목표를 세운다.","날마다 같은 시간에 한다.","실수를 두려워하지 않는다.","날마다 조금씩 하면 누구나 잘할 수 있다."],"ks":[[2,"하나, 작은 목표를"],[5,"작은 목표를 세우고, 날마다"]],"ev":["시간을 정해 두면 좋은 점을 알 수 있는 문장은?","잊지 않고 할 수","3문단 두 번째 문장에 나와요."],"p":["무엇이든 꾸준히 잘 해내는 친구들이 있습니다. 이런 친구들에게는 어떤 공통점이 있을까요? 세 가지를 알아봅시다.","하나, 작은 목표를 세웁니다. ‘책 많이 읽기’보다 ‘하루에 열 쪽 읽기’처럼 해낼 수 있는 목표를 정합니다. 작은 목표를 이루면 자신감이 생깁니다.","둘, 날마다 같은 시간에 합니다. 저녁을 먹고 나서 책을 읽는 것처럼 시간을 정해 두면 잊지 않고 할 수 있습니다.","셋, 실수를 두려워하지 않습니다. 틀린 문제는 왜 틀렸는지 다시 살펴보고, 다음에는 틀리지 않도록 합니다.","처음부터 잘하는 사람은 없습니다. 작은 목표를 세우고, 날마다 조금씩 해 나가면 누구나 잘할 수 있습니다."],"g":"lo"},{"n":49,"ti":"충치","to":"충치를 막으려면 이를 꼼꼼히 닦고 단 음식을 줄이며 치과 검사를 받자.","tx":["충치는 처음에 아프지 않을 수 있다.","단 음식을 많이 먹어도 충치와 관계없다."],"cp":3,"fm":"미괄식","th":["충치를 막기 위해 이 글을 읽은 내가 동생에게 해 줄 말로 알맞은 것은?","“자기 전에 이를 꼼꼼히 닦고, 사탕은 줄이자.”","“아프지 않으면 치과에 안 가도 돼.”","“이는 아침에만 닦으면 돼.”","“끈적한 간식을 많이 먹자.”","3문단에 자기 전에 이를 닦고 단 음식을 줄이라고 했어요."],"kw":["충치","찬물","간식","구멍"],"vo":[["찌꺼기","쓸 것을 쓰고 남은 부스러기","새로 만든 음식","깨끗한 물","약"],["정기적","일정한 때를 정해 되풀이하는 것","아주 가끔 우연히","한 번뿐인","아무 때나 마구"]],"mi":["충치가 생기는 까닭","충치가 심해지면 아프다.","충치를 막는 방법"],"ks":[[2,"하지만 구멍이 깊어지면"],[3,"충치를 막으려면"]],"ev":["충치를 일찍 찾는 방법을 알 수 있는 문장은?","정기적으로 검사를","3문단 마지막 문장에 나와요."],"p":["충치는 이가 썩는 병입니다. 이에 남아 있는 음식 찌꺼기를 입속 세균이 먹고 산을 만들어 내는데, 이 산이 이를 조금씩 녹여 구멍을 냅니다.","충치는 처음에는 아프지 않아서 모르고 지나치기 쉽습니다. 하지만 구멍이 깊어지면 찬물을 마실 때 이가 시리고, 더 심해지면 밤에 잠을 못 잘 만큼 아플 수 있습니다.","충치를 막으려면 밥을 먹은 뒤와 자기 전에 이를 꼼꼼히 닦아야 합니다. 단 음식과 끈적한 간식은 줄이는 것이 좋습니다. 또 치과에 가서 정기적으로 검사를 받으면 충치를 일찍 찾아 치료할 수 있습니다."],"g":"lo"},{"n":50,"ti":"나의 꿈, 요리사","to":"나는 요리사가 되고 싶다.","tx":["동생은 볶음밥을 잘 먹는다.","요리사는 그림을 잘 그려야 한다."],"cp":1,"fm":"두괄식","th":["글쓴이가 요리사가 된다면 어떤 요리사가 될까요?","가족과 친구들을 위해 맛있고, 채소도 잘 먹게 하는 음식을 만드는 요리사","비싼 음식만 만드는 요리사","채소는 절대 쓰지 않는 요리사","음식을 대충 담는 요리사","1·2문단에 가족과 친구들에게 맛있는 음식을 만들고, 채소를 싫어하는 친구도 좋아할 음식을 만들겠다고 했어요."],"kw":["요리사","그림","볶음밥","동생"],"vo":[["잘게","아주 작게","크고 굵게","통째로","길게"],["볶다","음식을 기름에 넣고 이리저리 저으며 익히다","물에 삶다","날것으로 두다","얼리다"]],"mi":["맛있는 음식을 만들어 주는 요리사가 되고 싶다.","채소를 싫어하는 친구도 좋아할 음식을 만들겠다.","음식을 예쁘게 담는 것도 재미있을 것 같다."],"ks":[[1,"나는 요리사가 되고"],[2,"그리고 채소를 싫어하는"]],"ev":["글쓴이의 동생이 채소를 먹게 된 방법을 알 수 있는 문장은?","볶음밥에 넣으면","2문단 마지막 문장에 나와요."],"p":["나는 요리사가 되고 싶어요. 요리사가 되면 가족과 친구들에게 맛있는 음식을 만들어 줄 거예요. 모두 맛있게 먹으면 정말 기쁘겠지요?","그리고 채소를 싫어하는 친구들도 좋아할 만한 음식을 만들 거예요. 채소를 잘게 썰어 볶음밥에 넣으면 동생도 잘 먹거든요.","나는 그림을 그릴 때도 즐거워요. 음식을 예쁘게 담는 것도 그림을 그리는 것처럼 재미있을 것 같아요."],"g":"lo"},{"n":51,"ti":"콩나물 기르기","to":"콩나물을 기르는 방법과 자라는 과정","tx":["콩나물로 국을 끓일 수 있다.","콩나물은 햇빛을 많이 받아야 잘 자란다."],"cp":0,"fm":"병렬식","th":["콩나물을 기르다가 검은 천이 벗겨져 며칠 동안 햇빛을 받았어요. 어떻게 될까요?","떡잎이 초록색으로 변하고 맛이 떨어진다.","더 하얗고 맛있게 자란다.","뿌리가 사라진다.","콩이 다시 딱딱해진다.","4문단에 빛이 들면 떡잎이 초록색으로 변하고 맛이 떨어진다고 했어요."],"kw":["콩나물","국","천","일주일"],"vo":[["불리다","물에 담가 부피가 커지고 부드러워지게 하다","불에 굽다","바짝 말리다","잘게 부수다"],["떡잎","씨앗에서 싹이 틀 때 처음 나오는 잎","가을에 떨어지는 잎","꽃잎","뿌리털"]],"mi":["콩나물 기르기의 좋은 점","콩나물을 기르는 방법","콩나물이 자라는 과정","콩나물을 기를 때 조심할 점"],"ks":[[1,"콩나물 기르기의 좋은 점은"],[4,"기를 때 조심할 점은"]],"ev":["콩나물을 먹을 수 있을 때까지 걸리는 시간을 알 수 있는 문장은?","일주일쯤 지나면","3문단 마지막 문장에 나와요."],"p":["콩나물 기르기의 좋은 점은 집에서 쉽게 기를 수 있고, 하루하루 자라는 모습을 눈으로 볼 수 있다는 것이다. 다 자란 콩나물로 국을 끓여 먹는 재미도 있다.","기르는 방법은 간단하다. 먼저 콩나물콩을 물에 하룻밤 불린다. 그다음 바닥에 구멍이 뚫린 그릇에 콩을 담고, 빛이 들지 않도록 검은 천으로 덮어 둔다. 하루에 여러 번 물을 흠뻑 주면 물이 구멍으로 빠져나가면서 콩이 자란다.","콩나물은 콩껍질이 벌어지며 하얀 뿌리가 나오는 것부터 시작한다. 이어서 줄기가 길게 자라고, 줄기 끝에 노란 떡잎이 달린다. 날씨에 따라 다르지만 일주일쯤 지나면 먹을 수 있을 만큼 자란다.","기를 때 조심할 점은 빛을 막아 주는 것이다. 콩나물에 빛이 들면 떡잎이 초록색으로 변하고 맛이 떨어진다. 또 물을 주지 않아 마르면 잘 자라지 못하므로 물을 거르지 않아야 한다."],"g":"hi"},{"n":52,"ti":"업사이클링 디자이너","to":"업사이클링 디자이너가 주목받는 까닭과 하는 일, 전망","tx":["버려지는 옷이 많다.","업사이클링은 물건을 녹여 원료로 쓰는 것이다."],"cp":0,"fm":"병렬식","th":["업사이클링 디자이너라면 낡은 우산을 어떻게 활용할까요?","우산 천을 잘라 비에 강한 장바구니로 만든다.","우산을 녹여서 원료로 쓴다.","쓰레기봉투에 넣어 버린다.","똑같은 새 우산을 산다.","2·3문단에 업사이클링은 버려지는 물건에 아이디어를 더해 더 가치 있는 새 물건으로 만드는 것이라고 했어요."],"kw":["업사이클링","청바지","현수막","원료"],"vo":[["주목","관심을 가지고 주의 깊게 살펴보는 것","못 본 척하는 것","잊어버리는 것","피하는 것"],["가치","쓸모나 중요성의 정도","물건의 색깔","물건의 무게","물건의 크기"]],"mi":["쓰레기가 늘며 다시 쓰는 방법에 대한 관심이 커졌다.","재활용과 다른 업사이클링, 그리고 업사이클링 디자이너의 등장","업사이클링 디자이너가 하는 일","업사이클링 디자이너의 전망"],"ks":[[2,"이와 달리 업사이클링은"],[3,"업사이클링 디자이너는 버려진"]],"ev":["재활용이 무엇인지 알 수 있는 문장은?","녹이거나 부수어","2문단 첫 문장에 나와요."],"p":["해마다 버려지는 옷과 물건의 양은 엄청나다. 쓰레기가 늘어나면서 물건을 버리지 않고 다시 쓰는 방법에 대한 관심도 커지고 있다.","재활용은 버린 물건을 녹이거나 부수어 원료로 다시 쓰는 것이다. 이와 달리 업사이클링은 버려지는 물건에 디자인과 아이디어를 더해 더 가치 있는 새 물건으로 만드는 것이다. 이런 관심 속에서 주목받는 직업이 ‘업사이클링 디자이너’이다.","업사이클링 디자이너는 버려진 물건의 쓸모를 새롭게 찾아낸다. 예를 들어 낡은 청바지로 가방을 만들고, 버려진 현수막으로 필통을 만든다. 폐타이어로 의자를 만들기도 한다.","환경을 지키려는 사람들이 많아질수록 업사이클링 디자이너가 할 일도 늘어날 것으로 보인다. 앞으로는 물건을 만들 때부터 다시 쓰일 것을 생각하는 일이 더 중요해질 것이다."],"g":"hi"},{"n":53,"ti":"밭에서 나는 고기, 콩","to":"우리 몸과 생활에 도움을 주는 콩의 좋은 점","tx":["콩으로 두부를 만든다.","콩에는 영양소가 거의 없다."],"cp":0,"fm":"병렬식","th":["고기를 잘 먹지 못하는 친구가 단백질을 얻으려면 어떤 음식을 먹으면 좋을까요?","두부나 두유 같은 콩 음식","사탕과 과자","탄산음료","흰 쌀밥만","2문단에 콩은 고기 못지않게 단백질이 많다고 했어요."],"kw":["콩","근육","청국장","곡식"],"vo":[["식이 섬유","몸속에서 소화되지 않고 장의 움직임을 돕는 성분","단맛을 내는 성분","짠맛을 내는 소금","물에 녹는 기름"],["발효","곰팡이나 세균의 작용으로 음식이 새로운 맛과 성질로 변하는 것","음식이 불에 타는 것","음식이 얼어붙는 것","음식을 잘게 써는 것"]],"mi":["콩의 좋은 점을 알아보자.","콩에는 단백질이 풍부하다.","콩에는 식이 섬유가 많다.","콩은 여러 음식으로 바꾸어 먹을 수 있다.","콩은 몸과 생활에 두루 도움을 주는 고마운 곡식이다."],"ks":[[2,"첫째, 콩에는 단백질이"],[3,"둘째, 콩에는 식이 섬유가"]],"ev":["콩이 ‘밭에서 나는 고기’라고 불리는 까닭을 알 수 있는 문장은?","고기 못지않게","2문단 마지막 문장에 나와요."],"p":["콩은 아주 오래전부터 우리 밥상에 올라온 곡식이다. 우리 조상들은 콩으로 된장, 간장, 두부를 만들어 먹었고, 밥에 섞어 먹기도 했다. 이러한 콩이 우리 몸에 주는 좋은 점을 알아보자.","첫째, 콩에는 단백질이 풍부하다. 단백질은 근육과 피부 등 우리 몸을 만드는 데 꼭 필요한 영양소이다. 콩은 고기 못지않게 단백질이 많아 ‘밭에서 나는 고기’라고 불린다.","둘째, 콩에는 식이 섬유가 많다. 식이 섬유는 장이 잘 움직이도록 도와 변비를 막는 데 도움을 준다.","셋째, 콩은 여러 음식으로 바꾸어 먹을 수 있다. 콩을 갈아 두부와 두유를 만들고, 싹을 틔워 콩나물로 먹으며, 발효시켜 된장과 청국장을 만든다.","이 밖에도 콩은 값이 비싸지 않고 오래 보관할 수 있다. 이처럼 콩은 우리 몸과 생활에 두루 도움을 주는 고마운 곡식이다."],"g":"hi"},{"n":54,"ti":"푸드 스타일리스트","to":"음식을 맛있어 보이게 꾸미는 푸드 스타일리스트가 하는 일과 전망","tx":["광고 속 음식 사진은 먹음직스럽다.","푸드 스타일리스트는 요리 지식이 필요 없다."],"cp":2,"fm":"중괄식","th":["푸드 스타일리스트가 되고 싶은 친구에게 이 글을 바탕으로 해 줄 조언은?","요리 공부와 함께 색깔, 그릇, 사진을 보는 감각도 길러 봐.","음식을 예쁘게 담는 연습만 하면 돼.","요리는 몰라도 괜찮아.","사진은 다른 사람이 찍으니 신경 쓰지 마.","3문단에 요리 지식과 함께 색깔과 그릇, 사진에 대한 감각도 길러야 한다고 했어요."],"kw":["푸드 스타일리스트","떡볶이","식탁보","잡지"],"vo":[["군침이 돌다","먹고 싶어 입안에 침이 고이다","배가 몹시 아프다","졸음이 쏟아지다","입맛이 없어지다"],["어우러지다","여럿이 잘 어울려 조화를 이루다","서로 따로 떨어지다","색이 바래다","부서지다"]],"mi":["음식 사진을 보면 먹고 싶어진다.","푸드 스타일리스트가 하는 일과 늘어나는 수요","푸드 스타일리스트가 되기 위해 길러야 할 것"],"ks":[[2,"이처럼 음식이 가장 맛있어"],[3,"하지만 푸드 스타일리스트가"]],"ev":["푸드 스타일리스트를 찾는 곳이 늘어나는 까닭을 알 수 있는 문장은?","요리 방송과 인터넷","2문단 마지막 문장에 나와요."],"p":["잡지나 광고에서 먹음직스러운 음식 사진을 보면 저절로 군침이 돈다. 김이 모락모락 나는 찌개, 윤기가 흐르는 떡볶이, 알록달록한 샐러드는 보기만 해도 먹고 싶어진다.","이처럼 음식이 가장 맛있어 보이도록 꾸미는 사람을 푸드 스타일리스트라고 한다. 푸드 스타일리스트는 음식에 어울리는 그릇과 식탁보를 고르고, 재료의 색깔이 잘 어우러지도록 음식을 담는다. 사진을 찍는 동안 음식이 마르지 않도록 살피고, 필요하면 조명의 방향까지 함께 고민한다. 요즘은 요리 방송과 인터넷 요리 영상이 많아지면서 이 직업을 찾는 곳도 늘어나고 있다.","하지만 푸드 스타일리스트가 되려면 음식을 예쁘게 담는 솜씨만으로는 부족하다. 요리에 대한 지식은 물론 색깔과 그릇, 사진에 대한 감각도 함께 길러야 한다."],"g":"hi"},{"n":55,"ti":"구름의 종류","to":"구름은 생기는 높이와 모양에 따라 여러 종류로 나뉜다.","tx":["구름은 작은 물방울이 모인 것이다.","모든 구름은 비를 내린다."],"cp":1,"fm":"두괄식","th":["여름 오후, 하늘에 거대한 구름이 높이 솟아오르고 있어요. 어떤 일이 생길 수 있을까요?","천둥 번개와 함께 소나기가 내릴 수 있다.","하늘이 더 맑아진다.","눈이 펑펑 내린다.","구름이 새털처럼 가늘어진다.","3문단에 뭉게구름이 높이 솟아 소나기구름이 되면 천둥, 번개와 소나기를 뿌리기도 한다고 했어요."],"kw":["구름","천둥","솜뭉치","층운"],"vo":[["수증기","물이 증발하여 된 기체","얼음 조각","빗방울","먼지"],["거대하다","엄청나게 크다","아주 작다","얇고 가볍다","흐릿하다"]],"mi":["구름은 생기는 높이와 모양에 따라 나눌 수 있다.","높이에 따른 구름의 종류","모양에 따른 구름의 종류"],"ks":[],"ev":["높은 하늘의 구름이 새털처럼 보이는 까닭을 알 수 있는 문장은?","얼음 알갱이로 되어","2문단 첫 문장에 나와요."],"p":["하늘에 떠 있는 구름은 모두 비슷해 보이지만, 사실 여러 종류가 있다. 구름은 공기 중의 수증기가 식어서 생긴 아주 작은 물방울이나 얼음 알갱이가 모인 것인데, 생기는 높이와 모양에 따라 나눌 수 있다.","높이에 따라 나누면, 높은 하늘에 생기는 구름은 얼음 알갱이로 되어 있어 새털처럼 가늘고 하얗다. 이런 구름을 새털구름(권운)이라고 한다. 낮은 하늘에 생기는 구름은 물방울이 많아 회색빛을 띠며, 하늘을 넓게 덮는 층구름(층운)이 대표적이다.","모양에 따라 나누면, 솜뭉치처럼 뭉게뭉게 피어오르는 뭉게구름(적운)이 있다. 뭉게구름이 위로 높이 솟아올라 거대해지면 소나기구름(적란운)이 되는데, 이 구름은 천둥, 번개와 함께 소나기를 뿌리기도 한다."],"g":"hi"},{"n":56,"ti":"목소리가 큰 하준이","to":"나의 특징을 부끄러워하지 말고 소중히 여기자.","tx":["학예회 연습은 강당에서 했다.","목소리가 크면 부끄러운 일이다."],"cp":3,"fm":"미괄식","th":["하준이의 마음은 어떻게 바뀌었나요?","속상함 → 자랑스러움","기쁨 → 슬픔","자랑스러움 → 부끄러움","화남 → 무서움","처음에는 놀림을 받아 말수가 줄었지만, 해설을 멋지게 해내고 자기 목소리를 자랑스러워하게 되었어요."],"kw":["목소리","강당","박수","연극"],"vo":[["쩌렁쩌렁","목소리가 크고 우렁차게 울리는 모양","아주 작게 속삭이는 모양","조용히 멈춘 모양","흐릿한 모양"],["해설","이야기나 무대의 내용을 풀어서 설명하는 것","노래를 부르는 것","춤을 추는 것","무대를 치우는 것"]],"mi":["목소리가 커서 놀림을 받아 말수가 줄어든 하준이","학예회 연습에서 해설을 맡을 친구가 필요했다.","해설을 멋지게 해내고 자기 목소리를 자랑스러워한 하준이"],"ks":[[1,"하준이는 목소리가 반에서"],[3,"하준이는 그날 처음으로"]],"ev":["하준이가 놀림 때문에 달라진 모습을 알 수 있는 문장은?","말수가 줄어들었다","1문단 마지막 문장에 나와요."],"p":["하준이는 목소리가 반에서 가장 컸다. 조용히 말하려고 해도 목소리가 교실에 쩌렁쩌렁 울렸다. 친구들은 하준이가 말할 때마다 귀를 막는 시늉을 하며 놀렸다. 하준이는 점점 말수가 줄어들었다.","어느 날 학교 강당에서 학예회 연습이 열렸다. 연극 무대에 선 친구들의 목소리는 너무 작아서 뒷자리까지 들리지 않았다. 선생님께서는 누가 해설을 맡아 큰 소리로 읽어 줄 수 있는지 물으셨다.","하준이는 떨리는 마음으로 손을 들었다. 하준이가 해설을 읽자 강당 맨 뒤까지 또렷하게 들렸다. 친구들은 박수를 치며 “역시 하준이 목소리 최고!”라고 외쳤다. 하준이는 그날 처음으로 자기 목소리가 자랑스러웠다."],"g":"hi"},{"n":57,"ti":"시를 읽는 방법","to":"시를 소리 내어 읽고, 장면과 마음을 떠올리며 즐기자.","tx":["시는 줄과 연을 나누어 쓴다.","시는 한 번만 읽으면 된다."],"cp":2,"fm":"미괄식","th":["‘눈이 소복소복 쌓인다’라는 시 구절을 이 글의 방법대로 읽는다면?","눈 쌓인 장면을 떠올리며 소리 내어 읽고, 그때 내 느낌을 생각해 본다.","글자 수를 센다.","어려운 낱말만 사전에서 찾고 끝낸다.","빠르게 한 번만 읽는다.","2문단에 소리 내어 여러 번 읽고, 장면을 떠올리며 내 경험과 견주어 보라고 했어요."],"kw":["시","리듬감","장면","경험"],"vo":[["비유","어떤 것을 비슷한 다른 것에 빗대어 나타내는 것","틀린 글자를 고치는 것","글을 짧게 줄이는 것","그림을 그리는 것"],["견주다","둘 이상을 나란히 놓고 비교하다","하나로 합치다","멀리 치우다","모르는 척하다"]],"mi":["시의 뜻과 특징","시를 읽는 방법"],"ks":[[1,"시는 짧은 말 속에"],[2,"시를 읽을 때에는 소리"]],"ev":["시가 리듬감을 살리는 방법을 알 수 있는 문장은?","줄과 연을 나누어","1문단 두 번째 문장에 나와요."],"p":["시는 짧은 말 속에 글쓴이의 생각과 느낌을 담은 글이다. 시에는 흉내 내는 말이나 비유하는 표현이 자주 쓰이고, 줄과 연을 나누어 리듬감을 살린다. 그래서 같은 내용이라도 시로 쓰면 더 생생하고 새롭게 느껴진다.","시를 읽을 때에는 소리 내어 여러 번 읽어 보는 것이 좋다. 읽으면서 떠오르는 장면을 머릿속에 그려 보고, 글쓴이가 어떤 마음이었을지 생각해 본다. 또 나라면 그 장면에서 어떤 느낌이 들었을지 내 경험과 견주어 보면 시를 더 깊이 즐길 수 있다."],"g":"hi"},{"n":58,"ti":"스마트폰 사용을 줄이려면","to":"스마트폰 사용을 줄이기 위해 가정, 학교, 어린이 스스로 노력해야 한다.","tx":["스마트폰으로 영상을 볼 수 있다.","스마트폰은 오래 쓸수록 좋다."],"cp":0,"fm":"병렬식","th":["이 글에서 말한 방법 가운데 ‘어린이 스스로’ 할 수 있는 일은?","하루에 쓸 시간을 정하고 다 쓰면 스스로 끈다.","학교에 보드게임을 사 달라고 한다.","부모님께 스마트폰을 쓰지 말라고 한다.","잠자기 직전까지 영상을 본다.","4문단에 하루에 쓸 시간을 정해 두고 다 쓰면 스스로 끄는 연습을 하라고 했어요."],"kw":["스마트폰","보드게임","잠","책상"],"vo":[["관리","일이나 물건을 맡아 잘 살피고 다스리는 것","아무렇게나 두는 것","모두 버리는 것","남에게 주는 것"],["마련하다","필요한 것을 미리 갖추다","없애 버리다","잃어버리다","빌려 쓰다"]],"mi":["스마트폰을 너무 오래 쓰면 좋지 않은 점이 많다.","가정에서 가족이 함께 약속을 정한다.","학교에서 스마트폰 없이 즐길 활동을 늘린다.","어린이 스스로 사용 시간을 관리하는 습관을 기른다."],"ks":[[2,"먼저, 가정에서"],[4,"무엇보다 어린이 스스로"]],"ev":["스마트폰을 오래 쓰면 잠에 생기는 문제를 알 수 있는 문장은?","잠드는 시간이 늦어지며","1문단 세 번째 문장에 나와요."],"p":["요즘 어린이들은 스마트폰을 쓰는 시간이 점점 늘어나고 있다. 스마트폰으로 영상을 보고 게임을 하다 보면 시간 가는 줄 모른다. 하지만 너무 오래 쓰면 눈이 피로해지고, 잠드는 시간이 늦어지며, 책을 읽거나 밖에서 놀 시간이 줄어든다. 그렇다면 스마트폰 사용을 줄이려면 어떻게 해야 할까?","먼저, 가정에서 가족이 함께 약속을 정해야 한다. 밥을 먹을 때와 잠자기 한 시간 전에는 가족 모두 스마트폰을 내려놓는 식이다.","학교에서는 스마트폰 없이도 즐길 수 있는 활동을 늘려야 한다. 쉬는 시간에 할 수 있는 보드게임이나 운동 놀이를 마련하는 것도 한 방법이다.","무엇보다 어린이 스스로 사용 시간을 관리하는 습관을 길러야 한다. 하루에 쓸 시간을 정해 두고, 다 쓰면 스스로 끄는 연습을 한다. 스마트폰을 책상에서 멀리 두는 것도 도움이 된다."],"g":"hi"},{"n":59,"ti":"문장 부호의 쓰임","to":"여러 가지 문장 부호와 그 쓰임","tx":["물음표는 묻는 문장에 쓴다.","문장 부호는 없어도 뜻이 똑같이 전해진다."],"cp":0,"fm":"병렬식","th":["“우와 눈이 온다”라는 문장 끝에 쓰기에 가장 알맞은 문장 부호는?","느낌표(!)","물음표(?)","쉼표(,)","아무것도 쓰지 않는다","4문단에 느낌표는 놀람이나 기쁨처럼 강한 느낌을 나타내는 문장 끝에 쓴다고 했어요."],"kw":["문장 부호","기호","낱말","느낌"],"vo":[["기호","어떤 뜻을 나타내려고 쓰는 부호나 표시","긴 이야기","그림책","글씨체"],["늘어놓다","여럿을 죽 벌여 놓다","하나로 뭉치다","모두 지우다","숨겨 두다"]],"mi":["문장 부호의 뜻","마침표의 쓰임","물음표의 쓰임","느낌표의 쓰임","쉼표의 쓰임"],"ks":[[1,"문장 부호는 글의 뜻을"]],"ev":["같은 말이라도 물음표가 붙으면 어떻게 되는지 알 수 있는 문장은?","궁금해하는 뜻이","3문단 두 번째 문장에 나와요."],"p":["문장 부호는 글의 뜻을 정확하게 전하기 위해 쓰는 기호이다. 문장 부호에는 여러 가지가 있다.","마침표(.)는 설명하거나 시키는 문장의 끝에 쓴다. 문장이 끝났다는 것을 알려 주어 읽는 사람이 어디서 쉬어 읽을지 알게 해 준다.","물음표(?)는 묻는 문장의 끝에 쓴다. 같은 말이라도 물음표가 붙으면 궁금해하는 뜻이 된다.","느낌표(!)는 놀람이나 기쁨처럼 강한 느낌을 나타내는 문장의 끝에 쓴다.","쉼표(,)는 문장 안에서 짧게 쉬어 읽을 곳이나, 같은 종류의 낱말을 늘어놓을 때 쓴다."],"g":"hi"},{"n":60,"ti":"물을 아끼는 방법","to":"여러 가지 방법으로 물을 아끼자.","tx":["깨끗한 물을 만드는 데 에너지가 든다.","물은 얼마든지 써도 된다."],"cp":0,"fm":"병렬식","th":["양치할 때 물을 아끼려면 어떻게 해야 할까요?","컵에 물을 받아 쓴다.","물을 틀어 놓은 채 양치한다.","양치를 하지 않는다.","뜨거운 물만 쓴다.","2문단에 양치할 때는 컵을 쓰라고 했어요."],"kw":["물","수도꼭지","에너지","양동이"],"vo":[["에너지","일을 할 수 있는 힘","물건의 값","물의 온도","수도관의 길이"],["새다","틈이나 구멍으로 물이나 공기가 조금씩 빠져나가다","꽉 막히다","얼어붙다","끓어오르다"]],"mi":["물을 아끼는 방법에는 여러 가지가 있다.","양치할 때 컵을 쓴다.","샤워 시간을 줄인다.","새는 수도꼭지를 바로 고친다."],"ks":[[1,"물을 아끼는 방법에는"],[4,"셋째, 새는 수도꼭지는"]],"ev":["물을 틀어 놓고 양치하면 안 되는 까닭을 알 수 있는 문장은?","그대로 흘러가 버린다","2문단 두 번째 문장에 나와요."],"p":["우리가 쓰는 깨끗한 물은 저절로 생기지 않는다. 물을 깨끗하게 만들어 집까지 보내려면 많은 노력과 에너지가 든다. 물을 아끼는 방법에는 여러 가지가 있다.","첫째, 양치할 때는 컵을 쓴다. 물을 틀어 놓은 채 양치하면 쓰지도 않는 물이 그대로 흘러가 버린다.","둘째, 샤워 시간을 줄인다. 샤워를 몇 분만 줄여도 아낄 수 있는 물이 꽤 많다.","셋째, 새는 수도꼭지는 바로 고친다. 한 방울씩 떨어지는 물도 하루 종일 모이면 양동이를 채울 만큼 많아질 수 있다."],"g":"hi"},{"n":61,"ti":"미세 먼지의 피해","to":"미세 먼지가 주는 여러 가지 피해","tx":["미세 먼지는 자동차 매연에서 생긴다.","미세 먼지는 식물을 잘 자라게 한다."],"cp":0,"fm":"병렬식","th":["미세 먼지가 아주 심한 날, 알맞은 행동은?","밖에서 오래 뛰어놀지 않고 외출할 때는 마스크를 쓴다.","창문을 활짝 열어 둔다.","운동장에서 오래 달리기를 한다.","아무렇지 않게 평소처럼 지낸다.","2·3문단에 미세 먼지는 몸속 깊이 들어가 건강을 해치고, 심한 날에는 밖에서 뛰어놀기 힘들다고 했어요."],"kw":["미세 먼지","공장","창문","양분"],"vo":[["매연","자동차나 공장에서 나오는 그을음이 섞인 연기","깨끗한 공기","수증기","꽃향기"],["환기","탁한 공기를 빼고 맑은 공기로 바꾸는 것","문을 꽉 닫는 것","불을 켜는 것","청소하는 것"]],"mi":["미세 먼지의 뜻과 생기는 곳","미세 먼지는 건강을 해친다.","미세 먼지는 생활에 불편을 준다.","미세 먼지는 식물이 자라는 데 방해가 된다."],"ks":[[2,"첫째, 사람의 건강을"],[3,"둘째, 생활에 불편을"]],"ev":["미세 먼지가 몸속 깊이 들어갈 수 있는 까닭을 알 수 있는 문장은?","코와 목에서 걸러지지","2문단 두 번째 문장에 나와요."],"p":["미세 먼지는 눈에 보이지 않을 만큼 아주 작은 먼지이다. 자동차 매연이나 공장의 연기 등에서 많이 생기며, 바람을 타고 먼 곳까지 날아가기도 한다. 미세 먼지가 주는 피해는 다음과 같다.","첫째, 사람의 건강을 해친다. 미세 먼지는 크기가 아주 작아서 코와 목에서 걸러지지 않고 몸속 깊이 들어갈 수 있다. 그래서 기침이 나거나 목이 아프고, 눈이 따가울 수 있다.","둘째, 생활에 불편을 준다. 미세 먼지가 심한 날에는 창문을 열어 환기하기 어렵고, 밖에서 운동을 하거나 뛰어놀기도 힘들다.","셋째, 식물이 자라는 데 방해가 된다. 잎에 먼지가 쌓이면 햇빛을 제대로 받지 못해 식물이 양분을 만들기 어려워진다."],"g":"hi"},{"n":62,"ti":"추석의 여러 이름","to":"추석을 부르는 여러 가지 이름과 그 뜻","tx":["추석은 음력 8월 15일이다.","추석은 한 가지 이름으로만 불린다."],"cp":0,"fm":"병렬식","th":["신라 시대 ‘가배’ 잔치에서 진 편이 한 일은?","음식을 대접하며 잔치를 열었다.","벌을 받았다.","길쌈을 그만두었다.","다른 마을로 떠났다.","4문단에 진 편이 음식을 대접하며 잔치를 벌였다고 했어요."],"kw":["추석","길쌈","신라","농사"],"vo":[["명절","해마다 일정하게 지키며 즐기는 날","생일","방학","주말"],["길쌈","실을 뽑아 옷감을 짜는 일","농사일","고기잡이","집 짓기"]],"mi":["추석의 뜻과 여러 이름","‘한가위’라는 이름의 뜻","‘중추절’이라는 이름의 뜻","‘가배’라는 이름의 유래"],"ks":[[2,"곧 한가위는"],[3,"그래서 가을의 가운데"]],"ev":["음력으로 가을이 몇 월인지 알 수 있는 문장은?","7월, 8월, 9월","3문단 두 번째 문장에 나와요."],"p":["추석은 음력 8월 15일로, 한 해 농사를 거두어들이며 조상께 감사하는 우리 명절이다. 추석은 여러 가지 이름으로도 불린다.","먼저 ‘한가위’라는 이름이 있다. ‘한’은 ‘크다’는 뜻이고, ‘가위’는 ‘가운데’라는 뜻의 옛말에서 왔다고 한다. 곧 한가위는 가을의 한가운데 있는 큰 날이라는 뜻이다.","‘중추절’이라고도 부른다. 음력으로 가을은 7월, 8월, 9월인데, 8월이 그 가운데에 있다. 그래서 가을의 가운데 달에 있는 명절이라는 뜻으로 중추절이라고 한다.","‘가배’라는 이름도 전해진다. 옛 기록에 따르면 신라 시대에 여자들이 두 편으로 나뉘어 한 달 동안 길쌈 솜씨를 겨루고, 8월 15일에 진 편이 음식을 대접하며 잔치를 벌였다고 한다. 이 잔치를 가배라고 불렀다."],"g":"hi"},{"n":63,"ti":"씨앗이 퍼지는 방법","to":"씨앗은 스스로 퍼지거나 다른 것의 도움을 받아 퍼진다.","tx":["민들레 씨앗은 바람에 날아간다.","식물은 씨앗을 퍼뜨리지 않는다."],"cp":1,"fm":"두괄식","th":["산에 다녀온 뒤 바지에 가시 달린 열매가 붙어 있었어요. 이 열매는 어떻게 퍼지는 식물일까요?","동물의 털이나 사람 옷에 붙어서 퍼지는 식물","꼬투리가 터져 스스로 퍼지는 식물","바람을 타고 날아가는 식물","물에 떠서 퍼지는 식물","3문단에 도꼬마리 열매는 가시가 있어 동물의 털이나 옷에 붙어 옮겨 간다고 했어요."],"kw":["씨앗","봉숭아","갈고리","똥"],"vo":[["꼬투리","콩 같은 식물의 씨앗이 들어 있는 껍질","꽃잎","뿌리","줄기"],["퍼뜨리다","널리 퍼지게 하다","한곳에 모으다","없애 버리다","숨겨 두다"]],"mi":["씨앗이 퍼지는 방법은 크게 두 가지로 나뉜다.","스스로 씨앗을 퍼뜨리는 식물","다른 것의 도움을 받아 퍼지는 식물"],"ks":[[1,"씨앗이 퍼지는 방법은"],[3,"다른 것의 도움을 받는 식물은"]],"ev":["새가 씨앗을 옮기는 방법을 알 수 있는 문장은?","새의 똥과 함께","3문단 마지막 문장에 나와요."],"p":["식물은 동물처럼 걸어 다닐 수 없지만, 씨앗을 멀리 퍼뜨려 새로운 곳에서 자란다. 씨앗이 퍼지는 방법은 크게 스스로 퍼지는 방법과 다른 것의 도움을 받는 방법으로 나눌 수 있다.","스스로 퍼지는 식물로는 봉숭아와 콩이 있다. 이 식물들은 열매가 익어 마르면 꼬투리나 껍질이 톡 터지면서 씨앗을 튕겨 낸다.","다른 것의 도움을 받는 식물은 더 많다. 민들레는 씨앗에 솜털 같은 갓털이 있어서 바람을 타고 멀리 날아간다. 도꼬마리 열매는 갈고리 같은 가시가 있어 동물의 털이나 사람의 옷에 붙어 옮겨 간다. 또 새가 먹은 열매의 씨앗은 새의 똥과 함께 다른 곳에 떨어지기도 한다."],"g":"hi"},{"n":64,"ti":"한옥의 아름다움과 지혜","to":"한옥의 아름다움과 한옥에 담긴 지혜","tx":["한옥 지붕은 끝이 들려 있다.","한옥은 쇠와 유리로만 짓는다."],"cp":0,"fm":"병렬식","th":["한겨울 한옥에서 방을 따뜻하게 해 주는 것은?","방바닥 밑으로 열기가 지나가는 온돌","대청마루","창문의 한지","지붕 끝의 기와","2문단에 겨울에는 온돌이 방을 데워 준다고 했어요."],"kw":["한옥","날개","흙","열기"],"vo":[["대청마루","한옥 가운데에 있는 넓은 나무 바닥","방바닥 밑의 불길","지붕 위의 기와","부엌의 아궁이"],["데우다","식은 것을 따뜻하게 하다","차갑게 식히다","물에 적시다","말리다"]],"mi":["새가 날개를 펼친 듯 아름다운 한옥의 지붕","계절에 맞게 지낼 수 있는 한옥의 지혜","자연 재료로 지은 편안한 한옥"],"ks":[[2,"한옥에는 계절에 맞게"],[3,"이런 자연 재료 덕분에"]],"ev":["한지를 바른 창문의 좋은 점을 알 수 있는 문장은?","빛을 부드럽게","3문단 두 번째 문장에 나와요."],"p":["한옥은 우리 조상들이 지어 살던 전통 집이다. 한옥의 지붕은 끝이 하늘을 향해 살짝 들려 있어, 멀리서 보면 새가 날개를 펼친 것처럼 부드럽고 아름답다.","한옥에는 계절에 맞게 지낼 수 있는 지혜가 담겨 있다. 겨울에는 방바닥 밑으로 따뜻한 열기가 지나가는 온돌이 방을 데워 준다. 여름에는 나무 바닥으로 된 대청마루가 바람을 잘 통하게 해 시원하다.","한옥은 주
