<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>달달맘의 글분석 학습지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap">
<style>
/* 한 가지 모습(흰 종이 만화 카드)으로만 디자인한 페이지: 배경과 글자색을 모두 직접 지정합니다. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#342A2A; --ink-2:#6C5F5F; --ink-3:#A89B9B;
  --pink:#F5A3B7; --pink-soft:#FDE7ED; --pink-b:#EE9DB1;
  --lav:#F6E3F4; --lav-b:#E2A6D7;
  --lime:#EAF7CB; --peach:#FFF3E6; --peach-b:#F7CDA4;
  --blue:#4568CF; --blue-soft:#EAF0FC; --coral:#E3544B;
  --hl:#FFD2DC; --hl-y:#FFE7A3; --hl-g:#D9F0B8;
  --ok:#3E9B58; --ok-soft:#E8F6DF; --bad:#E3544B; --bad-soft:#FDE9E6;
  --rule:#EDF0F8; --margin:#F6B7C4; --star:#F5B73C; --line:#E6DCDC;
  --lh:36px;
  --f-hand:'Gaegu','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-pen:'Nanum Pen Script','Gaegu','Apple SD Gothic Neo',cursive;
  --f-text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{word-break:keep-all;overflow-wrap:anywhere;font-family:var(--f-hand);font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:18px 56px}
.tnum{font-variant-numeric:tabular-nums}
.hl{background:linear-gradient(to bottom,transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 3px}
.hl-y{background:linear-gradient(to bottom,transparent 55%,var(--hl-y) 55%,var(--hl-y) 92%,transparent 92%);padding:0 3px}
.hl-g{background:linear-gradient(to bottom,transparent 55%,var(--hl-g) 55%,var(--hl-g) 92%,transparent 92%);padding:0 3px}
.red{color:var(--coral)} .bl{color:var(--blue)}
.doodle{font-family:var(--f-pen);color:var(--coral);font-size:24px;line-height:1;display:inline-block;transform:rotate(-8deg);white-space:nowrap;pointer-events:none}
.doodle.ink{color:var(--ink-2)}
.chr{display:block;flex:none;width:110px}
.chr svg{display:block;width:100%;height:auto;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite}
.hop{animation:hop .5s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.05)}100%{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* speech bubbles */
.bubble{position:relative;background:var(--lime);border:2.5px solid var(--ink);border-radius:46% 54% 48% 52% / 58% 50% 50% 42%;padding:14px 24px;text-align:center;font-weight:700}
.bubble.l::after{content:'';position:absolute;left:-10px;bottom:22px;width:18px;height:18px;background:inherit;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(30deg) skewX(-10deg)}
.bubble.b::after{content:'';position:absolute;left:34px;bottom:-10px;width:18px;height:18px;background:inherit;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(40deg)}
.bubble.pink{background:var(--pink-soft);border-color:var(--pink-b);border-radius:18px}
.bubble.pink::after{border-color:var(--pink-b)}
.bubble.wh{background:#fff}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px 24px;align-items:end;padding-block:6px 10px}
.kicker{font-size:17px;color:var(--ink-2);margin:0}
.brand{font-family:var(--f-hand);font-weight:700;font-size:clamp(46px,8vw,78px);line-height:1;margin:6px 0 0;letter-spacing:-.02em}
.brand .red{white-space:nowrap}
.sub{font-size:21px;margin:12px 0 0;font-weight:700}
.hero-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero-c .pair{display:flex;align-items:flex-end;gap:6px}
.hero-c .bubble{max-width:260px;font-size:20px}
.hero-c .d1{position:absolute;right:6px;top:4px}
.panel{display:flex;flex-wrap:wrap;gap:14px;margin-block:10px 18px}
.guide{flex:1 1 420px;border:2.5px solid var(--peach-b);border-radius:6px;padding:12px 18px;position:relative;background:#fff}
.guide h3,.statbox h3{margin:0 0 6px;font-size:21px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checks li{display:flex;gap:10px;align-items:center;font-size:20px}
.cb{width:26px;height:26px;flex:none;position:relative;border:2.5px solid var(--ink);border-radius:3px;background:#fff}
.cb.on::after{content:'';position:absolute;left:3px;top:-10px;width:12px;height:22px;border-right:4px solid var(--coral);border-bottom:4px solid var(--coral);transform:rotate(40deg);border-radius:2px}
.checks .k{font-family:var(--f-pen);color:var(--coral);font-size:28px;width:18px;text-align:center}
.statbox{flex:0 1 380px;flex-wrap:wrap;border:2.5px solid var(--lav-b);background:var(--lav);border-radius:6px;padding:12px 18px;display:flex;gap:22px;align-items:center}
.statbox b{display:block;font-size:40px;line-height:1}
.statbox span{font-size:17px;color:var(--ink-2);white-space:nowrap}
.statbox b{white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-block:6px 16px}
.seg{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg button{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 18px;font-size:20px;font-weight:700;transition:transform .12s}
.seg button[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--coral);color:var(--coral)}
.seg button:hover{transform:translateY(-2px)}
.seg button:active{transform:translateY(0)}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:19px;cursor:pointer}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk input:focus-visible + .cb{outline:3px solid var(--blue);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
.tile{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:4px;text-align:left;background:#fff;border:2.5px solid var(--c,var(--pink-b));border-radius:6px;padding:10px 14px 10px;min-height:156px;transition:transform .15s ease}
.tile:nth-child(4n+1){--c:var(--pink-b)} .tile:nth-child(4n+2){--c:var(--peach-b)} .tile:nth-child(4n+3){--c:var(--lav-b)} .tile:nth-child(4n+4){--c:#9DC4F0}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile:active{transform:none}
.tile .no{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:700;line-height:1}
.tile .no .circ{display:inline-grid;place-items:center;width:40px;height:40px;border:2.5px solid var(--ink);border-radius:50%;font-size:22px}
.tile .no .n3{font-size:18px}
.tile .no small{font-size:16px;color:var(--ink-3);font-weight:400}
.tile .snip{font-family:var(--f-text);font-size:14px;line-height:1.55;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .st{display:flex;align-items:center;justify-content:space-between;font-size:17px;color:var(--ink-3)}
.tile .new{font-family:var(--f-pen);color:var(--blue);font-size:22px}
.tile .stamp{position:absolute;right:8px;top:6px;font-family:var(--f-pen);color:var(--coral);font-size:20px;border:2px solid var(--coral);border-radius:50%;width:54px;height:54px;display:grid;place-items:center;line-height:1;transform:rotate(12deg);opacity:.85;text-align:center}
.stars{display:inline-flex;gap:1px}
.stars svg{width:18px;height:18px}
.empty{padding:40px 0;display:flex;gap:16px;align-items:center}
.note{margin-top:30px;font-size:18px;border:2.5px dashed var(--peach-b);border-radius:6px;padding:12px 18px;max-width:80ch}
.note summary{cursor:pointer;font-weight:700}
.note p{margin:8px 0;font-family:var(--f-text);font-size:15px;line-height:1.7}

/* ---------- sheet ---------- */
.shead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:2px 10px}
.back{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:3px 16px 3px 12px;font-size:18px;font-weight:700}
.back:hover{background:var(--pink-soft)}
.shead h2{font-size:34px;margin:0;line-height:1.1;display:flex;align-items:center;gap:10px}
.shead .lv{font-size:17px;color:var(--ink-2);border:2px solid var(--peach-b);background:var(--peach);border-radius:999px;padding:0 12px}
.rail-wrap{overflow-x:auto;margin-bottom:22px;scrollbar-width:thin}
.rail{display:flex;gap:6px;list-style:none;margin:0;padding:2px 2px 6px;min-width:max-content}
.rail li{font-size:17px;padding:2px 12px;border-radius:999px;border:2px solid #E6DEDE;color:var(--ink-3);white-space:nowrap;display:inline-flex;gap:4px;align-items:center;background:#fff}
.rail li.on{border-color:var(--coral);color:var(--coral);background:var(--pink-soft);font-weight:700}
.rail li.fin{color:var(--ink);border-color:var(--ink-3)}
.rail li.fin::before{content:'✔';color:var(--coral)}
.body{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:26px;align-items:start}
.pcard{background:#fff;border:2.5px solid var(--blue);border-radius:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.pcard .d2{position:absolute;right:8px;top:-22px;z-index:2}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:2px dashed #C9D5F2;background:var(--blue-soft)}
.pens{display:flex;gap:6px;flex-wrap:wrap}
.pen{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:1px 10px;font-size:18px;font-weight:700;display:inline-flex;gap:5px;align-items:center;transition:transform .1s}
.pen .k{font-family:var(--f-pen);color:var(--coral);font-size:26px;line-height:1}
.pen[aria-pressed="true"]{background:var(--ink);color:#fff}
.pen[aria-pressed="true"] .k{color:var(--hl-y)}
.pen:hover:not([aria-pressed="true"]){transform:translateY(-2px)}
.pen.clear{border-style:dashed;color:var(--ink-2)}
.pscroll{overflow:auto;flex:1 1 auto;min-height:0}
.ptext{position:relative;margin:0;padding:8px 20px 20px 58px;font-family:var(--f-text);font-size:18px;line-height:var(--lh);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1.5px),var(--rule) calc(var(--lh) - 1.5px));background-size:100% var(--lh);background-position:0 8px}
.ptext::before{content:'';position:absolute;top:0;bottom:0;left:46px;border-left:2px solid var(--margin)}
.para{margin:0;text-indent:1em;position:relative}
.poem .para{text-indent:0;margin-bottom:var(--lh)}
.pnum{position:absolute;left:-54px;top:1px;width:34px;height:30px;display:grid;place-items:center;text-indent:0;font-family:var(--f-hand);font-weight:700;color:var(--coral);font-size:24px;opacity:0;transform:scale(.6) rotate(-10deg);transition:opacity .3s,transform .3s}
.nums .pnum{opacity:1;transform:none}
.s{border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .25s}
.w{border-radius:3px}
.pen-slash .w,.pen-box .w{cursor:pointer}
.pen-slash .w:hover,.pen-box .w:hover{background:var(--pink-soft)}
.pen-line .s{cursor:pointer}
.pen-line .s:hover{background-color:#FFF6D6}
.w.box{outline:2.5px solid var(--coral);outline-offset:1px}
.w.slash::after{content:' /';color:var(--coral);font-family:var(--f-pen);font-size:24px}
.s.ul{background-image:linear-gradient(to bottom,transparent 58%,var(--hl-y) 58%,var(--hl-y) 92%,transparent 92%)}
.s.hit{background-color:var(--hl-g);box-shadow:0 0 0 3px var(--hl-g)}
.ctxw{background:var(--hl);border-radius:3px;padding:0 2px}
.pfoot{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding:6px 12px;border-top:2px dashed #C9D5F2;font-size:18px;color:var(--ink-2)}
.meter{display:flex;gap:14px;flex-wrap:wrap}
.meter b{color:var(--ink);font-size:22px;margin-left:4px}
#penHint{font-family:var(--f-pen);color:var(--coral);font-size:22px}
.pcol-toggle{display:none}

.side{display:grid;gap:16px}
.card{position:relative;background:#fff;border:2.5px solid var(--peach-b);border-radius:6px;padding:16px 18px 18px;animation:pop .2s ease}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec h3{margin:0;font-size:28px;display:flex;align-items:center;gap:8px;line-height:1.1}
.circ{display:inline-grid;place-items:center;width:36px;height:36px;border:2.5px solid var(--ink);border-radius:50%;font-size:22px;flex:none}
.cnt{font-size:18px;color:#fff;background:#8B8080;border-radius:999px;padding:0 12px}
.qbar{height:10px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:14px;background:#fff}
.qbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--pink) 0 8px,#F9BCCB 8px 16px);transform-origin:left;transition:transform .3s ease}
.ask{display:flex;gap:6px;align-items:flex-end;margin:0 0 12px}
.ask .chr{width:84px}
.ask .bubble{flex:1;font-size:22px;line-height:1.45;text-align:left;margin-left:12px;border-radius:26px;padding:12px 18px}
.ctx{font-family:var(--f-text);font-size:16px;line-height:1.8;background:var(--peach);border:2px dashed var(--peach-b);border-radius:6px;padding:8px 14px;margin:0 0 12px}
.ctx::before{content:'글 속 문장';display:block;font-family:var(--f-pen);font-size:22px;color:var(--coral);line-height:1.1}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;text-align:left;border:2px solid #E4DADA;background:#fff;border-radius:8px;padding:10px 14px;font-size:21px;line-height:1.45;font-weight:700;transition:border-color .15s,background-color .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--ink);transform:translateX(3px)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt[disabled]{cursor:default}
.opt .cb{margin-top:2px;display:grid;place-items:center;font-size:15px;color:var(--ink-3);font-weight:700}
.opt.sent{font-family:var(--f-text);font-weight:400;font-size:16px;line-height:1.65}
.opt .sub{display:block;font-size:17px;color:var(--ink-2);font-weight:400}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .cb{color:transparent}
.opt.right .cb::after{content:'';position:absolute;left:4px;top:-12px;width:12px;height:24px;border-right:4.5px solid var(--coral);border-bottom:4.5px solid var(--coral);transform:rotate(40deg);border-radius:2px}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .cb{color:var(--bad);font-size:20px}
.opt.dim{opacity:.5}
.fb{margin-top:14px;display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 14px;animation:pop .25s ease}
.fb.ok{background:var(--pink-soft);border:2.5px solid var(--pink-b)}
.fb.no{background:var(--lav);border:2.5px solid var(--lav-b)}
.fb .chr{width:70px;margin-top:-4px}
.fb h4{margin:0;font-size:26px;line-height:1.2}
.fb.ok h4{color:var(--coral)} .fb.no h4{color:#8A4E8C}
.fb p{margin:4px 0 0;font-family:var(--f-text);font-size:15.5px;line-height:1.7}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:5px 20px;font-size:21px;font-weight:700;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:none}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff}
.hint{font-family:var(--f-pen);font-size:22px;color:var(--ink-2);margin:8px 0 0;text-align:right}

.readhead{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.readhead .chr{width:96px}
.readhead .bubble{flex:1;margin-left:12px;font-size:21px}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border:2.5px solid var(--lav-b);background:var(--lav);border-radius:6px}
.clock{font-size:46px;font-weight:700;line-height:1}
.clock small{font-size:18px;color:var(--ink-2);display:block;margin-top:2px;font-weight:400}

.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score .big{font-size:84px;font-weight:700;line-height:.9}
.score .big small{font-size:34px;color:var(--ink-3)}
.bigstars svg{width:40px;height:40px}
.resrow{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.resrow .chr{width:92px}
.resrow .bubble{flex:1;margin-left:12px;font-size:20px;text-align:left}
.cats{display:grid;gap:6px;margin:16px 0 0;padding:0;list-style:none}
.cats li{display:grid;grid-template-columns:8em 1fr 3em;gap:10px;align-items:center;font-size:19px}
.cats .tr{height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.cats .tr i{display:block;height:100%;background:var(--pink)}
.cats .tr i.lo{background:#C9B6E8}
.cats .v{text-align:right}
.review{margin-top:14px}
.review summary{cursor:pointer;font-weight:700;font-size:21px}
.review ol{margin:10px 0 0;padding-left:22px;display:grid;gap:10px;font-family:var(--f-text)}
.review li{font-size:14.5px;line-height:1.6}
.review .yn{font-weight:700}
.review .yn.o{color:var(--ok)} .review .yn.x{color:var(--bad)}
.review .ans{color:var(--ink-2)}
.speed{font-size:19px;margin-top:10px}


.who{display:grid;gap:2px}
.who label{font-size:17px;color:var(--ink-2)}
.who input{width:6.5em;font:inherit;font-size:22px;font-weight:700;border:0;border-bottom:2.5px dashed var(--lav-b);background:transparent;color:var(--ink);padding:0 2px}
.who input:focus{outline:none;border-bottom-color:var(--coral)}
.today{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:2.5px solid var(--pink-b);background:var(--pink-soft);border-radius:6px;padding:8px 14px;margin-bottom:14px;font-size:20px}
.today.none{border-style:dashed;background:#fff;color:var(--ink-2);font-size:18px}
.momsend{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px;padding:10px 14px;border:2.5px solid var(--pink-b);background:var(--pink-soft);border-radius:10px}
.momsend .chr{width:62px}
.momsend > div{flex:1 1 180px;display:grid}
.momsend b{font-size:22px} .momsend span{font-size:17px;color:var(--ink-2)}
a.btn{text-decoration:none;display:inline-block}
.send-back{position:fixed;inset:0;z-index:50;background:rgba(52,42,42,.35);display:grid;place-items:center;padding:16px;animation:pop .15s ease}
.send{width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:16px 18px 18px}
.send-top{display:flex;align-items:flex-end;gap:6px;margin-bottom:10px}
.send-top .chr{width:80px}
.send-top .bubble{flex:1;margin-left:12px;font-size:22px}
.send-steps{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:19px}
.send-steps li{display:flex;align-items:center;gap:8px}
.send-steps .circ{width:28px;height:28px;font-size:17px}
.send textarea{width:100%;font-family:var(--f-text);font-size:14.5px;line-height:1.6;border:2px dashed var(--peach-b);border-radius:8px;padding:10px;background:var(--peach);color:var(--ink);resize:vertical}
.send-msg{min-height:1.4em;margin:6px 0 0;color:var(--coral);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:900px){
  .statbox{flex-basis:100%}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-c{flex-direction:row;justify-content:center;align-items:flex-end}
  .hero-c .chr{width:84px}
  .hero-c .bubble{font-size:18px;padding:10px 16px}
  .brand{font-size:44px}
  .body{grid-template-columns:minmax(0,1fr);gap:18px}
  .pcard{position:relative;top:0;max-height:none}
  .quizmode .pcard .pscroll{max-height:42vh}
  .quizmode .pcard.fold .pscroll,.quizmode .pcard.fold .pfoot,.quizmode .pcard.fold .ptools .pens{display:none}
  .pcol-toggle{display:inline-flex}
  .ptext{padding-left:50px;padding-right:14px;font-size:17px;--lh:34px}
  .ptext::before{left:40px}
  .pnum{left:-50px}
  .ask .chr{width:64px}
  .ask .bubble{font-size:20px}
  .opt{font-size:19px}
  .pcard .d2{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

<script>
const DATA = [{"n":1,"ti":"몸을 튼튼히 하는 방법","to":"몸이 건강하려면 규칙적으로 운동하고 음식을 골고루 먹어야 한다.","tx":["운동을 하면 살이 찌지 않는다.","공부보다 운동이 더 중요하다."],"cp":1,"fm":"두괄식","th":["과자만 먹고 밖에 나가 놀지 않는 동생에게 이 글을 읽은 내가 해 줄 말로 가장 알맞은 것은?","“골고루 먹고 규칙적으로 운동해야 몸이 튼튼해져.”","“과자에는 영양소가 많으니 많이 먹어도 돼.”","“운동은 가끔 한 번씩 많이 하면 돼.”","“공부만 열심히 하면 건강해져.”","글쓴이는 몸이 건강하려면 ‘규칙적인 운동’과 ‘골고루 먹기’가 필요하다고 했어요."],"kw":["건강","숙제","공부","살"],"vo":[["규칙적","정해진 때와 순서에 맞추어 되풀이하는 것","아주 가끔 한 번씩 하는 것","마음 내킬 때만 하는 것","남이 시켜서 억지로 하는 것"],["편식","좋아하는 음식만 가려서 먹는 것","음식을 골고루 먹는 것","음식을 꼭꼭 씹어 먹는 것","밥을 굶는 것"]],"mi":["몸의 건강은 매우 중요하다.","규칙적으로 운동해야 한다.","음식을 골고루 먹어야 한다."],"ks":[[1,"몸의 건강은 우리가"],[2,"첫째, 규칙적으로"]],"ev":["음식을 가려 먹으면 왜 몸이 약해질까요? 그 까닭을 알려 주는 문장은?","편식을 하면","3문단 마지막 문장에 편식하면 필요한 영양소가 모자라 몸이 약해진다고 했어요."],"p":["몸의 건강은 우리가 생활하는 데 매우 중요하다. 몸이 건강하지 않으면 우리는 공부도 할 수 없고, 운동도 할 수 없다. 몸이 건강하려면 어떻게 해야 할까?","첫째, 규칙적으로 운동을 하여야 한다. 운동을 규칙적으로 꾸준히 하면 살도 찌지 않을 뿐 아니라, 밥도 잘 먹게 된다. 그러면 당연히 몸도 튼튼해진다.","둘째, 음식을 골고루 먹어야 한다. 우리 몸은 여러 가지 영양소를 골고루 먹어야 한다. 편식을 하면 필요한 영양소가 모자라 몸이 약해진다."],"g":"lo"},{"n":2,"ti":"컴퓨터와 친해지는 방법","to":"컴퓨터와 친해지려면 직접 조립해 보고 여러 가지 활동을 해 봐야 한다.","tx":["컴퓨터 조립은 장난감 성 쌓기보다 쉽다.","컴퓨터는 형이나 언니만 잘 다룰 수 있다."],"cp":1,"fm":"두괄식","th":["이 글에서 말한 방법대로 컴퓨터와 친해지려는 친구의 행동으로 알맞은 것은?","컴퓨터로 직접 타자를 쳐 보고 숙제도 해 본다.","형이 컴퓨터 하는 모습만 옆에서 구경한다.","컴퓨터는 어려우니 만지지 않는다.","컴퓨터 광고만 많이 본다.","글에서는 컴퓨터를 조립해 보고, 직접 여러 활동을 해 보라고 했어요."],"kw":["컴퓨터","완구","숙제","언니"],"vo":[["조립","여러 부품을 맞추어 하나로 짜 맞추는 것","물건을 부수어 버리는 것","물건을 새로 사는 것","물건을 깨끗이 닦는 것"],["부품","기계의 한 부분을 이루는 물건","기계를 넣는 상자","기계를 쓰는 방법","기계를 파는 가게"]],"mi":["컴퓨터와 친해지면 컴퓨터를 잘 사용할 수 있다.","컴퓨터를 조립해 본다.","컴퓨터로 많은 활동을 해 본다."],"ks":[[1,"컴퓨터와 친해지면"],[3,"둘째, 컴퓨터로"]],"ev":["컴퓨터를 조립해 보면 무엇을 알게 된다고 했나요? 그 내용이 담긴 문장은?","컴퓨터를 뜯어서 다시","2문단 마지막 문장에 조립해 보면 컴퓨터가 어떻게 만들어졌고 각 부품이 하는 일을 알게 된다고 했어요."],"p":["여러분, 컴퓨터를 형이나 언니처럼 잘 다루고 싶으세요? 그러면 컴퓨터와 친해져야 합니다. 컴퓨터와 친해지면 컴퓨터를 더 잘 이해하게 되고, 결국 컴퓨터를 잘 사용할 수 있게 된답니다. 컴퓨터와 친해지려면 어떻게 해야 할까요?","첫째, 컴퓨터를 조립해 보는 것입니다. 컴퓨터를 조립하는 것은 조립식 완구로 성을 쌓는 것보다 쉽습니다. 컴퓨터를 뜯어서 다시 조립을 해 보면, 컴퓨터가 어떻게 만들어졌고, 각 부품이 하는 일은 무엇인지 알게 됩니다.","둘째, 컴퓨터로 많은 활동을 해 봐야 합니다. 타자도 치고, 간단한 숙제도 해 봐야 합니다. 여러 가지 프로그램을 자주 직접 사용하면, 그 경험이 모여서 컴퓨터를 잘 다루는 사람이 된답니다."],"g":"lo"},{"n":3,"ti":"남자가 하는 일, 여자가 하는 일","to":"직업에서 남녀의 구별이 사라지고 있으며, 중요한 것은 무엇을 잘하고 좋아하느냐이다.","tx":["예전에는 운전을 남자만 했다.","직업은 남자와 여자가 따로 정해져 있다."],"cp":4,"fm":"미괄식","th":["남자 간호사가 되고 싶은 준호에게 이 글의 글쓴이가 해 줄 말로 알맞은 것은?","“네가 좋아하고 잘할 수 있다면 멋진 꿈이야.”","“간호사는 여자만 하는 일이야.”","“운전사가 되는 게 더 어울려.”","“직업은 부모님이 정해 주셔야 해.”","글쓴이는 중요한 것이 어떤 일을 잘하고 좋아하느냐라고 했어요."],"kw":["직업","기계","미용사","산악인"],"vo":[["구별","서로 다른 점에 따라 나누어 놓는 것","모두 똑같이 섞는 것","서로 도와주는 것","크게 칭찬하는 것"],["정복","어려운 곳이나 목표에 끝까지 올라 이겨 내는 것","산에서 길을 잃는 것","산을 깎아서 없애는 것","산 아래에서 구경만 하는 것"]],"mi":["직업은 매우 다양하다.","예전에는 직업에 남녀 구별이 있었다.","최근에는 직업의 남녀 구별이 없어지고 있다.","중요한 것은 무엇을 잘하고 좋아하느냐이다."],"ks":[[2,"예전에는 이러한"],[3,"그러나 최근에는"]],"ev":["요즘은 여자도 버스나 택시를 운전한다는 것을 알 수 있는 문장은?","여자 운전사를","3문단에 시내버스나 택시를 운전하는 여자 운전사를 자주 볼 수 있다고 나와 있어요."],"p":["직업은 참 다양합니다. 물건을 만드는 사람, 물건을 파는 사람, 회사에서 사무를 보는 사람, 운전을 하는 사람 등 여러 일터에서 사람들은 각각 다른 일을 하고 있습니다.","예전에는 이러한 직업에도 남녀의 구별이 있었습니다. 예를 들어, 자동차 운전이나 공사장의 큰 기계를 다루는 일은 남자들이 했습니다. 음식을 만드는 일이나 머리를 자르는 일은 주로 여자들이 했습니다.","그러나 최근에는 직업의 남녀 구별이 없어지고 있습니다. 시내버스나 택시를 운전하는 여자 운전사를 자주 볼 수 있고, 높고 험한 산을 정복하는 여자 산악인도 볼 수 있습니다. 또, 머리를 손질해 주는 남자 미용사를 볼 수 있고, 아름다운 옷을 만드는 남자 디자이너도 볼 수 있습니다.","이처럼 남자가 하는 일과 여자가 하는 일의 구별은 사라져 가고 있습니다. 중요한 것은 어떤 일을 잘 하고 어떤 일을 좋아하느냐입니다."],"g":"lo"},{"n":4,"ti":"가방","to":"가방은 쓰임에 따라 종류가 많고, 물건을 한꺼번에 들고 다닐 수 있어 편리하다.","tx":["보자기는 비가 오면 젖는다.","가방보다 보자기가 더 편리하다."],"cp":1,"fm":"두괄식","th":["사람들이 보자기 대신 가방을 만들게 된 까닭으로 알맞은 것은?","보자기가 튼튼하지 않고 비에 젖어 불편했기 때문에","보자기가 너무 비쌌기 때문에","보자기는 색깔이 한 가지뿐이었기 때문에","가방이 보자기보다 예뻤기 때문에","3문단에 보자기는 튼튼하지 않고 비가 오면 젖어서 불편했다고 나와요."],"kw":["가방","보자기","재료","비"],"vo":[["쓰임","물건이 쓰이는 곳이나 쓰이는 방법","물건의 값","물건의 색깔","물건의 무게"],["한꺼번에","여러 번 나누지 않고 한 번에 모두","아주 천천히 하나씩","아무것도 없이","다른 사람과 번갈아"]],"mi":["가방은 물건을 한꺼번에 들고 다닐 수 있어 편리하다.","가방에는 여러 가지 종류가 있다.","보자기가 불편해서 여러 가지 가방을 만들게 되었다."],"ks":[[2,"가방에는 여러"],[3,"그래서 사람들은"]],"ev":["가방이 쓰임에 따라 여러 가지로 나뉜다는 예를 찾을 수 있는 문장은?","책가방, 여행용 가방","2문단에 책가방, 여행용 가방, 사무용 가방이 예로 나와요."],"p":["가방이 있으면 여러 가지 물건을 넣어 한꺼번에 들고 다닐 수 있어 참 편합니다.","가방에는 여러 가지 종류가 있습니다. 책가방, 여행용 가방, 그리고 사무용 가방 등 쓰임에 따라 여러 가지로 나눌 수 있습니다.","예전에는 보자기를 많이 사용했습니다. 그러나 보자기는 튼튼하지도 않고, 비가 오면 젖어서 불편했습니다. 그래서 사람들은 물에 젖지 않고 오래 써도 망가지지 않는 재료로 여러 가지 가방을 만들게 되었습니다."],"g":"lo"},{"n":5,"ti":"스케이트와 인라인 스케이트","to":"스케이트와 인라인 스케이트의 차이점과 공통점","tx":["인라인 스케이트는 공원에서 탄다.","스케이트는 인라인 스케이트보다 빠르다."],"cp":1,"fm":"두괄식","th":["눈도 얼음도 없는 따뜻한 봄날, 동네 공원에서 탈 수 있는 것은?","인라인 스케이트","스케이트","둘 다 탈 수 없다","스케이트날만 떼어서 탄다","스케이트는 얼음 위에서만 탈 수 있지만 인라인 스케이트는 평평한 바닥이면 어디서나 탈 수 있어요."],"kw":["스케이트","가죽","골목","강철"],"vo":[["공통점","둘 이상의 것에 똑같이 있는 점","서로 다른 점","가장 나쁜 점","새로 생긴 점"],["밑창","신발의 바닥에 댄 부분","신발 끈","신발의 윗부분","신발을 넣는 상자"]],"mi":["스케이트와 인라인 스케이트는 공통점과 차이점이 있다.","스케이트에는 금속날이, 인라인 스케이트에는 바퀴가 붙어 있다.","스케이트는 얼음 위에서만, 인라인 스케이트는 어디서나 탈 수 있다.","둘 다 발에 신고 탄다는 공통점이 있다."],"ks":[[2,"금속날을 붙인 스케이트와는"],[3,"그러나 인라인 스케이트는"]],"ev":["스케이트가 얼음 위를 잘 달릴 수 있는 까닭을 알려 주는 문장은?","날카로운 스케이트날 덕분에","2문단에 날카로운 스케이트날 덕분에 얼음 위를 달릴 수 있다고 했어요."],"p":["스케이트와 인라인 스케이트는 공통점과 차이점이 있습니다.","스케이트는 가죽으로 만든 신발의 밑창에 금속날을 붙여 만든 것입니다. 스케이트의 금속날은 강철을 얇게 펴서 만든 것입니다. 이 날카로운 스케이트날 덕분에 얼음 위를 신나게 달릴 수 있습니다. 금속날을 붙인 스케이트와는 달리, 인라인 스케이트는 신발의 밑창에 바퀴가 붙어 있습니다.","스케이트는 얼음 위에서만 탈 수 있습니다. 그러나 인라인 스케이트는 평평한 바닥만 있으면 어느 곳에서나 탈 수 있습니다. 그래서 인라인 스케이트는 공원이나 동네 골목에서 아이들이 많이 탑니다.","그러나 스케이트와 인라인 스케이트 모두 발에 신고 타는 것이라는 공통점이 있습니다."],"g":"lo"},{"n":6,"ti":"손수건","to":"손수건은 언제 어디서나 쓸 일이 많으니 항상 몸에 지니고 다니자.","tx":["손수건은 땀을 닦는 데만 쓴다.","손수건은 들고 다니기 불편하다."],"cp":3,"fm":"양괄식","th":["소풍 가서 넘어져 무릎에 작은 상처가 났어요. 이 글과 관련해 알맞은 생각은?","손수건이 있으면 상처를 감쌀 수 있어 편리하겠다.","손수건은 손을 닦을 때만 써야 한다.","상처가 나면 손수건을 버려야 한다.","손수건은 집에만 두는 것이 좋다.","2문단에 작은 상처가 났을 때도 손수건을 편리하게 쓸 수 있다고 했어요."],"kw":["손수건","화장","흙","먼지"],"vo":[["용도","쓰이는 곳이나 쓰는 방법","물건의 모양","물건의 값","물건을 만든 사람"],["지니다","몸에 가지고 있다","잃어버리다","빌려주다","깨끗이 빨다"]],"mi":["손수건을 항상 몸에 지니고 다니는 까닭","손수건의 다양한 용도","손수건을 항상 몸에 지니고 다니자."],"ks":[[1,"손수건은 무엇 때문에"],[3,"손수건을 항상 가지고"]],"ev":["손수건이 손이나 땀을 닦는 일 말고도 쓰인다는 것을 알 수 있는 문장은?","길을 가다가","2문단에 흙이나 먼지가 묻었을 때, 음식을 먹은 뒤, 작은 상처가 났을 때 등 여러 경우가 나와요."],"p":["손수건은 무엇 때문에 항상 몸에 지니고 다녀야 할까? 그것은 손수건의 용도는 언제 어디에서나 발생될 수 있기 때문이다.","손수건의 용도는 반드시 손이나 땀을 씻는 것이 그 전부는 아니다. 길을 가다가 옷에 흙이나 먼지가 묻는 다던가 음식을 먹은 다음, 혹은 화장을 고칠 때, 또는 작은 상처가 났을 때 손수건은 가장 편리하게 이용될 수 있다. 이 때문에 손수건은 항상 몸에 지니게 된다.","이렇게 손수건은 언제 어디서나 사용할 순간이 많다. 손수건을 항상 가지고 다니는 것이 조금 불편하다 하더라도 이렇게 언제 어디서나 사용해야 하는 손수건을 몸에 지니고 다니자."],"g":"lo"},{"n":7,"ti":"컴퓨터 프로그램 불법 복제","to":"컴퓨터 프로그램을 불법으로 복제하지 말자.","tx":["컴퓨터 프로그램은 만들기 쉽다.","불법 복제를 하면 프로그램을 싸게 쓸 수 있다."],"cp":3,"fm":"미괄식","th":["친구가 “산 게임 프로그램을 복사해 줄게.”라고 해요. 이 글을 읽은 내가 할 말로 알맞은 것은?","“불법 복제는 모두에게 손해니까 하지 말자.”","“고마워, 많이 복사해 줘.”","“다른 친구들에게도 나눠 주자.”","“프로그램은 원래 공짜야.”","글쓴이는 불법 복제가 나라와 사용하는 사람 모두에게 손해를 끼친다고 했어요."],"kw":["불법 복제","국가","개발","노력"],"vo":[["대수롭지 않다","중요하게 여길 만하지 않다","매우 중요하다","아주 어렵다","무척 무섭다"],["복제","원래의 것과 똑같이 만드는 것","새롭게 발명하는 것","깨끗이 지우는 것","값을 내고 사는 것"]],"mi":["프로그램 만드는 일을 가볍게 여겨 불법 복제가 많다.","불법 복제는 나라와 사용자 모두에게 손해를 끼친다.","불법 복제를 하지 않도록 노력해야 한다."],"ks":[[1,"그래서 프로그램의 불법"],[2,"그러나, 프로그램의"]],"ev":["불법 복제가 많으면 왜 좋은 프로그램을 쓸 수 없게 되나요? 그 까닭을 알려 주는 문장은?","불법 복제가 많이 이루어지면","2문단 두 번째 문장에 프로그램 개발을 하지 않게 되어 쓸 수 없게 된다고 했어요."],"p":["컴퓨터를 사용하는 사람들 중에서 컴퓨터 프로그램을 만드는 것을 대수롭지 않게 생각하는 사람이 있는 것 같다. 그래서 프로그램의 불법 복제가 많이 이루어지는 것은 아닌가 하는 생각이 든다.","그러나, 프로그램의 불법 복제를 하는 것은 국가적으로도 손해를 끼치는 것뿐만 아니라 사용하는 사람에게도 손해를 끼치는 일이다. 불법 복제가 많이 이루어지면 프로그램 개발을 하지 않게 되어 국가적 손실이 발생되며, 유용한 프로그램이 개발되지 않아 결국 사용하는 사람도 이러한 프로그램을 사용할 수 없게 된다.","따라서 컴퓨터를 진정으로 유용하게 사용하기 위해서는 불법 복제를 하지 않는 우리의 노력이 필요하다."],"g":"lo"},{"n":8,"ti":"글쓰기와 옷 만들기","to":"글을 쓰는 일은 옷을 만드는 일처럼 일정한 단계를 밟아야 한다.","tx":["옷을 만들 때는 다림질이 가장 중요하다.","글은 생각나는 대로 빨리 써야 한다."],"cp":3,"fm":"미괄식","th":["옷을 다 만든 뒤 ‘마무리 작업’을 하듯, 글을 다 쓴 뒤 해야 할 일은?","쓴 글을 다시 읽어 보고 고친다.","글을 읽을 사람을 정한다.","알맞은 글감을 고른다.","글쓰기 계획을 세운다.","옷을 만든 뒤 마무리 작업을 하듯, 글도 다 쓴 뒤 다시 읽고 고쳐요(2문단 다섯째)."],"kw":["단계","단추","셔츠","다림질"],"vo":[["마름질","옷감을 치수에 맞게 재어 자르는 일","옷을 빨아 말리는 일","옷에 단추를 다는 일","옷을 개어 넣는 일"],["글감","글을 쓸 때 쓰는 재료나 내용","글을 쓰는 연필","글을 적는 종이","글을 읽는 사람"]],"mi":["옷을 만드는 과정","글을 쓰는 과정","글을 쓰는 일은 옷을 만드는 일과 같다."],"ks":[[2,"이 과정을 보면"],[3,"결론적으로"]],"ev":["단계가 흐트러지면 어떻게 된다고 했나요? 그 내용이 담긴 문장은?","이러한 과정이 흐트러지면","3문단 마지막 문장에 훌륭한 글도, 멋진 옷도 만들 수 없다고 했어요."],"p":["옷을 만드는 과정을 한번 살펴보자. 첫째, 옷을 만들려면 먼저 누가, 언제, 어디서 입을 옷인가를 결정해야 한다. 둘째, 그 셔츠에 알맞은 옷감을 골라야 한다. 셋째, 옷감을 골랐으면 이제 어떤 모양으로 할 것인지를 정해야 한다. 넷째, 옷감에다 밑그림을 그리고 그 밑그림에 따라 마름질을 한다. 마름질이 끝난 후 정성스럽게 바느질을 한다. 다섯째, 마무리 작업을 한다. 단추도 달고 실밥도 뜯고, 입고 나갈 수 있도록 다림질도 한다.","이 과정을 보면 우리가 글을 쓰는 과정이 옷을 만드는 일과 같음을 알 수 있다. 글을 쓸 때에도, 첫째, 이 글을 읽을 대상을 정한다. 둘째, 그 글에 알맞은 글감을 정한다. 셋째, 글감을 골랐으면 이 글감을 어떻게 다듬어 글로 나타낼지 정해야 한다. 넷째, 글을 쓰기 위한 계획을 세우고, 글을 쓴다. 다섯째, 쓴 글을 다시 읽어보고 수정한다.","결론적으로, 글을 쓰는 일은 옷을 만드는 일과 같다. 글을 쓸 때도, 옷을 만들 때도 우리는 일정한 단계를 밟아 일을 해나가게 된다. 이러한 과정이 흐트러지면 우리는 훌륭한 글도, 멋진 옷도 만들 수 없다."],"g":"lo"},{"n":9,"ti":"개구리의 먹이와 우는 법","to":"개구리의 먹이와 우는 법","tx":["개구리는 물속에서만 산다.","개구리는 죽은 벌레를 좋아한다."],"cp":1,"fm":"두괄식","th":["연못가에서 개구리 울음소리가 크게 들려요. 이 글로 알 수 있는 사실은?","울고 있는 개구리는 수컷이다.","울고 있는 개구리는 암컷이다.","개구리는 배가 고플 때 운다.","모든 개구리의 울음소리는 똑같다.","3문단에 우는 것은 수컷뿐이며 대개 암컷을 부를 때 운다고 했어요."],"kw":["개구리","거미","실","메뚜기"],"vo":[["독특하다","다른 것과 달리 특별하다","다른 것과 똑같다","아주 시끄럽다","매우 흔하다"],["순식간","눈 깜짝할 사이처럼 아주 짧은 동안","아주 오랜 시간","하루 종일","일 년 동안"]],"mi":["개구리의 먹이와 우는 법을 알아보자.","개구리의 먹이","개구리의 우는 법"],"ks":[[1,"여기서는 개구리의"],[3,"개구리의 우는 법은"]],"ev":["개구리가 움직이지 않는 먹이는 먹지 않는다는 것을 알 수 있는 문장은?","움직이지 않는 것은","2문단에 움직이지 않는 것은 먹지 않는다고 나와 있어요."],"p":["물속에서 사는 동물은 땅 위에서 사는 동물과 여러 가지로 크게 다르다. 그런데 신기하게도 물속과 땅 위 양쪽에서 사는 신기한 동물들이 있다. 그 중의 하나가 바로 개구리이다. 여기서는 개구리의 먹이, 우는 법에 대하여 알아보겠다.","이런 개구리들은 나방, 거미, 달팽이, 배추벌레, 귀뚜라미, 메뚜기 등을 먹는다. 그런데 특이한 것은 움직이지 않는 것은 먹지 않는다는 점이다. 죽은 것도 실에 묶어 흔들어 주면 혀를 뻗어 순식간에 잡아먹는다.","개구리의 우는 법은 매우 독특하다. 목을 잔뜩 부풀려 울음 주머니를 공명시키는 방법으로 운다. 개구리의 울음소리는 종류에 따라 조금씩 다르다. 개구리들 중에서 우는 것은 수컷들뿐인데 대개 암컷을 부를 때 운다."],"g":"lo"},{"n":10,"ti":"어머니와 아버지","to":"어머니와 아버지를 소개하는 글","tx":["어머니는 화가 나면 무섭다.","아버지는 키가 크다."],"cp":0,"fm":"병렬식","th":["이 글을 쓴 사람은 누구일까요?","어머니와 아버지의 자녀","어머니의 친구","아버지의 회사 동료","요리 선생님","‘나를 놀라게도 합니다’, ‘저를 항상 돌봐 주십니다’ 같은 말로 보아 부모님의 자녀가 쓴 글이에요."],"kw":["어머니와 아버지","수영","반찬","센티미터"],"vo":[["내성적","감정이나 생각을 겉으로 잘 드러내지 않는 성격","누구에게나 먼저 말을 거는 성격","화를 자주 내는 성격","장난을 좋아하는 성격"],["온화하다","성격이 부드럽고 따뜻하다","성격이 급하고 사납다","몸이 아주 튼튼하다","말이 아주 많다"]],"mi":["어머니의 특기와 취미","어머니의 성격","아버지의 건강한 체력","아버지의 성격"],"ks":[[2,"어머니의 성격은"],[4,"아버지의 성격은"]],"ev":["아버지의 가장 좋은 점이 무엇인지 알 수 있는 문장은?","아버지의 제일 좋은 점은","4문단 마지막 문장에 화를 잘 내시지 않는 것이라고 했어요."],"p":["어머니의 특기는 요리이고, 취미는 독서와 음악 감상, 수영입니다. 그리고 어머니는 반찬 솜씨가 아주 좋습니다. 가끔씩 특별 요리로 나를 놀라게도 합니다.","어머니의 성격은 조용하고 내성적입니다. 가끔 화가 나실 때에는 아주 무섭습니다. 그러나 어머니는 나를 아주 사랑하십니다. 사랑과 정성으로 저를 항상 돌봐 주십니다.","아버지는 아주 건강한 체력을 갖고 있습니다. 키 178 센티미터에 몸무게 80 킬로그램으로 운동을 좋아하십니다.","아버지의 성격은 온화하고 조용하지만 가끔씩 웃기기도 하십니다. 특히 좋아하시는 것은 요리 만들기입니다. 아버지의 제일 좋은 점은 화를 잘 내시지 않는 것입니다."],"g":"lo"},{"n":11,"ti":"갯벌의 소중함","to":"갯벌은 사람과 자연에게 꼭 필요한 소중한 공간이다.","tx":["갯벌은 찐득찐득한 진흙이다.","갯벌 여행은 재미가 없다."],"cp":1,"fm":"두괄식","th":["갯벌을 ‘자연의 정화조’라고 부르는 까닭은 무엇일까요?","갯벌 생물들이 오폐수 속 유기물을 먹어 바다를 깨끗하게 하기 때문에","갯벌에 물이 가득 고여 있기 때문에","갯벌에서 소금을 만들기 때문에","갯벌에 사람이 많이 놀러 오기 때문에","2문단에 갯벌 생물들이 오폐수 속 유기물을 먹이로 먹는다고 했어요. 정화조는 더러운 물을 깨끗하게 하는 통이에요."],"kw":["갯벌","갈대","펄","산소"],"vo":[["정화조","더러운 물을 깨끗하게 거르는 통","물고기를 기르는 어항","빗물을 모아 두는 통","불을 끄는 소화기"],["허파","숨을 쉬게 하는 몸속 기관(폐)","음식을 소화하는 위","피를 온몸에 보내는 심장","소리를 듣는 귀"]],"mi":["갯벌은 사람에게 꼭 필요한 공간이며 종류가 여러 가지이다.","갯벌은 자연의 정화조이다.","갯벌은 지구의 허파이다.","갯벌 생물을 만나려면 갯벌의 종류와 생물의 습성을 알아야 한다."],"ks":[[1,"갯벌은 사람에게"],[3,"갯벌은 지구의 허파"]],"ev":["갯벌의 식물들이 공기를 좋게 만든다는 것을 알 수 있는 문장은?","공기 중으로 산소를","3문단에 식물들이 공기 중으로 산소를 내보낸다고 했어요."],"p":["갯벌은 사람에게 꼭 필요한 공간이다. 흔히 갯벌 하면 찐득찐득한 진흙의 검은색 나는 펄을 생각하기 쉽다. 그러나 이런 펄은 갯벌의 한 종류일 뿐이다. 갯벌은 펄갯벌, 모래갯벌, 혼합갯벌, 바위갯벌로 나뉜다. 종류마다 먹이가 다르고, 그곳에서 살아가는 생물도 다르다.","갯벌은 자연의 정화조이다. 갯벌 생물들은 사람들이 바다에 흘려 보낸 오폐수 속에 들어 있는 유기물을 먹이로 섭취한다.","갯벌은 지구의 허파이다. 갯벌은 동물뿐만 아니라 수많은 식물들이 살아가는 공간이다. 갈대, 갯질경이, 눈에 보이지 않을 정도로 작은 바닷말류까지 엄청나게 많은 식물들이 살아가면서 공기 중으로 산소를 내보낸다.","다양한 갯벌의 생물들을 만나기 위해서는 그 생물들이 좋아하는 갯벌의 종류와 생물들의 습성을 알아야 한다. 신나고 재미있는 갯벌여행은 그냥 얻어지는 것이 아니다."],"g":"lo"},{"n":12,"ti":"고마운 나무","to":"나무가 주는 혜택을 누리기 위해 나무를 꾸준히 심고 가꾸자.","tx":["이 책은 종이로 만들었다.","산에 나무가 많으면 홍수가 난다."],"cp":4,"fm":"양괄식","th":["나무가 모두 없어진다면 어떤 일이 생길지 가장 알맞게 짐작한 것은?","공기가 탁해지고 종이를 만들기 어려워진다.","홍수와 가뭄이 모두 사라진다.","공기가 더 맑아진다.","책이 더 많아진다.","나무는 공기를 맑게 하고 홍수·가뭄을 막으며 종이의 재료가 돼요."],"kw":["나무","가뭄","책","홍수"],"vo":[["혜택","도움이나 이익을 받는 것","손해를 보는 것","벌을 받는 것","걱정을 하는 것"],["가꾸다","식물이 잘 자라도록 보살피다","나무를 베어 내다","꽃을 꺾다","씨앗을 버리다"]],"mi":["나무는 많은 혜택을 준다.","나무는 공기를 맑게 하고 홍수와 가뭄을 막는다.","나무는 종이를 만드는 데에도 쓰인다.","나무를 꾸준히 심고 가꾸어야 한다."],"ks":[[2,"나무는 공기를 맑게"],[4,"나무가 주는 혜택을 누리기"]],"ev":["나무가 홍수를 막는 데 도움을 준다는 것을 알 수 있는 문장은?","산에 나무가 많으면","2문단에 산에 나무가 많으면 홍수나 가뭄을 막을 수 있다고 했어요."],"p":["나무는 우리에게 많은 혜택을 줍니다.","나무는 공기를 맑게 합니다. 그것이 많은 곳은 공기가 맑습니다. 산에 나무가 많으면 홍수나 가뭄을 막을 수도 있습니다.","나무가 주는 혜택은 이것만이 아닙니다. 나무는 종이를 만드는 데에도 쓰입니다. 우리가 보는 이 책도 종이로 만들었습니다.","만약 나무가 없다면 우리는 많은 불편을 겪을 것입니다. 나무가 주는 혜택을 누리기 위하여 우리는 꾸준히 나무를 심고 가꾸어야 합니다."],"g":"lo"},{"n":13,"ti":"무지개","to":"무지개가 생기는 까닭과 모양, 무지개에 얽힌 이야기","tx":["무지개는 일곱 가지 색이다.","무지개는 밤에 볼 수 있다."],"cp":0,"fm":"병렬식","th":["맑은 날 마당에서 분무기로 물을 뿌렸더니 작은 무지개가 보였어요. 그 까닭은?","공중에 뿌려진 물방울이 햇빛을 받았기 때문에","분무기 속에 물감이 들어 있었기 때문에","비가 오는 중이었기 때문에","밤이 되었기 때문에","1문단에 무지개는 공중에 떠 있는 물방울이 햇빛을 받아 생긴다고 했어요."],"kw":["무지개","선녀","계곡","남색"],"vo":[["반원","원을 반으로 나눈 모양","네모난 모양","세모난 모양","완전히 둥근 모양"],["조상","지금의 우리보다 먼저 살았던 옛날 사람들","지금 함께 사는 이웃","앞으로 태어날 사람들","먼 나라 사람들"]],"mi":["무지개가 생기는 까닭","무지개의 모양과 빛깔","조상들이 생각한 무지개"],"ks":[[1,"그래서 무지개는 비가"],[3,"우리 조상들은 무지개를"]],"ev":["무지개가 무엇 때문에 생기는지 알 수 있는 문장은?","무지개는 공중에 떠 있는","1문단에 공중에 떠 있는 물방울이 햇빛을 받아 생긴다고 했어요."],"p":["우리는 비가 온 뒤에 가끔 무지개가 뜨는 것을 볼 수 있습니다. 무지개는 공중에 떠 있는 물방울이 햇빛을 받아 생깁니다. 그래서 무지개는 비가 그친 뒤에 볼 수 있습니다.","무지개는 반원 모양의 띠처럼 생겼습니다. 빨강, 주황, 노랑, 초록, 파랑, 남색, 보라 빛깔로 이루어져 매우 아름답습니다.","우리 조상들은 무지개를 하늘과 땅을 이어 주는 다리로 여겼습니다. 그래서 선녀가 무지개를 타고 계곡에 목욕하러 내려온다는 이야기도 생겼습니다."],"g":"lo"},{"n":14,"ti":"월드컵 축구 대회","to":"세계인의 잔치인 월드컵 축구 대회","tx":["월드컵은 1930년에 처음 열렸다.","월드컵은 우리나라에서만 열린다."],"cp":1,"fm":"두괄식","th":["월드컵을 ‘세계인의 잔치’라고 부르는 까닭으로 알맞은 것은?","여러 나라 사람들이 축구로 함께 어울리기 때문에","경기가 끝나면 잔치 음식을 먹기 때문에","한 나라 사람들만 모이기 때문에","해마다 열리기 때문에","2문단에 축구를 함으로써 여러 나라 사람들이 함께 어울리는 잔치라고 했어요."],"kw":["월드컵","우루과이","일본","문화 행사"],"vo":[["공동","둘 이상이 함께 하는 것","혼자서 하는 것","몰래 하는 것","서로 다투는 것"],["단순하다","복잡하지 않고 간단하다","아주 복잡하다","매우 특별하다","무척 위험하다"]],"mi":["가장 유명한 축구 대회인 월드컵","세계인의 잔치인 월드컵","2002년 우리나라와 일본이 함께 연 월드컵"],"ks":[[1,"그 중에서 가장 유명한"],[2,"축구를 함으로써"]],"ev":["월드컵이 몇 년마다 열리는지 알 수 있는 문장은?","4년에 한 번씩","1문단에 4년에 한 번씩 열린다고 했어요."],"p":["여러 나라가 참가하는 축구 대회는 많이 있습니다. 그 중에서 가장 유명한 축구 대회가 바로 월드 컵 축구 대회입니다. 이 대회는 1930년에 우루과이에서 처음 열린 이후로 4년에 한 번씩 열리고 있습니다.","세계인의 관심 속에서 열리는 이 대회는 단순한 축구 대회가 아닙니다. 축구를 함으로써 여러 나라 사람들이 함께 어울리는 세계인의 잔치입니다. 이 대회가 열리는 동안 여러 가지 문화 행사도 볼 수 있습니다.","2002년에는 제17회 월드 컵 축구 대회가 열렸습니다. 이 대회는 우리나라와 일본이 공동으로 열었습니다. 우리 나라에서는 온 국민이 힘을 모아 준비하여 월드 컵 축구 대회를 세계인의 잔치로 만들었습니다."],"g":"lo"},{"n":15,"ti":"자연의 소중함","to":"자연을 아끼고 보호하자.","tx":["공기와 물은 자연에서 얻는다.","자연 보호는 나라에서만 하는 일이다."],"cp":5,"fm":"미괄식","th":["이 글에서 말한 ‘자연을 보호하는 방법’을 실천한 어린이는?","산에서 불장난을 하지 않고 나무를 아낀 지민","냇가의 물고기를 잔뜩 잡아 온 현우","산에 쓰레기를 묻고 온 서연","나뭇가지를 꺾어 칼싸움을 한 도윤","4문단에 산불을 조심하고 나무를 가꾸는 것이 자연을 보호하는 방법이라고 했어요."],"kw":["자연","식료품","가스","산불"],"vo":[["파괴","부수거나 망가뜨리는 것","새로 만드는 것","깨끗이 청소하는 것","잘 지키는 것"],["원료","물건을 만드는 데 들어가는 재료","물건을 파는 곳","물건의 이름","물건을 쓰는 방법"]],"mi":["생활에 필요한 것은 대부분 자연에서 얻는다.","자연에서 얻는 것은 셀 수 없이 많다.","자연이 파괴되고 있어 자연 보호가 필요하다.","자연을 보호하는 여러 가지 방법","어린이들도 자연을 아끼도록 노력해야 한다."],"ks":[[3,"그러므로 사람은 자연을"]],"ev":["자연이 망가지고 있는 까닭을 알 수 있는 문장은?","자연을 함부로 다루어서","3문단에 사람들이 자연을 함부로 다루어서 자연이 파괴되어 간다고 했어요."],"p":["우리는 생활에 필요한 것들을 대부분 자연에서 얻는다.","공기나 물을 비롯하여 식료품, 옷감의 원료 등 자연에서 얻어지는 것은 이루 헤아릴 수 없다.","그러므로 사람은 자연을 떠나서는 살 수 없다. 그런데 사람들이 자연을 함부로 다루어서 자연이 자꾸자꾸 파괴되어 가고 있다. 그래서 나라에서는 오래 전부터 자연 보호 운동을 펼치고 있다. 어떻게 하면 자연을 쓸모 있게 이용하면서 아끼고 잘 가꾸어 나갈 수 있을까?","우선, 산에 나무를 많이 심고 아름답게 가꾸어야 한다. 그리고 공장이나 자동차 등에서 나쁜 가스를 마구 뿜어 내지 않도록 하고, 물고기를 마구 잡지 않으며 산불을 조심하는 것 등이 모두 자연을 보호하는 훌륭한 방법이다.","그러므로 우리 어린이들도 한 그루의 나무, 한 마리의 물고기 등을 아껴서 아름다운 자연이 되도록 노력해야겠다."],"g":"lo"},{"n":16,"ti":"민수의 다짐","to":"바른 자세로 앉아 책을 읽자.","tx":["아버지는 운전을 잘하신다.","엎드려서 책을 읽으면 편하다."],"cp":2,"fm":"미괄식","th":["민수가 바른 자세로 책을 읽겠다고 다짐한 까닭은?","허리를 구부리고 운전해서 허리가 아프신 아버지를 보고","책상이 너무 낮아서","의사 선생님께 혼이 나서","책이 재미없어서","구부린 자세 때문에 허리가 아프셨다는 아버지 이야기를 듣고 민수는 자기 자세를 돌아보았어요."],"kw":["바른 자세","운전","병원","방바닥"],"vo":[["편찮다","(웃어른이) 몸이 아프다","기분이 무척 좋다","마음이 편안하다","배가 고프다"],["다짐","마음을 굳게 먹고 스스로 약속하는 것","다른 사람을 탓하는 것","할 일을 미루는 것","잊어버리는 것"]],"mi":["민수는 엎드려 책을 읽었다.","아버지의 이야기를 듣고 민수는 바른 자세로 책을 읽겠다고 다짐했다."],"ks":[[1,"민수는 책상에 엎드려"],[2,"그래서 민수는 앞으로"]],"ev":["엎드려서 책을 읽던 민수가 불편했던 점을 알 수 있는 문장은?","한참 있으니 목이 아팠습니다","1문단에 한참 있으니 목이 아팠다고 했어요."],"p":["민수는 책상에 엎드려 책을 읽었습니다. 한참 있으니 목이 아팠습니다. 그래서 이번에는 방바닥에 엎드려 책을 읽었습니다.","그때 아버지께서 돌아오셨습니다. 아버지께서는 무척 편찮아 보이셨습니다. 아버지께 어디 아프냐고 여쭈어 보았더니 허리를 구부리고 운전해서 허리가 아프시다고 하셨습니다. 그리고 병원에 갔더니 의사선생님께서 바른 자세로 운전을 해야 한다고 하셨다고 합니다. 그래서 민수는 앞으로 바른 자세로 앉아 책을 읽어야겠다고 다짐하였습니다."],"g":"lo"},{"n":17,"ti":"메아리","to":"내가 먼저 고운 말을 써야 고운 말이 돌아온다.","tx":["산꼭대기에 올라가면 기분이 좋다.","산에서는 소리를 지르면 안 된다."],"cp":3,"fm":"미괄식","th":["이 이야기의 메아리처럼, 우리 생활에서 비슷한 일이 일어나는 경우는?","내가 친구에게 먼저 다정하게 말하면 친구도 다정하게 대답한다.","친구가 화를 내도 나는 모른다.","산에 가면 항상 비가 온다.","혼자 있으면 심심하다.","메아리가 내 말을 그대로 돌려주듯, 내가 하는 말과 행동은 나에게 돌아와요."],"kw":["메아리","산꼭대기","건너편","얼굴"],"vo":[["곰곰이","여러모로 깊이 생각하는 모양","아주 빠르게","크게 소리 지르며","아무 생각 없이"],["미소","소리 없이 빙긋이 웃는 웃음","큰 소리로 우는 것","화난 얼굴","찡그린 표정"]],"mi":["아이가 산꼭대기에서 “야호!” 하고 소리쳤다.","“바보야!” 하고 외치자 똑같은 말이 들려왔다.","“나는 네가 좋아!”라고 외치자 똑같은 말이 들려와 기분이 좋아졌다."],"ks":[],"ev":["아이가 화가 났을 때 바로 소리치지 않고 생각을 했다는 것을 알 수 있는 문장은?","곰곰이 생각하였습니다","3문단 첫 문장에 화가 났지만 곰곰이 생각했다고 나와요."],"p":["한 아이가 산에 올라갔습니다. 그리고 산꼭대기에 다다라 소리를 질렀습니다. “야호!” 건너편에서 똑같은 소리가 들려 왔습니다. “야호!”","이번에는 이렇게 소리를 질렀습니다. “이, 바보야!” 그러자 저 쪽에서도 똑같은 대답이 들려 왔습니다.","아이는 화가 났지만 곰곰이 생각하였습니다. 잠시 후 아이의 얼굴에 미소가 떠올랐습니다. 아이는 다시 외쳤습니다. “나는 네가 좋아!” 외치자 “나는 네가 좋아!”하고 똑같은 말이 들려왔습니다. 아이는 기분이 좋아졌습니다."],"g":"lo"},{"n":18,"ti":"원숭이 공연 안내","to":"원숭이 공연을 보러 분수대 옆 무대 앞으로 오세요.","tx":["동물원에는 코끼리 열차가 있다.","동물원은 세 시에 문을 닫는다."],"cp":2,"fm":"중괄식","th":["이 글은 어떤 상황에서 들을 수 있는 말일까요?","동물원에서 방송으로 안내하는 말","학교에서 선생님이 수업하는 말","친구에게 쓴 편지","동물에 대해 설명하는 책","‘찾아 주셔서 감사합니다’, ‘오십시오’ 같은 말로 보아 동물원 안내 방송이에요."],"kw":["원숭이 공연","버스 정류장","코끼리 열차","분수대"],"vo":[["공연","관객 앞에서 음악, 춤, 재주 등을 보여 주는 것","동물에게 먹이를 주는 것","표를 사는 것","집으로 돌아가는 것"],["정류장","버스나 차가 멈추어 사람을 태우고 내리는 곳","물건을 사고파는 곳","동물이 사는 곳","공연을 하는 무대"]],"mi":["동물원을 찾아 주셔서 감사하다.","원숭이 공연을 보려면 분수대 옆 무대 앞으로 오세요.","돌아가실 분은 코끼리 열차를 타세요."],"ks":[[2,"원숭이 공연을 보시려면"]],"ev":["원숭이 공연이 몇 시에 시작하는지 알 수 있는 문장은?","세 시부터는","2문단 첫 문장에 세 시부터 시작한다고 했어요."],"p":["오늘도 저희 동물원을 찾아 주셔서 감사합니다.","잠시 후 세 시부터는 저희 동물원의 자랑인 원숭이 공연이 시작됩니다. 원숭이 공연을 보시려면 분수대 옆에 있는 무대 앞으로 오십시오. 많이 오셔서 즐겁게 구경하시기 바랍니다.","원숭이 공연이 끝난 뒤에 집으로 돌아가실 분은 코끼리 열차를 타면 되는데 코끼리 열차는 버스 정류장까지 여러분을 안전하게 모셔 드릴 것입니다."],"g":"lo"},{"n":19,"ti":"특기·적성 교육 장소","to":"특기·적성 교육 장소를 잘 기억해 두었다가 참여하자.","tx":["태권도는 운동장에서 배운다.","특기·적성 교육은 모두 음악실에서 한다."],"cp":4,"fm":"미괄식","th":["이 글은 누가 누구에게 하는 말일까요?","선생님이 어린이들에게 방송으로 알리는 말","어린이가 부모님께 쓴 편지","친구끼리 나누는 대화","책에 나오는 옛날이야기","‘어린이 여러분, 안녕하세요.’로 시작하고 장소를 알려 주는 것으로 보아 안내 방송이에요."],"kw":["장소","태권도","식당","노래"],"vo":[["적성","어떤 일에 알맞은 소질이나 성질","학교의 시간표","운동장의 크기","선생님의 이름"],["참여","어떤 일에 함께 끼어 참가하는 것","멀리서 구경만 하는 것","빠지고 쉬는 것","집으로 돌아가는 것"]],"mi":["특기·적성 교육 장소를 알려 주겠다.","교육 장소는 모두 다르다.","노래는 음악실, 그림은 한빛 동산, 태권도는 조회대 앞","장소를 잘 기억해 두었다가 참여하자."],"ks":[[1,"지금부터 특기"]],"ev":["그림을 그리고 싶은 어린이가 가야 할 곳을 알 수 있는 문장은?","그림을 그리고 싶은","3문단 두 번째 문장에 식당 옆 한빛 동산으로 가라고 했어요."],"p":["어린이 여러분, 안녕하세요. 오늘은 특기․적성 교육을 하는 날입니다. 지금부터 특기․적성 교육을 하는 장소를 알려드리겠습니다.","특기․적성 교육을 하는 장소는 모두 다릅니다.","노래를 하고 싶은 어린이는 본관 2층 음악실로 가야합니다. 그림을 그리고 싶은 어린이는 식당 옆에 있는 한빛 동산으로 가고, 태권도를 배우고 싶은 어린이는 운동장 조회대 앞에 모입니다.","특기․적성 교육을 하는 어린이는 장소를 잘 기억해 두었다가 참여하도록 하세요."],"g":"lo"},{"n":20,"ti":"자갈을 모으는 어름치","to":"어름치는 알이 떠내려가지 않도록 자갈을 모아 탑처럼 쌓는다.","tx":["어름치는 맑은 물에 산다.","어름치는 자갈을 먹는다."],"cp":3,"fm":"미괄식","th":["어름치가 사는 강에 흙탕물과 쓰레기가 많아진다면 어떻게 될까요?","맑은 물에 사는 어름치가 살기 어려워진다.","어름치가 더 많아진다.","어름치가 자갈을 더 잘 모은다.","아무 일도 일어나지 않는다.","1문단에 어름치는 맑은 물에 사는 물고기라고 했어요."],"kw":["어름치","4월","구덩이","입"],"vo":[["구덩이","땅이 움푹하게 파인 곳","높이 쌓은 돌탑","물 위에 뜬 풀","강가의 모래밭"],["떠내려가다","물에 떠서 흘러가 버리다","물속에 가라앉다","하늘로 날아가다","땅속으로 숨다"]],"mi":["어름치는 맑은 물에 사는 물고기이다.","어름치는 봄에 자갈을 강바닥에 모은다.","알이 떠내려가지 않도록 자갈을 탑처럼 쌓는다."],"ks":[[3,"그리고 알이 떠내려가지"]],"ev":["어름치가 자갈을 모으는 때를 알 수 있는 문장은?","4월이나 5월이","2문단에 4월이나 5월이 되면 자갈을 모은다고 했어요."],"p":["어름치는 맑은 물에 사는 물고기입니다.","어름치는 4월이나 5월이 되면 자갈을 입으로 물어다 강바닥에 모읍니다. 어름치는 왜 강바닥에 자갈을 모을까요?","어름치는 강바닥에 구덩이를 파고 알을 낳습니다. 그리고 알이 떠내려가지 않도록 자갈을 물어다 탑처럼 쌓아 올리는 겁니다."],"g":"lo"},{"n":21,"ti":"교통 질서","to":"교통 질서를 잘 지키자.","tx":["건널목에는 신호등이 있다.","자동차가 많으면 길이 막힌다."],"cp":3,"fm":"양괄식","th":["신호등이 빨간불인데 길을 건너려는 동생에게 할 말로 알맞은 것은?","“신호를 안 지키면 사고가 날 수 있어. 초록불을 기다리자.”","“차가 없으면 빨리 뛰어가면 돼.”","“빨간불일 때 건너는 게 더 빨라.”","“다른 사람도 건너니까 괜찮아.”","2문단에 신호등을 보지 않고 건너면 사고가 날 위험이 있다고 했어요."],"kw":["교통 질서","건널목","자동차","불편"],"vo":[["혼잡","여럿이 뒤섞여 어수선하고 복잡한 것","텅 비어 조용한 것","깨끗하게 정리된 것","아주 빠른 것"],["질서","혼란 없이 순서나 차례를 지키는 것","마음대로 하는 것","아주 빨리 가는 것","남보다 먼저 가는 것"]],"mi":["교통 질서를 지켜야 한다.","교통 신호를 안 지키면 위험하고 불편하다.","모두 교통 질서를 잘 지켜야 한다."],"ks":[],"ev":["교통 신호를 안 지키면 길이 막힐 수 있다는 것을 알 수 있는 문장은?","길이 막히는 등","2문단 마지막 문장에 길이 막히는 등 교통이 혼잡해질 수 있다고 했어요."],"p":["우리는 교통 질서를 지켜야 합니다.","건널목을 건널 때에 신호등을 보지 않고 건너면 사고가 날 위험이 있습니다. 그리고 사람들이 교통 신호를 잘 안 지키면 자동차들이 길을 가는 데 불편을 주게 됩니다. 그래서 길이 막히는 등 교통이 혼잡해질 수 있습니다.","따라서, 우리는 모두 교통 질서를 잘 지켜야 합니다."],"g":"lo"},{"n":22,"ti":"발표 시간","to":"친구의 말을 끝까지 잘 들어 주자.","tx":["발표할 때는 목소리가 커야 한다.","정윤이는 발표를 잘한다."],"cp":4,"fm":"미괄식","th":["발표하는 친구를 배려하는 듣는 태도로 알맞은 것은?","발표하는 친구를 바라보며 끝까지 듣는다.","창밖을 바라본다.","옆 친구와 킥킥거린다.","내가 말하고 싶어서 계속 손을 든다.","정윤이처럼 끝까지 들어 주는 태도가 말하는 친구에게 힘이 돼요."],"kw":["듣기","창밖","차례","용기"],"vo":[["조마조마하다","걱정이 되어 마음이 불안하다","무척 즐겁고 신나다","배가 부르다","졸리고 피곤하다"],["관심","어떤 것에 마음이 끌려 주의를 기울이는 것","싫어서 피하는 마음","아무렇지 않은 마음","화가 나는 마음"]],"mi":["말하기·듣기 시간에 용기를 내어 말했다.","친구들이 내 말을 잘 들어 주지 않았다.","정윤이만 끝까지 들어 주었고 나는 제대로 말하지 못했다.","정윤이가 내 말을 들어 줘서 고마웠다."],"ks":[[1,"하지만 용기를 내어"],[3,"이런 친구들의 모습을"]],"ev":["발표할 차례가 되었을 때 ‘나’의 마음을 알 수 있는 문장은?","틀리면 어쩌나","1문단에 틀리면 어쩌나 하고 마음이 조마조마했다고 했어요."],"p":["‘말하기․듣기’ 시간이었다. 내가 친구들 앞에서 말할 차례가 되었다. 틀리면 어쩌나 하고 마음이 조마조마했다. 하지만 용기를 내어 내 생각을 말하기 시작했다.","그런데 진수는 내 말에는 관심이 없는지 창 밖만 바라보고 있었다. 경태와 미선이는 무슨 이야기를 하는지 자기네들끼리 킥킥거렸다. 준호는 내가 말을 하고 있는데도 자기가 말을 하고 싶은지 자꾸 손을 들고…….","이런 친구들의 모습을 보니 내 생각을 제대로 말할 수가 없었다. 다른 친구와 달리 정윤이는 내가 발표하는 것을 끝까지 들어주었다. 친구들이 정윤이처럼 내가 하는 말을 잘 들어 주었으면 좋았을 텐데…….","정윤이가 내 말을 들어 줘서 참 고마웠다."],"g":"lo"},{"n":23,"ti":"또또 상자","to":"다시 쓸 수 있는 물건을 모아 두면 필요할 때 잘 쓸 수 있다.","tx":["혜선이는 공책을 가져오지 않았다.","색종이는 한 번만 써야 한다."],"cp":4,"fm":"미괄식","th":["우리 반에 ‘또또 상자’가 생긴다면 넣기에 알맞은 물건은?","한쪽 면만 쓴 종이","다 쓴 볼펜 껍데기","먹다 남은 과자","쓰고 버린 휴지","또또 상자는 다시 쓸 수 있는 종이를 모아 놓는 상자예요."],"kw":["또또 상자","읽기","공책","색종이"],"vo":[["남다","쓰고 난 뒤에도 더 있다","모두 없어지다","새로 생기다","깨끗해지다"],["모아 놓다","여러 개를 한곳에 두다","하나씩 버리다","멀리 보내다","다른 사람에게 팔다"]],"mi":["쓰고 또 쓰는 또또 상자","우리 반에는 다시 쓸 종이를 모으는 또또 상자가 있다.","공책이 없던 혜선이가 또또 상자의 종이를 썼다.","또또 상자가 우리 반에 있어서 참 좋다."],"ks":[[2,"우리 반에는 다시"],[4,"또또 상자가 우리 반에"]],"ev":["혜선이가 또또 상자의 종이를 쓴 까닭을 알 수 있는 문장은?","혜선이는 공책을","3문단에 혜선이가 공책을 가져오지 않았다고 했어요."],"p":["쓰고 또 쓰는 또또 상자.","우리 반에는 다시 쓸 수 있는 종이를 모아 놓는 상자가 있다. 이름은 또또 상자다.","‘읽기’ 시간이었다. 혜선이는 공책을 가져오지 않았다. 그래서 또또 상자에서 종이 한 장을 가져 와서 썼다. 우리가 다시 쓸 종이를 모으길 잘 했다고 생각했다.","나는 색종이가 남아서 또또 상자에 넣었다. 넣으면서 내 색종이는 누가 쓸까 한번 생각해 보았다. 또또 상자가 우리 반에 있어서 참 좋다."],"g":"lo"},{"n":24,"ti":"초식 공룡과 육식 공룡","to":"공룡에는 초식 공룡과 육식 공룡이 있었다.","tx":["공룡은 모두 풀을 먹었다.","초식 공룡은 동물의 왕이었다."],"cp":1,"fm":"두괄식","th":["초식 공룡이 무리를 지어 생활한 까닭으로 알맞은 것은?","육식 공룡으로부터 목숨을 지키기 위해","풀을 더 많이 먹기 위해","육식 공룡을 사냥하기 위해","잠을 푹 자기 위해","2문단에 목숨을 보존하기 위해 무리를 지어 생활했다고 했어요."],"kw":["공룡","무리","왕","먹이"],"vo":[["초식","풀이나 식물을 먹고 사는 것","고기를 먹고 사는 것","아무것도 먹지 않는 것","물만 마시는 것"],["보존","잘 지켜서 남아 있게 하는 것","잃어버리는 것","나누어 주는 것","새로 사는 것"]],"mi":["공룡에는 초식 공룡과 육식 공룡이 있었다.","초식 공룡은 무리를 지어 생활하며 도망쳤다.","육식 공룡은 동물의 왕이었다."],"ks":[[2,"초식 공룡들은 목숨을"],[3,"거대하고 사나운"]],"ev":["육식 공룡과 싸울 수 있었던 것이 무엇인지 알 수 있는 문장은?","같은 육식 공룡뿐","3문단 마지막 문장에 같은 육식 공룡뿐이었다고 했어요."],"p":["공룡에는 초식 공룡과 육식 공룡이 있었는데, 육식 공룡들은 초식 공룡까지 공격하여 먹이로 삼았다.","초식 공룡들은 목숨을 보존하기 위해 무리를 지어 생활하기도 하였다. 육식 공룡이 나타나면 재빨리 도망을 쳤다. 잡히면 살아남을 수 없기 때문이었다.","거대하고 사나운 육식 공룡은 동물의 왕이었다. 육식 공룡과 싸울 수 있는 것은 같은 육식 공룡뿐이었다."],"g":"lo"},{"n":25,"ti":"책을 빌려 주세요","to":"도서실 책을 집으로 빌려 갈 수 있게 해 주세요.","tx":["위인들은 책을 많이 읽었다.","수지는 2학년 2반이다."],"cp":2,"fm":"중괄식","th":["교장 선생님께서 수지의 부탁을 들어주신다면, 어린이들이 지켜야 할 일로 알맞은 것은?","책을 제때 반납하고 깨끗하게 본다.","책을 오래오래 가지고 있는다.","책에 낙서를 한다.","친구에게 몰래 빌려준다.","3문단에 책을 제때 반납하지 않거나 더럽히는 일이 없도록 규칙을 정하자고 했어요."],"kw":["도서실 책","위인","규칙","2학년"],"vo":[["반납","빌린 것을 도로 돌려주는 것","물건을 사는 것","물건을 잃어버리는 것","물건을 새로 만드는 것"],["부탁","어떤 일을 해 달라고 청하는 것","크게 꾸짖는 것","고맙다고 인사하는 것","잘못을 사과하는 것"]],"mi":["수지의 자기소개","도서실 책을 집으로 빌려 갈 수 있게 해 달라는 부탁","규칙을 정하면 빌려주어도 문제가 없을 것이다.","책을 많이 읽을 수 있도록 도와 달라."],"ks":[[2,"드리고 싶은 말씀은"],[4,"저희들이 책을 많이"]],"ev":["수지가 책을 많이 읽고 싶어 하는 까닭이 드러난 문장은?","위인들은 어려서부터","4문단에 위인들은 어려서부터 책을 많이 읽었다고 배웠다고 했어요."],"p":["교장 선생님, 안녕하세요? 저는 2학년 2반 이수지입니다.","교장 선생님께 이렇게 편지를 쓰는 것은 한 가지 부탁 말씀을 드리기 위해서입니다. 드리고 싶은 말씀은 도서실 책을 집으로 빌려 갈 수 있도록 해 주셨으면 하는 것입니다.","책을 제때에 반납하지 않거나 더럽히는 일이 없도록 여러 가지 규칙을 정하면 책을 빌려 주어서 생기는 문제는 별로 없을 것입니다.","교장 선생님, 위인들은 어려서부터 책을 많이 읽었다고 배웠습니다. 그래서 선생님들께서도 훌륭한 사람이 되기 위해서는 항상 책을 가까이해야 한다고 말씀하셨습니다. 저희들이 책을 많이 읽을 수 있도록 도와 주세요."],"g":"lo"},{"n":26,"ti":"두뇌 활동을 돕는 생활 습관","to":"두뇌 활동을 돕는 간단한 생활 습관","tx":["콩은 섬유질이 풍부하다.","낮잠은 두뇌에 나쁘다."],"cp":1,"fm":"두괄식","th":["이 글을 읽고 두뇌 활동을 위해 실천할 일로 알맞지 않은 것은?","밤새 게임을 하며 늦게 잔다.","아침밥을 꼭 먹는다.","피아노 연주를 배운다.","잠을 제때 잔다.","4문단에 잠을 제때 자야 한다고 했어요. 오래 깨어 있으면 두뇌가 제대로 일하지 못해요."],"kw":["두뇌","신문","바이올린","고단백질"],"vo":[["향상","실력이나 수준이 더 나아지는 것","점점 나빠지는 것","그대로 멈추는 것","완전히 사라지는 것"],["연속","끊이지 않고 죽 이어지는 것","중간에 자주 쉬는 것","한 번만 하는 것","거꾸로 하는 것"]],"mi":["두뇌 활동을 돕는 생활 습관 소개","아침을 꼭 먹고 콩을 먹는 것이 좋다.","악기 연주를 배우는 것이 좋다.","잠을 제때 자야 한다."],"ks":[[2,"일단 아침을 꼭"],[4,"잠을 제때 자야 한다"]],"ev":["콩이 두뇌 활동에 좋은 까닭을 알 수 있는 문장은?","콩은 고단백질인데다","2문단에 콩은 고단백질인 데다 섬유질이 풍부해서 두뇌 활동을 돕는다고 했어요."],"p":["영국의 유명한 신문이 두뇌 활동을 돕는 간단한 생활 습관을 소개했다.","일단 아침을 꼭 먹어야 한다. 또한 콩을 먹는 게 좋다. 콩은 고단백질인데다 섬유질이 풍부해서 두뇌의 활동을 돕는다.","악기 연주를 배우는 것도 좋다. 피아노나 바이올린을 배운 6세 어린이는 아이큐가 향상되었다.","잠을 제때 자야 한다. 21시간 연속으로 깨어있는 사람의 뇌는 술 마시고 정신없는 사람의 두뇌와 같다. 점심을 먹고 잠깐 낮잠을 자는 것도 좋다."],"g":"lo"},{"n":27,"ti":"선생님이 되고 싶어요","to":"나는 선생님이 되고 싶다.","tx":["우리 선생님은 늘 웃으신다.","동생들에게 잘해 주어야 한다."],"cp":1,"fm":"두괄식","th":["글쓴이가 선생님이 되기 위해 하려는 일이 아닌 것은?","텔레비전을 많이 본다.","공부를 열심히 한다.","동네 동생들에게 더 잘 대해 준다.","아이들을 사랑하는 마음을 기른다.","3·4문단에 공부를 열심히 하고 동생들에게 잘 대해 주겠다고 했어요."],"kw":["선생님","웃음","동네","어른"],"vo":[["이다음","지금 뒤에 오는 때, 앞날","오래전 옛날","바로 어제","지금 이 순간"],["대하다","어떤 태도로 상대하다","피해서 숨다","크게 다투다","멀리 떠나다"]],"mi":["나는 선생님이 되고 싶다.","웃음으로 대해 주시는 선생님이 좋아서 선생님이 되고 싶어졌다.","선생님이 되기 위해 공부를 열심히 해야 한다.","동네 동생들에게도 더 잘 대해 줄 것이다."],"ks":[[2,"그래서 나도 이다음에"],[3,"선생님이 되기 위해서는"]],"ev":["글쓴이가 동생들에게 더 잘해 주려는 까닭이 나타난 문장은?","아이들을 사랑하는 마음이","4문단에 아이들을 사랑하는 마음이 중요하기 때문이라고 했어요."],"p":["나는 선생님이 되고 싶습니다.","우리 선생님은 언제나 우리들을 웃음으로 대해 주십니다. 나는 그런 선생님이 참 좋습니다. 그래서 나도 이다음에 어른이 되면 선생님이 되어야겠다고 생각했습니다.","선생님이 되기 위해서는 지금부터 공부를 열심히 해야 합니다. 학생을 가르치기 위해서는 선생님도 열심히 공부해야 하기 때문입니다.","그리고 지금부터는 우리 동네에 있는 동생들에게도 더 잘 대해 줄 것입니다. 아이들을 사랑하는 마음이 중요하기 때문입니다."],"g":"lo"},{"n":28,"ti":"현장 학습은 동물원으로","to":"현장 학습을 동물원으로 가자.","tx":["동물원에는 사자가 있다.","동물원은 매우 좁다."],"cp":1,"fm":"두괄식","th":["글쓴이가 동물원에 가자고 하며 든 까닭이 아닌 것은?","동물원 입장료가 싸다.","동물에 대해 여러 가지를 배울 수 있다.","동물들과 사진을 찍을 수 있다.","넓은 곳에 가면 기분이 좋아진다.","입장료 이야기는 글에 나오지 않아요."],"kw":["동물원","기린","호랑이","코"],"vo":[["현장 학습","교실 밖 실제 장소에 가서 보고 배우는 공부","교실에서 책으로만 하는 공부","집에서 하는 숙제","시험을 보는 것"],["뿜다","속에 있는 것을 밖으로 세게 내보내다","안으로 빨아들이다","조용히 숨기다","천천히 마시다"]],"mi":["현장 학습을 동물원으로 갔으면 좋겠다.","동물원에서는 여러 가지를 배우고 동물들과 사진을 찍을 수 있다.","넓은 동물원에 가면 기분이 좋아질 것이다."],"ks":[[2,"그 곳에 가면"],[3,"그렇기 때문에 우리는"]],"ev":["동물원에 여러 동물이 있다는 것을 보여 주는 예가 담긴 문장은?","재주를 넘는 원숭이","2문단에 원숭이, 사자, 기린, 호랑이 가족이 예로 나와요."],"p":["나는 우리 반의 현장 학습을 동물원으로 갔으면 좋겠습니다.","그 곳에 가면 동물들에 대한 여러 가지를 배울 수도 있고, 동물들과 사진도 찍을 수 있습니다. 왜냐하면 동물원에는 많은 동물들이 살고 있기 때문입니다. 재주를 넘는 원숭이, 동물의 왕인 사자, 목이 긴 기린, 백두산의 호랑이 가족도 있습니다. 뿐만 아니라 긴 코를 가진 코끼리가 물을 뿜어대는 것도 볼 수 있습니다.","또 동물원은 많은 동물들이 살고 있기 때문에 매우 넓습니다. 그렇게 넓은 곳에 가면 우리들은 매우 시원함을 느낍니다. 그렇기 때문에 우리는 기분도 좋아질 것입니다."],"g":"lo"},{"n":29,"ti":"꼬리잡기와 그림자밟기","to":"옛날 어린이들이 즐기던 꼬리잡기와 그림자밟기 놀이 방법","tx":["꼬리잡기는 한 줄로 늘어선다.","그림자밟기는 요즘 생긴 놀이다."],"cp":1,"fm":"두괄식","th":["구름이 잔뜩 끼어 해가 보이지 않는 날, 하기 어려운 놀이는?","그림자밟기","꼬리잡기","둘 다 할 수 있다","둘 다 할 수 없다","그림자밟기는 그림자가 있어야 하는데, 해가 없으면 그림자가 잘 생기지 않아요."],"kw":["놀이","허리","가위바위보","줄"],"vo":[["술래","놀이에서 다른 아이들을 찾거나 잡는 역할을 맡은 사람","놀이에서 이긴 사람","놀이를 구경하는 사람","놀이를 처음 만든 사람"],["늘어서다","길게 줄을 지어 서다","둥글게 모여 앉다","흩어져 숨다","한 사람씩 떠나다"]],"mi":["꼬리잡기와 그림자밟기 놀이를 알아보자.","꼬리잡기 놀이 방법","그림자밟기 놀이 방법"],"ks":[[2,"꼬리잡기는 같은 줄의"],[3,"그림자밟기는 다른 사람의"]],"ev":["꼬리잡기에서 누가 술래가 되는지 알 수 있는 문장은?","맨 앞 사람이 술래가","2문단에 맨 앞 사람이 술래가 되어 맨 뒷사람을 잡는다고 했어요."],"p":["옛날 어린이들이 즐기던 놀이에는 여러 가지가 있습니다. 그 중에서 꼬리잡기, 그림자밟기는 어떻게 하는 놀이인지 알아봅시다.","꼬리잡기는 같은 줄의 맨 앞 사람이 맨 뒷사람을 잡는 놀이입니다. 이 놀이를 하려면 먼저 여러 사람이 한 줄로 늘어섭니다. 그리고 뒷사람은 앞 사람의 허리를 잡고 몸을 구부립니다. 맨 앞 사람이 술래가 되어 맨 뒷사람을 잡습니다. 술래에게 잡힌 사람은 다음 술래가 됩니다.","그림자밟기는 다른 사람의 그림자를 밟는 놀이입니다. 먼저 가위바위보를 하여 술래를 정합니다. 술래가 다른 사람의 그림자를 밟으면 놀이에서 이기게 됩니다. 술래에게 그림자를 밟힌 사람은 다음 술래가 됩니다."],"g":"lo"},{"n":30,"ti":"우리나라 학용품","to":"우리나라 학용품을 쓰자.","tx":["외제 학용품이 더 좋다.","우리나라는 학용품을 수출한다."],"cp":3,"fm":"미괄식","th":["글쓴이와 같은 생각을 가진 친구는?","“우리나라 학용품도 좋으니 우리 것을 쓰자.”","“외국 학용품이 무조건 최고야.”","“학용품은 비쌀수록 좋아.”","“학용품은 안 써도 돼.”","글쓴이는 우리나라 제품도 선진국 제품 못지않으니 우리 학용품을 써야 한다고 했어요."],"kw":["학용품","미국","선생님","일본"],"vo":[["외제","다른 나라에서 만든 물건","우리나라에서 만든 물건","손으로 직접 만든 물건","오래된 물건"],["못지않다","어떤 것에 뒤지지 않을 만큼 좋다","훨씬 나쁘다","아주 작다","전혀 다르다"]],"mi":["어떤 학생들은 외제 학용품을 많이 쓴다.","우리나라 제품도 선진국 제품 못지않다.","우리나라 학용품을 써야 한다."],"ks":[[1,"요즘 어떤 학생들은"],[2,"그러나 우리 나라 제품도"]],"ev":["우리나라 학용품이 좋다는 근거가 나타난 문장은?","외국으로 많이 수출한다","2문단에 선생님께서 우리나라도 학용품을 외국으로 많이 수출한다고 하셨다고 했어요."],"p":["요즘 어떤 학생들은 외제 학용품을 많이 쓴다. 그 친구들은 일본이나 미국의 학용품이 우리 나라 것보다 좋다고 한다.","그러나 우리 나라 제품도 선진국 제품 못지않다. 선생님께서 얼마 전에 우리 나라도 학용품을 외국으로 많이 수출한다고 하셨다.","나는 우리 나라 학용품을 써야 한다고 생각한다."],"g":"lo"},{"n":31,"ti":"상구의 다짐","to":"텔레비전은 시간을 정해서 조금만 보자.","tx":["상구는 텔레비전을 좋아한다.","텔레비전은 아예 보면 안 된다."],"cp":3,"fm":"미괄식","th":["상구가 다짐을 잘 지키려면 어떻게 하면 좋을까요?","텔레비전 보는 시간을 정해 달력에 적어 둔다.","보고 싶은 프로그램은 모두 본다.","밤늦게 몰래 본다.","숙제를 하면서 본다.","3문단에 상구는 시간을 정해서 조금만 보겠다고 다짐했어요."],"kw":["텔레비전","가족","유행","눈"],"vo":[["여쭈다","웃어른에게 묻다","친구를 부르다","크게 꾸짖다","몰래 숨기다"],["유행","어떤 행동이나 모양이 한동안 많은 사람들 사이에 퍼지는 것","오래전부터 지켜 온 전통","혼자만 아는 비밀","학교의 규칙"]],"mi":["상구는 텔레비전을 자주 본다.","텔레비전을 오래 보면 좋지 않은 점이 많다.","상구는 텔레비전을 시간을 정해 조금만 보겠다고 다짐했다."],"ks":[[1,"상구는 텔레비전을 자주"],[2,"오랫동안 텔레비전을 보면"]],"ev":["텔레비전을 오래 보면 가족 사이에 생기는 문제를 알 수 있는 문장은?","가족과 이야기할 시간이","2문단에 가족과 이야기할 시간이 부족해진다고 했어요."],"p":["상구는 텔레비전을 자주 봅니다. 그런데 아버지께서는 텔레비전을 조금만 보라고 하십니다.","재미있는 텔레비전을 보지 못하게 하는 까닭을 여쭈어 보았더니 오랫동안 텔레비전을 보면 눈이 나빠지고 공부할 시간을 빼앗겨서 좋지 않다고 말씀하셨습니다. 또 가족과 이야기할 시간이 부족해지고 좋지 않은 유행을 따라 하게 된다고 하셨습니다.","그래서 상구는 앞으로 텔레비전을 시간을 정해서 조금만 보겠다고 다짐하였습니다."],"g":"lo"},{"n":32,"ti":"이사를 간 물고기","to":"쓰레기를 함부로 버리지 말자.","tx":["아버지의 고향은 샘골이다.","시골 풍경은 아름답다."],"cp":3,"fm":"미괄식","th":["아버지께서 어렸을 때와 달리 냇가에서 물고기를 볼 수 없게 된 까닭은?","냇물이 더러워졌기 때문에","날씨가 너무 추웠기 때문에","물고기를 모두 잡아갔기 때문에","냇물이 모두 말라 버렸기 때문에","아버지께서 냇물이 더러워져 물고기도 다른 곳으로 이사를 갔을 거라고 말씀하셨어요."],"kw":["냇물","버스","일기","풍경"],"vo":[["고향","태어나서 자란 곳","처음 가 보는 곳","지금 다니는 학교","여행 가서 묵는 곳"],["속이 상하다","마음이 아프고 언짢다","배가 몹시 부르다","기분이 아주 좋다","몸이 튼튼하다"]],"mi":["영수는 물고기를 볼 생각에 기뻐하며 아버지의 고향으로 갔다.","냇물이 더러워져 물고기를 볼 수 없었다.","사람들이 쓰레기를 함부로 버리지 않았으면 좋겠다."],"ks":[[2,"맑은 물과 뛰어노는"],[3,"사람들이 쓰레기를"]],"ev":["영수가 냇가에 도착해서 가장 먼저 알아챈 것이 나타난 문장은?","냄새가 났습니다","2문단에 냇가에 다다르자 냄새가 났다고 했어요."],"p":["일요일 아침, 영수는 아버지의 고향 마을인 샘골로 가는 버스를 탔습니다. 차창 밖으로 보이는 시골 풍경이 아름다웠습니다. 아버지께서는 어렸을 때 냇가에서 물고기를 잡으며 재미있게 놀았다고 말씀하셨습니다. 나도 물고기가 즐겁게 노는 모습을 볼 수 있다는 생각에 기뻤습니다.","냇가에 다다랐을 때였습니다. 냄새가 났습니다. 냇물에서 나는 냄새였습니다. “아빠, 물고기가 살고 있을까요?” 아버지는 냇물이 더러워졌으니 물고기도 다른 곳으로 이사를 갔을 거라고 말씀하셨습니다. 맑은 물과 뛰어노는 물고기를 볼 수 없었습니다.","영수는 속이 상하여 집으로 돌아왔습니다. 그리고 낮에 있었던 일을 떠올리며 일기를 썼습니다. 사람들이 쓰레기를 함부로 버리지 않았으면 좋겠습니다."],"g":"lo"},{"n":33,"ti":"운동","to":"운동을 열심히 하자.","tx":["나는 오후에 축구를 한다.","운동을 하면 밥맛이 없어진다."],"cp":3,"fm":"미괄식","th":["운동을 싫어하는 친구에게 글쓴이가 할 만한 말은?","“운동을 하면 몸이 튼튼해지고 밥맛도 좋아져.”","“운동은 힘드니까 안 해도 돼.”","“축구는 혼자 하는 게 좋아.”","“아침에는 늦잠을 자야 해.”","2문단에 운동을 하면 몸이 튼튼해지고 밥맛이 좋다고 했어요."],"kw":["운동","아침","친구","체조"],"vo":[["체조","몸을 튼튼하게 하려고 정해진 방법으로 몸을 움직이는 운동","공을 차는 경기","물속에서 하는 운동","잠을 자는 것"],["밥맛","밥을 먹을 때 느끼는 맛이나 먹고 싶은 마음","밥을 짓는 방법","밥그릇의 크기","반찬의 가짓수"]],"mi":["나는 운동을 열심히 한다.","운동을 하면 몸이 튼튼해지고 밥맛이 좋다.","운동을 열심히 하는 것이 좋다."],"ks":[[1,"나는 운동을 열심히 합니다"],[2,"운동을 하면 몸이"]],"ev":["글쓴이가 아침에 하는 운동을 알 수 있는 문장은?","체조를 합니다","1문단에 아침에 일찍 일어나 체조를 한다고 했어요."],"p":["나는 운동을 열심히 합니다. 아침에 일찍 일어나 체조를 합니다. 오후에는 친구들과 함께 축구를 합니다.","운동을 하면 몸이 튼튼해집니다. 그리고 밥맛이 좋습니다.","나는 운동을 열심히 하는 것이 좋다고 생각합니다."],"g":"lo"},{"n":34,"ti":"여러 가지 비 이름","to":"조상들은 비가 내리는 모양을 보고 비 이름을 여러 가지로 붙였다.","tx":["는개는 이슬비보다 가늘다.","비는 모두 같은 이름으로 부른다."],"cp":4,"fm":"양괄식","th":["바람과 함께 굵은 비가 세차게 내려 얼굴이 따가운 날, 조상들은 이 비를 무엇이라고 불렀을까요?","채찍비","는개","이슬비","가랑비","3문단에 세찬 바람과 함께 좍좍 내리는 비를 채찍비라고 했어요."],"kw":["비 이름","안개","뺨","바람"],"vo":[["억세다","힘이 세고 거칠다","아주 약하고 부드럽다","조용하고 느리다","가늘고 가볍다"],["얼얼하다","맞거나 데어서 따끔따끔 아프다","시원하고 상쾌하다","간지럽다","아무 느낌이 없다"]],"mi":["조상들은 비가 내리는 모양을 보고 재미있는 이름을 붙였다.","가늘게 내리는 비의 이름","굵고 억세게 내리는 비의 이름","조상들은 비 모양에 따라 여러 가지 이름을 붙였다."],"ks":[[1,"비 이름에는 여러"],[2,"가늘게 내리는 비에는"]],"ev":["가랑비가 이슬비보다 굵다는 것을 알 수 있는 문장은?","이슬비보다 좀더 굵은","2문단 마지막 문장에 이슬비보다 좀 더 굵은 비를 가랑비라고 한다고 했어요."],"p":["비 이름에는 여러 가지가 있습니다. 우리 조상들은 비가 내리는 모양을 보고 이름을 재미있게 붙였습니다.","가늘게 내리는 비에는 는개, 이슬비, 가랑비 등과 같은 이름을 붙였습니다. 안개처럼 보이면서 이슬비보다 더 가늘게 내리는 비를 는개라고 합니다. 그보다 조금 굵은 비는 이슬비, 이슬비보다 좀더 굵은 비는 가랑비라고 부릅니다.","굵고 억세게 내리는 비에는 작달비, 장대비 등과 같은 이름을 붙였습니다. 특히, 세찬 바람과 함께 좍좍 내리는 비는 채찍비라고 불렀습니다. 채찍비를 얼굴에 맞으면 정말 채찍을 맞은 것처럼 뺨이 얼얼하다고 합니다.","이처럼 우리 조상들은 비가 내리는 모양을 보고 비 이름을 여러 가지로 붙였습니다."],"g":"lo"},{"n":35,"ti":"엄마의 부탁","to":"건강하게 지내려면 좋은 생활 습관을 가져야 한다.","tx":["수연이는 2학년이다.","엄마는 잔소리를 좋아한다."],"cp":3,"fm":"미괄식","th":["엄마가 수연이에게 이 편지를 쓴 까닭으로 가장 알맞은 것은?","수연이가 좋은 생활 습관을 가져 건강하게 자라길 바라서","수연이가 학교에 늦어서","수연이에게 선물을 주고 싶어서","수연이가 2학년이 되어서","3문단에 건강하게 지내려면 좋은 생활 습관을 가져야 한다고 부탁했어요."],"kw":["생활 습관","가방","양치질","2학년"],"vo":[["대견스럽다","흐뭇하고 자랑스럽다","걱정스럽고 불안하다","화가 나고 속상하다","부끄럽고 창피하다"],["기온차","때에 따라 기온이 달라지는 정도","비가 내리는 양","바람이 부는 방향","하루의 길이"]],"mi":["아픈데도 학교에 간 수연이가 대견했다.","수연이의 나쁜 생활 습관에 대한 잔소리","건강하려면 좋은 생활 습관을 가져야 한다."],"ks":[[1,"수연아, 오늘 아침에"],[3,"수연아, 건강하게 지내려면"]],"ev":["수연이가 감기에 걸리기 쉬웠던 까닭 중 하나가 나타난 문장은?","옷을 얇게 입고","2문단에 옷을 얇게 입고 손발도 씻지 않았다고 했어요."],"p":["수연아, 오늘 아침에 엄마는 네가 참 대견스러웠단다. 감기에 걸려 힘들어하면서도 가방을 메고 학교 가는 모습을 보고 네가 다 컸다는 생각을 하였다.","수연아, 2학년이 된 뒤로 부쩍 어른스러워진 네 모습에 엄마는 놀랄 때가 많았단다. 하지만 네게 오늘은 잔소리를 해야겠다. 요즘처럼 낮과 밤의 기온차가 심할 때에는 감기에 걸리기 쉽다. 그런데 너는 옷을 얇게 입고, 집에 돌아와서는 손발도 씻지 않았지. 저녁에는 양치질도 하지 않고 잠자리에 들었잖아?","수연아, 건강하게 지내려면 좋은 생활 습관을 가져야 한다. 날씨에 맞게 옷을 입고, 몸을 깨끗하게 씻는 게 참 중요해. 엄마의 가장 큰 바람은 네가 건강하게 자라는 것이란다. 엄마의 말을 잔소리로만 듣지 말고 부탁하는 말로 들어 주렴."],"g":"lo"},{"n":36,"ti":"과일 중의 왕 키위","to":"키위는 맛과 영양이 풍부해서 과일 중의 왕으로 꼽힌다.","tx":["키위는 새콤달콤하다.","키위는 고기보다 영양이 많다."],"cp":1,"fm":"양괄식","th":["고기를 먹은 뒤에 키위를 디저트로 먹으면 좋은 까닭은?","키위에 단백질을 분해하는 성분이 있어서","키위가 고기보다 달아서","키위에 지방이 없어서","키위 향이 좋아서","3문단에 키위에는 단백질을 분해하는 성분이 있어 고기를 먹은 후에 먹으면 좋다고 했어요."],"kw":["키위","사과","심장병","디저트"],"vo":[["함유량","어떤 성분이 들어 있는 양","과일의 무게","과일의 가격","과일의 개수"],["분해","하나로 된 것을 여러 부분으로 나누는 것","여러 개를 하나로 합치는 것","깨끗이 씻는 것","차갑게 얼리는 것"]],"mi":["맛과 영양 때문에 과일의 왕으로 꼽히는 키위","고른 영양소를 갖춘 키위","키위의 여러 가지 효능"],"ks":[[2,"영양면에서 키위만큼"],[3,"맛도 영양도 만점인"]],"ev":["키위 한 개로 하루에 필요한 비타민 C를 얻을 수 있다는 것을 알 수 있는 문장은?","열매 1개에","2문단 마지막 문장에 열매 1개에 하루에 필요한 비타민 C 양이 모두 들어 있다고 했어요."],"p":["사람들은 과일 중의 왕으로 키위를 꼽기도 합니다. 살이 부드럽고 즙이 많으며 달콤하면서도 새콤하고 향까지 좋아 많은 이들에게 사랑을 받고 있습니다. 그런데 맛이 좋다고 모두가 과일의 왕이 될 수 있는 건 아니에요. 바로 영양소 때문이죠.","영양면에서 키위만큼 고른 영양소를 갖추고 있는 과일이 없습니다. 키위 속에서 당분, 비타민 C는 물론 지방과 단백질까지 들어 있습니다. 특히 비타민 C의 함유량은 사과나 배에 비해 훨씬 높습니다. 열매 1개에 하루에 필요한 비타민C 양이 모두 들어 있다고 합니다.","또한 키위는 암을 예방하고 심장병 치료에 좋다고 합니다. 그리고 단백질을 분해하는 성분이 있어서 고기를 먹은 후에 디저트로 먹으면 좋다고 하네요. 맛도 영양도 만점인 키위야말로 과일의 왕으로 꼽힐 만하지요?"],"g":"lo"},{"n":37,"ti":"약속","to":"약속 시간을 꼭 지켜야 한다.","tx":["재민이는 엄마 심부름을 했다.","공원에는 시계탑이 있다."],"cp":3,"fm":"미괄식","th":["재민이가 약속을 잘 지키려면 어떻게 했어야 할까요?","늦을 것 같다고 미리 알리거나 서둘러 심부름을 마쳤어야 한다.","심부름을 하지 말았어야 한다.","약속 장소를 바꾸었어야 한다.","아무 말 없이 오지 말았어야 한다.","글쓴이는 까닭이 있어도 약속 시간을 어기면 기다리는 사람이 힘들다고 했어요. 미리 알리거나 서두르는 것이 좋아요."],"kw":["약속 시간","시계탑","공원","심부름"],"vo":[["어기다","약속이나 규칙을 지키지 않다","약속을 잘 지키다","새로 만들다","크게 기뻐하다"],["낭비","시간이나 돈을 헛되이 쓰는 것","아껴서 모아 두는 것","알맞게 나누는 것","다른 사람에게 주는 것"]],"mi":["재민이가 약속 시간에 30분이나 늦게 왔다.","까닭이 있어도 약속 시간을 어긴 것은 잘못이다.","약속 시간을 꼭 지켜야 한다."],"ks":[[1,"그런데 재민이가 30분이나"],[2,"재민이가 엄마 심부름을 하고"]],"ev":["약속 시간을 지키지 않는 친구를 기다리면 어떤 점이 힘든지 알 수 있는 문장은?","지루하고 힘이 듭니다","2문단에 기다리는 일은 지루하고 힘이 든다고 했어요."],"p":["나는 오늘 공원에 있는 시계탑 앞에서 재민이를 만나기로 하였습니다. 그런데 재민이가 30분이나 늦게 왔습니다. 재민이는 엄마 심부름을 하고 오느라 늦었다고 말하였습니다.","재민이가 엄마 심부름을 하고 오느라 늦었지만, 약속 시간을 어긴 것은 잘못입니다. 약속 시간을 지키지 않는 친구를 기다리는 일은 지루하고 힘이 듭니다. 그리고 시간을 낭비하게 됩니다.","나는 약속 시간을 꼭 지켜야 한다고 생각합니다."],"g":"lo"},{"n":38,"ti":"이런 인사 저런 인사","to":"나라마다 인사하는 법이 다르다.","tx":["멕시코 사람들은 껴안으며 인사한다.","인사하는 법은 모든 나라가 똑같다."],"cp":1,"fm":"두괄식","th":["사우디아라비아에서 온 친구를 만났어요. 친구 나라의 인사법으로 알맞은 것은?","가까이 다가가 뺨을 가볍게 대며 어깨를 두드린다.","허리를 굽혀 인사한다.","힘껏 껴안고 큰 소리를 낸다.","손을 흔들기만 한다.","4문단에 사우디아라비아 사람들은 뺨을 대며 인사한다고 했어요."],"kw":["인사","어깨","멕시코","인사말"],"vo":[["상대방","어떤 일이나 말을 함께 하는 짝이 되는 사람","나 자신","모르는 사람","구경하는 사람"],["반가움","보고 싶던 사람을 만나 기쁜 마음","무서운 마음","슬픈 마음","귀찮은 마음"]],"mi":["나라마다 인사법이 다르다.","우리나라는 허리를 굽혀 인사한다.","멕시코는 서로 껴안으며 인사한다.","사우디아라비아는 뺨을 대며 인사한다."],"ks":[[2,"우리 나라 사람들은 허리를"],[3,"멕시코 사람들은 서로"]],"ev":["우리나라 사람들은 인사할 때 상대방과 조금 떨어진다는 것을 알 수 있는 문장은?","조금 떨어져서","2문단에 상대방과 조금 떨어져서 바른 자세로 인사한다고 했어요."],"p":["나라마다 인사하는 법이 다릅니다. 어떻게 다를까요?","우리 나라 사람들은 허리를 굽혀 인사합니다. 상대방과 조금 떨어져서 바른 자세로 인사합니다. 서로 인사말을 주고받습니다.","멕시코 사람들은 서로 껴안으며 인사합니다. 상대방에게 가까이 다가가서 힘껏 서로를 껴안습니다. 그러고는 큰 소리로 반가움을 나타냅니다.","사우디아라비아 사람들은 뺨을 대며 인사합니다. 상대방에게 가까이 다가가서 서로의 뺨을 가볍게 댑니다. 그러면서 서로의 어깨를 가볍게 두드리며 반가움을 나타냅니다."],"g":"lo"},{"n":39,"ti":"여름철 과일 참외","to":"여름철 과일인 참외의 이름과 효능","tx":["참외는 노란색이다.","참외는 겨울 과일이다."],"cp":1,"fm":"두괄식","th":["‘참외’라는 이름에 담긴 뜻으로 알맞은 것은?","오이보다 맛과 향기가 좋은 과일","아주 작은 오이","참새가 좋아하는 오이","차가운 오이","2문단에 ‘참’은 썩 좋다는 순우리말이라서 오이보다 맛과 향기가 좋다는 뜻이라고 했어요."],"kw":["참외","청개구리","인도","주근깨"],"vo":[["원산지","동식물이 처음 나서 자란 곳","물건을 파는 곳","과일을 보관하는 곳","과일을 먹는 계절"],["효능","좋은 결과를 나타내는 쓸모","나쁜 냄새","겉모양","값이 싼 정도"]],"mi":["여름철 과일인 참외에 대해 알아보자.","참외의 원산지와 이름의 뜻","참외의 여러 가지 효능"],"ks":[[1,"여름철 과일인 맛있는"],[3,"예로부터 말린 참외"]],"ev":["참외가 여름철 지친 몸에 좋은 까닭을 알 수 있는 문장은?","성질이 차고","3문단에 성질이 차고 맛이 달아 여름철 지친 몸에 활력을 준다고 했어요."],"p":["노란 빛깔과 달콤한 향기로 입맛을 당기는 참외는 여름이 다가와 청개구리가 울고, 지렁이가 땅에서 나올 즈음 열리는 여름철 과일이다. 여름철 과일인 맛있는 참외에 대해서 알아보자.","인도가 원산지이며 참외의 명칭은 외, 왕과, 띠외, 신라갈이, 쥐참외 등으로 바뀌어 왔다. ‘외’는 오이를 가리키고, ‘참’은 ‘허름하지 않고 썩 좋다’는 순우리말로, 오이보다 맛과 향기가 좋다는 뜻이다.","참외는 간을 보호하고 암을 예방하는 효능이 있다고 한다. 또한 성질이 차고 맛이 달아 여름철 지친 몸에 활력을 준다. 예로부터 말린 참외 꼭지는 체했을 때 토하게 도와주고 참외 잎을 으깬 즙은 주근깨 예방에 좋다고 할 정도로 여러 가지 효능을 가진 과일이다."],"g":"lo"},{"n":40,"ti":"교통사고를 줄이려면","to":"교통사고를 줄이려면 길을 가는 사람이 신호를 잘 지켜야 한다.","tx":["교통사고는 작년보다 줄었다.","철수는 뉴스를 좋아한다."],"cp":2,"fm":"미괄식","th":["철수가 빨간불에 뛰어 건너는 사람을 볼 때마다 무섭다고 느낀 까닭은?","사고가 날까 봐 걱정되었기 때문에","그 사람이 철수를 쫓아올까 봐","학교에 늦을까 봐","신호등이 고장 날까 봐","빨간불에 뛰어 건너면 교통사고가 날 위험이 커요."],"kw":["교통사고","뉴스","학교","저녁"],"vo":[["횡단보도","사람이 길을 건널 수 있게 표시해 놓은 곳","차가 서 있는 곳","버스를 기다리는 곳","차가 다니는 넓은 길"],["주장","자기의 생각을 굳게 내세우는 것","남의 말을 그대로 따르는 것","아무 말도 하지 않는 것","질문을 하는 것"]],"mi":["철수는 교통사고를 막는 방법을 생각해 보았다.","교통사고를 줄이려면 길을 가는 사람이 신호를 잘 지켜야 한다."],"ks":[[1,"그래서 어떻게 하면"],[2,"그래서 철수는 교통 사고를"]],"ev":["철수가 교통사고가 늘었다는 것을 어떻게 알게 되었는지 나타난 문장은?","교통 사고가 지난해 보다","1문단에 텔레비전 뉴스에서 교통사고가 지난해보다 많이 났다는 소식을 전했다고 했어요."],"p":["철수는 저녁에 텔레비전 뉴스를 보고 있었습니다. 교통 사고가 지난해 보다 많이 났다는 소식을 전하고 있었습니다. 철수는 왜 우리 나라에서 교통 사고가 더욱 많아졌는지 궁금하였습니다. 그래서 어떻게 하면 교통 사고를 막을 수 있을지 생각하여 보았습니다.","철수는 교통사고를 줄이기 위해서는 먼저 길을 가는 사람이 신호를 잘 지켜야 하며, 반드시 횡단 보도로 건너야 한다고 생각하였습니다. 철수가 학교에 가려면 큰 길을 건너야 하는데, 철수는 빨간 불인데도 급하게 뛰어 건너는 사람을 가끔씩 봅니다. 철수는 그때마다 매우 무섭다는 생각이 들었습니다. 그래서 철수는 교통 사고를 줄이려면 반드시 길을 가는 사람이 신호를 잘 지켜야 한다고 주장하고 싶었습니다."],"g":"lo"},{"n":41,"ti":"두꺼비","to":"두꺼비의 생김새와 특징","tx":["두꺼비는 겨울잠을 잔다.","두꺼비는 적을 만나면 빨리 도망친다."],"cp":0,"fm":"병렬식","th":["두꺼비가 해마다 알을 낳는 곳이 오염되면 어떻게 될까요?","두꺼비가 살 곳을 잃는다.","두꺼비가 다른 곳에 알을 낳는다.","두꺼비가 더 많아진다.","두꺼비가 겨울잠을 자지 않는다.","4문단에 두꺼비는 알 낳는 장소를 바꾸지 않아서 환경이 오염되면 살 곳을 잃는다고 했어요."],"kw":["두꺼비","독","3월","피부"],"vo":[["우스꽝스럽다","모습이나 행동이 웃음이 날 만큼 이상하다","무섭고 사납다","아름답고 멋지다","작고 귀엽다"],["습성","동물이 늘 하는 버릇 같은 성질","동물의 몸무게","동물의 이름","동물이 사는 나라"]],"mi":["두꺼비의 우스꽝스러운 모습","적을 만났을 때 두꺼비가 하는 행동","겨울잠에서 깬 두꺼비는 새끼가 살기 좋은 곳으로 이동한다.","두꺼비는 알을 낳는 장소를 바꾸지 않는다."],"ks":[[2,"게다가 몸짓이 둔하기"],[4,"하지만 알을 낳는 장소를"]],"ev":["두꺼비가 적을 향해 무엇을 하는지 알 수 있는 문장은?","독을 내뿜습니다","2문단에 적을 향해 독을 내뿜는다고 했어요."],"p":["두꺼비의 모습은 우스꽝스럽기 짝이 없습니다. 껌벅거리는 큰 눈, 일자로 꽉 다문 입, 오톨도톨한 피부, 어슬렁어슬렁 기어다니는 모습.....","게다가 몸짓이 둔하기 때문에 적을 만나면 도망치는 대신, 몸을 부풀리면서 머리를 적의 코 앞에 내밉니다. 그리고 적을 향해 독을 내뿜습니다.","두꺼비는 굴이나 땅 속에서 겨울잠을 잡니다. 보통 3월 정도가 되면 이 겨울잠에서 깨게 되는데 이 때 두꺼비들은 새끼가 살아가기에 좋은 곳을 찾아 멀리 이동합니다.","하지만 알을 낳는 장소를 바꾸지 않는 습성도 있습니다. 따라서 해마다 알을 낳기 위해 같은 장소를 찾아오기 때문에 환경을 오염시키게 되면 살 곳을 잃고 맙니다."],"g":"lo"},{"n":42,"ti":"만약 일기예보가 없다면?","to":"일기예보는 우리 생활에 꼭 필요하다.","tx":["아빠는 세차를 좋아한다.","일기예보는 틀릴 때가 많다."],"cp":4,"fm":"미괄식","th":["내일은 소풍 가는 날이에요. 일기예보를 보고 할 수 있는 일로 알맞은 것은?","비 소식이 있으면 우산이나 우비를 챙긴다.","날씨와 상관없이 짧은 옷만 챙긴다.","소풍날을 아무렇게나 정한다.","아무것도 준비하지 않는다.","일기예보를 보면 날씨에 맞게 미리 준비할 수 있어요."],"kw":["일기예보","결혼식","세차","먼지"],"vo":[["어김없이","틀림없이 꼭 그대로","가끔씩만","전혀 아니게","아주 늦게"],["기상청","날씨를 살피고 알려 주는 나라 기관","비행기를 타는 곳","물건을 사는 곳","병을 고치는 곳"]],"mi":["일기예보가 없다면 어떤 일이 생길까?","중요한 행사 날짜를 정할 수 없다.","빨래, 세차, 외출할 때 불편하다.","일기예보는 우리 생활에 꼭 필요하다."],"ks":[[1,"만약에 일기예보가"],[4,"이처럼 일기예보는"]],"ev":["일기예보가 없으면 엄마가 집을 비우기 어려운 까닭을 알 수 있는 문장은?","언제 비가 올지","3문단에 언제 비가 올지 모르기 때문이라고 했어요."],"p":["9시 뉴스가 끝나면 어김없이 나오는 오늘의 날씨. 우리 친구들은 일기예보를 듣고 미리 우산을 준비해 가죠. 엄마는 언제 빨래를 해야 할지, 아빠는 언제쯤 세차를 하면 좋을지 결정합니다. 만약에 일기예보가 없다면 어떤 일이 생길까요?","우리 생활부터 살펴보자. 일기예보가 없다면 축구나 야구경기, 소풍, 결혼식 등 중요한 행사의 날짜를 결정할 수 없다. 설령 결정하더라도 그날 아침까지 하늘을 보고 확인해야 한다.","엄마는 언제 빨래를 해야 할지도 모르고, 빨래를 한다고 해도 잠깐 집을 비울 수도 없다. 왜? 언제 비가 올지 모르니까. 아빠 차도 먼지가 가득히 쌓여 있을게 뻔하다. 게다가 외출할 때마다 우산을 갖고 다녀야 할지도 모른다.","기상청은 여름이나 겨울이 되기 전에 10년만의 무더위, 따뜻한 겨울 등 미리 예보한다. 이처럼 일기예보는 우리 생활에 꼭 필요하다."],"g":"lo"},{"n":43,"ti":"여러 나라의 우표","to":"여러 나라의 우표를 모으면 그 나라에 대해 더 잘 알 수 있다.","tx":["우표는 모두 네모 모양이다.","우표에는 동물만 그려진다."],"cp":4,"fm":"미괄식","th":["여러 나라 우표를 모으면 좋은 점으로 알맞은 것은?","그 나라의 인물, 행사, 동식물 등을 알 수 있다.","편지를 빨리 보낼 수 있다.","돈을 많이 벌 수 있다.","우표가 저절로 커진다.","4문단에 여러 나라 우표를 모으면 그 나라에 대해 더 잘 알 수 있다고 했어요."],"kw":["우표","월드컵","동물","인물"],"vo":[["본뜨다","이미 있는 것을 보고 그대로 따라 만들다","새롭게 발명하다","부수어 없애다","감추어 두다"],["흔히","보통 자주","아주 드물게","한 번도 없이","처음으로"]],"mi":["우표는 나라마다 다르다.","우표의 여러 가지 모양","우표에 담기는 여러 가지 내용","여러 나라 우표를 모으면 그 나라를 더 잘 알 수 있다."],"ks":[[1,"우표는 나라마다 다릅니다"],[3,"우표에는 여러 가지 내용이"]],"ev":["우표 중에는 네모가 아닌 모양도 있다는 것을 알 수 있는 문장은?","길쭉한 우표","2문단에 길쭉한 우표, 둥근 우표 등이 있다고 했어요."],"p":["우표는 나라마다 다릅니다. 사람들은 멋있고 아름다운 우표를 만들기 위하여 노력합니다.","우리가 흔히 보는 우표는 작고 네모난 모양입니다. 그러나 길쭉한 우표, 둥근 우표, 동물이나 물건의 모양을 본뜬 우표도 있습니다.","우표에는 여러 가지 내용이 들어갑니다. 우리는 우표에서 훌륭한 인물, 월드컵과 같은 큰 행사, 사라져 가는 동물이나 식물 등을 볼 수 있습니다.","나라마다 우표의 동물이나 내용이 다르기 때문에 여러 나라의 우표를 모으면 그 나라에 대하여 더 잘 알 수 있습니다."],"g":"lo"},{"n":44,"ti":"변비","to":"변비는 만병의 근원이 되는 위험한 질병이다.","tx":["발효식품이 인기다.","변비는 치료할 필요가 없다."],"cp":3,"fm":"미괄식","th":["이 글을 읽고 변비에 대해 바르게 생각한 친구는?","“누구나 겪는 일이라도 건강을 위해 관심을 가져야 해.”","“누구나 겪으니까 신경 쓰지 않아도 돼.”","“광고에 나오는 음식만 먹으면 돼.”","“변비는 어른만 걸려.”","3문단에 변비는 흔해도 분명 위험한 질병이며 건강을 나타내는 척도라고 했어요."],"kw":["변비","광고","화장실","의학"],"vo":[["척도","무엇을 평가하거나 재는 기준","물건을 담는 그릇","아주 작은 조각","병을 고치는 약"],["근원","어떤 일이 생겨나는 바탕이나 원인","끝나는 마지막","옆에 있는 것","아주 좋은 것"]],"mi":["변비로 고생하는 사람들이 많다.","변비의 뜻","변비는 만병의 근원이 되는 위험한 질병이다."],"ks":[[2,"변비란 변이"]],"ev":["변비로 고생하는 사람이 많다는 것을 무엇으로 알 수 있다고 했나요?","광고들을 흔히","1문단에 화장실 가는 일이 즐거워진다는 광고를 흔히 볼 수 있다고 했어요."],"p":["요즘 장을 편안하게 해주는 발효식품들이 인기다. 이것을 먹으면 화장실 가는 일이 즐거워진다고 하는 광고들을 흔히 볼 수 있다는 것은 그만큼 변비로 고생하는 사람들이 많다.","변비란 변이 정상적으로 오랫동안 장에 머물며 배설 되지 못하는 상태 즉, 대변이 나오기 힘든 상태를 의미한다. 의학적으로 다음과 같은 증상이 있을 때 변비라고 할 수 있다.","변비는 누구나 경험이 있기 때문에 흔히 치료할 필요가 없다고 생각하는 경우가 많다. 하지만 변비는 분명 위험한 질병이며 건강을 나타내는 척도라고 볼 수 있다. 옛부터 사람의 건강상태를 알려고 할 때 변을 보면 알 수 있다는 말도 건강한 변의 중요성을 나타내는 것이라 할 수 있다. 따라서 변비는 만병의 근원이 된다."],"g":"lo"},{"n":45,"ti":"거시기","to":"‘거시기’는 사투리가 아닌 표준어이다.","tx":["거시기는 전라도 사투리이다.","텔레비전에는 사투리가 많이 나온다."],"cp":1,"fm":"두괄식","th":["말하다가 갑자기 물건 이름이 생각나지 않을 때 ‘거시기’를 쓰는 것은 바른 쓰임일까요?","그렇다. 생각이 잘 나지 않아 막막할 때 쓰는 말이다.","아니다. 사투리라서 쓰면 안 된다.","아니다. 나쁜 말이라서 쓰면 안 된다.","아니다. 외국어라서 쓰면 안 된다.","2문단에 거시기는 이야기하다가 생각이 잘 나지 않아 막막할 때 쓴다고 나와 있어요."],"kw":["거시기","영화","백과사전","물음"],"vo":[["사투리","어느 한 지역에서만 쓰는 말","모든 사람이 함께 쓰는 바른말","외국에서 들어온 말","옛날에만 쓰던 말"],["막막하다","어떻게 해야 할지 몰라 답답하다","무척 신나고 즐겁다","아주 배가 부르다","마음이 편안하다"]],"mi":["‘거시기’는 사투리가 아니다.","표준어 ‘거시기’의 뜻"],"ks":[[1,"우리가 흔히 사투리라고"]],"ev":["‘거시기’의 뜻을 어디에서 찾아볼 수 있다고 했나요? 그 내용이 담긴 문장은?","백과사전으로 찾아보면","2문단에 백과사전으로 찾아보면 뜻이 나와 있다고 했어요."],"p":["텔레비전과 영화에서 나오는 거시기라는 말 들어본 적 있나요? 우리가 흔히 사투리라고 불리는 '거시기'는 사투리가 아니에요.","그럼 표준어로 무슨 뜻이냐고요? 거시기를 백과사전으로 찾아보면 너무 짓궂은 물음에 대답하기 힘들거나 버거울 때를 나타낼 때 쓰거나 갑자기 얘기하느라고 생각이 잘 나지 않아 막막할 때라고 나와 있습니다."],"g":"lo"},{"n":46,"ti":"김치","to":"친구들이 김치를 즐겨 먹었으면 좋겠다.","tx":["김치는 외국 사람들도 먹는다.","햄이 김치보다 영양이 많다."],"cp":3,"fm":"미괄식","th":["햄만 좋아하는 윤주에게 김치를 권하며 할 말로 알맞은 것은?","“김치는 양념이 많이 들어가서 맛도 좋고 영양가도 높아.”","“김치는 옛날 음식이라 맛이 없어.”","“햄을 더 많이 먹어.”","“김치는 외국 음식이야.”","2문단에 김치는 갖가지 양념이 들어가서 맛도 좋고 영양가도 높다고 했어요."],"kw":["김치","햄","양념","윤주"],"vo":[["양념","음식 맛을 돋우려고 넣는 재료","음식을 담는 그릇","음식을 먹는 도구","음식을 만드는 사람"],["영양가","음식이 몸에 영양이 되는 정도","음식의 가격","음식의 색깔","음식의 양"]],"mi":["김치는 옛날부터 먹던 음식이다.","김치는 맛도 좋고 영양가도 높다.","친구들이 김치를 즐겨 먹었으면 좋겠다."],"ks":[[1,"김치는 우리 나라 사람들이"],[3,"나는 친구들이 김치를"]],"ev":["김치가 외국에서도 인기가 있다는 것을 알 수 있는 문장은?","외국 사람들도","1문단에 외국 사람들도 김치를 좋아해서 많이 먹는다고 했어요."],"p":["김치는 우리 나라 사람들이 옛날부터 먹던 음식이다. 이제는 외국 사람들도 김치를 좋아해서 많이 먹는다고 한다.","김치에는 갖가지 양념이 들어가서 맛도 좋고 영양가도 높다. 그리고 종류도 여러 가지여서 입맛에 따라 골라 먹을 수 있다.","나는 김치를 좋아한다. 나는 김치가 없으면 밥맛이 나지 않는다. 그런데 요즘에는 김치보다 햄을 더 좋아하는 친구들이 많다. 내 친구 윤주도 김치보다 햄을 더 좋아한다. 나는 친구들이 김치를 즐겨 먹었으면 좋겠다고 생각한다."],"g":"lo"},{"n":47,"ti":"황쏘가리","to":"황금빛으로 빛나는 아름다운 물고기 황쏘가리","tx":["쏘가리는 황갈색이다.","황쏘가리는 흔한 물고기이다."],"cp":1,"fm":"두괄식","th":["강에서 온몸이 황갈색이고 잿빛 무늬가 있는 물고기를 보았어요. 무엇일까요?","쏘가리","황쏘가리","금붕어","알 수 없다","2문단에 쏘가리는 온몸이 황갈색이고 잿빛 무늬가 있다고 했어요."],"kw":["황쏘가리","비늘","곡선","잿빛"],"vo":[["자잘하다","여럿이 다 가늘고 작다","아주 크고 굵다","길고 뾰족하다","둥글고 넓다"],["흩어지다","한데 모여 있던 것이 여기저기로 퍼지다","한곳에 모이다","깨끗이 사라지다","위로 솟다"]],"mi":["황쏘가리는 몸 전체가 황금빛으로 빛나는 물고기이다.","황쏘가리와 쏘가리는 빛깔과 무늬가 다르다.","황쏘가리는 아름답지만 쉽게 볼 수 없다."],"ks":[[1,"황쏘가리는 몸 전체가"],[2,"황쏘가리는 쏘가리와 이름이"]],"ev":["황쏘가리를 보기 어렵다는 것을 알 수 있는 문장은?","쉽게 볼 수 없습니다","3문단에 우리 주위에서 쉽게 볼 수 없다고 했어요."],"p":["황쏘가리는 몸 전체가 황금빛으로 빛나는 물고기입니다. 눈과 입은 크고 비늘은 자잘합니다. 그리고 등과 배는 부드러운 곡선 모양입니다.","황쏘가리는 쏘가리와 이름이 비슷하지만 빛깔과 무늬는 다릅니다. 쏘가리는 온몸이 황갈색이고 잿빛 무늬가 지느러미까지 흩어져 있습니다. 그러나 황쏘가리는 온몸이 황금색이고, 잿빛 무늬가 없습니다.","황쏘가리는 매우 아름답습니다. 그렇지만 우리 주위에서 쉽게 볼 수 없습니다."],"g":"lo"},{"n":48,"ti":"실패한 사람들의 공통점","to":"실패를 두려워하지 말고 포기하지 않는 어린이가 되자.","tx":["실패한 사람은 친구가 많다.","한 번 실패하면 다시는 성공할 수 없다."],"cp":5,"fm":"미괄식","th":["시험을 망친 뒤 “문제가 너무 이상해서 그래!”라고만 말하는 친구는 어떤 공통점에 해당할까요?","남의 탓만 한다.","정확한 목표가 없다.","친구가 없다.","포기하지 않는다.","2문단에 실수를 했을 때 남의 탓으로만 돌리는 사람을 말하고 있어요."],"kw":["실패","조상","평균","부자"],"vo":[["막연히","뚜렷하지 않고 어렴풋하게","아주 정확하게","매우 빠르게","몹시 화가 나서"],["협력자","힘을 합해 서로 돕는 사람","서로 싸우는 사람","혼자 일하는 사람","구경만 하는 사람"]],"mi":["실패한 사람들의 공통점 3가지를 알아보자.","남의 탓만 한다.","정확한 목표가 없다.","친구가 없다.","실패를 두려워하지 말고 포기하지 말자."],"ks":[[1,"이번 주에는 실패한"],[5,"실패를 두려워하지 말고"]],"ev":["목표를 구체적으로 세워야 한다는 것을 알 수 있는 문장은?","구체적인 계획을","3문단에 구체적인 계획을 세워야 한다고 했어요."],"p":["이 세상에는 성공한 사람들도 많고 실패한 사람들도 많습니다. 이번 주에는 실패한 사람들의 공통점 3가지를 알아보도록 해요.","▶하나, 남의 탓만 한다=시험성적이 나쁘거나 어떤 실수를 했을 때 조상, 부모, 친구 탓으로 돌립니다. 자신의 잘못은 하나도 없죠. 이런 사람들은 앞으로도 실패를 반복할 가능성이 매우 높습니다.","▶둘, 정확한 목표가 없다=막연히 이번 시험에서 좋은 성적을 거두겠다는 것만으로는 부족합니다. 구체적으로 어느 과목에서 몇 점을 더 올려 전 과목의 평균점수를 몇 점 올리겠다는 식으로 구체적인 계획을 수립해야 하죠.","▶셋, 친구가 없다=인간은 혼자 살아갈 수 없는 사회적 동물입니다. 다른 사람들의 도움을 받으면 성공은 그만큼 빨라지죠. 인간관계가 좋으면 그만큼 많은 협력자를 구할 수 있습니다.","실패보다 더 무서운 것은 포기입니다. 누구나 실패나 실수를 할 수 있습니다. 그러나 동일한 실수를 반복하는 것은 부끄러운 일입니다. 좋은 성적을 올리거나 부자가 되기 위해서는 실패를 최소화할 필요가 있습니다. 실패를 두려워하지 말고, 포기하지 않는 어린이가 되세요."],"g":"lo"},{"n":49,"ti":"감기","to":"감기를 막으려면 평소 몸을 건강하게 하고, 걸리면 푹 쉬어야 한다.","tx":["감기는 고뿔이라고도 한다.","감기약을 먹으면 감기의 원인이 없어진다."],"cp":3,"fm":"미괄식","th":["감기에 걸린 동생에게 이 글을 읽은 내가 해 줄 말로 가장 알맞은 것은?","“잠을 충분히 자면서 푹 쉬어야 빨리 나아.”","“감기약만 먹으면 바로 다 나아.”","“밤늦게까지 놀아도 괜찮아.”","“감기는 합병증이 절대 없어.”","3문단에 감기에 걸렸다면 충분한 수면으로 몸을 쉬게 하는 것이 가장 빠른 치료약이라고 했어요."],"kw":["감기","설사","중이염","약국"],"vo":[["합병증","어떤 병에 걸렸을 때 함께 생기는 다른 병","병이 다 나은 것","병을 막는 주사","병원의 이름"],["역부족","힘이나 능력이 모자라는 것","힘이 아주 넘치는 것","딱 알맞은 것","아무 문제가 없는 것"]],"mi":["감기의 뜻과 증상","감기의 기간과 합병증","감기를 이기려면 몸을 건강하게 유지하고 푹 쉬어야 한다."],"ks":[[1,"감기란 일종의"]],"ev":["병원에서 주는 감기약이 감기를 완전히 없애는 약이 아니라는 것을 알 수 있는 문장은?","완화제나 진통제일 뿐이다","3문단에 감기약은 증상을 누그러뜨리는 완화제나 진통제일 뿐이라고 했어요."],"p":["감기란 일종의 전염성 호흡기질환으로 ‘고뿔’이라고도 한다. 보통 재채기·콧물·코막힘 및 목구멍의 통증과 쉰 목소리 등 호흡기 증상과 함께 열이 나고 몸이 으슬으슬하며, 두통·설사·관절통 등의 증상이다.","감염성인 감기는 잠복기 1∼4일, 발병 후 2∼3일로 보통 증상이 가벼워지나, 중증인 경우는 2∼3주간도 계속되는 일이 있다. 또 세균의 2차감염으로 폐렴, 급성기관지염, 중이염 등의 합병증이 일어나기 쉽다.","우리가 보통 감기에 걸려 병원이나 약국을 찾아갈 때도 ‘감기약’이라고 주는 것은 각각의 증상에 대한 완화제나 진통제일 뿐이다. 현대 의학이 아무리 발전했다고 해도 모든 원인을 밝혀내어 그에 알맞은 치료법을 찾아내기에는 여전히 역부족이다. 가장 좋은 것은 감기에 걸리기 전에 최대한 감기 바이러스가 침투할 수 없도록 몸을 건강하게 유지시키는 것이다. 이미 감기에 걸렸다면 충분한 수면을 통해 우리 몸을 쉬게 해주는 것이 가장 빠른 치료약이다."],"g":"lo"},{"n":50,"ti":"나의 꿈, 선생님","to":"나는 선생님이 되고 싶다.","tx":["나는 노래를 잘 부른다.","선생님은 무엇이든 다 알아야 한다."],"cp":1,"fm":"두괄식","th":["글쓴이가 선생님이 된다면 어떤 선생님이 될까요?","재미있는 이야기를 들려주고 궁금한 것을 척척 가르쳐 주는 선생님","숙제를 아주 많이 내 주는 선생님","무섭게 혼내는 선생님","말을 전혀 하지 않는 선생님","1·2문단에 재미있는 이야기를 들려주고 궁금한 것을 척척 가르쳐 주겠다고 했어요."],"kw":["선생님","노래","이야기","척척"],"vo":[["척척","일을 막힘없이 시원스럽게 잘 해내는 모양","아주 느리게","틀리게","마지못해"],["신이 나다","흥미나 기쁨이 생겨 기분이 매우 좋아지다","무섭고 두렵다","몹시 졸리다","속이 상하다"]],"mi":["재미있는 이야기를 들려주는 선생님이 되고 싶다.","궁금한 것을 척척 가르쳐 주고 싶다.","선생님처럼 노래를 잘 부르고 싶다."],"ks":[[1,"나는 선생님이 되고"],[2,"그리고 아이들이 궁금해하는"]],"ev":["글쓴이가 노래를 부를 때 어떤 기분인지 알 수 있는 문장은?","노래를 부를 때에도","3문단에 노래를 부를 때에도 신이 난다고 했어요."],"p":["나는 선생님이 되고 싶습니다. 선생님이 되면 아이들에게 재미있는 이야기를 많이 들려줄 거예요. 아이들은 이야기를 듣고 정말 즐거워하겠지요?","그리고 아이들이 궁금해하는 것은 무엇이든지 척척 가르쳐 줄 거예요. 모르는 것을 선생님께서 가르쳐 주실 때에 나는 정말 신이 나거든요.","나는 노래를 부를 때에도 신이 나요. 우리 선생님처럼 노래를 잘 부르고 싶어요."],"g":"lo"},{"n":51,"ti":"느타리버섯 재배","to":"느타리버섯을 재배하는 방법과 과정","tx":["느타리버섯은 화장실에서만 자란다.","버섯 포자를 분류하는 실험 방법"],"cp":0,"fm":"병렬식","th":["병버섯을 키우는데 버섯이 병목까지 올라왔어요. 어떻게 해야 할까요?","뚜껑을 열어 준다.","병을 흔들어 준다.","햇빛이 강한 곳으로 옮긴다.","물을 모두 버린다.","4문단에 버섯이 병목쯤 올라올 때 뚜껑을 열어 주어야 한다고 했어요."],"kw":["느타리버섯","포자","화장실","뚜껑"],"vo":[["재배","식물을 심어 가꾸는 것","식물을 뽑아 버리는 것","식물을 사고파는 것","식물의 이름을 짓는 것"],["배양","미생물이나 세포를 알맞은 환경에서 기르는 것","물건을 포장하는 것","물을 끓이는 것","흙을 파내는 것"]],"mi":["느타리버섯 키우기의 좋은 점","느타리버섯의 재배 방법","느타리버섯의 성장 과정","느타리버섯을 재배할 때 조심할 점"],"ks":[[1,"느타리버섯 키우기의 좋은 점은"],[2,"재배방법은 병버섯"]],"ev":["느타리 나무를 두기에 알맞은 곳을 알 수 있는 문장은?","그늘 볕이 들어오는 곳","2문단에 느타리 나무는 물기를 충분히 흡수시킨 뒤 그늘 볕이 드는 곳에 두면 된다고 했어요."],"p":["느타리버섯 키우기의 좋은 점은 간편하게 키울 수 있고, 자라나는 과정을 생생하게 볼 수 있다는 것이다. 나중에는 포자를 분류하는 실험도 해 보면 재미있다.","재배방법은 병버섯 재배 농장을 통해 종균이 배양되어 있는 병버섯을 구입하여 재배하거나 종균을 접종하여 잘 배양된 표고버섯이나 느타리 나무를 구입하여 재배하는 것이다. 병버섯은 화장실과 같이 적정한 습기와 온도가 유지되는 장소에 두면 되고 느타리 나무는 물기를 충분히 흡수시킨 후 그늘 볕이 들어오는 곳에 두면 한 달 정도 되면 느타리버섯을 볼 수 있다.","느타리버섯의 성장 과정은 종균이 하얗게 피어나다가 돌기가 생겨나기 시작하며 갓이 까맣게 생기고 갓과 주름이 점점 구분이 되어 자라게 된다.","재배할 때 조심할 점은 적당한 습기와 온도 물을 유지해야 하며 병버섯을 키울 경우 버섯이 병목쯤 올라올 때 뚜껑을 열어 주어야 한다."],"g":"hi"},{"n":52,"ti":"맞춤 여행 코디네이터","to":"맞춤 여행 코디네이터의 등장과 역할, 전망","tx":["설 연휴에 해외여행객이 많다.","단체 여행이 가장 인기 있다."],"cp":0,"fm":"병렬식","th":["영화를 좋아하는 부부에게 맞춤 여행 코디네이터가 해 줄 수 있는 일은?","영화 촬영지만 돌아보는 일정을 짜 주고 영화에 밝은 안내원을 배치한다.","여러 사람과 함께 움직이는 단체 여행을 권한다.","영화표를 싸게 사 준다.","집에서 영화를 볼 수 있게 해 준다.","3문단에 명화 촬영지만 돌아볼 수 있는 프로그램을 짜 주고 영화 지식이 해박한 안내원을 배치한다고 했어요."],"kw":["맞춤 여행","설 연휴","이탈리아","경제"],"vo":[["대세","일이 되어 가는 큰 흐름","아주 작은 일","지나간 일","혼자만의 생각"],["해박하다","여러 방면으로 아는 것이 넓고 많다","아는 것이 거의 없다","말이 아주 적다","성격이 급하다"]],"mi":["해외여행을 나가려는 사람이 많다.","여행객의 흥미 변화로 맞춤 여행 코디네이터가 등장했다.","맞춤 여행 코디네이터가 하는 일","맞춤 여행 코디네이터의 전망"],"ks":[[2,"이런 여행객들의 흥미 변화로"],[3,"맞춤 여행 코디네이터는 가족이나"]],"ev":["요즘 여행객들이 단체 여행을 좋아하지 않는다는 것을 알 수 있는 문장은?","단체 여행을 좋아하지 않는다","2문단 두 번째 문장에 그 내용이 나와요."],"p":["나라 경제가 나쁘다고 하지만 다가올 설 연휴를 맞아 해외여행을 나가려는 사람들은 엄청나게 많다고 한다.","어쨌든 해외여행에 대한 높은 관심은 거스를 수 없는 대세다. 더욱이 요즘 여행객들은 과거처럼 여행사가 짜놓은 일정에 따라 여러 사람들과 함께 움직이는 단체 여행을 좋아하지 않는다. 그 때문에 여행사들은 단체 여행 프로그램 중간 중간에 여행객들이 개인적으로 즐길 수 있는 프로그램을 짜는 데 신경을 많이 쓴다. 이런 여행객들의 흥미 변화로 인해 등장한 신종 직업이 ‘맞춤 여행 코디네이터’이다.","맞춤 여행 코디네이터는 가족이나 부부, 또는 이해 단체만을 위한 별도의 여행 프로그램을 제공하는 사람들이다. 가령 이탈리아를 배경으로 한 영화에 관심이 많은 부부에게 ‘로마의 휴일’, ‘시네마 천국’, ‘로미오와 줄리엣’ 등 명화를 촬영한 지역만을 돌아볼 수 있는 여행 프로그램을 짜주고 현지에서도 영화 지식이 해박한 안내원을 배치한다.","아직 맞춤형 여행 코디네이터가 사업적으로 성공할 기반이 마련돼 있지는 않지만 어린이 친구들이 사회에서 활동할 10년 이후에는 맞춤 여행이 본격화할 것으로 전망된다."],"g":"hi"},{"n":53,"ti":"매실의 효능","to":"사람의 몸을 건강하게 하는 매실의 효능","tx":["매실은 매화나무의 열매이다.","매실은 삼국 시대부터 먹었다."],"cp":0,"fm":"병렬식","th":["일을 많이 해서 피곤하고 어깨가 뻐근한 아빠께 매실을 권할 때 들 수 있는 까닭은?","매실의 구연산이 피로 물질인 젖산을 몸 밖으로 내보내기 때문이다.","매실이 피부를 촉촉하게 하기 때문이다.","매실에 칼슘이 많기 때문이다.","매실이 살구와 비슷하기 때문이다.","2문단에 구연산이 피로 물질인 젖산을 분해해 몸 밖으로 배출시킨다고 했어요."],"kw":["매실","살구","고려","칼슘"],"vo":[["효능","좋은 결과를 나타내는 능력","좋지 않은 맛","열매의 모양","과일의 값"],["장복","같은 약이나 음식을 오랫동안 계속 먹는 것","한 번만 먹는 것","먹지 않고 버리는 것","남에게 나누어 주는 것"]],"mi":["매실의 유래","매실은 피로 회복에 좋다.","매실은 만성 변비를 없앤다.","매실은 피부 미용에 좋다.","그 밖의 매실의 효능과 역할"],"ks":[[2,"첫째, 매실은 피로회복에"],[3,"둘째, 만성 변비를"]],"ev":["매실이 장 속의 나쁜 균을 줄여 준다는 것을 알 수 있는 문장은?","나쁜 균의 번식을","3문단에 카테킨산이 장 안에 사는 나쁜 균의 번식을 억제한다고 했어요."],"p":["매실은 매화나무의 열매를 말하며 장미과 벚나무속에 속하는 핵과류 과수로서 자두, 살구 등과 아주 가까운 과수이다. 원산지는 아시아의 동부 온난한 지방으로 우리나라, 중국, 일본 등에 야생종이 분포하고 있다. 재배년대는 3천 년 전의 중국의 고서인 \"신능본초경\"에 백매(과실저림) 오매(과실화건)라 하여 매실의 탁월한 약효를 기록하고 있다. 우리나라에는 삼국시대부터 꽃을 관상할 목적에서 정원에 심었고 열매를 이용한 것은 한의학이 도입된 고려 중엽 때부터라고 알려 지고 있으며 우리의 선조들은 이 열매를 식용이나 약용으로 이용해 왔다. 이러한 매실의 효능을 살펴보면 다음과 같다.","첫째, 매실은 피로회복에 좋다. 매실에는 구연산, 사과산, 화박산 등 유기산이 많이 함유되어 있다. 그 중에서도 구연산이 특히 풍부한데 구연산은 우리 몸의 피로 물질인 젖산을 분해시켜 몸 밖으로 배출시키는 작용을 한다. 구연산이 몸속의 피로물질을 씻어내는 능력은 무려 포도당의 10배. 피로물질인 젖산이 체내에 쌓이게 되면 어깨 결림, 두통, 요통 등의 증상이 나타나는데 이럴 때 매실이 좋다. 매실을 장복하면 좀처럼 피로를 느끼지 못하고 체력이 좋아진다.","둘째, 만성 변비를 없앤다. 매실 속에는 강한 해독작용과 살균효과가 있는 카테킨산이 들어있다. 카테킨산은 장안에 살고 있는 나쁜 균의 번식을 억제하고 장내의 살균성을 높여 장의 염증과 이상 발효를 막는다. 동시에 장의 연동운동을 활발하게 해 장을 건강하게 유지시켜 나간다.","마지막으로 매실은 피부미용에도 좋다. 매실을 꾸준히 먹다보면 피부가 탄력 있고 촉촉해지는 것을 느낄 수 있다. 매실 속에 들어있는 각종 성분이 신진대사를 원활하게 해 주기 때문이다. 각종 유기산과 비타민이 혈액순환을 도와 피부에 좋은 작용을 한다.","이 밖에도 매실은 칼슘 흡수율을 높이고 강력한 살균, 살충 작용 등을 하는데, 이렇게 매실은 사람의 몸을 건강하게 유지시키는 역할을 하는 으뜸 과일 중에 하나이다."],"g":"hi"},{"n":54,"ti":"컬러리스트","to":"색깔을 선택하고 창조하는 전문가 컬러리스트의 역할과 전망","tx":["요즘 자동차는 파스텔 색이 많다.","컬러리스트 자격증은 필요 없다."],"cp":2,"fm":"중괄식","th":["컬러리스트가 되고 싶은 친구에게 이 글을 바탕으로 해 줄 조언은?","미술을 공부하고 색깔 개발 시스템이 있는 회사에서 경력을 쌓으면 유리하다.","자격증만 따면 누구나 최고가 될 수 있다.","색깔은 중요하지 않으니 모양만 공부해라.","화장품만 공부하면 된다.","3문단에 전문적인 컬러리스트가 되려면 미술을 전공하고 경력을 쌓는 것이 유리하다고 했어요."],"kw":["컬러리스트","개나리","휴대전화","화장품"],"vo":[["감흥","마음속에 느끼어 일어나는 흥겨움","배고픈 느낌","졸린 느낌","아픈 느낌"],["수요","어떤 물건이나 일을 필요로 하거나 사려는 것","물건을 만드는 것","물건을 버리는 것","물건의 무게"]],"mi":["주변에서 느낄 수 있는 색의 느낌","컬러리스트가 하는 일과 전망","전문적인 컬러리스트가 되는 방법"],"ks":[[2,"이처럼 상품의 색깔을"],[3,"이 때문에 보다 전문적인"]],"ev":["컬러리스트가 한 가지 제품의 색을 만들기 위해 얼마나 노력하는지 알 수 있는 문장은?","1000여 종의 색을","2문단에 한 가지 제품의 색을 만들려고 1000여 종의 색을 대입해 본다고 했어요."],"p":["개나리가 활짝 핀 거리를 걷다보면 화사한 색깔이 우리에게 주는 감흥을 새삼 느끼게 된다. 사람들의 옷차림도 바람이 불면 날아갈 듯 가벼워 보인다. 손에 든 휴대전화의 색깔도 무슨 낱말로 표현해야 할지 모르게 오묘하다. 요즘엔 자동차 색상도 파스텔 계열들이 많이 늘어나 눈을 즐겁게 한다.","이처럼 상품의 색깔을 유행과 고객의 수요에 맞도록 선택하고 새롭게 창조해내는 전문가들이 컬러리스트다. 화장품이나 패션 등 여성이 고객의 대다수인 업종에서는 오래 전부터 색에 대한 고민을 많이 해왔지만 컬러리스트라는 전문 직업명을 붙여 전문성을 인정해준 것은 얼마 되지 않았다. 컬러리스트는 똑 같은 색깔이라도 제품의 모양, 고객층, 사용 국가 등에 따라 각기 다른 효과를 내는 점을 잘 알고 있는 이들이다. 그래서 한 가지 제품의 색을 만들기 위해 1000여 종의 색을 대입시켜 본다고 한다. 국내에서는 2002년에 컬러리스트 국가자격증이 도입됐다. 현재 디자인이나 화장품 업계에서 인정을 받고 있으나 모든 상품이 색을 갖고 있으며 어떤 색을 쓰는 가가 제품의 부가가치를 결정하는 만큼 이 직업에 대한 수요는 급속히 늘어날 전망이다.","그러나 색깔과 관련한 직업에 종사하고 있는 인력이 국내에만도 50만 명이 넘는 만큼 컬러리스트 자격증은 자칫 흔해질 우려도 있다. 이 때문에 보다 전문적인 컬러리스트가 되기 위해서는 미술을 전공하고 체계화된 색깔 선택 및 개발 시스템이 있는 회사에서 경력을 쌓는 것이 유리해 보인다."],"g":"hi"},{"n":55,"ti":"세균의 종류","to":"세균은 온도, 산소, 이로움과 해로움에 따라 여러 종류로 나뉜다.","tx":["세균은 광합성을 한다.","콜레라균은 유용세균이다."],"cp":1,"fm":"두괄식","th":["김치나 요구르트를 만드는 데 쓰이는 세균은 어떤 세균에 속할까요?","유용세균","유해세균","고온성세균만","세균이 아니다","3문단에 유용세균은 식품을 가공하는 데 이용된다고 했어요."],"kw":["세균","엽록소","파상풍균","습도"],"vo":[["기생","다른 생물에 붙어서 양분을 얻으며 사는 것","스스로 양분을 만드는 것","땅속에서 잠을 자는 것","물 위를 떠다니는 것"],["유해","해로움이 있는 것","이로움이 있는 것","아무 관계가 없는 것","아주 흔한 것"]],"mi":["세균의 특징과 여러 종류로 나눌 수 있는 까닭","온도와 산소에 따른 세균의 종류","사람에게 이로운지 해로운지에 따른 세균의 종류"],"ks":[[1,"그런데 세균이 자라기 위해서는"],[3,"세균은 인간에게 이로운"]],"ev":["세균이 식물처럼 광합성을 할 수 없는 까닭을 알 수 있는 문장은?","엽록소가 없기 때문에","1문단에 세균은 엽록소가 없어서 광합성을 할 수 없다고 했어요."],"p":["세균은 박테리아라고도 하며 현재까지 2,000여 종이 알려져 있다. 세균은 엽록소가 없기 때문에 식물처럼 광합성을 할 수 없다. 따라서 땅 속, 물 속, 공기 속, 사람의 몸 속 등 어느 곳에나 양분이 있으면 기생한다. 그런데 세균이 자라기 위해서는 양분과 함께 알맞은 온도와 습도 및 산소가 필요하기 때문에 다양하게 분류할 수 있다.","세균은 온도에 따라 20℃ 이하에서 잘 자라는 것을 저온성세균, 55∼60℃에서 잘 자라는 것을 고온성세균이라고 하며, 그 중간 온도에서 자라는 것을 중온성세균이라고 한다. 산소에 따라서는 산소를 필요로 하는 세균을 호기성세균, 산소 없이도 살 수 있는 세균을 혐기성세균이라 한다.","세균은 인간에게 이로운 유용세균과 해를 끼치는 유해세균이 있다. 유용세균은 식품을 가공하거나 항생물질로 이용하고, 유해세균은 여러 질병을 일으키는 세균으로 파상풍균, 콜레라균, 디프테리아균, 결핵균 등이 있다."],"g":"hi"},{"n":56,"ti":"키가 큰 경숙이","to":"자신을 사랑하고 자랑스럽게 여기자.","tx":["여자 농구 선수는 키가 크다.","키가 큰 것은 부끄러운 일이다."],"cp":3,"fm":"미괄식","th":["경숙이의 마음은 어떻게 바뀌었나요?","속상함 → 자랑스러움","기쁨 → 슬픔","자랑스러움 → 부끄러움","화남 → 무서움","처음에는 놀림을 받아 속상했지만, 농구 선수의 말을 듣고 자기 키를 자랑스러워하게 되었어요."],"kw":["키","강사","무릎","학급"],"vo":[["흥분","어떤 일에 자극을 받아 감정이 북받치는 것","마음이 차분하게 가라앉는 것","깊이 잠드는 것","몸이 아픈 것"],["연사","여러 사람 앞에서 연설이나 강연을 하는 사람","무대 뒤에서 일하는 사람","경기에서 진 사람","교실 청소를 하는 사람"]],"mi":["키가 커서 놀림을 받는 경숙이","키 큰 농구 선수를 부러워하는 친구들","자신의 키를 자랑스러워하게 된 경숙이"],"ks":[[1,"키가 크다고 친구들이"],[3,"그제서야 경숙이는"]],"ev":["경숙이가 키를 작게 보이려고 한 행동을 알 수 있는 문장은?","무릎을 구부려","1문단에 작게 보이려고 무릎을 구부려 걷기도 했다고 했어요."],"p":["경숙이는 학급에서 가장 키가 컸다. 키가 크다고 친구들이 놀려 경숙이는 속상했다. 작게 보이려고 무릎을 구부려 걷기도 하였다. 그럴수록 친구들은 우스꽝스럽다고 그녀를 놀렸다.","어느 날, 선생님께서 지역 여자 농구단의 스타가 외부 강사로 올 거라고 하였다. 그 강사는 경숙이가 본 사람들 중 가장 키가 큰 여성이었다. 그 여자 농구 선수가 프로 선수 생활에 대하여 이야기를 들려주자 친구들은 모두 그 농구 선수를 부러워하였다.","경숙이는 매우 흥분했다. 자신이 장래에 운동선수가 될 수 있을지에 대해 질문했다. 그 연사는 경숙이가 다른 학생들보다 키가 크기 때문에 가능성이 많다고 말을 해 주었다. 그제서야 경숙이는 자신의 키가 큰 것을 자랑스러워했다."],"g":"hi"},{"n":57,"ti":"이야기를 읽는 방법","to":"이야기에 반영된 문화를 생각하며 이야기를 읽자.","tx":["문화는 시대에 따라 다르다.","문화에는 예술이 포함된다."],"cp":2,"fm":"미괄식","th":["옛이야기 『흥부와 놀부』를 이 글의 방법대로 읽는다면 어떤 질문을 떠올리면 좋을까요?","“옛날 사람들이 입고 먹던 것은 지금과 어떻게 다를까?”","“흥부는 키가 몇 센티미터일까?”","“이 책은 몇 쪽일까?”","“책의 글씨체는 무엇일까?”","2문단에 작품에 어떤 문화가 반영되어 있고, 지금 문화와 어떤 차이가 있는지 살펴보라고 했어요."],"kw":["문화","종교","제도","학문"],"vo":[["계승","앞사람의 전통이나 문화를 이어받는 것","새로 만들어 내는 것","완전히 없애는 것","남에게 파는 것"],["반영","어떤 모습이나 생각이 다른 것에 드러나 나타나는 것","아예 숨기는 것","거꾸로 뒤집는 것","새로 고치는 것"]],"mi":["문화의 뜻","이야기에 반영된 문화를 살펴보며 읽자."],"ks":[[1,"문화는 사회 구성원에 의해서"],[2,"이야기를 읽을 때에는"]],"ev":["먹고 입고 사는 일도 문화에 들어간다는 것을 알 수 있는 문장은?","의식주를 비롯하여","1문단에 의식주를 비롯하여 언어, 풍습 등이 모두 포함된다고 했어요."],"p":["문화는 사회 구성원에 의해서 습득되고 계승되는 생활양식을 말합니다. 여기에는 의식주를 비롯하여 언어, 풍습, 종교, 학문, 예술,
