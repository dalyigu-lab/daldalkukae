로 나무, 흙, 돌, 종이 같은 자연 재료로 짓는다. 창문에 바르는 한지는 빛을 부드럽게 들이고 바람도 조금씩 통하게 한다. 이런 자연 재료 덕분에 한옥은 사람에게 편안한 집이 된다."],"g":"hi"},{"n":65,"ti":"배려의 뜻","to":"배려는 다른 사람의 처지를 헤아리는 마음을 작은 행동으로 옮기는 것이다.","tx":["배려는 한자로 된 말이다.","배려는 마음속으로만 생각하면 된다."],"cp":4,"fm":"미괄식","th":["이 글의 생각에 가장 가까운 배려 있는 행동은?","짐을 든 이웃을 위해 엘리베이터 문을 잡아 드린다.","마음속으로만 도와야겠다고 생각한다.","선생님이 보실 때만 친구를 돕는다.","칭찬받으려고 억지로 돕는다.","4문단에 배려는 생각을 작은 행동으로 옮길 때 참된 배려가 된다고 했어요."],"kw":["배려","짐","입장","문"],"vo":[["헤아리다","짐작하여 미루어 생각하다","잊어버리다","무시하다","숫자를 세다"],["거창하다","일의 규모가 매우 크다","아주 작고 사소하다","조용하고 차분하다","빠르고 가볍다"]],"mi":["‘배려’라는 낱말의 풀이","배려는 다른 사람의 처지를 헤아리는 마음이다.","배려는 작은 행동에서 시작된다.","배려는 마음을 행동으로 옮기는 것이다."],"ks":[[3,"배려는 거창한 일이"],[4,"그러므로 배려는 다른 사람의"]],"ev":["참된 배려가 되려면 무엇이 필요한지 알 수 있는 문장은?","실제로 행동할 때","4문단 마지막 문장에 나와요."],"p":["배려는 ‘짝 배(配)’와 ‘생각할 려(慮)’가 합쳐진 말이다.","배려는 도와주거나 보살펴 주려고 마음을 쓰는 것이다. 곧 내 입장만 생각하지 않고 다른 사람의 처지를 헤아리는 마음이다.","배려는 거창한 일이 아니다. 뒤따라오는 사람을 위해 문을 잡아 주고, 무거운 짐을 든 사람에게 먼저 길을 비켜 주는 것처럼 작은 행동에서 시작된다.","그러므로 배려는 다른 사람의 마음을 헤아리는 생각을 작은 행동으로 옮기는 것이다. 마음속으로만 생각하는 것이 아니라 실제로 행동할 때 비로소 참된 배려가 된다."],"g":"hi"},{"n":66,"ti":"조선의 과거 제도","to":"조선의 과거는 관리를 뽑는 시험이었지만, 실제로는 누구나 합격하기 어려웠다.","tx":["과거는 문과, 무과, 잡과로 나뉘었다.","조선에서는 천민도 과거를 볼 수 있었다."],"cp":0,"fm":"병렬식","th":["조선 시대 농사짓는 백성이 과거에 합격하기 어려웠던 까닭은?","농사일로 바빠 오랜 시간 공부만 할 수 없었기 때문에","과거 시험장이 너무 멀었기 때문에","과거는 여자만 볼 수 있었기 때문에","시험 문제가 외국어였기 때문에","2문단에 과거를 준비하려면 오랜 시간 공부만 해야 해서 농사일로 바쁜 백성은 합격하기 어려웠다고 했어요."],"kw":["과거","무예","통역","양반"],"vo":[["관리","나라의 일을 맡아보는 사람","농사짓는 사람","물건을 파는 사람","고기를 잡는 사람"],["무예","칼, 활, 창 등을 쓰는 기술","글을 짓는 솜씨","노래 실력","그림 솜씨"]],"mi":["조선의 과거 제도와 그 종류","실제로는 누구나 과거에 합격하기 어려웠다."],"ks":[[1,"조선 시대에는 나라의 관리를"],[2,"법으로는 천민이 아니면"]],"ev":["과거에 합격한 사람이 주로 어느 집안에서 나왔는지 알 수 있는 문장은?","양반 집안에서","2문단 마지막 문장에 나와요."],"p":["조선 시대에는 나라의 관리를 뽑기 위해 과거라는 시험을 치렀다. 과거는 크게 글을 잘하는 사람을 뽑는 문과, 무예가 뛰어난 사람을 뽑는 무과, 의학이나 통역 같은 기술을 가진 사람을 뽑는 잡과로 나뉘었다. 과거에 합격하는 것은 집안의 큰 자랑이었다.","그렇다면 누구나 과거를 볼 수 있었을까? 법으로는 천민이 아니면 과거를 볼 수 있었지만, 실제로는 그렇지 않았다. 과거를 준비하려면 오랜 시간 공부만 해야 했기 때문에, 농사일로 바쁜 백성들이 합격하기는 무척 어려웠다. 그래서 과거 합격자는 주로 양반 집안에서 나왔다."],"g":"hi"},{"n":67,"ti":"세종 대왕과 훈민정음","to":"세종 대왕이 백성을 위해 훈민정음을 만들었다.","tx":["세종은 조선의 제4대 임금이다.","훈민정음은 배우기 어려웠다."],"cp":0,"fm":"병렬식","th":["세종 대왕이 훈민정음을 만든 가장 큰 까닭은?","한자를 어려워하는 백성이 쉽게 글을 쓸 수 있게 하려고","중국과 친하게 지내려고","학자들에게 일을 주려고","한자를 더 많이 가르치려고","2·3문단에 한자가 어려워 백성이 글을 읽고 쓸 수 없는 것을 안타깝게 여겨 새 글자를 만들었다고 했어요."],"kw":["훈민정음","학자","혀","1446년"],"vo":[["백성","나라의 일반 사람들","임금","신하","외국 사람"],["안타깝다","뜻대로 되지 않아 가슴 아프고 답답하다","아주 기쁘다","무척 자랑스럽다","아무렇지 않다"]],"mi":["백성을 아낀 세종 대왕","한자가 어려워 백성은 글을 쓸 수 없었다.","세종이 훈민정음을 만들어 알렸다.","훈민정음 덕분에 백성이 글을 쓸 수 있게 되었다."],"ks":[[3,"세종은 이 점을 안타깝게"],[4,"덕분에 많은 백성이"]],"ev":["‘훈민정음’이라는 이름의 뜻을 알 수 있는 문장은?","백성을 가르치는 바른 소리","3문단 두 번째 문장에 나와요."],"p":["세종 대왕은 조선의 제4대 임금이다. 세종은 백성을 아끼는 마음이 깊었고, 나라를 위해 여러 학자들과 함께 많은 연구를 했다.","그 무렵 우리나라 사람들은 말은 우리말로 했지만, 글은 중국의 한자를 빌려 썼다. 한자는 글자 수가 많고 배우기 어려워서, 대부분의 백성은 글을 읽고 쓸 수 없었다.","세종은 이 점을 안타깝게 여겨 누구나 쉽게 배울 수 있는 새 글자를 만들었다. 그리고 1446년, ‘백성을 가르치는 바른 소리’라는 뜻의 훈민정음을 세상에 널리 알렸다.","훈민정음은 소리를 내는 입과 혀의 모양을 본떠 만들어 배우기 쉬웠다. 덕분에 많은 백성이 자기 생각을 글로 적을 수 있게 되었다."],"g":"hi"},{"n":68,"ti":"조선 후기 장시의 발달","to":"조선 후기에는 농업이 발달하며 장시를 중심으로 상업이 성장했다.","tx":["장시는 닷새마다 열렸다.","조선 후기에는 물건을 사고팔지 않았다."],"cp":3,"fm":"미괄식","th":["보부상이 장시에서 한 역할로 알맞은 것은?","여러 장을 돌며 먼 지역의 물건까지 오가게 했다.","곡식을 기르는 기술을 만들었다.","장시를 모두 없앴다.","과거 시험을 감독했다.","3문단에 보부상이 활약하며 먼 지역의 물건까지 오갈 수 있게 되었다고 했어요."],"kw":["장시","곡식","보부상","닷새"],"vo":[["상업","물건을 사고팔아 이익을 얻는 일","농사짓는 일","물고기를 잡는 일","글을 쓰는 일"],["활약","활발하게 활동하는 것","가만히 쉬는 것","숨어 지내는 것","포기하는 것"]],"mi":["조선 후기에 농업이 발달해 남는 곡식과 물건이 생겼다.","물건을 사고판 곳은 닷새마다 열리는 장시였다.","장시가 활발해지며 상업이 성장했다."],"ks":[[1,"조선 후기에는 사람들의 생활에"],[3,"이렇게 조선 후기에는"]],"ev":["농사 기술의 발달로 달라진 점을 알 수 있는 문장은?","더 많은 곡식을","1문단 두 번째 문장에 나와요."],"p":["조선 후기에는 사람들의 생활에 큰 변화가 일어났다. 농사짓는 기술이 발달하면서 같은 땅에서 더 많은 곡식을 거둘 수 있게 되었다. 먹고 남는 곡식과 물건이 생기자 사람들은 이것을 다른 물건과 바꾸고 싶어 했다.","물건을 사고팔 곳은 어디였을까? 바로 닷새마다 열리는 장, 곧 장시였다.","장시가 늘어나고 활발해진 까닭은 무엇보다 남는 물건을 사고팔려는 사람이 많아졌기 때문이다. 여기에 여러 장을 돌아다니며 물건을 파는 보부상이 활약하면서 먼 지역의 물건까지 오갈 수 있게 되었다. 이렇게 조선 후기에는 농업의 발달과 함께 장시를 중심으로 상업이 크게 성장하였다."],"g":"hi"},{"n":69,"ti":"수원 화성","to":"정조가 새로운 과학 기술로 쌓은 수원 화성과 그 가치","tx":["화성은 1796년에 완성되었다.","화성은 기록이 남아 있지 않다."],"cp":1,"fm":"두괄식","th":["화성이 전쟁으로 망가진 뒤에도 원래 모습대로 고칠 수 있었던 까닭은?","쌓은 과정이 책에 자세히 기록되어 있었기 때문에","거중기가 아직 남아 있었기 때문에","정조가 다시 쌓았기 때문에","돌이 전혀 부서지지 않았기 때문에","3문단에 『화성성역의궤』의 기록 덕분에 원래 모습대로 고칠 수 있었다고 했어요."],"kw":["수원 화성","도르래","무덤","유네스코"],"vo":[["거중기","도르래를 이용해 무거운 물건을 들어 올리는 기계","성벽을 쌓는 벽돌","돌을 깎는 망치","성문을 여는 열쇠"],["설계","만들 물건이나 건물의 모양과 방법을 미리 정하는 것","부수어 없애는 것","그대로 베끼는 것","나중에 고치는 것"]],"mi":["정조가 수원에 쌓은 화성","화성을 쌓을 때 쓰인 과학 기술","화성의 기록과 세계 유산이 된 가치"],"ks":[[2,"화성을 쌓을 때에는 새로운"]],"ev":["수원 화성이 세계 유산이 된 해를 알 수 있는 문장은?","1997년","3문단 마지막 문장에 나와요."],"p":["수원 화성은 조선의 정조가 지금의 경기도 수원에 쌓은 성이다. 정조는 아버지 사도 세자의 무덤을 수원으로 옮기고, 그 둘레에 새로운 도시를 만들고자 했다. 1794년에 쌓기 시작해 1796년에 완성되었다.","화성을 쌓을 때에는 새로운 과학 기술이 쓰였다. 정약용은 도르래의 원리를 이용한 거중기를 설계하여 무거운 돌을 쉽게 들어 올리도록 했다. 덕분에 큰 공사를 예상보다 빨리 마칠 수 있었다.","화성을 쌓은 과정은 『화성성역의궤』라는 책에 자세히 기록되었다. 이 기록 덕분에 전쟁으로 망가진 화성을 원래 모습대로 다시 고칠 수 있었다. 수원 화성은 그 가치를 인정받아 1997년에 유네스코 세계 유산이 되었다."],"g":"hi"},{"n":70,"ti":"고추가 들어온 길","to":"고추가 우리나라에 들어온 과정과 우리 음식에 준 변화","tx":["고추는 아메리카에서 자라던 식물이다.","고추는 처음부터 우리나라에 있었다."],"cp":0,"fm":"병렬식","th":["고추가 들어오기 전의 김치는 어떤 모습이었을까요?","빨갛지 않은 김치","지금보다 더 빨간 김치","고추장으로 버무린 김치","김치가 아예 없었다","3문단에 고추가 들어오기 전의 김치는 지금처럼 빨갛지 않았다고 했어요."],"kw":["고추","유럽","마늘","떡볶이"],"vo":[["대륙","바다로 둘러싸인 아주 넓은 땅","작은 섬","좁은 강","높은 산"],["절이다","채소 등에 소금이나 식초를 배어들게 하다","불에 굽다","물에 씻다","얼리다"]],"mi":["고추는 원래 아메리카에서 자라던 식물이다.","고추가 세계로 퍼져 우리나라에 들어왔다.","고추가 들어오기 전의 김치","고추는 우리 음식의 맛을 크게 바꾸었다."],"ks":[[2,"우리나라에는 조선 시대인"],[4,"고추는 우리 음식의 맛을"]],"ev":["고추가 세계 여러 곳으로 퍼진 까닭을 알 수 있는 문장은?","바닷길을 오가면서","2문단 첫 문장에 나와요."],"p":["매콤한 김치와 떡볶이에 빠지지 않는 고추는 처음부터 우리나라에 있던 채소가 아니다. 고추는 원래 아메리카 대륙에서 자라던 식물이다.","아메리카의 고추는 유럽 사람들이 바닷길을 오가면서 세계 여러 곳으로 퍼져 나갔다. 우리나라에는 조선 시대인 16세기 말이나 17세기 초 무렵 들어온 것으로 알려져 있다.","고추가 들어오기 전의 김치는 지금처럼 빨갛지 않았다. 소금에 절인 채소에 마늘, 생강 같은 양념을 넣어 담갔다.","고추는 우리 음식의 맛을 크게 바꾸어 놓았다. 오늘날 고춧가루와 고추장은 우리 밥상에서 빼놓을 수 없는 양념이 되었다."],"g":"hi"},{"n":71,"ti":"여름의 곤충, 매미","to":"매미의 생김새와 한살이, 우는 방법","tx":["매미는 여름에 운다.","매미는 암컷만 운다."],"cp":0,"fm":"병렬식","th":["나무 위에서 ‘맴맴’ 울고 있는 매미는 암컷일까요, 수컷일까요?","수컷","암컷","둘 다","알 수 없다","4문단에 매미 가운데 우는 것은 수컷이라고 했어요."],"kw":["매미","날개","나무뿌리","배"],"vo":[["허물","곤충이나 뱀이 자라면서 벗는 껍질","곤충의 날개","나무의 열매","흙 알갱이"],["투명하다","속까지 환히 비쳐 보이다","아주 까맣다","두껍고 단단하다","울퉁불퉁하다"]],"mi":["여름을 알리는 곤충 매미를 알아보자.","매미의 생김새와 먹이","땅속에서 애벌레로 지내다 어른벌레가 되는 매미","수컷 매미가 우는 방법"],"ks":[[2,"매미는 몸길이가"],[3,"매미는 어른벌레가 되기"]],"ev":["매미가 어떻게 소리를 내는지 알 수 있는 문장은?","발음 기관을 떨어","4문단 마지막 문장에 나와요."],"p":["한여름 나무 위에서 ‘맴맴’ 우는 매미 소리를 들으면 여름이 왔다는 것을 알 수 있다. 여름의 대표 곤충인 매미에 대해 알아보자.","매미는 몸길이가 3~5센티미터쯤 되고, 투명한 날개가 두 쌍 있다. 머리 양옆에는 커다란 눈이 튀어나와 있고, 뾰족한 입으로 나무줄기를 찔러 즙을 빨아 먹는다.","매미는 어른벌레가 되기 전까지 땅속에서 애벌레로 몇 해를 산다. 땅속에서 나무뿌리의 즙을 먹으며 자라다가, 때가 되면 땅 위로 올라와 허물을 벗고 어른벌레가 된다.","매미 가운데 우는 것은 수컷이다. 수컷은 배에 있는 발음 기관을 떨어 소리를 내며 암컷을 부른다."],"g":"hi"},{"n":72,"ti":"계절별 제철 음식","to":"계절마다 가장 맛있고 영양이 풍부한 제철 음식","tx":["겨울에는 김장을 한다.","제철 음식은 계절과 관계없다."],"cp":0,"fm":"병렬식","th":["봄 소풍 도시락에 제철 음식을 넣고 싶어요. 알맞은 것은?","냉이와 달래로 만든 나물 반찬","김장 김치","전어구이","굴전","2문단에 봄에는 냉이, 달래, 쑥 같은 봄나물이 제철이라고 했어요."],"kw":["제철 음식","냉이","전어","김장"],"vo":[["제철","먹거리가 가장 맛있고 알맞은 때","한겨울","아무 때나","다음 해"],["돋우다","입맛이나 흥미를 더 일어나게 하다","없애다","줄이다","잊게 하다"]],"mi":["제철 음식의 뜻","봄의 제철 음식","여름의 제철 음식","가을의 제철 음식","겨울의 제철 음식"],"ks":[[1,"제철 음식은 그 계절에"],[4,"가을은 곡식과 열매를"]],"ev":["여름 제철 음식이 더위를 이기는 데 도움을 주는 까닭을 알 수 있는 문장은?","물기가 많아","3문단 두 번째 문장에 나와요."],"p":["제철 음식은 그 계절에 가장 맛있고 영양이 풍부한 음식을 말한다. 계절마다 우리 밥상에 오르는 제철 음식은 다르다.","봄에는 겨우내 언 땅을 뚫고 올라온 나물이 제철이다. 냉이, 달래, 쑥 같은 봄나물은 향긋하여 입맛을 돋워 준다.","여름에는 햇볕을 듬뿍 받고 자란 채소와 과일이 풍성하다. 오이와 토마토, 수박과 참외는 물기가 많아 더위를 이기는 데 도움을 준다.","가을은 곡식과 열매를 거두는 계절이다. 햅쌀로 지은 밥과 밤, 사과, 배가 맛있고, 바다에서는 전어가 많이 잡힌다.","겨울에는 무와 배추로 김장을 한다. 날이 추울수록 단맛이 드는 시금치와, 바다에서 나는 굴과 김도 겨울에 특히 맛이 좋다."],"g":"hi"},{"n":73,"ti":"한지와 양지","to":"종이의 두 종류인 한지와 양지의 특징","tx":["한지는 닥나무로 만든다.","양지는 손으로만 만든다."],"cp":0,"fm":"병렬식","th":["오래오래 보관할 기록을 적을 종이로 더 알맞은 것은?","쉽게 찢어지지 않고 잘 상하지 않는 한지","값이 싼 양지","물에 젖은 종이","아무 종이나 괜찮다","2문단에 한지는 질겨서 쉽게 찢어지지 않고 오래 두어도 잘 상하지 않는다고 했어요."],"kw":["종이","껍질","기계","인쇄"],"vo":[["질기다","잘 끊어지거나 찢어지지 않고 견디는 힘이 세다","쉽게 부서지다","아주 무르다","가볍게 날리다"],["펄프","나무를 잘게 부수어 만든 종이의 원료","옷감","유리","쇠붙이"]],"mi":["종이는 한지와 양지로 나뉜다.","한지를 만드는 방법과 특징","양지를 만드는 방법과 특징"],"ks":[[2,"한지는 닥나무 껍질로"]],"ev":["양지가 값이 싼 까닭을 알 수 있는 문장은?","한꺼번에 많이","3문단 두 번째 문장에 나와요."],"p":["우리가 쓰는 종이는 크게 두 가지로 나눌 수 있다. 하나는 한지이고, 다른 하나는 양지이다.","한지는 닥나무 껍질로 만든 우리 전통 종이이다. 닥나무 껍질을 삶고 두드려 섬유를 풀어낸 뒤, 물에 풀어 발로 떠서 말린다. 섬유가 길고 질겨서 쉽게 찢어지지 않고, 오래 두어도 잘 상하지 않는다.","양지는 나무를 잘게 부순 펄프로 기계를 이용해 만든 종이이다. 한꺼번에 많이 만들 수 있어 값이 싸고, 겉이 매끄러워 글씨를 쓰거나 인쇄하기에 좋다."],"g":"hi"},{"n":74,"ti":"하천을 살리자","to":"맑은 하천을 물려주기 위해 하천을 아끼고 지키자.","tx":["하천에는 물고기가 산다.","물고기 떼죽음은 모두 자연 때문이다."],"cp":4,"fm":"미괄식","th":["하천을 살리기 위해 집에서 할 수 있는 일로 알맞은 것은?","설거지할 때 기름은 닦아 내고 세제는 알맞게 쓴다.","남은 국물과 기름을 하수구에 붓는다.","세제를 많이 쓸수록 좋다.","하천 옆에 쓰레기를 모아 둔다.","3문단에 기름이나 음식물 찌꺼기를 하수구에 버리지 말고 세제를 알맞게 쓰라고 했어요."],"kw":["하천","보금자리","세제","산책"],"vo":[["떼죽음","한꺼번에 많이 죽는 것","하나씩 태어나는 것","무리 지어 이사하는 것","잠을 자는 것"],["보금자리","지내기에 매우 포근하고 아늑한 곳","아주 위험한 곳","쓰레기장","높은 산꼭대기"]],"mi":["하천의 물고기 떼죽음은 사람 때문인 경우가 많다.","하천을 지켜야 하는 까닭","하천을 살리는 방법","하천을 아끼고 지켜야 한다."],"ks":[[1,"전문가들은 이런 일이"],[4,"맑은 하천을 다음 세대에게"]],"ev":["하천이 사람에게 쉼터가 된다는 것을 알 수 있는 문장은?","산책할 수 있는","2문단 마지막 문장에 나와요."],"p":["여름마다 도시의 하천에서 물고기가 떼죽음을 당했다는 소식이 들려온다. 전문가들은 이런 일이 자연의 탓이라기보다 사람들이 흘려보낸 더러운 물과 쓰레기 때문인 경우가 많다고 말한다.","하천을 지켜야 하는 까닭은 무엇일까? 첫째, 하천은 물고기와 새, 곤충이 살아가는 보금자리이다. 둘째, 하천의 물은 우리가 마시는 물과 농사짓는 물의 중요한 바탕이 된다. 셋째, 맑은 하천은 사람들에게 쉬고 산책할 수 있는 공간을 준다.","하천을 살리는 방법에는 무엇이 있을까? 첫째, 기름이나 음식물 찌꺼기를 하수구에 버리지 않는다. 둘째, 하천 주변에 쓰레기를 버리지 않고, 보이는 쓰레기는 줍는다. 셋째, 세제를 알맞게 써서 더러운 물을 줄인다.","지금까지 하천을 지켜야 하는 까닭과 하천을 살리는 방법을 알아보았다. 하천은 사람과 자연 모두의 소중한 터전이다. 맑은 하천을 다음 세대에게 물려주기 위해 우리 모두 하천을 아끼고 지켜야 한다."],"g":"hi"},{"n":75,"ti":"책임감 있는 사람","to":"작은 일부터 스스로 해내며 책임감 있는 사람이 되자.","tx":["책임감이 부족하면 핑계를 댄다.","책임감은 나이가 들면 저절로 생긴다."],"cp":4,"fm":"미괄식","th":["다음 중 책임감 있는 모습으로 알맞은 것은?","모둠에서 맡은 자료 조사를 약속한 날까지 끝내 온다.","힘들면 친구에게 떠넘긴다.","실수하면 친구 탓을 한다.","핑계를 대고 그만둔다.","2문단에 책임감 있는 사람은 맡은 일을 끝까지 해내고 약속한 시간을 지킨다고 했어요."],"kw":["책임감","화분","모둠","핑계"],"vo":[["떠맡다","남이 할 일을 대신 맡다","일을 남에게 넘기다","일을 끝내다","일을 잊다"],["핑계","잘못을 감추려고 다른 일을 내세우는 말","솔직한 사과","고마운 인사","칭찬하는 말"]],"mi":["함께 생활할 때 맡은 일에 책임을 다하는 것이 중요하다.","책임감 있는 사람의 모습","책임감이 부족한 사람의 모습","작은 일부터 해내며 책임감을 기르자."],"ks":[[1,"그러므로 함께 생활할 때에는"],[4,"책임감은 나이가 든다고"]],"ev":["책임감이 부족하면 생기는 문제를 알 수 있는 문장은?","믿고 일을 맡기기","3문단 마지막 문장에 나와요."],"p":["모둠 과제를 할 때 맡은 일을 끝까지 해 오는 친구가 있으면 모둠 전체가 편안하다. 반대로 한 사람이 맡은 일을 하지 않으면 다른 친구들이 그 일까지 떠맡아야 한다. 그러므로 함께 생활할 때에는 자기가 맡은 일에 책임을 다하는 것이 중요하다.","자기가 맡은 일을 끝까지 해내고, 그 결과까지 스스로 받아들이는 사람을 책임감 있는 사람이라고 한다. 이런 사람은 약속한 시간을 지키고, 실수를 했을 때에도 남의 탓을 하지 않고 먼저 사과한다.","책임감이 부족한 사람은 일이 힘들면 쉽게 그만두거나 핑계를 댄다. 그래서 다른 사람들이 그 사람을 믿고 일을 맡기기 어렵다.","책임감은 나이가 든다고 저절로 생기는 것이 아니라, 작은 일부터 스스로 해내는 경험을 통해 길러진다. 먼저 내 방 정리나 화분에 물 주기처럼 집에서 맡은 일을 꾸준히 해 보자. 그리고 약속을 지키지 못했을 때는 솔직하게 말하고 바로잡으려고 노력하자."],"g":"hi"},{"n":76,"ti":"맹꽁이","to":"맹꽁이의 생김새와 생활, 보호가 필요한 까닭","tx":["맹꽁이는 장마철에 운다.","맹꽁이는 개구리처럼 멀리 뛴다."],"cp":0,"fm":"병렬식","th":["마을의 논과 웅덩이를 모두 메워 건물을 짓는다면 맹꽁이는 어떻게 될까요?","알을 낳을 곳이 없어져 수가 더 줄어든다.","수가 더 많아진다.","낮에 더 크게 운다.","멀리 뛰어다니게 된다.","3·4문단에 맹꽁이는 웅덩이에 알을 낳고, 논과 습지가 줄어 수가 크게 줄었다고 했어요."],"kw":["맹꽁이","무늬","웅덩이","해충"],"vo":[["엉금엉금","느리게 기어가는 모양","빠르게 날아가는 모양","높이 뛰는 모양","가만히 서 있는 모양"],["습지","물기가 많아 늘 축축한 땅","메마른 사막","높은 산","넓은 바다"]],"mi":["장마철 밤에 들리는 맹꽁이 소리","맹꽁이의 생김새와 움직임","맹꽁이의 생활과 우는 모습","보호가 필요한 맹꽁이"],"ks":[[2,"맹꽁이는 몸이 둥글고"],[3,"맹꽁이는 대부분의 시간을"]],"ev":["‘맹꽁 맹꽁’ 소리가 어떻게 나는지 알 수 있는 문장은?","번갈아 우는","3문단 마지막 문장에 나와요."],"p":["장마철 밤, 논이나 웅덩이 근처에서 ‘맹꽁 맹꽁’ 하는 소리가 들릴 때가 있다. 바로 맹꽁이가 우는 소리이다.","맹꽁이는 몸이 둥글고 통통하며, 머리가 작고 다리가 짧다. 등은 누런 바탕에 푸르스름한 무늬가 있다. 다른 개구리처럼 멀리 뛰지 못하고 주로 엉금엉금 기어 다닌다.","맹꽁이는 대부분의 시간을 땅속에 숨어 지낸다. 그러다 장마철에 비가 많이 내리면 밖으로 나와 웅덩이에 알을 낳는다. ‘맹꽁 맹꽁’ 소리는 사실 여러 마리가 ‘맹’과 ‘꽁’을 번갈아 우는 소리라고 한다.","맹꽁이는 해충을 잡아먹는 이로운 동물이다. 그러나 논과 습지가 줄어들면서 수가 크게 줄어, 지금은 멸종 위기 야생 생물로 정해 보호하고 있다."],"g":"hi"},{"n":77,"ti":"일회용품을 줄이자","to":"일회용품을 줄이기 위해 작은 습관부터 바꾸자.","tx":["플라스틱은 썩는 데 오래 걸린다.","일회용품은 편리하니 많이 써도 된다."],"cp":5,"fm":"미괄식","th":["학교에 갈 때 일회용품을 줄이기 위해 챙기면 좋은 것은?","내 물병","일회용 컵 한 묶음","비닐봉지","플라스틱 빨대","2문단에 개인 컵과 물병을 들고 다니라고 했어요."],"kw":["일회용품","빨대","장바구니","카페"],"vo":[["일회용품","한 번 쓰고 버리게 만든 물건","여러 번 쓰는 물건","오래된 물건","비싼 물건"],["다회용","여러 번 되풀이하여 쓸 수 있는 것","한 번만 쓰는 것","쓸 수 없는 것","먹을 수 있는 것"]],"mi":["일회용품 쓰레기가 땅과 바다를 더럽힌다.","개인 컵과 물병을 들고 다닌다.","장바구니를 쓴다.","다회용 그릇을 챙긴다.","작은 습관부터 바꾸어 나가야 한다."],"ks":[[2,"첫째, 개인 컵과"],[5,"조금 불편하더라도"]],"ev":["플라스틱이 환경에 해로운 까닭을 알 수 있는 문장은?","썩는 데 아주 오랜","1문단 세 번째 문장에 나와요."],"p":["편리하다는 까닭으로 우리는 하루에도 여러 번 일회용품을 쓴다. 한 번 쓰고 버리는 컵, 빨대, 비닐봉지는 금세 쓰레기가 되어 쌓인다. 특히 플라스틱은 썩는 데 아주 오랜 시간이 걸려 땅과 바다를 더럽힌다. 그렇다면 일회용품을 줄이려면 어떻게 해야 할까?","첫째, 개인 컵과 물병을 들고 다닌다. 카페나 학교에서 일회용 컵 대신 내 컵을 쓰면 버려지는 컵이 줄어든다.","둘째, 장을 볼 때 장바구니를 쓴다. 장바구니를 가방에 넣어 다니면 비닐봉지를 받지 않아도 된다.","셋째, 음식을 포장할 때 다회용 그릇을 챙긴다. 집에서 쓰는 통을 가져가 음식을 담아 오면 플라스틱 용기를 줄일 수 있다.","일회용품을 쓰는 것은 잠깐이지만, 그 쓰레기는 오랫동안 남는다. 조금 불편하더라도 작은 습관부터 바꾸어 나가야 한다."],"g":"hi"},{"n":78,"ti":"비버의 댐","to":"비버는 안전한 집을 짓기 위해 나무와 진흙으로 댐을 쌓는다.","tx":["비버는 앞니가 날카롭다.","비버는 물속에서 살지 않는다."],"cp":4,"fm":"미괄식","th":["비버가 나뭇가지 틈을 진흙과 돌로 메우는 까닭은?","물이 새어 나가지 않게 하여 깊은 연못을 만들려고","나뭇가지를 먹으려고","댐을 예쁘게 꾸미려고","물고기를 잡으려고","3문단에 틈을 메우면 물이 새어 나가지 않아 깊은 연못이 생긴다고 했어요."],"kw":["댐","앞니","늑대","얼음"],"vo":[["갉다","날카로운 이로 조금씩 긁어 뜯다","통째로 삼키다","물을 뿌리다","부드럽게 쓰다듬다"],["메우다","뚫리거나 빈 곳을 채우다","구멍을 더 크게 뚫다","깨끗이 비우다","넓게 펼치다"]],"mi":["비버는 나무와 진흙으로 댐을 쌓는다.","나무를 쓰러뜨려 나뭇가지를 쌓는다.","틈을 진흙과 돌로 메워 연못을 만든다.","비버는 안전한 집을 짓기 위해 댐을 쌓는다."],"ks":[[1,"비버는 나무와 진흙으로"],[4,"비버가 댐을 쌓는 것은"]],"ev":["비버의 집이 적에게서 안전한 까닭을 알 수 있는 문장은?","입구가 물속에","4문단 두 번째 문장에 나와요."],"p":["비버가 강을 막아 댐을 쌓는 모습을 본 적이 있나요? 비버는 나무와 진흙으로 튼튼한 댐을 만드는 것으로 유명하다. 비버는 어떻게 댐을 쌓고, 왜 쌓는 것일까?","비버는 날카로운 앞니로 나무를 갉아 쓰러뜨린다. 그리고 나뭇가지를 물어 날라 물길을 가로지르도록 차곡차곡 쌓는다.","나뭇가지 사이의 틈은 진흙과 돌로 메운다. 이렇게 하면 물이 새어 나가지 않아 댐 뒤쪽에 깊은 연못이 생긴다.","비버가 댐을 쌓는 것은 깊은 물속에 안전한 집을 짓기 위해서이다. 집의 입구가 물속에 있어서 늑대 같은 적이 쉽게 들어오지 못하고, 겨울에도 얼음 아래로 드나들며 지낼 수 있다."],"g":"hi"},{"n":79,"ti":"갯벌이 주는 도움","to":"갯벌은 바다 생물과 새, 사람에게 많은 도움을 준다.","tx":["갯벌에는 게가 산다.","갯벌은 쓸모없는 땅이다."],"cp":0,"fm":"병렬식","th":["태풍이 올 때 갯벌이 사람에게 주는 도움은?","태풍이나 큰 파도의 힘을 약하게 해 준다.","태풍을 더 세게 만든다.","태풍이 오면 사라진다.","바람을 모아 전기를 만든다.","4문단에 갯벌은 태풍이나 큰 파도가 몰려올 때 그 힘을 약하게 해 준다고 했어요."],"kw":["갯벌","낙지","도요새","썰물"],"vo":[["썰물","바닷물이 빠져나가 물높이가 낮아지는 것","바닷물이 밀려 들어오는 것","비가 많이 오는 것","강물이 얼어붙는 것"],["쉼터","쉬어 가는 곳","일하는 곳","싸우는 곳","물건을 파는 곳"]],"mi":["갯벌의 뜻과 만들어진 과정","갯벌은 수많은 생물의 보금자리이다.","갯벌은 철새들의 쉼터이다.","갯벌은 사람에게도 도움을 준다."],"ks":[[2,"갯벌은 수많은 생물의"],[3,"갯벌은 철새들의 쉼터이기도"]],"ev":["갯벌이 바닷물을 깨끗하게 해 준다는 것을 알 수 있는 문장은?","더러운 물질을 걸러","4문단 두 번째 문장에 나와요."],"p":["바닷물이 빠져나가는 썰물 때가 되면 넓은 진흙 땅이 드러나고, 바닷물이 들어오는 밀물 때가 되면 다시 바다가 되는 곳이 있다. 이곳을 갯벌이라고 한다. 갯벌은 오랜 세월 동안 강물과 바닷물에 실려 온 흙과 모래가 쌓여 만들어졌다. 갯벌은 우리에게 어떤 도움을 줄까?","갯벌은 수많은 생물의 보금자리이다. 갯벌의 진흙 속에는 영양분이 많아서 조개, 게, 갯지렁이, 낙지 같은 생물이 모여 산다.","갯벌은 철새들의 쉼터이기도 하다. 먼 거리를 날아가는 도요새와 물떼새는 갯벌에 들러 조개와 갯지렁이를 먹으며 힘을 얻는다.","갯벌은 사람에게도 도움을 준다. 갯벌의 생물들은 바다로 흘러드는 더러운 물질을 걸러 바닷물을 깨끗하게 한다. 또 갯벌은 태풍이나 큰 파도가 몰려올 때 그 힘을 약하게 해 준다. 이처럼 갯벌은 바다 생물과 새, 그리고 사람에게 많은 도움을 준다."],"g":"hi"},{"n":80,"ti":"남극 기지의 생활","to":"남극 기지에서의 특별한 생활","tx":["남극은 얼음으로 덮여 있다.","남극의 쓰레기는 그곳에 버린다."],"cp":0,"fm":"병렬식","th":["눈보라가 심하게 부는 날, 남극 기지 대원이 할 행동으로 알맞은 것은?","날씨를 확인하고 되도록 밖에 나가지 않는다.","얇은 옷을 입고 밖으로 나간다.","혼자 멀리 산책을 간다.","창문을 열어 둔다.","2문단에 눈보라가 몰아치는 날에는 밖에 나가기 위험해서 날씨를 꼭 확인한다고 했어요."],"kw":["남극 기지","눈보라","온실","배"],"vo":[["대원","어떤 무리에 속하여 함께 일하는 사람","혼자 여행하는 사람","구경하는 사람","물건을 파는 사람"],["보관","물건을 맡아 잘 간직하는 것","모두 버리는 것","나누어 주는 것","먹어 버리는 것"]],"mi":["우리나라는 남극에 기지를 세우고 연구한다.","남극 기지의 추운 겨울과 대원들의 준비","남극 기지에서 먹을거리를 마련하는 방법","남극의 쓰레기는 남극 밖으로 가져간다."],"ks":[[2,"남극 기지의 겨울은"],[3,"남극 기지에서는 먹을거리를"]],"ev":["남극에서 쓰레기를 가져가는 까닭을 알 수 있는 문장은?","깨끗한 자연을 지키기","4문단 마지막 문장에 나와요."],"p":["남극은 일 년 내내 얼음으로 덮여 있는 아주 추운 곳이다. 우리나라는 이곳에 세종 기지와 장보고 기지를 세우고 과학자들을 보내 연구하고 있다.","남극 기지의 겨울은 무척 춥다. 영하 수십 도까지 내려가고, 눈보라가 몰아치는 날에는 앞이 보이지 않아 밖에 나가기도 위험하다. 그래서 대원들은 날씨를 꼭 확인하고, 밖에 나갈 때에는 여러 겹의 두꺼운 옷을 입는다.","남극 기지에서는 먹을거리를 구하기 어렵다. 그래서 오랫동안 먹을 식량을 미리 배로 실어 와 보관한다. 기지에 따라 작은 온실에서 신선한 채소를 직접 기르기도 한다.","남극에서 생긴 쓰레기는 함부로 버리지 않는다. 남극의 깨끗한 자연을 지키기 위해 쓰레기를 모아 두었다가 배에 실어 남극 밖으로 가져간다."],"g":"hi"},{"n":81,"ti":"줄임말을 쓸 때","to":"줄임말은 문제를 일으킬 수 있으니 때와 장소에 맞게 바른 우리말을 쓰자.","tx":["‘생선’은 ‘생일 선물’의 줄임말로도 쓰인다.","줄임말은 어디서든 써도 된다."],"cp":1,"fm":"양괄식","th":["할머니께 생일 선물 이야기를 할 때 알맞은 말은?","“할머니, 생일 선물 고마워요.”","“할머니, 생선 고마워요.”","“할머니, 생파 짱이에요.”","“할머니, ㄱㅅ.”","3문단에 여러 사람 앞이나 글에서는 바른 우리말을 쓰자고 했어요. 줄임말은 어른이 알아듣기 어려워요."],"kw":["줄임말","할머니","생선","글"],"vo":[["줄임말","낱말의 일부를 줄여서 간단히 만든 말","아주 긴 말","외국어","사투리"],["튀어나오다","갑자기 불쑥 밖으로 나오다","깊이 숨다","천천히 사라지다","꽉 막히다"]],"mi":["줄임말은 재미있지만 문제를 일으키기도 한다.","뜻을 모르는 사람과는 대화가 잘 통하지 않는다.","바른 우리말을 잊기 쉬우니 때와 장소에 맞게 써야 한다."],"ks":[[1,"이런 말은 친구끼리"],[3,"그러므로 줄임말은"]],"ev":["줄임말이 글쓰기에 주는 문제를 알 수 있는 문장은?","글을 쓸 때에도","3문단 두 번째 문장에 나와요."],"p":["요즘 어린이들 사이에서는 줄임말과 새로 만든 말을 쓰는 일이 많아졌다. 이런 말은 친구끼리 빠르고 재미있게 이야기할 수 있게 해 주지만, 여러 가지 문제를 일으키기도 한다.","먼저, 뜻을 모르는 사람과는 대화가 잘 통하지 않는다. 할머니나 할아버지께 ‘생선’이 ‘생일 선물’이라는 뜻이라고 설명하지 않으면 전혀 다른 뜻으로 알아들으실 수 있다.","또 줄임말을 자주 쓰다 보면 바른 우리말을 잊기 쉽다. 글을 쓸 때에도 줄임말이 튀어나와 뜻을 정확하게 전하지 못하는 경우가 생긴다. 그러므로 줄임말은 친한 친구끼리만 가볍게 쓰고, 여러 사람 앞이나 글에서는 바른 우리말을 쓰도록 해야 한다."],"g":"hi"},{"n":82,"ti":"하천의 지킴이, 수달","to":"수달은 깨끗한 하천을 알려 주는 소중한 동물이다.","tx":["수달은 물고기를 먹는다.","수달은 더러운 물에서도 잘 산다."],"cp":1,"fm":"양괄식","th":["어느 도시의 하천에서 수달이 다시 발견되었다는 뉴스가 나왔어요. 무엇을 짐작할 수 있을까요?","하천의 물이 깨끗해지고 물고기가 많아졌다.","하천이 더 더러워졌다.","하천에 물고기가 사라졌다.","수달이 더러운 물을 좋아하게 되었다.","4문단에 수달이 사는 하천은 물고기가 많고 물이 깨끗하다는 뜻이라고 했어요."],"kw":["수달","물갈퀴","천연기념물","바위"],"vo":[["생태계","생물들과 둘레의 자연이 서로 영향을 주고받는 세계","사람이 만든 건물","동물원","수족관"],["물갈퀴","물새나 수달의 발가락 사이에 있는 얇은 막","날카로운 발톱","등에 난 털","긴 꼬리"]],"mi":["수달은 하천 생태계의 지킴이이며 보호받고 있다.","물속 생활에 알맞은 수달의 몸","수달의 먹이와 생활","수달이 사는 하천은 깨끗한 하천이다."],"ks":[[2,"수달은 물속 생활에"],[4,"수달이 사는 하천은"]],"ev":["수달이 헤엄을 잘 치는 까닭을 알 수 있는 문장은?","물갈퀴가 있어","2문단 두 번째 문장에 나와요."],"p":["수달은 강과 하천에 사는 동물로, 물이 깨끗한 곳에서만 살 수 있어 ‘하천 생태계의 지킴이’라고 불린다. 그러나 하천이 오염되고 개발되면서 그 수가 줄어 지금은 천연기념물이자 멸종 위기 야생 생물로 보호받고 있다.","수달은 물속 생활에 알맞은 몸을 가지고 있다. 몸이 길고 매끈하며, 발가락 사이에 물갈퀴가 있어 헤엄을 잘 친다.","수달은 주로 물고기를 먹고, 개구리와 게도 잡아먹는다. 밤에 활발하게 움직이며, 물가의 바위 틈이나 굴에 보금자리를 만든다.","수달이 사는 하천은 물고기가 많고 물이 깨끗하다는 뜻이다. 그래서 수달이 돌아온 하천은 되살아난 하천이라고 할 수 있다."],"g":"hi"},{"n":83,"ti":"첨성대","to":"신라의 첨성대의 모습과 가치","tx":["첨성대는 경주에 있다.","첨성대는 조선 시대에 세웠다."],"cp":0,"fm":"병렬식","th":["첨성대를 보고 신라 사람들의 기술이 뛰어났다고 할 수 있는 까닭은?","오랜 세월 지진과 비바람을 견디고 모습을 지켜 왔기 때문에","높이가 100미터가 넘기 때문에","쇠로 만들었기 때문에","창문이 아주 많기 때문에","3문단에 오랜 세월 지진과 비바람을 견뎌 온 점이 신라의 뛰어난 기술을 보여 준다고 했어요."],"kw":["첨성대","창","지진","우물"],"vo":[["건축물","사람이 지은 집이나 탑 같은 구조물","자연에 생긴 동굴","땅에 박힌 돌","흐르는 강"],["지정","가리켜 어떤 것으로 정하는 것","모두 없애는 것","숨겨 두는 것","잊어버리는 것"]],"mi":["첨성대의 위치와 세운 때, 크기","첨성대의 생김새","첨성대의 쓰임과 가치"],"ks":[[1,"첨성대는 경상북도 경주에"],[2,"첨성대는 아래쪽이 넓고"]],"ev":["첨성대의 몸통이 몇 단으로 쌓였는지 알 수 있는 문장은?","27단으로","2문단 두 번째 문장에 나와요."],"p":["첨성대는 경상북도 경주에 있는 신라 시대의 돌 건축물이다. 신라의 선덕 여왕 때 세워졌다고 전해지며, 국보로 지정되어 있다. 높이는 약 9미터이다.","첨성대는 아래쪽이 넓고 위로 갈수록 좁아지는 병 모양이다. 둥근 몸통은 돌을 27단으로 쌓아 만들었고, 맨 위에는 우물 정(井) 자 모양으로 돌을 짜 올렸다. 몸통의 가운데쯤에는 네모난 창이 하나 나 있다.","첨성대는 이름 그대로 별을 살피던 곳으로 알려져 있다. 오랜 세월 동안 지진과 비바람을 견디며 지금까지 모습을 지켜 왔다는 점에서, 신라 사람들의 뛰어난 기술을 보여 준다."],"g":"hi"},{"n":84,"ti":"지진이 났을 때","to":"지진이 났을 때의 올바른 행동 요령","tx":["지진은 미리 알기 어렵다.","지진이 나면 엘리베이터를 탄다."],"cp":0,"fm":"병렬식","th":["교실에서 수업 중 땅이 크게 흔들리기 시작했어요. 가장 먼저 할 행동은?","책상 아래로 들어가 머리를 보호하고 책상 다리를 잡는다.","엘리베이터를 타러 뛰어간다.","창문 앞에 서서 밖을 본다.","흔들리는 중에 운동장으로 뛰어나간다.","2문단에 흔들림이 느껴지면 튼튼한 탁자 아래로 들어가 머리를 보호하라고 했어요."],"kw":["지진","계단","전봇대","공원"],"vo":[["대피","위험을 피해 안전한 곳으로 잠시 옮기는 것","위험한 곳으로 가는 것","집에 숨는 것","구경하는 것"],["확보","확실하게 갖추어 두는 것","잃어버리는 것","막아 버리는 것","다른 사람에게 주는 것"]],"mi":["지진 때 행동 요령을 미리 알아 두어야 한다.","건물 안에서 흔들릴 때의 행동","밖으로 나갈 때의 행동","넓은 곳으로 대피한다."],"ks":[[1,"그래서 지진이 났을 때"],[3,"밖으로 나갈 때에는"]],"ev":["흔들림이 멈춘 뒤 문을 여는 까닭을 짐작할 수 있는 문장은?","나갈 곳을 확보한다","2문단 두 번째 문장에 나와요."],"p":["지진은 언제 일어날지 미리 알기 어렵다. 그래서 지진이 났을 때 어떻게 행동해야 하는지 미리 알아 두는 것이 중요하다.","건물 안에 있을 때 흔들림이 느껴지면 튼튼한 탁자 아래로 들어가 머리를 보호하고, 탁자 다리를 꼭 잡는다. 흔들림이 멈추면 문을 열어 나갈 곳을 확보한다.","밖으로 나갈 때에는 엘리베이터를 타지 말고 계단을 이용한다. 건물 밖에서는 떨어지는 물건에 다치지 않도록 가방이나 두 팔로 머리를 감싼다.","밖에 나온 뒤에는 건물이나 담장, 전봇대에서 멀리 떨어진 운동장이나 공원 같은 넓은 곳으로 대피한다."],"g":"hi"},{"n":85,"ti":"달의 모양이 바뀌는 까닭","to":"달은 햇빛을 반사하고 지구 둘레를 돌기 때문에 모양이 바뀌어 보인다.","tx":["보름달은 둥글다.","달은 스스로 빛을 낸다."],"cp":3,"fm":"미괄식","th":["달이 스스로 빛을 낸다면 어떻게 보일까요?","날마다 모양이 바뀌지 않고 늘 둥글게 보일 것이다.","더 가늘게 보일 것이다.","아예 보이지 않을 것이다.","반쪽만 보일 것이다.","2·3문단에 달은 햇빛을 반사하는 절반만 빛나고, 보는 방향에 따라 밝은 부분이 달라져 모양이 바뀐다고 했어요."],"kw":["달","눈썹","햇빛","방향"],"vo":[["반사","빛이나 소리가 물체에 부딪혀 되돌아 나오는 것","빛을 스스로 내는 것","빛을 모두 삼키는 것","소리를 크게 내는 것"],["둘레","무엇을 둘러싼 바깥 언저리","한가운데","맨 아래","꼭대기"]],"mi":["달은 날마다 모양이 달라진다.","달은 햇빛을 반사하여 절반만 빛난다.","달이 지구 둘레를 돌며 보이는 밝은 부분이 달라진다."],"ks":[[2,"그래서 달은 언제나"],[3,"달이 돌면서 지구에서"]],"ev":["달이 지구 둘레를 도는 데 걸리는 시간을 알 수 있는 문장은?","약 한 달에","3문단 첫 문장에 나와요."],"p":["밤하늘의 달은 날마다 모양이 조금씩 달라진다. 가느다란 눈썹 모양일 때도 있고, 반쪽만 보일 때도 있으며, 둥근 보름달이 될 때도 있다.","달은 스스로 빛을 내지 못하고 햇빛을 받아 반사하여 빛난다. 그래서 달은 언제나 햇빛을 받는 절반만 밝게 빛난다.","달은 지구 둘레를 약 한 달에 한 바퀴씩 돈다. 달이 돌면서 지구에서 바라보는 방향이 바뀌기 때문에, 햇빛을 받아 밝은 부분이 우리 눈에 보이는 크기도 날마다 달라진다. 밝은 부분이 모두 보이면 보름달이 되고, 거의 보이지 않으면 달이 보이지 않는 삭이 된다."],"g":"hi"},{"n":86,"ti":"우리 전통 악기","to":"소리를 내는 방법에 따른 우리 전통 악기의 분류","tx":["해금은 활로 연주한다.","장구는 입으로 분다."],"cp":0,"fm":"병렬식","th":["사물놀이에 쓰이는 꽹과리, 징, 장구, 북은 어떤 악기에 속할까요?","두드리거나 쳐서 소리를 내는 타악기","줄을 뜯는 현악기","입으로 부는 관악기","전기로 소리를 내는 악기","3문단에 장구, 북, 꽹과리, 징은 두드리거나 쳐서 소리를 내는 타악기라고 했어요."],"kw":["전통 악기","대나무","활","구멍"],"vo":[["현악기","줄을 뜯거나 켜서 소리를 내는 악기","입으로 부는 악기","두드리는 악기","흔드는 악기"],["높낮이","높고 낮은 정도","길고 짧은 정도","무겁고 가벼운 정도","빠르고 느린 정도"]],"mi":["줄을 뜯거나 켜서 소리를 내는 현악기","입으로 불어서 소리를 내는 관악기","두드리거나 쳐서 소리를 내는 타악기"],"ks":[[2,"다음으로 입으로 불어서"]],"ev":["대금과 단소에서 음의 높낮이를 바꾸는 방법을 알 수 있는 문장은?","막았다 열었다","2문단 두 번째 문장에 나와요."],"p":["우리 전통 악기는 소리를 내는 방법에 따라 나누어 볼 수 있다. 먼저 줄을 뜯거나 켜서 소리를 내는 현악기가 있다. 가야금은 손가락으로 줄을 뜯어 소리를 내고, 해금은 활로 줄을 문질러 소리를 낸다.","다음으로 입으로 불어서 소리를 내는 관악기가 있다. 대나무로 만든 대금과 단소는 구멍을 손가락으로 막았다 열었다 하며 음의 높낮이를 바꾼다.","마지막으로 두드리거나 쳐서 소리를 내는 타악기가 있다. 장구, 북, 꽹과리, 징이 여기에 속한다."],"g":"hi"},{"n":87,"ti":"우리 아빠","to":"아빠가 살아오신 과정","tx":["아빠는 바닷가 마을에서 태어나셨다.","아빠는 바다를 싫어하신다."],"cp":0,"fm":"병렬식","th":["이 글은 어떤 순서로 쓰였나요?","아빠의 삶을 시간 순서대로 썼다.","아빠의 생김새를 위에서 아래로 썼다.","아빠와 엄마를 비교하며 썼다.","아빠가 좋아하는 음식 순서로 썼다.","태어나심 → 중학생 → 대학과 회사 → 지금, 시간의 흐름에 따라 썼어요."],"kw":["아빠","소금","부서","조개껍데기"],"vo":[["그을리다","햇볕이나 연기를 쬐어 검게 되다","하얗게 씻기다","물에 젖다","얼어붙다"],["부서","회사에서 일을 나누어 맡은 조직","회사 건물","회사 이름","회사 식당"]],"mi":["바다를 좋아하던 어린 시절의 아빠","중학생 때 과학 대회에서 상을 받으신 아빠","대학과 회사를 거쳐 엄마를 만나 결혼하신 아빠","지금도 배를 만드시는 아빠"],"ks":[[2,"아빠는 중학생 때"],[3,"아빠는 대학에서 기계를"]],"ev":["아빠와 엄마가 어떻게 만나셨는지 알 수 있는 문장은?","같은 부서였던","3문단 두 번째 문장에 나와요."],"p":["우리 아빠는 1985년에 바닷가 작은 마을에서 태어나셨다. 어릴 때에는 바다에서 헤엄치는 것을 무척 좋아해서 날마다 까맣게 그을린 얼굴로 집에 돌아오셨다고 한다.","아빠는 중학생 때 학교 과학 대회에서 상을 받으셨다. 바닷물로 소금을 만드는 실험을 해서 선생님께 칭찬을 많이 들으셨다고 한다.","아빠는 대학에서 기계를 공부하셨다. 그리고 배를 만드는 회사에 들어가 일하시다가, 회사에서 같은 부서였던 엄마를 만나 결혼하셨다.","지금도 아빠는 배를 만드는 일을 하신다. 쉬는 날이면 나와 함께 바닷가에 가서 조개껍데기를 줍고, 어릴 적 이야기를 들려주신다."],"g":"hi"},{"n":88,"ti":"무궁화","to":"우리나라를 대표하는 꽃, 무궁화의 이름과 특징","tx":["무궁화는 여름에 핀다.","무궁화 한 송이는 한 달 동안 핀다."],"cp":0,"fm":"병렬식","th":["무궁화 한 송이가 저녁에 졌는데도 다음 날 나무에 꽃이 가득한 까닭은?","날마다 새로운 꽃이 계속 피어나기 때문에","진 꽃이 다시 살아나기 때문에","꽃이 절대 지지 않기 때문에","밤에 누가 꽃을 달아 두기 때문에","2문단에 한 송이는 하루 만에 지지만 날마다 새로운 꽃이 계속 피어난다고 했어요."],"kw":["무궁화","보라색","저녁","무늬"],"vo":[["끊임없이","계속하여 끊이지 않고","아주 가끔","한 번만","잠깐 동안"],["대표","전체를 잘 나타내는 것","가장 작은 것","숨겨진 것","필요 없는 것"]],"mi":["무궁화라는 이름의 뜻","무궁화가 피는 때와 모습","무궁화 꽃의 색깔과 단심"],"ks":[[1,"무궁화는 우리나라를"],[2,"무궁화는 여름부터"]],"ev":["무궁화 꽃잎 안쪽의 붉은 무늬를 무엇이라 부르는지 알 수 있는 문장은?","단심","3문단 마지막 문장에 나와요."],"p":["무궁화는 우리나라를 대표하는 꽃이다. ‘무궁’은 ‘끝이 없다’는 뜻으로, 꽃이 오랫동안 끊임없이 피고 지는 모습에서 이름이 붙었다.","무궁화는 여름부터 가을까지 약 석 달 동안 꽃을 피운다. 한 송이는 아침에 피었다가 저녁에 지지만, 날마다 새로운 꽃이 계속 피어나서 오랫동안 꽃을 볼 수 있다.","무궁화 꽃은 흰색, 분홍색, 보라색 등 여러 가지이며, 꽃잎 안쪽 가운데에 붉은 무늬가 있는 것이 많다. 이 붉은 무늬를 ‘단심’이라고 부른다."],"g":"hi"},{"n":89,"ti":"연필","to":"연필은 나에게 발자국, 마음, 친구처럼 소중하다.","tx":["연필로 공책에 글씨를 쓴다.","연필은 쓰면 쓸수록 길어진다."],"cp":0,"fm":"병렬식","th":["이 시에서 연필을 ‘친구’에 빗댄 까닭으로 알맞은 것은?","작아질 때까지 끝까지 곁에서 함께해 주기 때문에","키가 크기 때문에","말을 많이 하기 때문에","가방에 넣고 다니기 때문에","3연에 연필은 키가 작아져도 끝까지 곁에 있어 준다고 했어요."],"kw":["연필","공책","발자국","길"],"vo":[["또박또박","글씨를 하나하나 바르고 똑똑하게 쓰는 모양","마구 흘려 쓰는 모양","아주 크게","흐릿하게"],["곁","어떤 대상의 옆이나 가까운 곳","아주 먼 곳","높은 하늘","땅 밑"]],"mi":["연필은 나의 발자국","연필은 나의 마음","연필은 나의 친구"],"ks":[[1,"연필은 나의 발자국"]],"ev":["연필이 작아져도 곁에 있어 준다는 것을 알 수 있는 부분은?","키가 점점 작아져도","3연 둘째 줄에 나와요."],"p":["연필은 나의 발자국\n하얀 공책 위를 걸으며\n“오늘은 여기까지 왔어”\n또박또박 길을 남기지.","연필은 나의 마음\n속상한 날도 기쁜 날도\n“다 말해도 괜찮아”\n조용히 받아 적어 주지.","연필은 나의 친구\n키가 점점 작아져도\n“내일도 같이 쓰자”\n끝까지 곁에 있어 주지."],"g":"hi","poem":1},{"n":90,"ti":"대나무로 만든 물건","to":"쓰임에 따라 나누어 본 대나무로 만든 물건","tx":["대나무는 속이 비어 있다.","대나무는 무거워서 쓰기 어렵다."],"cp":0,"fm":"병렬식","th":["다음 중 ‘음식’과 관련해 대나무로 만든 물건은?","소쿠리","죽부인","단소","부채","3문단에 음식과 관련된 물건으로 소쿠리, 채반, 대나무 찜기가 나와요."],"kw":["대나무","부채","찜기","구멍"],"vo":[["엮다","가늘고 긴 것을 서로 어긋나게 짜서 만들다","풀어 헤치다","잘라 버리다","물에 담그다"],["소쿠리","대나무로 엮어 만든 둥근 그릇","쇠로 만든 냄비","유리컵","종이 상자"]],"mi":["대나무의 특징과 대나무로 만든 물건 조사","더위를 식히는 대나무 물건","음식과 관련된 대나무 물건","대나무로 만든 악기"],"ks":[[3,"둘째, 음식과 관련해서는"],[4,"셋째, 소리를 내는 악기도"]],"ev":["죽부인을 안고 자면 시원한 까닭을 알 수 있는 문장은?","바람이 잘 통해","2문단 두 번째 문장에 나와요."],"p":["대나무는 곧게 자라고 속이 비어 있어 가볍고 튼튼하다. 그래서 우리 조상들은 대나무로 생활에 필요한 여러 가지 물건을 만들어 썼다. 나는 대나무로 만든 물건을 쓰임에 따라 나누어 조사해 보았다.","먼저 더위를 식히는 물건으로는 부채와 죽부인이 있다. 대나무를 얇게 쪼개 만든 부채는 가볍게 부칠 수 있고, 대나무를 엮어 만든 죽부인은 안고 자면 바람이 잘 통해 시원하다.","둘째, 음식과 관련해서는 소쿠리, 채반, 대나무 찜기 등이 있다. 소쿠리와 채반은 씻은 채소의 물기를 빼거나 음식을 말리는 데 쓴다.","셋째, 소리를 내는 악기도 대나무로 만든다. 대금과 단소, 피리 같은 악기는 대나무 관에 구멍을 뚫어 만든다."],"g":"hi"},{"n":91,"ti":"삼 년 고개","to":"생각을 바꾸면 어려움도 이겨 낼 수 있다.","tx":["할아버지는 장에 다녀오셨다.","고개를 넘을 때는 조심해야 한다."],"cp":2,"fm":"미괄식","th":["소년이 할아버지의 걱정을 해결한 방법은?","같은 말을 거꾸로 생각해 여러 번 넘어지게 했다.","할아버지를 다른 마을로 이사 가게 했다.","고개의 돌을 모두 치웠다.","의원을 모셔 왔다.","한 번 넘어지면 삼 년을 산다면 여러 번 넘어지면 더 오래 산다고, 생각을 바꾸었어요."],"kw":["삼 년 고개","장","소년","자리"],"vo":[["헛디디다","발을 잘못 디디다","발을 바르게 딛다","높이 뛰다","천천히 걷다"],["무릎을 치다","좋은 생각이 떠올라 무릎을 탁 치다","무릎을 다치다","무릎을 꿇다","무릎이 아프다"]],"mi":["삼 년 고개에서 넘어져 앓아누운 할아버지","소년의 지혜로 할아버지가 오래 살게 되었다."],"ks":[[1,"어느 날 장에 다녀오던"],[2,"할아버지는 삼 년 고개로"]],"ev":["소년이 할아버지에게 알려 준 생각이 나타난 문장은?","열 번 넘어지면","2문단에 두 번 넘어지면 육 년, 열 번 넘어지면 삼십 년을 산다고 했어요."],"p":["옛날 어느 마을에 ‘삼 년 고개’라는 고개가 있었다. 이 고개에서 넘어지면 삼 년밖에 못 산다는 말이 전해졌다. 어느 날 장에 다녀오던 할아버지가 그만 발을 헛디뎌 이 고개에서 넘어지고 말았다. 할아버지는 집에 돌아와 자리에 누워 끙끙 앓기만 했다.","이 소식을 들은 이웃 마을 소년이 할아버지를 찾아왔다. “할아버지, 한 번 넘어지면 삼 년을 산다면서요? 그럼 두 번 넘어지면 육 년, 열 번 넘어지면 삼십 년을 사시겠네요!” 그 말을 들은 할아버지는 무릎을 탁 쳤다. 할아버지는 삼 년 고개로 달려가 데굴데굴 구르고 또 굴렀고, 그 뒤로 오래오래 건강하게 살았다."],"g":"hi"},{"n":92,"ti":"솔거의 소나무 그림","to":"꾸준히 노력하면 재능을 꽃피울 수 있다.","tx":["솔거는 신라 사람이다.","새들은 소나무를 싫어한다."],"cp":2,"fm":"미괄식","th":["새들이 솔거의 그림에 날아와 부딪힌 일로 알 수 있는 것은?","솔거의 그림이 진짜 소나무처럼 훌륭했다.","새들이 눈이 나빴다.","황룡사에 먹이가 많았다.","그림이 너무 작았다.","2문단에 소나무가 진짜처럼 생생해서 새들이 앉으려다 벽에 부딪혔다고 했어요."],"kw":["솔거","칡뿌리","황룡사","붓"],"vo":[["생생하다","눈앞에 보는 것처럼 또렷하다","흐릿하고 희미하다","오래되어 낡다","아주 작다"],["감탄","마음속 깊이 느끼어 탄복하는 것","몹시 실망하는 것","화를 내는 것","무시하는 것"]],"mi":["가난했지만 쉬지 않고 그림을 연습한 솔거","황룡사 벽에 진짜 같은 소나무를 그린 솔거"],"ks":[[1,"이렇게 날마다 쉬지 않고"],[2,"어느 날 솔거는 황룡사의"]],"ev":["솔거가 붓과 종이 없이 연습한 방법을 알 수 있는 문장은?","칡뿌리로 바위에","1문단 세 번째 문장에 나와요."],"p":["신라에 솔거라는 아이가 살았다. 솔거는 집이 가난해 붓과 종이를 살 수 없었지만 그림 그리기를 무척 좋아했다. 그래서 산에서 나무를 하다가도 칡뿌리로 바위에 그림을 그리고, 땅바닥에 나뭇가지로 새와 나무를 그리며 연습했다. 이렇게 날마다 쉬지 않고 연습한 끝에 솔거의 그림 솜씨는 온 나라에 알려졌다.","어느 날 솔거는 황룡사의 벽에 늙은 소나무를 그리게 되었다. 솔거가 온 정성을 다해 그린 소나무는 줄기와 가지가 진짜처럼 생생했다. 그러자 새들이 진짜 나무인 줄 알고 날아와 앉으려다 벽에 부딪혀 떨어지곤 했다. 사람들은 솔거의 그림을 보고 감탄을 금치 못했다."],"g":"hi"},{"n":93,"ti":"혹부리 할아버지","to":"욕심을 부리면 화를 당한다.","tx":["도깨비는 노래를 좋아한다.","착한 할아버지는 혹이 두 개가 되었다."],"cp":2,"fm":"미괄식","th":["욕심 많은 할아버지가 혹을 두 개나 달게 된 까닭은?","보물이 탐나서 거짓말을 했다가 도깨비에게 들켰기 때문에","노래를 너무 잘 불러서","착한 할아버지가 혹을 붙여 주어서","산에서 넘어져서","2문단에 보물을 얻으려고 거짓말을 했다가 화가 난 도깨비들이 혹까지 붙여 주었다고 했어요."],"kw":["욕심","도깨비","빈집","노래"],"vo":[["얼떨결","뜻밖의 일을 갑자기 당하여 정신이 없는 사이","아주 천천히 생각한 끝","미리 준비한 대로","잠에서 깬 뒤"],["몰려오다","여럿이 떼를 지어 한꺼번에 오다","혼자 조용히 가다","흩어져 떠나다","숨어 버리다"]],"mi":["착한 할아버지는 도깨비에게 보물을 받고 혹을 뗐다.","욕심 많은 할아버지는 거짓말을 했다가 혹을 하나 더 붙였다."],"ks":[[1,"할아버지가 얼떨결에"],[2,"욕심 많은 할아버지는 결국"]],"ev":["도깨비들이 착한 할아버지를 찾아온 까닭을 알 수 있는 문장은?","노래가 어디서 나오느냐고","1문단 세 번째 문장에 나와요."],"p":["옛날 어느 마을에 뺨에 커다란 혹이 달린 마음씨 착한 할아버지가 살았다. 할아버지는 산에서 나무를 하다 날이 저물어 빈집에서 밤을 보내게 되었다. 무서운 마음을 달래려고 노래를 부르고 있는데, 도깨비들이 몰려와 그 노래가 어디서 나오느냐고 물었다. 할아버지가 얼떨결에 혹에서 나온다고 대답하자, 도깨비들은 보물을 잔뜩 주고 혹을 떼어 갔다.","이 이야기를 들은 이웃 마을의 욕심 많은 혹부리 할아버지는 보물을 얻으려고 일부러 그 빈집을 찾아갔다. 그리고 도깨비들 앞에서 노래가 혹에서 나온다고 거짓말을 했다. 속은 것을 알고 화가 난 도깨비들은 보물은커녕 지난번에 떼어 간 혹까지 붙여 주었다. 욕심 많은 할아버지는 결국 혹을 두 개나 달고 돌아가게 되었다."],"g":"hi"},{"n":94,"ti":"겨울에 참외를 구하라니","to":"어려운 일도 지혜롭게 해결하자.","tx":["원님은 참외를 먹고 싶어 했다.","겨울에는 눈이 쌓인다."],"cp":2,"fm":"미괄식","th":["아들이 원님에게 ‘아버지가 뱀에게 물렸다’고 말한 까닭은?","겨울에 참외를 구하라는 명령이 억지라는 것을 깨닫게 하려고","정말로 아버지가 뱀에게 물려서","원님을 무섭게 하려고","참외 대신 뱀을 주려고","원님이 ‘겨울에 뱀이 어디 있냐’고 하자, 아들은 ‘겨울에는 참외도 없다’고 되받아 원님이 억지를 깨닫게 했어요."],"kw":["지혜","농부","고을","사흘"],"vo":[["억지","잘 안 될 일을 무리하게 우기는 것","올바른 이치","친절한 부탁","고마운 마음"],["말문이 막히다","할 말이 없어 말을 하지 못하게 되다","말을 아주 잘하다","크게 웃다","노래를 부르다"]],"mi":["겨울에 참외를 구해 오라는 고약한 원님의 명령","지혜로운 아들 덕분에 원님이 억지를 그만두었다."],"ks":[[1,"어느 추운 겨울날"],[2,"말문이 막힌 원님은"]],"ev":["농부가 걱정한 까닭을 알 수 있는 문장은?","벌을 받을까 봐","1문단 마지막 문장에 나와요."],"p":["옛날 어느 고을에 욕심 많고 고약한 원님이 있었다. 어느 추운 겨울날, 원님은 갑자기 참외가 먹고 싶다며 한 농부에게 사흘 안에 참외를 구해 오라고 명령했다. 한겨울에 참외를 구할 수 없었던 농부는 벌을 받을까 봐 걱정이 되어 밥도 넘기지 못했다.","이 사정을 들은 농부의 어린 아들이 아버지 대신 원님을 찾아갔다. 아들은 아버지가 참외를 구하러 산에 갔다가 뱀에게 물려 누워 계신다고 말했다. 원님은 눈 쌓인 겨울에 뱀이 어디 있느냐며 버럭 화를 냈다. 그러자 아들은 차분하게 말했다. 한겨울에 뱀이 없듯이 참외도 없는데, 어찌 참외를 구해 오라 하십니까? 말문이 막힌 원님은 부끄러워 더 이상 억지를 부리지 않았다."],"g":"hi"},{"n":95,"ti":"방귀쟁이 며느리","to":"단점처럼 보이는 것도 쓰임에 따라 장점이 될 수 있다.","tx":["비단 장수들은 배를 먹고 싶어 했다.","방귀는 무조건 참아야 한다."],"cp":2,"fm":"미괄식","th":["시아버지가 며느리를 다시 집으로 데려간 까닭은?","며느리의 방귀가 쓸모 있다는 것을 알게 되어서","며느리가 방귀를 참겠다고 약속해서","비단 장수들이 부탁해서","길을 잃어서","2문단에 방귀로 배를 따 비단을 얻는 것을 보고 방귀도 쓸모가 있다며 데려갔다고 했어요."],"kw":["방귀","비단","배나무","친정"],"vo":[["친정","결혼한 여자의 부모님이 사는 집","남편의 집","이웃집","시장"],["들썩이다","무엇이 자꾸 들렸다 놓였다 하며 흔들리다","아주 조용하다","단단히 고정되다","천천히 식다"]],"mi":["방귀를 세게 뀐 며느리가 친정으로 돌려보내지게 되었다.","며느리의 방귀가 쓸모 있다는 것을 알고 다시 데려갔다."],"ks":[[1,"놀란 시집 식구들은"],[2,"그 모습을 본 시아버지는"]],"ev":["며느리가 시집와서 힘이 없었던 까닭을 알 수 있는 문장은?","꾹 참느라","1문단 두 번째 문장에 나와요."],"p":["옛날에 방귀를 아주 세게 뀌는 며느리가 있었다. 며느리는 시집온 뒤로 방귀를 꾹 참느라 얼굴이 누렇게 뜨고 날마다 힘이 없었다. 걱정이 된 시아버지가 까닭을 묻자, 며느리는 망설이다가 방귀를 뀌어도 되겠느냐고 여쭈었다. 허락을 받은 며느리가 참았던 방귀를 뀌자, 온 집이 들썩이고 시아버지가 문밖까지 날아갔다. 놀란 시집 식구들은 며느리를 친정으로 돌려보내기로 했다.","친정으로 가던 길에 시아버지와 며느리는 커다란 배나무 아래를 지나게 되었다. 비단 장수들이 배가 너무 높이 달려 따 먹지 못한다며 발을 구르고 있었다. 며느리가 나무를 향해 방귀를 한 번 뀌자, 잘 익은 배가 우수수 떨어졌다. 배를 맛있게 먹은 비단 장수들은 고맙다며 비단을 잔뜩 내주었다. 그 모습을 본 시아버지는 며느리의 방귀도 쓸모가 있다며 기뻐하며 며느리를 다시 집으로 데려갔다."],"g":"hi"},{"n":96,"ti":"소반","to":"소반의 쓰임과 재료, 모양과 종류","tx":["소반은 나무로 만든다.","소반은 모두 둥근 모양이다."],"cp":0,"fm":"병렬식","th":["옛날 집에 소반이 여러 개 있었던 까닭은?","식구마다 따로 상을 받는 일이 많았기 때문에","소반이 자주 부서졌기 때문에","소반으로 방을 꾸미려고","손님에게 선물하려고","1문단에 식구마다 따로 상을 받는 일이 많아서 집집마다 소반이 여러 개 있었다고 했어요."],"kw":["소반","은행나무","통영","부엌"],"vo":[["상판","상이나 탁자에서 물건을 올려놓는 넓은 판","상의 다리","상의 밑바닥","상 옆의 손잡이"],["구실","자기가 맡은 역할","핑계","물건의 값","건물의 이름"]],"mi":["소반의 뜻과 쓰임","소반의 재료와 모양","지역에 따른 소반의 종류"],"ks":[[1,"소반은 음식을 담은"]],"ev":["소반이 음식을 나르는 데에도 쓰였다는 것을 알 수 있는 문장은?","쟁반 구실도","1문단 마지막 문장에 나와요."],"p":["소반은 음식을 담은 그릇을 올려놓는 작은 상이다. 옛날에는 식구마다 따로 상을 받는 일이 많아서 집집마다 여러 개의 소반이 있었다. 소반은 부엌에서 방까지 음식을 나르는 쟁반 구실도 했다.","소반은 주로 은행나무, 느티나무, 소나무 같은 나무로 만들었다. 상판의 모양에 따라 둥근 원반, 네모난 소반, 여러 모서리를 가진 팔각반 등이 있다.","소반은 만든 지역에 따라 이름과 모양이 조금씩 다르다. 통영에서 만든 통영반, 나주에서 만든 나주반, 해주에서 만든 해주반이 특히 유명하다."],"g":"hi"},{"n":97,"ti":"펭귄","to":"펭귄의 생김새와 먹이, 번식 등 여러 가지 생태","tx":["황제펭귄은 남극에 산다.","펭귄은 하늘을 날 수 있다."],"cp":0,"fm":"병렬식","th":["황제펭귄 수컷이 알을 품는 동안 어떻게 지낼까요?","두 달 가까이 아무것도 먹지 않고 알을 지킨다.","날마다 바다에 나가 먹이를 먹는다.","알을 얼음 위에 두고 떠난다.","암컷에게 알을 맡기고 잠만 잔다.","4문단에 수컷은 두 달 가까이 아무것도 먹지 않고 알을 지킨다고 했어요."],"kw":["펭귄","크릴","깃털","적도"],"vo":[["잠수","물속으로 잠겨 들어가는 것","하늘로 날아오르는 것","땅을 파는 것","물 위에 떠 있는 것"],["지방층","피부 아래에 기름 성분이 쌓인 층","뼈","근육","깃털"]],"mi":["날지 못하고 헤엄을 잘 치는 펭귄","펭귄의 먹이와 잠수","추위를 견디는 펭귄의 몸","황제펭귄의 번식","따뜻한 곳에 사는 펭귄도 있다."],"ks":[[3,"펭귄의 몸은 추위를"],[4,"황제펭귄은 추운 남극의"]],"ev":["펭귄의 날개가 무슨 일에 쓰이는지 알 수 있는 문장은?","물속을 빠르게 헤엄치는","1문단 두 번째 문장에 나와요."],"p":["펭귄은 날지 못하는 새이다. 날개는 작고 단단한 지느러미처럼 생겨서, 하늘을 나는 대신 물속을 빠르게 헤엄치는 데 쓰인다.","펭귄은 주로 물고기, 오징어, 크릴 같은 작은 바다 생물을 먹는다. 먹이를 찾아 물속 깊이 잠수하는데, 황제펭귄은 수백 미터 깊이까지 내려가기도 한다.","펭귄의 몸은 추위를 잘 견디도록 되어 있다. 짧고 촘촘한 깃털이 여러 겹으로 나 있고, 피부 아래에는 두꺼운 지방층이 있어 몸의 열을 빼앗기지 않는다.","황제펭귄은 추운 남극의 겨울에 알을 낳는다. 수컷은 알을 발등 위에 올려놓고 배의 피부로 덮어 따뜻하게 품는다. 수컷은 두 달 가까이 아무것도 먹지 않고 알을 지킨다.","모든 펭귄이 추운 곳에만 사는 것은 아니다. 적도 가까이에 있는 갈라파고스 제도에 사는 펭귄도 있다."],"g":"hi"},{"n":98,"ti":"보온병의 비밀","to":"보온병이 진공을 이용해 온도를 오래 지키는 원리","tx":["보온병에는 차를 담을 수 있다.","보온병은 벽이 한 겹이다."],"cp":0,"fm":"병렬식","th":["보온병의 두 벽 사이에 공기가 다시 가득 들어간다면 어떻게 될까요?","열이 잘 드나들어 음료가 빨리 식거나 미지근해진다.","음료가 더 오래 뜨거워진다.","보온병이 더 가벼워진다.","아무 변화가 없다.","2문단에 두 벽 사이를 진공으로 만들어 열이 잘 드나들지 못하게 한다고 했어요."],"kw":["보온병","뚜껑","공기","벽"],"vo":[["진공","공기 같은 물질이 거의 없는 빈 공간","물이 가득 찬 곳","얼음으로 된 곳","불이 타는 곳"],["비결","남이 모르는 자기만의 좋은 방법","누구나 아는 방법","실패한 이유","잘못된 습관"]],"mi":["보온병의 뜻과 쓰임","진공을 이용해 온도를 지키는 보온병의 원리"],"ks":[[2,"이처럼 진공으로 열의"]],"ev":["진공이 열을 잘 막는 까닭을 알 수 있는 문장은?","열을 전달할 물질이","2문단 세 번째 문장에 나와요."],"p":["보온병은 뜨거운 음료는 뜨겁게, 차가운 음료는 차갑게 오랫동안 지켜 주는 병이다. 겨울에 따뜻한 차를 담아 가거나 여름에 시원한 물을 담아 갈 때 쓰면 편리하다.","보온병은 안쪽 벽과 바깥쪽 벽의 두 겹으로 되어 있다. 그리고 두 벽 사이의 공기를 빼서 진공 상태로 만든다. 열은 물질을 통해 전달되는데, 진공에는 열을 전달할 물질이 거의 없어 열이 잘 드나들지 못한다. 또 뚜껑을 꼭 닫아 공기가 드나들지 못하게 한다. 이처럼 진공으로 열의 이동을 막는 것이 보온병이 온도를 오래 지키는 비결이다."],"g":"hi"},{"n":99,"ti":"정월 대보름","to":"정월 대보름의 부럼 깨기와 대보름 음식, 풍습","tx":["대보름에는 보름달이 뜬다.","대보름은 여름 명절이다."],"cp":0,"fm":"병렬식","th":["대보름 아침, 조상들이 호두를 깨문 까닭은?","한 해 동안 피부병이 생기지 않고 이가 튼튼해지기를 바라서","호두가 가장 맛있어서","이를 부러뜨리려고","마당을 청소하려고","1문단에 부럼을 깨물면 부스럼이 생기지 않고 이가 튼튼해진다고 믿었다고 했어요."],"kw":["대보름","호두","수수","마당"],"vo":[["부스럼","피부에 나는 종기","딱딱한 껍질","곡식의 한 종류","보름달의 다른 이름"],["곁들이다","주된 것에 다른 것을 함께 더하다","모두 빼 버리다","따로 떼어 놓다","먼저 먹어 치우다"]],"mi":["정월 대보름과 부럼 깨기","대보름 음식과 소원 빌기"],"ks":[[1,"이날 아침에는 호두"],[2,"대보름에는 오곡밥과"]],"ev":["오곡밥에 들어가는 곡식을 알 수 있는 문장은?","찹쌀, 조, 수수","2문단 두 번째 문장에 나와요."],"p":["정월 대보름은 음력 1월 15일로, 새해 들어 처음 맞는 보름달이 뜨는 날이다. 이날 아침에는 호두, 땅콩, 밤 같은 단단한 열매를 깨무는데, 이를 ‘부럼 깨기’라고 한다. 조상들은 부럼을 깨물면 한 해 동안 부스럼 같은 피부병이 생기지 않고 이가 튼튼해진다고 믿었다. 그래서 처음 깨문 부럼은 먹지 않고 마당에 던지며 한 해의 건강을 빌기도 했다.","대보름에는 오곡밥과 묵은 나물도 먹는다. 오곡밥은 찹쌀, 조, 수수, 팥, 콩 같은 다섯 가지 곡식을 섞어 지은 밥이다. 여기에 지난가을에 말려 두었던 나물을 삶아 무쳐 곁들인다. 또 저녁이 되면 사람들은 높은 곳에 올라가 둥근 보름달을 보며 한 해의 소원을 빌었다."],"g":"hi"},{"n":100,"ti":"행성 이름에 담긴 이야기","to":"태양계 행성의 영어 이름에 담긴 로마 신화 속 신의 이야기","tx":["목성은 가장 큰 행성이다.","행성 이름은 모두 과학자 이름에서 왔다."],"cp":0,"fm":"병렬식","th":["‘마르스’라는 이름이 화성에 어울린다고 생각한 까닭은?","붉은빛이 전쟁의 불길이나 피를 떠올리게 해서","화성이 가장 빨리 돌아서","화성이 가장 커서","화성이 태양에 가장 가까워서","3문단에 화성의 붉은빛이 전쟁의 불길이나 피를 떠올리게 해서 전쟁의 신 마르스의 이름을 붙였다고 했어요."],"kw":["행성 이름","전령","붉은빛","왕"],"vo":[["전령","명령이나 소식을 전하는 사람","전쟁에서 이긴 사람","노래하는 사람","물건을 만드는 사람"],["신화","신이나 영웅에 대한 옛날이야기","오늘의 뉴스","과학 실험 보고서","요리책"]],"mi":["행성의 영어 이름은 로마 신화의 신에서 따왔다.","수성의 이름 머큐리에 담긴 뜻","화성의 이름 마르스에 담긴 뜻","목성의 이름 주피터에 담긴 뜻"],"ks":[[2,"수성이 다른 행성보다"],[4,"가장 큰 행성에"]],"ev":["목성이 어떤 행성인지 알 수 있는 문장은?","가장 큰 행성인","4문단 첫 문장에 나와요."],"p":["태양계의 행성들은 저마다 이름을 가지고 있다. 영어 이름은 대부분 옛 로마 신화에 나오는 신의 이름에서 따왔다.","태양에 가장 가까운 수성은 영어로 머큐리(Mercury)라고 한다. 머큐리는 신들의 소식을 빠르게 전하는 전령의 신이다. 수성이 다른 행성보다 태양 둘레를 가장 빨리 돌기 때문에 이 이름이 붙었다고 한다.","붉은빛을 띠는 화성은 마르스(Mars)라고 부른다. 마르스는 전쟁의 신인데, 화성의 붉은빛이 전쟁의 불길이나 피를 떠올리게 해서 이 이름이 붙었다고 한다.","태양계에서 가장 큰 행성인 목성은 주피터(Jupiter)라고 한다. 주피터는 로마 신화에서 신들의 왕이다. 가장 큰 행성에 가장 높은 신의 이름을 붙인 것이다."],"g":"hi"}];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, k) => shuffle(a).slice(0, k);
const MARKS = ['①','②','③','④','⑤','⑥'];
function hasBatchim(w){ const c = w.charCodeAt(w.length - 1); if (c < 0xAC00 || c > 0xD7A3) return /[0-9LMNR]$/i.test(w) ? /[0136783LMNR]$/i.test(w) : false; return (c - 0xAC00) % 28 !== 0; }
const josa = (w, a, b) => w + (hasBatchim(w) ? a : b);
function splitSent(p){
  const out = []; let cur = ''; let i = 0;
  while (i < p.length){
    const c = p[i]; cur += c;
    if ('.?!…'.includes(c)){
      let j = i + 1;
      while (j < p.length && '.?!…”’"\''.includes(p[j])){ cur += p[j]; j++; }
      if (j >= p.length || p[j] === ' '){ out.push(cur.trim()); cur = ''; i = j; continue; }
      i = j; continue;
    }
    i++;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
const byN = {}; DATA.forEach(d => byN[d.n] = d);
DATA.forEach(d => {
  d.sents = d.p.map(p => d.poem ? p.split('\n') : splitSent(p));
  d.chars = d.p.join('').replace(/\s/g, '').length;
});
const starSvg = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="${on ? 'var(--star)' : 'var(--line)'}"/></svg>`;
const starsHtml = (n, cls = 'stars') => `<span class="${cls}" aria-label="별 ${n}개">${[0,1,2].map(i => starSvg(i < n)).join('')}</span>`;

/* ---------- question builder ---------- */
function opt(t, c = false, extra = {}){ return Object.assign({ t, c }, extra); }
function buildQs(d){
  const U = d.poem ? '연' : '문단';
  const N = d.p.length;
  const peers = DATA.filter(x => x.g === d.g && x.n !== d.n);
  const qs = [];

  // 문단 나누기
  const cnt = [N - 1, N, N + 1, N + 2].filter(x => x >= 1);
  while (cnt.length < 4) cnt.push(cnt[cnt.length - 1] + 1);
  qs.push({ cat: 'count', kind: 'count',
    prompt: `이 글은 몇 개의 ${U}으로 이루어져 있나요?`,
    opts: cnt.slice(0, 4).map(x => opt(`${x}개의 ${U}`, x === N)),
    exp: d.poem ? `한 줄을 띄어 묶어 놓은 덩어리를 ‘연’이라고 해요. 이 시는 ${N}개의 연으로 되어 있어요.` : `한 칸 들여 써서 시작하는 덩어리가 하나의 문단이에요. 이 글은 ${N}개의 문단으로 되어 있어요. 이제 공책 왼쪽에 문단 번호가 나타나요.` });

  // 생각하기
  qs.push({ cat: 'think', prompt: d.th[0], opts: [opt(d.th[1], true), ...d.th.slice(2, 5).map(t => opt(t))], exp: d.th[5] });

  // 핵심 단어
  const kw = d.kw[0];
  const full = d.p.join(' ');
  const times = full.split(kw).length - 1;
  qs.push({ cat: 'key', prompt: '이 글의 핵심 단어(가장 중요한 낱말)는 무엇일까요?',
    opts: [opt(kw, true), ...d.kw.slice(1).map(t => opt(t))],
    exp: `‘${kw}’${hasBatchim(kw) ? '은' : '는'} 글 전체의 중심 내용과 이어지는 낱말이에요.${times >= 2 ? ` 글에 ${times}번이나 나와요.` : ''} 나머지 낱말은 글의 한 부분에만 잠깐 나와요.` });

  // 어휘
  d.vo.forEach(v => {
    const word = v[0];
    const stem = /다$/.test(word) && word.length > 1 ? word.slice(0, -1) : word;
    let ctx = null;
    for (const ss of d.sents){ for (const s of ss){ if (s.includes(stem)){ ctx = { s, stem }; break; } } if (ctx) break; }
    qs.push({ cat: 'vocab', prompt: `글에 나온 ‘${word}’의 뜻으로 알맞은 것은?`, ctx,
      opts: [opt(v[1], true), ...v.slice(2).map(t => opt(t))],
      exp: `‘${word}’${hasBatchim(word) ? '은' : '는'} “${v[1]}”이라는 뜻이에요. 앞뒤 문장을 함께 읽으면 뜻을 짐작하기 쉬워요.` });
  });

  // 중심 문단: 문단별 중심 내용 (최대 3개)
  const idx = d.mi.map((_, i) => i);
  const chosen = (idx.length <= 3 ? idx : pick(idx, 3)).sort((a, b) => a - b);
  chosen.forEach(k => {
    const others = d.mi.filter((_, i) => i !== k);
    const pool = shuffle(others).concat(d.tx).filter((t, i, a) => a.indexOf(t) === i && t !== d.mi[k]).slice(0, 3);
    qs.push({ cat: 'main', kind: 'mi', para: k, prompt: `${k + 1}${U}의 중심 내용으로 알맞은 것은?`,
      opts: [opt(d.mi[k], true), ...pool.map(t => opt(t))],
      exp: `${k + 1}${U}은 “${d.mi[k]}”에 대한 내용이에요. 문단 속 여러 문장이 공통으로 말하는 것을 찾으면 중심 내용이 보여요.` });
  });
  // 중심 문단
  const cpOpts = d.p.map((_, i) => opt(`${i + 1}${U}`, d.cp === i + 1));
  cpOpts.push(opt(`어느 한 ${U}이 아니라 글 전체에 고루`, d.cp === 0));
  qs.push({ cat: 'main', kind: 'cp', noShuffle: true,
    prompt: `글쓴이가 가장 하고 싶은 말(중심 내용)이 담긴 ${U}은 어디일까요?`, opts: cpOpts, para: d.cp ? d.cp - 1 : null,
    exp: d.cp === 0 ? `이 글은 여러 ${U}이 같은 무게로 나란히 설명하는 짜임이라서, 중심 내용이 글 전체에 고루 나뉘어 있어요.`
                    : `${d.cp}${U}(“${d.mi[d.cp - 1]}”)에 글쓴이가 가장 하고 싶은 말이 담겨 있어요.` });

  // 중심 문장
  d.ks.forEach(([pi, sub]) => {
    const ss = d.sents[pi - 1];
    const right = ss.find(s => s.includes(sub));
    let wrongs = pick(ss.filter(s => s !== right), 3);
    if (wrongs.length < 3){
      const near = d.sents.filter((_, i) => i !== pi - 1).flat().filter(s => s.length > 8);
      wrongs = wrongs.concat(pick(near, 3 - wrongs.length));
    }
    qs.push({ cat: 'sent', kind: 'sent', hl: right, para: pi - 1, prompt: `${pi}${U}에서 중심 문장을 고르세요.`,
      opts: [opt(right, true, { sent: 1 }), ...wrongs.map(t => opt(t, false, { sent: 1 }))],
      exp: `중심 문장은 ${U} 전체의 내용을 대표하는 문장이에요. 나머지 문장은 중심 문장을 자세히 풀어 주거나 예를 드는 뒷받침 문장이에요.` });
  });

  // 근거 찾기
  const all = d.sents.flat();
  const evR = all.find(s => s.includes(d.ev[1]));
  const evW = pick(all.filter(s => s !== evR), 3);
  qs.push({ cat: 'evid', kind: 'sent', hl: evR, prompt: d.ev[0],
    opts: [opt(evR, true, { sent: 1 }), ...evW.map(t => opt(t, false, { sent: 1 }))], exp: d.ev[2] });

  // 짜임 (4·5·6학년)
  if (d.g === 'hi'){
    qs.push({ cat: 'theme', kind: 'form', noShuffle: true, prompt: '중심 내용이 어디에 있는지 생각해 보고, 이 글의 짜임(형식)을 고르세요.',
      opts: FORMS.map(([t, s]) => opt(t, t === d.fm, { sub: s })),
      exp: `이 글은 ${d.fm}이에요. ${FORMS.find(f => f[0] === d.fm)[1]}.` });
  }
  // 주제
  const tOther = pick(peers.map(x => x.to).filter(t => t !== d.to && !d.tx.includes(t)), 1);
  qs.push({ cat: 'theme', prompt: '이 글의 주제로 가장 알맞은 것은?',
    opts: [opt(d.to, true), ...d.tx.map(t => opt(t)), ...tOther.map(t => opt(t))],
    exp: `주제는 글 전체를 아우르는 중심 생각이에요. 이 글의 주제는 “${d.to}”예요. 다른 보기는 글의 한 부분이거나, 글과 맞지 않는 내용이에요.` });
  // 제목
  const tt = pick(peers.map(x => x.ti).filter(t => t !== d.ti), 3);
  qs.push({ cat: 'theme', prompt: '이 글에 가장 알맞은 제목은?',
    opts: [opt(d.ti, true), ...tt.map(t => opt(t))],
    exp: `제목은 글 전체의 내용을 짧게 나타내요. 이 글에는 ‘${d.ti}’${hasBatchim(d.ti) ? '이' : '가'} 잘 어울려요.` });

  qs.forEach(q => { if (!q.noShuffle) q.opts = shuffle(q.opts); });
  return qs;
}

const WD = ['일','월','화','수','목','금','토'];
function dstr(t){ const d = new Date(t); const h = d.getHours(); return `${d.getMonth()+1}월 ${d.getDate()}일(${WD[d.getDay()]}) ${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(d.getMinutes()).padStart(2,'0')}`; }
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
const stars3 = n => '★'.repeat(n) + '☆'.repeat(3 - n);
function oneMsg(r, full){
  const lines = [`📘 학습지 ${r.n}번 「${r.title}」 ${r.score}/${r.total}점 ${stars3(r.stars)}`];
  if (r.cpm) lines.push(`   읽기 속도: 1분에 ${r.cpm}자 (${r.time})`);
  if (full){
    const good = r.cats.filter(c => c[1] === c[2]).map(c => c[0]);
    const weak = r.cats.filter(c => c[1] < c[2]).map(c => `${c[0]} ${c[1]}/${c[2]}`);
    if (good.length) lines.push(`   잘한 영역: ${good.join(', ')}`);
    if (weak.length) lines.push(`   더 연습할 영역: ${weak.join(', ')}`);
    if (r.wrong.length){ lines.push('   틀린 문제:'); r.wrong.forEach(w => lines.push(`   - [${w[0]}] ${w[1]}\n     정답: ${w[2]}`)); }
  }
  return lines.join('\n');
}

          <li><span class="cb on"></span><span class="k">/</span><span>한눈에 들어오는 만큼 <span class="hl">사선</span> 치기</span></li>
          <li><span class="cb on"></span><span class="k">□</span><span>모르는 낱말에 <span class="hl-y">네모</span> 치기</span></li>
          <li><span class="cb on"></span><span class="k">_</span><span>중요한 문장에 <span class="hl-g">밑줄</span> 치기</span></li>
        </ul>
      </div>
      <div class="statbox">
        <div><b class="tnum">${done.length}<small style="font-size:22px;color:var(--ink-3)">/100</small></b><span>푼 학습지</span></div>
        <div><b class="tnum">${starsTotal}</b><span>모은 별 ★</span></div>
        <div class="who"><label for="kidName">이름</label><input id="kidName" maxlength="10" value="${nm}" placeholder="이름 쓰기" autocomplete="off"></div>
      </div>
    </div>
    <div class="today${today.length ? '' : ' none'}">
      ${today.length ? `<span>오늘 <b class="tnum">${today.length}</b>편 풀었어! (${today.reduce((a, r) => a + r.score, 0)}/${today.reduce((a, r) => a + r.total, 0)}점)</span><button class="btn pri" id="todayMom">💌 오늘 공부 엄마에게 보내기</button>` : `<span>오늘 푼 학습지가 생기면 여기서 한꺼번에 엄마에게 보낼 수 있어요.</span>`}
    </div>
    <div class="bar">
      <div class="seg" role="group" aria-label="학년 선택">
        <button id="g-lo" aria-pressed="${prefs.g === 'lo'}">1·2·3학년 <span class="tnum">(1~50)</span></button>
        <button id="g-hi" aria-pressed="${prefs.g === 'hi'}">4·5·6학년 <span class="tnum">(51~100)</span></button>
      </div>
      <label class="chk"><input type="checkbox" id="onlyNew" ${prefs.onlyNew ? 'checked' : ''}><span class="cb ${prefs.onlyNew ? 'on' : ''}"></span> 아직 안 푼 것만 보기</label>
    </div>
    ${list.length ? `<div class="grid">${list.map(tileHtml).join('')}</div>` : `<div class="empty">${ch('songi', 'cheer')}<div class="bubble l">이 학년 학습지를 다 풀었어! 대단해~<br>체크를 끄면 다시 볼 수 있어.</div></div>`}
    <details class="note">
      <summary>선생님·부모님께</summary>
      <p>달달맘이 새로 쓴 지문 100편(1·2·3학년용 1~50, 4·5·6학년용 51~100)을 실었어요.</p>
      <p>한 편은 ‘읽기(사선·네모·밑줄 + 읽기 시간 재기) → 문단 나누기 → 생각하기 → 핵심 단어 → 어휘 → 중심 문단 → 중심 문장 → 근거 찾기 → 짜임·주제·제목’ 순서로 진행돼요. 4·5·6학년 학습지에는 글의 짜임(두괄식·미괄식 등) 문제가 더 있어요.</p>
      <p>보기 순서는 풀 때마다 바뀌어요. 점수와 별은 이 기기의 브라우저에만 저장돼요. 결과 화면의 ‘엄마에게 보내기’를 누르면 점수·읽기 속도·영역별 결과·틀린 문제가 한 번에 정리되고, 복사해서 카톡이나 문자로 보낼 수 있어요. 등장 캐릭터(송이·몽이·책돌이)는 이 앱을 위해 새로 그렸어요.</p>
    </details>`;
  $('#g-lo').onclick = () => { prefs.g = 'lo'; save(); renderHome(); };
  $('#g-hi').onclick = () => { prefs.g = 'hi'; save(); renderHome(); };
  $('#onlyNew').onchange = e => { prefs.onlyNew = e.target.checked; save(); renderHome(); };
  $('#kidName').onchange = e => { prefs.kid = e.target.value.trim(); save(); renderHome(); };
  const tm = $('#todayMom'); if (tm) tm.onclick = () => openSend(dayMsg(today), '오늘 공부한 걸 엄마에게 보내자!');
  document.querySelectorAll('.tile').forEach(b => b.onclick = () => openSheet(+b.dataset.n));
}
function tileHtml(d){
  const r = store[d.n];
  const src = d.p.join(' ').replace(/\n/g, ' ');
  const snip = src.length > 58 ? src.slice(0, 58) + '…' : src;
  return `<button class="tile" data-n="${d.n}" aria-label="학습지 ${d.n}${r ? `, 최고 점수 ${r.best}/${r.total}` : ', 새 학습지'}">
    ${r && r.stars === 3 ? '<span class="stamp">참<br>잘했어요</span>' : ''}
    <span class="no"><span class="circ tnum${d.n >= 100 ? ' n3' : ''}">${d.n}</span><small>${d.chars}자</small></span>
    <span class="snip">${esc(snip)}</span>
    <span class="st">${r ? `${starsHtml(r.stars)}<span class="tnum">${r.best}/${r.total}</span>` : '<span class="new">새 학습지!</span><span>→</span>'}</span>
  </button>`;
}

/* ---------- sheet ---------- */
function openSheet(n){
  const d = byN[n];
  S = { view: 'sheet', n, d, phase: 'read', qs: buildQs(d), qi: 0, ans: [], pen: null, t0: null, t1: null, fold: false };
  render(); window.scrollTo({ top: 0 });
}
function passageHtml(d){
  return d.p.map((p, pi) => `<p class="para" data-pi="${pi}"><span class="pnum" aria-hidden="true">${MARKS[pi] || pi + 1}</span>${
    d.sents[pi].map(s => `<span class="s" data-s="${esc(s)}">${s.split(' ').map(w => `<span class="w">${esc(w)}</span>`).join(' ')}</span>`).join(d.poem ? '<br>' : ' ')
  }</p>`).join('');
}
function renderSheet(){
  const d = S.d;
  $('#app').innerHTML = `
    <div class="shead">
      <button class="back" id="back" aria-label="목록으로">← 목록</button>
      <h2><span class="circ tnum" style="width:44px;height:44px;font-size:${d.n >= 100 ? 18 : 24}px">${d.n}</span> 학습지</h2>
      <span class="lv">${d.g === 'lo' ? '1·2·3학년용' : '4·5·6학년용'}</span>
    </div>
    <div class="rail-wrap"><ol class="rail" id="rail"></ol></div>
    <div class="body" id="body">
      <section class="pcard" id="pcard" aria-label="지문">
        <span class="doodle d2">여기 읽어 봐~</span>
        <div class="ptools">
          <div class="pens" role="group" aria-label="읽기 펜">
            <button class="pen" data-pen="slash" aria-pressed="false"><span class="k">/</span>사선</button>
            <button class="pen" data-pen="box" aria-pressed="false"><span class="k">□</span>네모</button>
            <button class="pen" data-pen="line" aria-pressed="false"><span class="k">_</span>밑줄</button>
            <button class="pen clear" id="clearMarks">지우기</button>
          </div>
          <button class="pen pcol-toggle" id="fold" aria-expanded="true">지문 접기</button>
        </div>
        <div class="pscroll" id="pscroll"><div class="ptext${d.poem ? ' poem' : ''}" id="ptext">${passageHtml(d)}</div></div>
        <div class="pfoot"><div class="meter"><span>글자 수<b class="tnum">${d.chars}</b>자</span><span id="mtime"></span><span id="mspeed"></span></div><span id="penHint"></span></div>
      </section>
      <section class="side" id="side" aria-live="polite"></section>
    </div>`;
  $('#back').onclick = () => { stopClock(); go('home'); };
  document.querySelectorAll('.pen[data-pen]').forEach(b => b.onclick = () => setPen(S.pen === b.dataset.pen ? null : b.dataset.pen));
  $('#clearMarks').onclick = () => { $('#ptext').querySelectorAll('.box,.slash,.ul').forEach(el => el.classList.remove('box', 'slash', 'ul')); };
  $('#fold').onclick = () => { S.fold = !S.fold; $('#pcard').classList.toggle('fold', S.fold); $('#fold').textContent = S.fold ? '지문 펼치기' : '지문 접기'; $('#fold').setAttribute('aria-expanded', String(!S.fold)); };
  $('#ptext').addEventListener('click', e => {
    if (!S.pen) return;
    if (S.pen === 'line'){ const s = e.target.closest('.s'); if (s) s.classList.toggle('ul'); }
    else { const w = e.target.closest('.w'); if (w) w.classList.toggle(S.pen === 'box' ? 'box' : 'slash'); }
  });
  setPen(null);
  renderSide();
}
function setPen(p){
  S.pen = p;
  document.querySelectorAll('.pen[data-pen]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pen === p)));
  const t = $('#ptext'); t.classList.remove('pen-slash', 'pen-box', 'pen-line'); if (p) t.classList.add('pen-' + p);
  const hint = { slash: '낱말을 누르면 / 가 생겨!', box: '모르는 낱말을 콕!', line: '중요한 문장을 콕!' };
  $('#penHint').textContent = p ? hint[p] : '';
}
function renderRail(){
  const cur = S.phase === 'read' ? 'read' : S.phase === 'quiz' ? S.qs[S.qi].cat : null;
  const present = new Set(['read', ...S.qs.map(q => q.cat)]);
  const catDone = c => c === 'read' ? S.phase !== 'read' : S.qs.every((q, i) => q.cat !== c || S.ans[i]);
  $('#rail').innerHTML = CATS.filter(([c]) => present.has(c)).map(([c, name]) =>
    `<li class="${c === cur ? 'on' : catDone(c) ? 'fin' : ''}"${c === cur ? ' aria-current="step"' : ''}>${name}</li>`).join('');
}

/* reading clock */
let tick = null;
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function startClock(){ S.t0 = Date.now(); S.t1 = null; clearInterval(tick); tick = setInterval(updClock, 250); updClock(); }
function stopClock(){ if (S.t0 && !S.t1) S.t1 = Date.now(); clearInterval(tick); tick = null; if (S.view === 'sheet') updClock(); }
function secs(){ return S.t0 ? ((S.t1 || Date.now()) - S.t0) / 1000 : 0; }
function speed(){ const s = secs(); return s >= 5 ? Math.round(S.d.chars / (s / 60)) : null; }
function updClock(){
  const c = $('#clock'); if (c) c.innerHTML = `${fmt(secs())}<small>${S.t1 ? '다 읽었어요!' : S.t0 ? '읽는 중… 타다닥' : '읽기 시작을 누르고 읽어요'}</small>`;
  const mt = $('#mtime'); if (mt) mt.innerHTML = S.t0 ? `읽은 시간<b class="tnum">${fmt(secs())}</b>` : '';
  const ms = $('#mspeed'); if (ms) ms.innerHTML = S.t1 && speed() ? `1분에<b class="tnum">${speed()}</b>자` : '';
  const b = $('#clockBtn'); if (b) b.textContent = !S.t0 ? '읽기 시작' : S.t1 ? '다시 재기' : '다 읽었어요';
}

function renderSide(){
  renderRail();
  $('#body').classList.toggle('quizmode', S.phase !== 'read');
  $('#ptext').classList.toggle('nums', S.phase === 'result' || S.ans[0] !== undefined);
  if (S.phase === 'read') return renderRead();
  if (S.phase === 'quiz') return renderQ();
  renderResult();
}
function renderRead(){
  $('#side').innerHTML = `<div class="card">
    <div class="sec"><h3><span class="circ">①</span> 읽기</h3><span class="cnt">문제 ${S.qs.length}개</span></div>
    <div class="readhead">${ch('bookie', 'happy', 'bob')}<div class="bubble l">천천히 읽으면서<br>펜으로 표시해 봐!</div></div>
    <ul class="checks">
      <li><span class="cb on"></span><span><span class="hl">사선 펜</span>을 켜고 낱말을 누르면 / 가 생겨요</span></li>
      <li><span class="cb on"></span><span>모르는 낱말엔 <span class="hl-y">네모</span>! 어휘 문제에서 뜻을 알 수 있어요</span></li>
      <li><span class="cb on"></span><span>중요한 문장엔 <span class="hl-g">밑줄</span>! 중심 문장 찾기에 도움돼요</span></li>
    </ul>
    <div class="timer">
      <div class="clock tnum" id="clock"></div>
      <button class="btn" id="clockBtn"></button>
    </div>
    <div class="acts"><button class="btn pri" id="startQ">문제 풀기 →</button></div>
  </div>`;
  $('#clockBtn').onclick = () => { if (!S.t0 || S.t1) startClock(); else stopClock(); };
  $('#startQ').onclick = () => { stopClock(); setPen(null); S.phase = 'quiz'; S.qi = 0; renderSide(); scrollSideIntoView(); };
  updClock();
}
function scrollSideIntoView(){
  if (window.matchMedia('(max-width:900px)').matches){ const el = $('#side'); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
}
function renderQ(){
  const q = S.qs[S.qi], a = S.ans[S.qi], n = S.qs.length;
  const ci = CATS.findIndex(c => c[0] === q.cat);
  const who = CAT_WHO[q.cat] || 'songi';
  const mood = a ? (a.ok ? 'wow' : 'oops') : 'think';
  const ctx = q.ctx ? `<p class="ctx">${esc(q.ctx.s).replace(esc(q.ctx.stem), `<span class="ctxw">${esc(q.ctx.stem)}</span>`)}</p>` : '';
  const yay = YAY[S.qi % YAY.length], oops = OOPS[S.qi % OOPS.length];
  $('#side').innerHTML = `<div class="card">
    <div class="sec"><h3><span class="circ">${CIRC[ci]}</span> ${CATNAME[q.cat]}</h3><span class="cnt tnum">${S.qi + 1}/${n}</span></div>
    <div class="qbar" aria-hidden="true"><i style="transform:scaleX(${(S.qi + (a ? 1 : 0)) / n})"></i></div>
    <div class="ask">${ch(who, mood, a ? 'hop' : '')}<p class="bubble l">${esc(q.prompt)}</p></div>
    ${!a ? `<span class="doodle" style="position:absolute;right:18px;top:92px">${CAT_NOTE[q.cat] || ''}</span>` : ''}
    ${ctx}
    <ul class="opts">${q.opts.map((o, i) => {
      let cls = o.sent ? 'opt sent' : 'opt';
      if (a){ if (o.c) cls += ' right'; else if (a.pick === i) cls += ' wrong'; else cls += ' dim'; }
      const mark = a && !o.c && a.pick === i ? '✕' : i + 1;
      return `<li><button class="${cls}" data-i="${i}" ${a ? 'disabled' : ''}><span class="cb">${mark}</span><span>${esc(o.t)}${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ''}</span></button></li>`;
    }).join('')}</ul>
    ${a ? `<div class="fb ${a.ok ? 'ok' : 'no'}">${ch(a.ok ? 'songi' : 'mongi', a.ok ? 'cheer' : 'oops', 'hop')}<div><h4>${a.ok ? yay : oops}</h4><p>${esc(q.exp)}</p></div></div>` : ''}
    <div class="acts">${a ? `<button class="btn pri" id="next">${S.qi + 1 < n ? '다음 문제 →' : '결과 보기 →'}</button>` : ''}</div>
    ${!a ? `<p class="hint">${q.kind === 'sent' ? '지문에서 문장을 찾아 읽고 골라 봐!' : '숫자 키 1~' + q.opts.length + '로도 고를 수 있어'}</p>` : ''}
  </div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  const nx = $('#next'); if (nx){ nx.onclick = nextQ; nx.focus({ preventScroll: true }); }
  const t = $('#ptext'); t.querySelectorAll('.hit').forEach(x => x.classList.remove('hit'));
  if (a && q.hl){ const el = [...t.querySelectorAll('.s')].find(s => s.dataset.s === q.hl); if (el){ el.classList.add('hit'); scrollPassageTo(el); } }
  else if (a && q.para != null && q.kind === 'cp'){ const p = t.querySelector(`.para[data-pi="${q.para}"]`); if (p) scrollPassageTo(p); }
}
function scrollPassageTo(el){
  const box = $('#pscroll'); if (!box) return;
  if (box.scrollHeight > box.clientHeight + 4){ box.scrollTo({ top: Math.max(0, el.offsetTop - 40), behavior: 'smooth' }); }
}
function choose(i){
  if (S.ans[S.qi]) return;
  const q = S.qs[S.qi];
  S.ans[S.qi] = { pick: i, ok: !!q.opts[i].c };
  renderSide();
}
function nextQ(){
  if (S.qi + 1 < S.qs.length){ S.qi++; renderSide(); scrollSideIntoView(); }
  else finish();
}
function finish(){
  const d = S.d, total = S.qs.length, score = S.ans.filter(a => a && a.ok).length, pct = score / total;
  const stars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0;
  const prev = store[d.n];
  store[d.n] = { best: Math.max(score, prev ? prev.best : 0), total, stars: Math.max(stars, prev ? prev.stars : 0), last: score, cpm: speed() || (prev && prev.cpm) || null };
  const per = {}; S.qs.forEach((q, i) => { per[q.cat] = per[q.cat] || [0, 0]; per[q.cat][1]++; if (S.ans[i] && S.ans[i].ok) per[q.cat][0]++; });
  const rec = { n: d.n, title: d.ti, g: d.g, score, total, stars, t: Date.now(), cpm: speed(), time: fmt(secs()),
    cats: CATS.filter(([c]) => per[c]).map(([c, name]) => [name, per[c][0], per[c][1]]),
    wrong: S.qs.map((q, i) => [q, S.ans[i]]).filter(([q, a]) => a && !a.ok).map(([q]) => [CATNAME[q.cat], q.prompt, q.opts.find(o => o.c).t]) };
  store._log.push(rec); if (store._log.length > 300) store._log = store._log.slice(-300);
  save();
  S.phase = 'result'; S.result = { score, total, stars, rec };
  renderSide(); scrollSideIntoView();
}
function renderResult(){
  const { score, total, stars } = S.result;
  const per = {};
  S.qs.forEach((q, i) => { per[q.cat] = per[q.cat] || [0, 0]; per[q.cat][1]++; if (S.ans[i] && S.ans[i].ok) per[q.cat][0]++; });
  const msg = stars === 3 ? '우와, 글을 정말 꼼꼼히 읽었구나!<br>참 잘했어요~' : stars === 2 ? '잘했어! 틀린 문제는<br>근거 문장을 다시 찾아보자.' : stars === 1 ? '조금만 더! 문단마다<br>중심 문장에 밑줄 치며 읽어 봐.' : '괜찮아, 천천히<br>한 번 더 읽고 도전하자!';
  const nextN = S.d.n + 1 <= (S.d.g === 'lo' ? 50 : 100) ? S.d.n + 1 : null;
  const sp = speed();
  $('#side').innerHTML = `<div class="card">
    <div class="sec"><h3><span class="circ">✿</span> 결과</h3><span class="cnt">학습지 ${S.d.n}</span></div>
    <div class="score"><div class="big tnum">${score}<small>/${total}</small></div>${starsHtml(stars, 'stars bigstars')}</div>
    <div class="resrow">${ch('songi', stars >= 2 ? 'cheer' : 'happy', 'hop')}<div class="bubble l pink">${msg}</div>${stars === 3 ? ch('mongi', 'cheer', 'bob') : ''}</div>
    ${sp ? `<p class="speed">읽기 속도: 1분에 <span class="hl-y tnum"><b>${sp}</b>자</span> (글자 수 ${S.d.chars}자 · ${fmt(secs())})</p>` : ''}
    <ul class="cats">${CATS.filter(([c]) => per[c]).map(([c, name]) => {
      const [o, t] = per[c]; const r = o / t;
      return `<li><span>${name}</span><span class="tr"><i class="${r < .5 ? 'lo' : ''}" style="width:${Math.round(r * 100)}%"></i></span><span class="v tnum">${o}/${t}</span></li>`;
    }).join('')}</ul>
    <details class="review"><summary>문제 다시 보기</summary><ol>${S.qs.map((q, i) => {
      const a = S.ans[i], right = q.opts.find(o => o.c);
      return `<li><span class="yn ${a && a.ok ? 'o' : 'x'}">${a && a.ok ? '○' : '×'}</span> [${CATNAME[q.cat]}] ${esc(q.prompt)}<br><span class="ans">정답: ${esc(right.t)}${a && !a.ok ? ` · 내가 고른 답: ${esc(q.opts[a.pick].t)}` : ''}</span></li>`;
    }).join('')}</ol></details>
    <div class="momsend">
      ${ch('mongi', 'happy', 'bob')}
      <div><b>엄마에게 결과를 보내 볼까?</b><span>점수, 읽기 속도, 틀린 문제가 정리돼요</span></div>
      <button class="btn pri" id="toMom">💌 엄마에게 보내기</button>
    </div>
    <div class="acts">
      <button class="btn" id="home">목록으로</button>
      <button class="btn" id="again">다시 풀기</button>
      ${nextN ? `<button class="btn pri" id="nextSheet">학습지 ${nextN} →</button>` : ''}
    </div>
  </div>`;
  $('#home').onclick = () => go('home');
  $('#toMom').onclick = () => openSend(resultMsg(S.result.rec), '엄마에게 결과를 보내자!');
  $('#again').onclick = () => openSheet(S.d.n);
  const ns = $('#nextSheet'); if (ns) ns.onclick = () => openSheet(nextN);
  $('#ptext').querySelectorAll('.hit').forEach(x => x.classList.remove('hit'));
}

document.addEventListener('keydown', e => {
  if (S.view !== 'sheet' || S.phase !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-6]$/.test(e.key) && !S.ans[S.qi]){ const i = +e.key - 1; if (i < S.qs[S.qi].opts.length) choose(i); }
});

function render(){ if (S.view === 'home') renderHome(); else renderSheet(); }
render();
</script>

</body>
</html>
